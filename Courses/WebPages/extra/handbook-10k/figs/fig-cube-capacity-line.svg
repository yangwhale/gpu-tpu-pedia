<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#202124">144 个 cube 全在 reservation 里，但最大任务只按 128 规划</text>

  <!-- 全景条：0–144，900px → 6.25 px/cube -->
  <text x="40" y="70" font-size="14" fill="#5f6368">全景（0 → 144 cube）</text>
  <rect x="40" y="80" width="800" height="40" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="440" y="106" font-size="15" fill="#174ea6" text-anchor="middle" font-weight="bold">128 cube：最大规划任务（8,192 芯）</text>
  <rect x="840" y="80" width="12.5" height="40" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <rect x="852.5" y="80" width="87.5" height="40" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="896" y="106" font-size="13" fill="#a50e0e" text-anchor="middle">14</text>
  <text x="40" y="140" font-size="13" fill="#5f6368">0</text>
  <text x="940" y="140" font-size="13" fill="#5f6368" text-anchor="end">144</text>

  <!-- 放大虚线：120–144 -->
  <line x1="790" y1="120" x2="40" y2="190" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <line x1="940" y1="120" x2="940" y2="190" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <rect x="790" y="78" width="152" height="44" fill="none" stroke="#9aa0a6" stroke-dasharray="4 4"/>

  <!-- 放大段：120..143，每格 37.5px -->
  <g stroke-width="1.2">
    <rect x="40" y="200" width="300" height="44" fill="#e8f0fe" stroke="#1a73e8"/>
    <rect x="340" y="200" width="75" height="44" fill="#fef7e0" stroke="#f9ab00"/>
    <rect x="415" y="200" width="525" height="44" fill="#fce8e6" stroke="#d93025"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.2">
    <line x1="77.5" y1="200" x2="77.5" y2="244"/><line x1="115" y1="200" x2="115" y2="244"/><line x1="152.5" y1="200" x2="152.5" y2="244"/><line x1="190" y1="200" x2="190" y2="244"/><line x1="227.5" y1="200" x2="227.5" y2="244"/><line x1="265" y1="200" x2="265" y2="244"/><line x1="302.5" y1="200" x2="302.5" y2="244"/>
    <line x1="377.5" y1="200" x2="377.5" y2="244"/>
    <line x1="452.5" y1="200" x2="452.5" y2="244"/><line x1="490" y1="200" x2="490" y2="244"/><line x1="527.5" y1="200" x2="527.5" y2="244"/><line x1="565" y1="200" x2="565" y2="244"/><line x1="602.5" y1="200" x2="602.5" y2="244"/><line x1="640" y1="200" x2="640" y2="244"/><line x1="677.5" y1="200" x2="677.5" y2="244"/><line x1="715" y1="200" x2="715" y2="244"/><line x1="752.5" y1="200" x2="752.5" y2="244"/><line x1="790" y1="200" x2="790" y2="244"/><line x1="827.5" y1="200" x2="827.5" y2="244"/><line x1="865" y1="200" x2="865" y2="244"/><line x1="902.5" y1="200" x2="902.5" y2="244"/>
  </g>
  <text x="190" y="228" font-size="14" fill="#174ea6" text-anchor="middle">…第 121–128 个</text>
  <text x="377" y="228" font-size="14" fill="#b06000" text-anchor="middle">2 余量</text>
  <text x="677" y="228" font-size="15" fill="#a50e0e" text-anchor="middle" font-weight="bold">14 个不保证：热备，平时跑低优先级</text>

  <!-- 标线 -->
  <line x1="340" y1="186" x2="340" y2="296" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="330" y="290" font-size="15" fill="#174ea6" text-anchor="end" font-weight="bold">128 最大任务上限</text>
  <line x1="415" y1="160" x2="415" y2="250" stroke="#1e8e3e" stroke-width="2.5"/>
  <text x="425" y="176" font-size="15" fill="#0d652d" font-weight="bold">130 Google SLO 线（DEGRADED 也算）</text>
  <text x="936" y="176" font-size="15" fill="#202124" text-anchor="end" font-weight="bold">144 物理</text>

  <!-- 括号：规划空出 16 -->
  <path d="M 340 316 L 340 326 L 940 326 L 940 316" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <text x="640" y="350" font-size="15" fill="#202124" text-anchor="middle">规划空出 16 = 2 规划余量 + 14 不保证</text>
  <text x="40" y="385" font-size="13" fill="#5f6368">128 = 最大规划任务的 cube 总数（可多片；公开单片上限 32）；另外每日配额再留 S = 2–4 个健康 cube 不准入（09 D04）</text>
</svg>

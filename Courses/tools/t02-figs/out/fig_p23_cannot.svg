<rect x="1061" y="446" width="305" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="1073" y="465" class="lbl">v7 切片有没有「物理 ≠ 可训练」</text>
<rect x="1073" y="485" width="132.7" height="19" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.1"/>
<text x="1081" y="498" class="xxs" fill="#f9ab00">只在备忘里 · 课件没写</text>
<rect x="1061" y="520" width="305" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="1073" y="539" class="lbl">SparseCore 在集合通信里的角色</text>
<rect x="1073" y="559" width="132.7" height="19" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.1"/>
<text x="1081" y="572" class="xxs" fill="#f9ab00">只在备忘里 · 课件没写</text>
<rect x="20" y="624" width="1360" height="144" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="652" class="sec">⭐ 两组没写进课件的空白，成因完全不同 —— 而台下看到的是同一片空白</text>
<text x="38" y="678" class="xs"><tspan font-weight="700" fill="#202124">① 从来没想到（两条）：「哪个更适合推理」和「TCO」。</tspan><tspan fill="#9aa0a6"> 而这恰恰是外行第一个会问的两个问题。所以不是疏忽，是机制：</tspan><tspan font-weight="700" fill="#202124">自曝清单只能列出你撞到过的坑。</tspan>那 16 条全是在做事的过程中撞出来的 —— 跑不出来、对不上、查不到出处；而<tspan font-weight="700" fill="#202124">两边推理对比和 TCO 从来没有</tspan></text>
<text x="38" y="696" class="xs"><tspan font-weight="700" fill="#202124">开过工</tspan>，所以从来没有机会暴露自己。</text>
<text x="38" y="719" class="xs"><tspan font-weight="700" fill="#202124">② 想到了，但只写在作者自己的备忘里（两条）</tspan><tspan fill="#9aa0a6"> —— 备忘里写的是「</tspan><tspan font-weight="700" fill="#202124">没查证，先不要讲</tspan>」。这是个<tspan font-weight="700" fill="#202124">主动决定</tspan>，可是<tspan font-weight="700" fill="#202124">学生看不出来</tspan>：<tspan font-weight="700" fill="#202124">一个决定不讲的空白，跟一个没意识到的空白，在台下眼里长得一模一样。</tspan>所以要么讲，要么在课件上明写「这一条查过，没结论」。</text>
<text x="38" y="742" class="xs"><tspan font-weight="700" fill="#202124">⭐ 两个补法防的是不同的东西：「换个外行提问」防想不到；「把决定不讲的也写出来」防台下看不见。</tspan><tspan fill="#9aa0a6"> 加上一张图那条</tspan><tspan font-weight="700" fill="#202124">「换个主角重读」防偏向</tspan> —— 三条合起来才是完整的：<tspan font-weight="700" fill="#202124">偏了、漏了、藏了。</tspan></text>
<text x="1380" y="780" class="xxs" fill="#9aa0a6" text-anchor="end">四类各五条是数出来的，不是凑的 —— 没有为了对称拆条或并条</text>
</svg>
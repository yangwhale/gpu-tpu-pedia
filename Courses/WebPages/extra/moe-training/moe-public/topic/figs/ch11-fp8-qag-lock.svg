<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="FP8 与 QAG 互锁：三种配置各付三笔账。BF16：AG 整份 bf16、无量化活、乘法 bf16。FP8 不带 QAG：AG 仍是整份 bf16，每卡还要把整份权重量化一遍，乘法变快，合计比 BF16 慢约 15%。FP8 带 QAG：AG 字节减半，每卡只量化自己那份，合计比 BF16 快 4%。数字为小号模型生产侧。"><title>FP8 与 QAG 互锁：三种配置各付三笔账。BF16：AG 整份 bf16、无量化活、乘法 bf16。FP8 不带 QAG：AG 仍是整份 bf16，每卡还要把整份权重量化一遍，乘法变快，合计比 BF16 慢约 15%。FP8 带 QAG：AG 字节减半，每卡只量化自己那份，合计比 BF16 快 4%。数字为小号模型生产侧。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="456" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">FP8 和 QAG 锁在一起：只开 FP8，AG 一个字节没省，还多出一份量化活</text>
<text x="24.0" y="60.0" font-size="14" fill="#3c4043" text-anchor="start">每种配置一层 MoE 要付的三笔账（示意，条长不按比例）；右栏是相对 BF16 的整步结果（小号模型）</text>
<rect x="16.0" y="96.0" width="868.0" height="108.0" rx="8" fill="none" stroke="#dadce0" stroke-width="1"/>
<text x="30.0" y="148.0" font-size="16" fill="#202124" text-anchor="start" font-weight="700">BF16</text>
<rect x="200.0" y="108.0" width="300.0" height="20.0" rx="4" fill="#feefe3" stroke="#e8710a" stroke-width="1.4"/>
<text x="516.0" y="123.0" font-size="14" fill="#b06000" text-anchor="start">专家权重 AG：整份 bf16</text>
<line x1="200.0" y1="150.0" x2="218.0" y2="150.0" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="516.0" y="155.0" font-size="14" fill="#a50e0e" text-anchor="start">量化：没有</text>
<rect x="200.0" y="172.0" width="300.0" height="20.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="516.0" y="187.0" font-size="14" fill="#174ea6" text-anchor="start">GMM 乘法：bf16</text>
<text x="860.0" y="154.0" font-size="18" fill="#5f6368" text-anchor="end" font-weight="700">基准</text>
<rect x="16.0" y="214.0" width="868.0" height="108.0" rx="8" fill="none" stroke="#dadce0" stroke-width="1"/>
<text x="30.0" y="266.0" font-size="16" fill="#202124" text-anchor="start" font-weight="700">FP8，不带 QAG</text>
<rect x="200.0" y="226.0" width="300.0" height="20.0" rx="4" fill="#feefe3" stroke="#e8710a" stroke-width="1.4"/>
<text x="516.0" y="241.0" font-size="14" fill="#b06000" text-anchor="start">AG：仍是整份 bf16</text>
<rect x="200.0" y="258.0" width="186.0" height="20.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="516.0" y="273.0" font-size="14" fill="#a50e0e" text-anchor="start">每卡把整份权重量化一遍</text>
<rect x="200.0" y="290.0" width="186.0" height="20.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="516.0" y="305.0" font-size="14" fill="#174ea6" text-anchor="start">GMM 乘法：变快</text>
<text x="860.0" y="272.0" font-size="18" fill="#d93025" text-anchor="end" font-weight="700">慢约 15%</text>
<rect x="16.0" y="332.0" width="868.0" height="108.0" rx="8" fill="none" stroke="#dadce0" stroke-width="1"/>
<text x="30.0" y="384.0" font-size="16" fill="#202124" text-anchor="start" font-weight="700">FP8 + QAG</text>
<rect x="200.0" y="344.0" width="150.0" height="20.0" rx="4" fill="#feefe3" stroke="#e8710a" stroke-width="1.4"/>
<text x="516.0" y="359.0" font-size="14" fill="#b06000" text-anchor="start">AG：f8，字节减半</text>
<rect x="200.0" y="376.0" width="24.0" height="20.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="516.0" y="391.0" font-size="14" fill="#a50e0e" text-anchor="start">每卡只量化自己那份</text>
<rect x="200.0" y="408.0" width="186.0" height="20.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="516.0" y="423.0" font-size="14" fill="#174ea6" text-anchor="start">GMM 乘法：变快</text>
<text x="860.0" y="390.0" font-size="18" fill="#188038" text-anchor="end" font-weight="700">快 4%</text></svg>

<text x="556.6666666666667" y="441.59116022099454" class="num" fill="#d93025">-19%</text>
<text x="76" y="142" class="lbl" fill="#202124">相对 8 GPU 的带宽保持率</text>
<text x="700" y="116" class="sec">怎么读　—— 先讲我们错在哪，再讲能确定什么</text>
<rect x="700" y="152" width="680" height="100" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="716" y="177" class="box">① 我们本来挑了 Copy 当对照项　→　<tspan font-weight="700" fill="#d93025">它走错了路</tspan></text>
<text x="716" y="197" class="xs">原打算：Copy 不掉 → 链路够用 → 掉的只能是别的原因。<tspan font-weight="700" fill="#202124">但源文档写明 Copy 是「节点内 GPU 间拷贝」</tspan> —— <tspan font-weight="700" fill="#d93025">它不走 dispatch / </tspan></text>
<text x="716" y="214" class="xs"><tspan font-weight="700" fill="#d93025">combine 走的那条跨节点路。</tspan>一个不出节点的量，对「出节点那条路够不够」没有信息。</text>
<rect x="700" y="262" width="680" height="96" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.3"/>
<text x="716" y="287" class="box">② 能确定的只有现象：目标数从 7 变成 31</text>
<text x="716" y="307" class="xs">8 卡时每张卡把 token 分给 <tspan font-weight="700" fill="#202124">7</tspan> 个目标，32 卡时分给 <tspan font-weight="700" fill="#202124">31</tspan> 个。<tspan font-weight="700" fill="#202124">单笔消息必然变小</tspan>，而小块分散写的链路利用率低于大块连续传输。</text>
<text x="716" y="324" class="xs"><tspan fill="#9aa0a6">（源文档给的「每目标约 100 / 22 GB/s」是拿总带宽除目标数</tspan><tspan font-weight="700" fill="#202124">倒算</tspan>的，不是独立测量 —— 拿它去解释掉幅属于循环论证，这里不用。</text>
<text x="716" y="341" class="xs">）</text>
<rect x="700" y="368" width="680" height="92" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="716" y="393" class="box">③ Combine 掉得更快，但<tspan font-weight="700" fill="#d93025">不是因为「归约变深」</tspan></text>
<text x="716" y="413" class="xs">每个 token 只把 <tspan font-weight="700" fill="#202124">topk ＝ 6</tspan> 份部分结果加回去，<tspan font-weight="700" fill="#202124">这个宽度是配置死的，与规模无关</tspan>，8 卡和 32 卡都是 6 份。更站得住的说法是：</text>
<text x="716" y="430" class="xs"><tspan font-weight="700" fill="#202124">要等齐的对端从 7 个变成 31 个</tspan>，归约必须等齐才能收尾，等的人越多，最慢那个的影响越大。</text>
<rect x="700" y="470" width="680" height="84" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.3"/>
<text x="716" y="495" class="box">④ <tspan font-weight="700" fill="#d93025">而且 Reduce 也掉了 18%</tspan>　—— 它同样标着「节点内」</text>
<text x="716" y="515" class="xs">紫线和红线在图上几乎叠在一起。<tspan font-weight="700" fill="#202124">要么这条「节点内」标注不准，要么「节点内不受规模影响」这句话本身要打折。</tspan><tspan font-weight="700" fill="#d93025">这处我们没查清，</tspan></text>
<text x="716" y="532" class="xs"><tspan font-weight="700" fill="#d93025">标出来。</tspan></text>
<text x="20" y="582" class="sec">绝对值另附　—— 单位 GB/s，出处：本仓库 gpu/a4x/06-deepep-test/</text>
<rect x="20" y="594" width="1360" height="34" rx="8" fill="#f1f3f4"/>
<text x="34" y="617" class="lbl" fill="#202124">操作</text>
<text x="534" y="617" class="lbl" fill="#202124">8 GPU / 2 节点</text>
<text x="814" y="617" class="lbl" fill="#202124">16 GPU / 4 节点</text>
<text x="1094" y="617" class="lbl" fill="#202124">32 GPU / 8 节点</text>
<line x1="20" y1="628" x2="1380" y2="628" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="650" class="xs">Copy　　　源文档标注：节点内</text>
<text x="534" y="650" class="num" fill="#202124">5,600</text>
<text x="814" y="650" class="num" fill="#202124">5,500</text>
<text x="1094" y="650" class="num" fill="#1e8e3e">5,700</text>
<rect x="20" y="662" width="1360" height="34" rx="0" fill="#fafafa"/>
<line x1="20" y1="662" x2="1380" y2="662" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="684" class="xs">Reduce　　源文档标注：节点内</text>
<text x="534" y="684" class="num" fill="#202124">2,100</text>
<text x="814" y="684" class="num" fill="#202124">1,870</text>
<text x="1094" y="684" class="num" fill="#8430ce">1,730</text>
<line x1="20" y1="696" x2="1380" y2="696" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="718" class="xs">Dispatch　跨节点 all-to-all</text>
<text x="534" y="718" class="num" fill="#202124">700</text>
<text x="814" y="718" class="num" fill="#202124">660</text>
<text x="1094" y="718" class="num" fill="#f9ab00">636</text>
<rect x="20" y="730" width="1360" height="34" rx="0" fill="#fafafa"/>
<line x1="20" y1="730" x2="1380" y2="730" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="752" class="xs">Combine　 跨节点 all-to-all ＋ reduce</text>
<text x="534" y="752" class="num" fill="#202124">724</text>
<text x="814" y="752" class="num" fill="#202124">683</text>
<text x="1094" y="752" class="num" fill="#d93025">590</text>
<rect x="20" y="594" width="1360" height="170" rx="8" fill="none" stroke="#dadce0" stroke-width="1.2"/>
<rect x="20" y="798" width="1360" height="152" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="38" y="826" class="sec">⭐⭐ 本节落点，以及一条比结论更值钱的方法论</text>
<text x="38" y="852" class="xs"><tspan font-weight="700" fill="#202124">能确定的：规模一大，all-to-all 这类通信就掉，而且掉幅跟「要面对多少个对端」同向。</tspan><tspan font-weight="700" fill="#d93025">不能确定的：掉幅里有多少来自消息变小、多少来自跨节点链路上的竞争。</tspan><tspan font-weight="700" fill="#202124">本图分不开这两者</tspan> —— 唯一的对照项 Copy 不出节点，而跨节点那条路我们没有独立的对照项。</text>
<text x="38" y="875" class="xs"><tspan font-weight="700" fill="#202124">方法论（这一条比上面的数据更该被带走）：</tspan>挑对照项时，第一个要问的不是「它稳不稳」，是<tspan font-weight="700" fill="#d93025">「它跟被测对象走的是不是同一条路」</tspan>。<tspan font-weight="700" fill="#202124">一个走错路的对照项比没有对照项更危险</tspan> —— 它会让你以为自己排除了什么。</text>
<text x="38" y="898" class="xs"><tspan fill="#9aa0a6">｜　源文档对 16 卡那次下降写的是「RDMA 竞争加剧」、对 32 卡写的是「碎片化」。这两条其实不矛盾：跨节点确实走 RDMA（部署要点里 NCCL_NET=gIB，8 节点那次的失败根因就是 ibv_modify_qp），两个因素同时在，只是本图分不开。　｜　主图归一化的理由：</tspan></text>
<text x="38" y="917" class="xs"><tspan fill="#9aa0a6">Copy 5,600、Dispatch 只有 700，画在同一根绝对值轴上，后三条会被压成贴地直线，而「掉了多少」恰恰是全部论点。</tspan></text>
</svg>
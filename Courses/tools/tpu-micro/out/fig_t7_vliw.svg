<text x="490.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">5</text>
<text x="558.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">6</text>
<text x="626.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">7</text>
<text x="694.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">8</text>
<text x="762.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">9</text>
<text x="830.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">10</text>
<text x="898.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">11</text>
<text x="966.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">12</text>
<text x="1034.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">13</text>
<text x="1102.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">14</text>
<text x="1170.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">15</text>
<text x="1238.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">16</text>
<text x="1306.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">17</text>
<text x="20" y="358" class="lbl" fill="#1a73e8">标量槽 ×2</text>
<rect x="116" y="338" width="1224.0" height="28" rx="3" fill="#fff" stroke="#e8eaed" stroke-width="1.0"/>
<rect x="321.5" y="340" width="269.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="661.5" y="340" width="677.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="117.5" y="340" width="65.0" height="24" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
<text x="124.0" y="357" class="xxs" fill="#1a73e8">发 DMA</text>
<rect x="185.5" y="340" width="133.0" height="24" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
<text x="192.0" y="357" class="xxs" fill="#1a73e8">算下一块地址</text>
<rect x="593.5" y="340" width="65.0" height="24" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
<text x="600.0" y="357" class="xxs" fill="#1a73e8">发下一条</text>
<text x="20" y="392" class="lbl" fill="#12786f">向量槽 ×4</text>
<rect x="116" y="372" width="1224.0" height="28" rx="3" fill="#fff" stroke="#e8eaed" stroke-width="1.0"/>
<rect x="117.5" y="374" width="65.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="1069.5" y="374" width="269.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="185.5" y="374" width="405.0" height="24" rx="3" fill="#e0f2f0" stroke="#12786f" stroke-width="1.2"/>
<text x="192.0" y="391" class="xxs" fill="#12786f">上一块的归一化 / 激活（独立的活）</text>
<rect x="593.5" y="374" width="473.0" height="24" rx="3" fill="#e0f2f0" stroke="#12786f" stroke-width="1.2"/>
<text x="600.0" y="391" class="xxs" fill="#12786f">继续</text>
<text x="20" y="426" class="lbl" fill="#1e8e3e">矩阵槽 ×2</text>
<rect x="116" y="406" width="1224.0" height="28" rx="3" fill="#fff" stroke="#e8eaed" stroke-width="1.0"/>
<rect x="117.5" y="408" width="473.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="1069.5" y="408" width="269.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="593.5" y="408" width="473.0" height="24" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="600.0" y="425" class="xxs" fill="#1e8e3e">矩阵乘：tile 到位才能开始</text>
<text x="20" y="460" class="lbl" fill="#f9ab00">杂项槽 ×1</text>
<rect x="116" y="440" width="1224.0" height="28" rx="3" fill="#fff" stroke="#e8eaed" stroke-width="1.0"/>
<rect x="185.5" y="442" width="405.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="661.5" y="442" width="677.0" height="24" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="117.5" y="442" width="65.0" height="24" rx="3" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="124.0" y="459" class="xxs" fill="#f9ab00">同步</text>
<rect x="593.5" y="442" width="65.0" height="24" rx="3" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="600.0" y="459" class="xxs" fill="#f9ab00">同步</text>
<line x1="1068.0" y1="486" x2="1340.0" y2="486" stroke="#d93025" stroke-width="1.6"/>
<line x1="1068.0" y1="482" x2="1068.0" y2="490" stroke="#d93025" stroke-width="1.6"/>
<line x1="1340.0" y1="482" x2="1340.0" y2="490" stroke="#d93025" stroke-width="1.6"/>
<text x="1068.0" y="506" class="xxs"><tspan font-weight="700" fill="#d93025">第 14 拍之后所有槽都空了</tspan> —— 独立的活用完了。这四拍<tspan font-weight="700" fill="#202124">不会有任</tspan></text>
<text x="1068.0" y="519" class="xxs"><tspan font-weight="700" fill="#202124">何东西自动顶上来</tspan>，因为没有第二个线程可切。</text>
<text x="20" y="506" class="xxs">第 1–6 拍的向量槽里塞的是<tspan font-weight="700" fill="#202124">上一块</tspan>的后处理 —— 和这次搬运没有依赖关系，所以能提前挪过来。<tspan font-weight="700" fill="#202124">这就是编译器「藏延迟」的全部手段：找独</tspan></text>
<text x="20" y="519" class="xxs"><tspan font-weight="700" fill="#202124">立的活。</tspan></text>
<text x="848" y="110" class="sec">同一个延迟，两边怎么处理</text>
<rect x="848" y="126" width="532" height="168" rx="10" fill="#fff" stroke="#202124" stroke-width="1.8"/>
<rect x="848" y="126" width="266.0" height="168" rx="10" fill="#e8f0fe"/>
<line x1="1114.0" y1="126" x2="1114.0" y2="294" stroke="#e8eaed" stroke-width="1.2"/>
<text x="864" y="152" class="box" fill="#1a73e8">GPU：运行时换一个跑</text>
<text x="864" y="172" class="xxs">warp 卡住 → 调度器立刻挑一个能跑的。<tspan font-weight="700" fill="#202124">代价是要同</tspan></text>
<text x="864" y="186" class="xxs"><tspan font-weight="700" fill="#202124">时驻留几十份上下文</tspan>，那 256 KB 寄存器堆就是为它</text>
<text x="864" y="200" class="xxs">准备的。 好处：形状不规则也能跑得不太难看。 坏</text>
<text x="864" y="214" class="xxs">处：同一份代码，两次跑的耗时可以差很多。</text>
<text x="1130.0" y="152" class="box" fill="#1e8e3e">TPU：编译期提前挪</text>
<text x="1130.0" y="172" class="xxs">编译器把独立的活挪进空拍。<tspan font-weight="700" fill="#202124">不需要驻留上下文，那</tspan></text>
<text x="1130.0" y="186" class="xxs"><tspan font-weight="700" fill="#202124">片硅省下来给了 MXU 和 VMEM</tspan>。 好处：耗时高度可</text>
<text x="1130.0" y="200" class="xxs">预测，同样的形状每次都一样快。 坏处：<tspan font-weight="700" fill="#d93025">挪不动就</tspan></text>
<text x="1130.0" y="214" class="xxs"><tspan font-weight="700" fill="#d93025">是真空转</tspan>，运行时没有第二次机会。</text>
<rect x="20" y="562" width="1360" height="158" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="34" y="588" class="sec" fill="#d93025">这个取舍在日常里长什么样　—— 三件事其实是同一件事</text>
<text x="34.0" y="618" class="lbl" fill="#d93025">① 形状一不规则，性能就掉得很难看</text>
<text x="34.0" y="638" class="xxs">不是编译器不肯优化，是<tspan font-weight="700" fill="#202124">可挪的独立指令本来就少了</tspan>。batch 小、序列不齐、专家路由不均 —— </text>
<text x="34.0" y="652" class="xxs">这几种情况的共同点都是「后一步紧跟着前一步」，空拍没东西填。</text>
<text x="486.0" y="618" class="lbl" fill="#d93025">② 编译很慢，而且慢得有道理</text>
<text x="486.0" y="638" class="xxs">v7 上一次 XLA 编译常见 <tspan font-weight="700" fill="#202124">10–17 分钟</tspan>。它不是在「翻译」，是在<tspan font-weight="700" fill="#202124">替硬件把整张班表排完</tspan> —— </text>
<text x="486.0" y="652" class="xxs">GPU 那边这件事是每次运行时由调度器现做的，成本摊在了跑的时候。</text>
<text x="938.0" y="618" class="lbl" fill="#d93025">③ 但跑起来非常稳</text>
<text x="938.0" y="638" class="xxs">同一个形状重复跑，步时几乎没有抖动 —— 因为根本没有运行时决策可抖。<tspan font-weight="700" fill="#202124">可预测性是这个设计</tspan></text>
<text x="938.0" y="652" class="xxs"><tspan font-weight="700" fill="#202124">买来的东西，不是附带效果</tspan>：容量规划、性能回归检测在 TPU 上都因此简单不少。</text>
<rect x="20" y="742" width="1360" height="116" rx="10" fill="#e0f2f0" stroke="#12786f" stroke-width="1.6"/>
<text x="34" y="768" class="sec" fill="#12786f">把 §2 那句话补完整</text>
<text x="34" y="792" class="xs">§2 说 TPU「省下了调度器、寄存器堆、记分板那片硅」。<tspan font-weight="700" fill="#202124">这张图是那句话的另一半：省下来的东西并没有消失，它被搬到了编译期。</tspan>调度这件事总得有人做 —— 区别只在于是硬件每次运行时重做一遍，还是编译器一次做完。</text>
<text x="34" y="822" class="xs">所以「TPU 更简单」是个误解。它<tspan font-weight="700" fill="#d93025">不是把复杂度删掉了，是把复杂度换了个地方放</tspan> —— 从硅上换到了编译器里，也从运行时换到了你写模型配置的那一刻。</text>
</svg>
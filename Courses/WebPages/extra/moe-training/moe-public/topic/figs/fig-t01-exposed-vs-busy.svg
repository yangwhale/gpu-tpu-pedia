<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 375" width="980" height="375"><rect width="980" height="375" fill="#fff"/><text x="490.0" y="30" font-family="Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">两条轨道、两种数：暴露等待（TensorCore）≠ 通信执行（SparseCore）</text><text x="490.0" y="54" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#5f6368">示意图，区间位置不按比例；两个总数来自一次大号模型 FP8 profile，按步时指数的尺子折成指数点</text><text x="176" y="112" font-family="Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">TensorCore</text><text x="176" y="130" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="end" fill="#5f6368">计算 + 等待</text><rect x="190" y="92" width="120" height="44" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><rect x="310" y="92" width="20" height="44" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><rect x="330" y="92" width="190" height="44" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><rect x="520" y="92" width="15" height="44" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><rect x="535" y="92" width="215" height="44" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><rect x="750" y="92" width="30" height="44" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><rect x="780" y="92" width="160" height="44" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="250" y="120" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">计算</text><text x="425" y="120" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">计算</text><text x="642" y="120" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">计算</text><text x="860" y="120" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">计算</text><text x="176" y="202" font-family="Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">SparseCore</text><text x="176" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="end" fill="#5f6368">collective 执行</text><rect x="210" y="182" width="270" height="44" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><rect x="490" y="182" width="250" height="44" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><rect x="750" y="182" width="180" height="44" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><text x="345" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">AG / RS 执行</text><text x="615" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">AG / RS 执行</text><text x="840" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">AG / RS 执行</text><rect x="60" y="262" width="420" height="64" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><text x="270.0" y="289.9" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">红色 = async-done 上的暴露等待：没藏住的部分</text><text x="270.0" y="307.9" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">合计约 3 个指数点</text><rect x="500" y="262" width="440" height="64" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><text x="720.0" y="289.9" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">绿色 = SparseCore 上通信执行区间的并集</text><text x="720.0" y="307.9" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#202124">合计约 30 个指数点 = 网络真实占用</text><text x="490.0" y="358" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#d93025" font-weight="bold">两数不能相加；差值也不等于「藏住了多少」</text></svg>

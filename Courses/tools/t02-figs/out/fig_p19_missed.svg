<svg viewBox="0 0 1400 800" width="1400" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两次漏改的真实机制：同一个文件里改了一处、漏了另一处 ——不是搜索能力问题，是注意力问题">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">同一个漏法，两次　—— <tspan font-weight="700" fill="#d93025">而两次都发生在同一个文件之内</tspan></text>
<rect x="1270" y="10" width="110" height="22" rx="11" fill="#d93025"/>
<text x="1325.0" y="25" class="lbl" fill="#fff" text-anchor="middle">撤源数，漏派生数</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#e8eaed"/>
<text x="37" y="58" class="sm">时间轴灰段＝上游还立着，跟着错不算漏改</text>
<rect x="277.5" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="294.5" y="58" class="sm">时间轴红段＝上游已撤、它还挂着，这才是「漏改」</text>
<rect x="581.0" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="598.0" y="58" class="sm">两条轴共用一把尺子：整条 = 08-05 → 08-31，26 天</text>
<rect x="20" y="124" width="676" height="520" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="20" y="124" width="5" height="520" rx="3" fill="#d93025"/>
<text x="40" y="151" class="sec" fill="#d93025">血缘一　·　孤儿期 15 天</text>
<rect x="40" y="168" width="636" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
<text x="52" y="183" class="xxs" fill="#f9ab00">源数　·　自己测错了</text>
<text x="52" y="202" class="numb" fill="#202124">1,014.8</text>
<text x="664" y="202" class="xxs" fill="#5f6368" text-anchor="end">TFLOP/s/chip　·　生 08-15，08-16 撤回</text>
<line x1="66" y1="220" x2="66" y2="236" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="40" y="236" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="52" y="251" class="xxs" fill="#8430ce">派生数　·　÷ 138.85 GFLOP/token</text>
<text x="52" y="270" class="numb" fill="#202124">7,308</text>
<text x="664" y="270" class="xxs" fill="#5f6368" text-anchor="end">tok/s/chip</text>
<line x1="66" y1="288" x2="66" y2="304" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="40" y="304" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="52" y="319" class="xxs" fill="#8430ce">它撑起的那句话</text>
<text x="52" y="338" class="box" fill="#202124">「v7 的 FP8 已反超 GB300 +17%」</text>
<text x="664" y="338" class="xxs" fill="#5f6368" text-anchor="end">7,308 对 6,242</text>
<rect x="40" y="372" width="636" height="118" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.2"/>
<text x="52" y="392" class="lbl">08-16　<tspan class="mono" fill="#1967d2">8c46582</tspan>　标题：「清掉<tspan font-weight="700" fill="#202124">全部</tspan>失效的 1,014.8」</text>
<text x="52" y="419" class="xxs"><tspan font-weight="700" fill="#202124">它确实动了 7,308</tspan> —— <tspan class="mono" fill="#1967d2">README.md</tspan> <tspan font-weight="700" fill="#202124">第 29 行</tspan>那格被改成了 <tspan class="mono" fill="#1967d2">4,876</tspan>。</text>
<text x="52" y="444" class="xxs"><tspan font-weight="700" fill="#202124">但同一个文件第 51 行还写着「已反超 GB300（7,308 vs 6,242）」</tspan><tspan fill="#9aa0a6">，第 52 行还挂着口径提醒。</tspan></text>
<text x="52" y="469" class="xxs"><tspan font-weight="700" fill="#202124">相隔 22 行。同一个文件、同一个数，改掉一处、漏了另一处。</tspan></text>
<line x1="54" y1="536" x2="662" y2="536" stroke="#dadce0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="287.8461538461538" y="527" width="23.384615384615415" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.2"/>
<rect x="311.2307692307692" y="527" width="350.7692307692308" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="287.8461538461538" y="558" class="xxs" fill="#5f6368">生 · 次日上游就撤了</text>
<text x="662.0" y="558" class="xxs" fill="#d93025" text-anchor="end">它才撤</text>
<rect x="40" y="576" width="636" height="46" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="54" y="598" class="numb" fill="#d93025">孤儿期 15 天</text>
<text x="662" y="598" class="xxs" fill="#5f6368" text-anchor="end">上游已经撤了、它还挂着的那段时间</text>
<rect x="704" y="124" width="676" height="520" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="704" y="124" width="5" height="520" rx="3" fill="#9aa0a6"/>
<text x="724" y="151" class="sec" fill="#202124">血缘二　·　同一个漏法，15 天后又来一次</text>
<rect x="724" y="168" width="636" height="52" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="736" y="183" class="xxs" fill="#d93025">源数　·　从来没有出处</text>
<text x="736" y="202" class="numb" fill="#202124">2,700 / 5,400</text>
<text x="1348" y="202" class="xxs" fill="#5f6368" text-anchor="end">GB300 峰值　·　生 07-12，08-31 撤回</text>
<line x1="750" y1="220" x2="750" y2="236" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="724" y="236" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="736" y="251" class="xxs" fill="#8430ce">派生数　·　拿它当分母</text>
<text x="736" y="270" class="numb" fill="#202124">31.60%</text>
<text x="1348" y="270" class="xxs" fill="#5f6368" text-anchor="end">GB300 的 MFU　·　生 08-05</text>
<line x1="750" y1="288" x2="750" y2="304" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="724" y="304" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="736" y="319" class="xxs" fill="#8430ce">它进了哪儿</text>
<text x="736" y="338" class="box" fill="#202124">跟 v7 并排的对照表</text>
<text x="1348" y="338" class="xxs" fill="#5f6368" text-anchor="end">并排比了 26 天</text>
<rect x="724" y="372" width="636" height="118" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.2"/>
<text x="736" y="392" class="lbl">08-31 00:24　<tspan class="mono" fill="#1967d2">483128b</tspan>　标题：「修正 GB300 峰值」</text>
<text x="736" y="419" class="xxs"><tspan font-weight="700" fill="#202124">它在同一个文件第 55 行亲手写下「31.6% 的分母 2,700 是推出来的，官方没有这个数」</tspan></text>
<text x="736" y="444" class="xxs"><tspan fill="#9aa0a6">—— 而</tspan><tspan font-weight="700" fill="#202124">第 24 行的表格里，</tspan><tspan class="mono" fill="#1967d2">31.60%</tspan> 原样挂着。相隔 31 行。</text>
<text x="736" y="469" class="xxs"><tspan font-weight="700" fill="#202124">在同一个文件里写下「这个数是错的」，却没改上面那个数。</tspan>两分半后 <tspan class="mono" fill="#1967d2">e2d0dc4</tspan> 补上。</text>
<line x1="738" y1="536" x2="1346" y2="536" stroke="#dadce0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="738.0" y="527" width="608.0" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.2"/>
<rect x="1346.0" y="527" width="3" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="738.0" y="558" class="xxs" fill="#5f6368" text-anchor="middle">生</text>
<text x="1346.0" y="558" class="xxs" fill="#9aa0a6" text-anchor="end">上游撤 · 同一次坐下来就补上了</text>
<rect x="724" y="576" width="636" height="46" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="738" y="598" class="numb" fill="#202124">孤儿期 2 分 30 秒</text>
<text x="1346" y="598" class="xxs" fill="#5f6368" text-anchor="end">上游已经撤了、它还挂着的那段时间</text>
<rect x="20" y="668" width="1360" height="108" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="696" class="sec">⭐ 两次都不是「搜不到」—— 两次都是同一个文件里，改了一处、漏了另一处；第二次甚至在同一个文件里亲手写下了「这个数是错的」</text>
<text x="38" y="722" class="xs"><tspan fill="#9aa0a6">所以「撤回后记得搜一遍下游」这条规矩</tspan><tspan font-weight="700" fill="#202124">是废话</tspan>：<tspan font-weight="700" fill="#202124">搜索从来不是瓶颈，注意力才是。</tspan></text>
<text x="38" y="743" class="xs"><tspan font-weight="700" fill="#202124">⭐ 把负担挪到落笔时：一个数如果是算出来的，就把算式写在它旁边</tspan><tspan fill="#9aa0a6"> —— </tspan><tspan class="mono" fill="#1967d2">7,308 = 1,014.8e12 ÷ 138.85e9</tspan>。这样改上游的人<tspan font-weight="700" fill="#202124">在同一屏上就能看见它</tspan>。</text>
<text x="1380" y="788" class="xxs" fill="#9aa0a6" text-anchor="end">⛔ 这一格的机制写错过两次（第一版是编的，第二版查得不够）—— 上面这一版的每个行号都对 git 逐条核过</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图。两行时间轴以基线慢层层长等于 100 归一。慢层：3 个 RS 在 13 就在 SparseCore 1 上一个接一个发，TensorCore 算了一小段就干等它们，干等 37；3 个 AG 挤到 75 之后才在 SparseCore 0 发。快层：AG 在 33 先发，RS 到 48 才起、落在 tgmm 和 gmm 底下，只在末尾补等 16，层长 83。播放头同时扫过两行。">

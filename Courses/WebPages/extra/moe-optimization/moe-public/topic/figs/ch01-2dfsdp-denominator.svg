<text x="266.0" y="242.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">1024 芯片</text>
<text x="884.0" y="230.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">约 90%</text>
<text x="244.0" y="308.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">2D FSDP 实际</text>

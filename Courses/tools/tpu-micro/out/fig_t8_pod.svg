<text x="1330.322671487088" y="271" class="xxs" fill="#1e8e3e">1 个 pod</text>
<text x="1326.322671487088" y="288" class="lbl" fill="#1e8e3e" text-anchor="end">9,216 颗 ＝ 144 个 cube</text>
<text x="700" y="330" class="box" fill="#1a73e8">B200</text>
<rect x="792" y="314" width="250.3226714870882" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
<text x="804" y="339" class="lbl" fill="#1a73e8">NVLink 域</text>
<rect x="1042.3226714870882" y="314" width="317.6773285129118" height="40" rx="6" fill="#fff" stroke="#1a73e8" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="1054.3226714870882" y="339" class="xxs" fill="#1a73e8">InfiniBand ／ 以太网　—— 带宽掉一个量级，而且集合通信要重写</text>
<line x1="913.7142857142857" y1="314" x2="913.7142857142857" y2="354" stroke="#fff" stroke-width="1.4"/>
<text x="917.7142857142857" y="367" class="xxs" fill="#1a73e8">1 台机器</text>
<line x1="1042.3226714870882" y1="314" x2="1042.3226714870882" y2="354" stroke="#fff" stroke-width="1.4"/>
<text x="1046.3226714870882" y="367" class="xxs" fill="#1a73e8">1 个机柜</text>
<line x1="1042.3226714870882" y1="188" x2="1042.3226714870882" y2="380" stroke="#d93025" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="1050.3226714870882" y="182" class="lbl" fill="#d93025">换协议就在这儿</text>
<text x="700" y="400" class="xs"><tspan font-weight="700" fill="#202124">128 倍的差距不在带宽上，在「不换协议能连多远」上。</tspan>9,216 ÷ 72 ＝ 128 —— 而且这两个数量级之间，TPU 那一侧<tspan font-weight="700" fill="#d93025">集合通信的写法</tspan></text>
<text x="700" y="416" class="xs"><tspan font-weight="700" fill="#d93025">一个字都不用改</tspan>。</text>
<text x="700" y="446" class="xs">反过来说也别夸大：<tspan font-weight="700" fill="#202124">单颗算力两边几乎打平</tspan>（B200 约 2,250 TFLOP/s BF16，TPU v7 一颗 chip 2,307），而且在 72 颗以内 </text>
<text x="700" y="462" class="xs"><tspan font-weight="700" fill="#d93025">NVLink 的每颗带宽还更高</tspan>（1.8 TB/s 对 1.2 TB/s）。<tspan fill="#9aa0a6">这张图比的是拓扑能延展多远，不是单芯片谁快。</tspan></text>
<rect x="20" y="724" width="670.0" height="186" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8"/>
<text x="36" y="750" class="sec" fill="#f9ab00">口径警告：「pod」有两个官方定义</text>
<text x="36" y="772" class="xs">同一批官方材料里，「pod」既被用来指 <tspan font-weight="700" fill="#202124">9,216 颗芯片的整机规模</tspan>，也被用来指<tspan font-weight="700" fill="#202124">一个 256 颗的可售单元</tspan>。两个都是官方说法，<tspan font-weight="700" fill="#d93025">互</tspan></text>
<text x="36" y="788" class="xs"><tspan font-weight="700" fill="#d93025">相矛盾，而且没有一处说明哪个作准</tspan>。</text>
<text x="36" y="842" class="xs">所以看到「一个 pod」这四个字，<tspan font-weight="700" fill="#202124">先问是哪个 pod</tspan>。本文提到 pod 一律指 9,216 那个，并且每次都把数字写出来。</text>
<rect x="710.0" y="724" width="670.0" height="186" rx="10" fill="#fff" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="726.0" y="750" class="sec" fill="#9aa0a6">这一节里我查不到的</text>
<text x="726.0" y="772" class="xs"><tspan font-weight="700" fill="#202124">1. 实际能一次调度到的最大切片。</tspan>物理上 9,216 颗连成一个环面是官方数字，但「一个作业最多能拿到多大一块」取决于调度系</text>
<text x="726.0" y="788" class="xs">统，<tspan fill="#9aa0a6">公开资料里没有一个可引用的上限</tspan>。</text>
<text x="726.0" y="842" class="xs"><tspan font-weight="700" fill="#202124">2. 环面在多大规模上会退化成非环。</tspan>边缘切片能不能拿到环绕链路，公开资料同样没说。<tspan fill="#9aa0a6">不猜。</tspan></text>
<rect x="700" y="518" width="680" height="178" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="716" y="544" class="sec" fill="#d93025">1,200 GB/s 这个数，官方自己写拧了</text>
<text x="716" y="566" class="xs">官方正文写的是「每<tspan font-weight="700" fill="#202124">轴</tspan>双向 200 GB/s」。可是三个轴 × 200 ＝ 600，对不上同一页表格里的 <tspan font-weight="700" fill="#202124">1,200</tspan>。</text>
<text x="716" y="608" class="xs">只有把它读成「每条<tspan font-weight="700" fill="#202124">链路</tspan> 200」才自洽：6 条 × 200 ＝ 1,200。<tspan font-weight="700" fill="#d93025">本文按这个读法画</tspan>，并且在这里写明原文是另一种措辞 —— <tspan font-weight="700" fill="#202124">遇到官</tspan></text>
<text x="716" y="624" class="xs"><tspan font-weight="700" fill="#202124">方文档自相矛盾，正确做法是标出来，不是挑一个顺手的悄悄用。</tspan></text>
<rect x="20" y="930" width="1360" height="120" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="34" y="956" class="sec" fill="#1e8e3e">两份文档合起来的那一句话</text>
<text x="34" y="982" class="xs">GPU 那份的最后一张图讲的是：一颗 B200 里有 <tspan font-weight="700" fill="#202124">592 个 Tensor Core</tspan>，而一颗 TPU v7 里只有 <tspan font-weight="700" fill="#202124">4 个 MXU</tspan> —— 同样一块矩阵乘的活，两边被切成的份数差 <tspan font-weight="700" fill="#202124">128 倍</tspan>。<tspan font-weight="700" fill="#d93025">GPU 的协调主要发生在芯片内部。</tspan></text>
<text x="34" y="1016" class="xs">这张图讲的是另一半：TPU 一颗芯片里只有两个核要协调，但<tspan font-weight="700" fill="#202124">不换协议能一路连到 9,216 颗</tspan>，而 GPU 在 72 颗上就得换。<tspan font-weight="700" fill="#d93025">TPU 的协调主要发生在芯片之间。</tspan>　<tspan font-weight="700" fill="#202124">两边不是「谁更强」，是把同一份复杂度放在了不同的地方 —— 这也是这整份材料从头到尾在说的同一件事。</tspan></text>
</svg>
<svg viewBox="0 0 1400 890" width="1400" height="890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="序列 128K 时注意力矩阵是 32 GiB，朴素写法要四趟 HBM 往返共 128 GiB；FlashAttention 用 online softmax 让它永远不落 HBM，计算量一点没变">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">先看这一节要解决的到底是什么　—— <tspan font-weight="700">128 GiB 全花在路上，一次乘法都没做</tspan></text>
<rect x="1281" y="10" width="99" height="22" rx="11" fill="#d93025"/>
<text x="1330.5" y="25" class="lbl" fill="#fff" text-anchor="middle">3.6 的引子</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">HBM 往返：真正的开销</text>
<rect x="176.3" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="193.3" y="58" class="sm">留在片上：省下来的</text>
<rect x="318.8" y="48" width="11" height="11" rx="2" fill="#5f6368"/>
<text x="335.8" y="58" class="sm">Q / K / V / O：无论如何都要搬的</text>
<rect x="20" y="84" width="1360" height="112" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="38" y="112" class="sec" fill="#d93025">一个头、一个样本、序列 128K、head_dim 128、bf16</text>
<text x="38" y="152" class="numb" fill="#202124">131,072</text>
<text x="38" y="172" class="xxs" fill="#5f6368">序列长度 n</text>
<text x="250" y="152" class="numb" fill="#5f6368">×</text>
<text x="290" y="152" class="numb" fill="#202124">131,072</text>
<text x="290" y="172" class="xxs" fill="#5f6368">n</text>
<text x="500" y="152" class="numb" fill="#5f6368">×</text>
<text x="540" y="152" class="numb" fill="#202124">2 B</text>
<text x="540" y="172" class="xxs" fill="#5f6368">bf16</text>
<text x="660" y="152" class="numb" fill="#5f6368">＝</text>
<text x="710" y="152" class="numb" fill="#202124">32 GiB</text>
<text x="710" y="172" class="xxs" fill="#5f6368">注意力矩阵 S 一个人就这么大</text>
<rect x="940" y="124" width="424" height="56" rx="6" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="954" y="146" class="xs"><tspan font-weight="700" fill="#202124">而 Q / K / V / O 四个加起来只有 128 MiB。</tspan><tspan font-weight="700" fill="#d93025">中间产物比输入输出大 250 倍。</tspan></text>
<rect x="20" y="218" width="674" height="268" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="38" y="246" class="sec" fill="#d93025">❌ 朴素写法：S 要在 HBM 里过四趟</text>
<text x="38" y="268" class="xxs" fill="#5f6368">每一步都是「算完写回去，下一步再读出来」</text>
<rect x="38" y="294" width="250" height="32" rx="5" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="50" y="315" class="xs" fill="#202124">① 算 S ＝ QKᵀ</text>
<line x1="292" y1="310" x2="336" y2="310" stroke="#d93025" stroke-width="2.0" marker-end="url(#aB)"/>
<rect x="340" y="294" width="150" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="352" y="315" class="xs" fill="#d93025">写 S　→　HBM</text>
<text x="510" y="315" class="numb" fill="#d93025">32 GiB</text>
<rect x="38" y="334" width="250" height="32" rx="5" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="50" y="355" class="xs" fill="#202124">② 算 softmax</text>
<line x1="292" y1="350" x2="336" y2="350" stroke="#d93025" stroke-width="2.0" marker-end="url(#aB)"/>
<rect x="340" y="334" width="150" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="352" y="355" class="xs" fill="#d93025">读 S　→　HBM</text>
<text x="510" y="355" class="numb" fill="#d93025">32 GiB</text>
<rect x="38" y="374" width="250" height="32" rx="5" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="50" y="395" class="xs" fill="#202124">　</text>
<line x1="292" y1="390" x2="336" y2="390" stroke="#d93025" stroke-width="2.0" marker-end="url(#aB)"/>
<rect x="340" y="374" width="150" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="352" y="395" class="xs" fill="#d93025">写 P　→　HBM</text>
<text x="510" y="395" class="numb" fill="#d93025">32 GiB</text>
<rect x="38" y="414" width="250" height="32" rx="5" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="50" y="435" class="xs" fill="#202124">③ 算 O ＝ PV</text>
<line x1="292" y1="430" x2="336" y2="430" stroke="#d93025" stroke-width="2.0" marker-end="url(#aB)"/>
<rect x="340" y="414" width="150" height="32" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.3"/>
<text x="352" y="435" class="xs" fill="#d93025">读 P　→　HBM</text>
<text x="510" y="435" class="numb" fill="#d93025">32 GiB</text>
<rect x="38" y="458" width="638" height="18" rx="4" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="50" y="472" class="xs" fill="#d93025">合计 128 GiB 的 HBM 往返 —— 这一大笔里，一次乘法都没有</text>
<rect x="706" y="218" width="674" height="268" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.8"/>
<text x="724" y="246" class="sec" fill="#1e8e3e">✅ FlashAttention：S 从来不落 HBM</text>
<text x="724" y="268" class="xxs" fill="#5f6368">分块 ＋ online softmax，一块算完就地更新结果</text>
<rect x="724" y="290" width="420" height="148" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="738" y="312" class="box" fill="#1e8e3e">片上暂存（共享内存 ／ VMEM）</text>
<rect x="738" y="324" width="392" height="30" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="750" y="344" class="xs" fill="#202124">① 取一块 K/V ＋ 一块 Q</text>
<rect x="738" y="360" width="392" height="30" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="750" y="380" class="xs" fill="#202124">② 算这一小块的 S，就地做 online softmax</text>
<rect x="738" y="396" width="392" height="30" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="750" y="416" class="xs" fill="#202124">③ 用跑动的最大值和分母，就地更新 O</text>
<line x1="934" y1="438" x2="934" y2="454" stroke="#1e8e3e" stroke-width="2.0" marker-end="url(#aB)"/>
<text x="946" y="452" class="xxs" fill="#1e8e3e">循环下一块</text>
<rect x="1158" y="290" width="204" height="148" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
<text x="1170" y="312" class="box" fill="#f9ab00">代价要说清楚</text>
<text x="1170" y="330" class="xxs"><tspan font-weight="700" fill="#202124">K/V 要按 Q 的分块重复读若干趟</tspan>，这一</text>
<text x="1170" y="344" class="xxs">项不是零。<tspan fill="#9aa0a6">所以收益取决于「S 那一项原</tspan></text>
<text x="1170" y="358" class="xxs"><tspan fill="#9aa0a6">本占多大」—— 序列越长越划算，短序列</tspan></text>
<text x="1170" y="372" class="xxs"><tspan fill="#9aa0a6">可能不值。</tspan></text>
<rect x="724" y="458" width="638" height="18" rx="4" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="736" y="472" class="xs" fill="#1e8e3e">S 那 128 GiB 整项消失 —— 而结果与朴素写法数学等价</text>
<rect x="20" y="508" width="1360" height="118" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
<text x="38" y="536" class="sec" fill="#1a73e8">🔢 三笔账，只有一笔变了</text>
<text x="38" y="566" class="lbl" fill="#5f6368">计算量 FLOPs</text>
<text x="38" y="590" class="box" fill="#1e8e3e">完全不变</text>
<text x="38" y="610" class="xxs" fill="#5f6368">一次乘法都没省</text>
<text x="486" y="566" class="lbl" fill="#5f6368">HBM 读写</text>
<text x="486" y="590" class="box" fill="#d93025">O(n²) → O(n²/块大小)</text>
<text x="486" y="610" class="xxs" fill="#5f6368">省的全在这一行</text>
<text x="934" y="566" class="lbl" fill="#5f6368">显存占用</text>
<text x="934" y="590" class="box" fill="#d93025">O(n²) → O(n)</text>
<text x="934" y="610" class="xxs" fill="#5f6368">32 GiB 的中间产物不存在了</text>
<rect x="20" y="648" width="1360" height="112" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/>
<text x="38" y="676" class="sec" fill="#8430ce">⭐ 落点：这一节问的「一个数怎么从 HBM 走到计算单元」，不是学术问题</text>
<text x="38" y="702" class="xs"><tspan font-weight="700" fill="#202124">过去五年最重要的那个 kernel，做的事跟计算单元一点关系都没有。</tspan>它没有换算法、没有减 FLOPs、没有用新指令 —— <tspan font-weight="700" fill="#d93025">它只是把数据在路上的走法改了一下。</tspan></text>
<text x="38" y="723" class="xs"><tspan font-weight="700" fill="#202124">所以接下来要一站一站走完这条路</tspan>，而且两边并排走：<tspan font-weight="700" fill="#202124">同一个 FlashAttention，在 GPU 上和在 TPU 上，每一站分别落在哪、由谁决定。</tspan></text>
<rect x="20" y="782" width="1360" height="88" rx="10" fill="#fff" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="38" y="808" class="sec">⚠️ 出处分层</text>
<text x="38" y="830" class="xs"><tspan font-weight="700" fill="#202124">当场算的</tspan>：131,072² × 2 B ＝ 32 GiB；四趟 ＝ 128 GiB；Q/K/V/O ＝ 4 × 131,072 × 128 × 2 B ＝ 128 MiB。式子都写在图上，可以自己复核。</text>
<text x="38" y="849" class="xxs"><tspan font-weight="700" fill="#202124">公开结论</tspan>：FLOPs 不变、HBM 读写降到 O(n²/块大小)、显存 O(n²)→O(n) —— FlashAttention 原始结论。<tspan fill="#9aa0a6">「短序列可能不划算」也是公开说法，本图不给具体门槛。</tspan></text>
</svg>
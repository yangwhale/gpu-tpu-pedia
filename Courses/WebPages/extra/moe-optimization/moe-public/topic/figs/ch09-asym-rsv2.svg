<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="三根横条是同一个大梯度规约的单次耗时：开 asym 的 RS 最短，关 asym 的 RS 慢约三成，退成整块 all-reduce 慢约六成。knockout 单关 RS v2 时从最短一根直接退到 all-reduce，丢掉整截，约 8 点；阶梯里 asym 已经先拆了，RS v2 只挽回关 asym 的 RS 到 all-reduce 那一小段，约 3 点；加上 knockout 关 asym 的约 5 点，正好约 8 点。">
<title>三根横条是同一个大梯度规约的单次耗时：开 asym 的 RS 最短，关 asym 的 RS 慢约三成，退成整块 all-reduce 慢约六成。knockout 单关 RS v2 时从最短一根直接退到 all-reduce，丢掉整截，约 8 点；阶梯里 asym 已经先拆了，RS v2 只挽回关 asym 的 RS 到 all-reduce 那一小段，约 3 点；加上 knockout 关 asym 的约 5 点，正好约 8 点。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="376" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">asym 只给 RS 提速，不给 AR：阶梯里先拆了 asym，RS v2 只剩后一小段可挽回</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">上：条长示意单次耗时（慢约三成 / 六成）。下：点数对账，另按点数比例画。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">梯度规约单次耗时</text>
<rect x="184.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="206.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">比开 asym 的 RS 多出的部分</text>
<text x="24.0" y="156.0" font-size="14" fill="#202124" text-anchor="start">开 asym 的 RS（满配路径）</text>
<rect x="250.0" y="136.0" width="300.0" height="28.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="24.0" y="206.0" font-size="14" fill="#202124" text-anchor="start">关 asym 的 RS</text>
<rect x="250.0" y="186.0" width="300.0" height="28.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<rect x="550.0" y="186.0" width="90.0" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="648.0" y="206.0" font-size="14" fill="#a50e0e" text-anchor="start">慢约三成</text>
<text x="24.0" y="256.0" font-size="14" fill="#202124" text-anchor="start">退成整块 all-reduce</text>
<rect x="250.0" y="236.0" width="300.0" height="28.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<rect x="550.0" y="236.0" width="180.0" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="738.0" y="256.0" font-size="14" fill="#a50e0e" text-anchor="start">慢约六成</text>
<text x="24.0" y="310.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">点数对账</text>
<line x1="250.0" y1="306.0" x2="420.0" y2="306.0" stroke="#d93025" stroke-width="4"/>
<line x1="420.0" y1="306.0" x2="522.0" y2="306.0" stroke="#1a73e8" stroke-width="4"/>
<text x="335.0" y="296.0" font-size="13" fill="#a50e0e" text-anchor="middle">knockout 关 asym ≈ 5 点</text>
<text x="471.0" y="326.0" font-size="13" fill="#174ea6" text-anchor="middle">阶梯 RS v2 ≈ 3 点</text>
<line x1="250.0" y1="350.0" x2="522.0" y2="350.0" stroke="#202124" stroke-width="2"/>
<line x1="250.0" y1="344.0" x2="250.0" y2="356.0" stroke="#202124" stroke-width="2"/>
<line x1="522.0" y1="344.0" x2="522.0" y2="356.0" stroke="#202124" stroke-width="2"/>
<text x="534.0" y="355.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">knockout 单关 RS v2 ≈ 8 点：3 + 5 ≈ 8</text>
</svg>

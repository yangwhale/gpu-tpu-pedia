</g>
<line x1="180.0" y1="363.0" x2="180.0" y2="391.0" stroke="#1a73e8" stroke-width="1.6" marker-end="url(#ar1a73e8)"/>
<g>
<rect x="30.0" y="395.0" width="300.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="180.0" y="414.7" font-size="13" fill="#202124" text-anchor="middle">每个 shard 各算 top-k</text>
</g>

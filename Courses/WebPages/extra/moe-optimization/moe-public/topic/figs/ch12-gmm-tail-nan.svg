<text x="393.0" y="211.0" font-size="14" fill="#5f6368" text-anchor="middle" font-weight="700">0</text>
<line x1="373.0" y1="116.0" x2="373.0" y2="236.0" stroke="#202124" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="369.0" y="112.0" font-size="13" fill="#5f6368" text-anchor="end">K 的真实边界</text>
<text x="44.0" y="270.0" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700">越界区：NaN × 0 ＝ NaN</text>
<text x="44.0" y="294.0" font-size="14" fill="#5f6368" text-anchor="start">累加进去，整个输出变 NaN</text>
<text x="44.0" y="318.0" font-size="14" fill="#5f6368" text-anchor="start">表现：第 0 步 loss 正常、grad_norm 已是 NaN</text>
<rect x="462.0" y="76.0" width="414.0" height="270.0" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
<rect x="462.0" y="76.0" width="414.0" height="4.0" rx="0" fill="#188038"/>
<text x="476.0" y="102.0" font-size="15" fill="#0d652d" text-anchor="start" font-weight="700">改后：LHS 也 mask</text>
<text x="482.0" y="152.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">LHS</text>

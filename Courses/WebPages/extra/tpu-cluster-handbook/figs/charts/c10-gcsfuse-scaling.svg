<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" role="img" aria-label="gcsfuse 读吞吐：1 台 host 1 / 8 / 32 / 64 路读线程合计 0.32 / 1.27 / 3.76 / 5.82 GB/s，低于每线程 0.32 的线性外推；16 台 host 1 路 4.94 GB/s、32 路 56 与 60 GB/s，约为 1 台的 15 倍。单线程拉 10 GB 环境 tar 约 33 秒，32 路约 2–3 秒。" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif' class="chart"><title>gcsfuse 读吞吐：加 host 是线性的（16 台 ≈ 15×），同一台上加线程是亚线性的（32 路 ≈ 12×）</title><desc>gcsfuse 读吞吐：1 台 host 1 / 8 / 32 / 64 路读线程合计 0.32 / 1.27 / 3.76 / 5.82 GB/s，低于每线程 0.32 的线性外推；16 台 host 1 路 4.94 GB/s、32 路 56 与 60 GB/s，约为 1 台的 15 倍。单线程拉 10 GB 环境 tar 约 33 秒，32 路约 2–3 秒。</desc><style>.pt{cursor:default}.pt:hover>*:not(title),.pt:focus>*:not(title){stroke:#202124;stroke-width:2.2}.pt:focus{outline:none}</style><rect width="880" height="480" fill="#fff"/><text x="20.0" y="30.0" font-size="19" fill="#202124" font-weight="700">gcsfuse 读吞吐：加 host 是线性的（16 台 ≈ 15×），同一台上加线程是亚线性的（32 路 ≈ 12×）</text><text x="20.0" y="52.0" font-size="14" fill="#5f6368">横轴 = 每台 host 的并发读线程数，纵轴 = 合计 GB/s（双对数）；虚线 = 「每线程 0.32 GB/s」的线性外推</text><text x="20.0" y="74.0" font-size="14" fill="#5f6368">两条线之间的距离在 1 路和 32 路都是约 15 倍 → 桶 / 对象一侧没成为瓶颈，瓶颈在每台 host 的读法</text><circle cx="26" cy="95" r="5.5" fill="#1a73e8"/><text x="38.0" y="100.0" font-size="13.5" fill="#202124">1 台 host</text><circle cx="132.42000000000002" cy="95" r="5.5" fill="#188038"/><text x="144.4" y="100.0" font-size="13.5" fill="#202124">16 台 host</text><line x1="240.4" y1="95" x2="254.4" y2="95" stroke="#5f6368" stroke-width="2" stroke-dasharray="4 3"/><text x="258.4" y="100.0" font-size="13.5" fill="#202124">每线程 0.32 GB/s 线性外推</text><line x1="80" y1="424.0" x2="620" y2="424.0" stroke="#eceff1"/><text x="72.0" y="428.5" font-size="13" fill="#5f6368" text-anchor="end">0.2</text><line x1="80" y1="384.2" x2="620" y2="384.2" stroke="#eceff1"/><text x="72.0" y="388.7" font-size="13" fill="#5f6368" text-anchor="end">0.5</text><line x1="80" y1="354.1" x2="620" y2=
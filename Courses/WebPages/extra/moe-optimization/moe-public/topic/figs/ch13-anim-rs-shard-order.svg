<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：前向 4 个 device 各持一个权重分片，沿两根轴联合 all-gather 成完整权重。反向完整梯度要 reduce-scatter 回去。两次按前向顺序的单轴 RS，每个 device 拿回自己的梯度分片；一次多轴 RS 顺序被打乱，D1、D2 拿到彼此的分片。右：lm_loss 相对差随训练步变化，第 0 步逐位一致，之后单调漂，第 1000 步约 −5%。">

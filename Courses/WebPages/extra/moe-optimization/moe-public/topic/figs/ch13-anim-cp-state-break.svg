<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="一条长序列按 CP 切成 4 个分片。绿点是递推状态，空心表示从零开始，越走越满。上：每个分片从 initial_state 等于 None 开始，绿点走到分片边界就消失，下一段从空心重来，长程依赖断开，显存和步时几乎不变、loss 看着正常。红斜纹是短卷积每段开头缺的左侧 halo。下：all-gather 路跨 rank 把上一段的末状态 S 交给下一段，绿点带着满状态越过边界。a2a 路改按头切，不产生分片边界。">
<title>CP 切开线性注意力：不交接状态，每个分片从零起算，边界处静默断开</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>
<style>
@keyframes tz { 0% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 2% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 11% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 21% { transform: translateX(150px); fill: #188038; stroke: #188038; opacity: 1 } 22% { transform: translateX(150px); fill: #d93025; stroke: #d93025; opacity: 1 } 24% { transform: translateX(150px); fill: #d93025; stroke: #d93025; opacity: 0 } 25% { transform: translateX(180px); fill: #ffffff; stroke: #188038; opacity: 1 } 34% { transform: translateX(180px); fill: #ffffff; stroke: #188038; opacity: 1 } 44% { transform: translateX(330px); fill: #188038; stroke: #188038; opacity: 1 } 45% { transform: translateX(330px); fill: #d93025; stroke: #d93025; opacity: 1 } 47% { transform: translateX(330px); fill: #d93025; stroke: #d93025; opacity: 0 } 48% { transform: translateX(360px); fill: #ffffff; stroke: #188038; opacity: 1 } 57% { transform: translateX(360px); fill: #ffffff; stroke: #188038; opacity: 1 } 67% { transform: translateX(510px); fill: #188038; stroke: #188038; opacity: 1 } 68% { transform: translateX(510px); fill: #d93025; stroke: #d93025; opacity: 1 } 70% { transform: translateX(510px); fill: #d93025; stroke: #d93025; opacity: 0 } 71% { transform: translateX(540px); fill: #ffffff; stroke: #188038; opacity: 1 } 80% { transform: translateX(540px); fill: #ffffff; stroke: #188038; opacity: 1 } 90% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 1 } 94% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 1 } 98% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 0 } 100% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 0 } }
@keyframes tk { 0% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 2% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 11% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 1 } 21% { transform: translateX(150px); fill: #188038; stroke: #188038; opacity: 1 } 25% { transform: translateX(180px); fill: #188038; stroke: #188038; opacity: 1 } 26% { transform: translateX(180px); fill: #188038; stroke: #188038; opacity: 1 } 34% { transform: translateX(180px); fill: #188038; stroke: #188038; opacity: 1 } 44% { transform: translateX(330px); fill: #188038; stroke: #188038; opacity: 1 } 48% { transform: translateX(360px); fill: #188038; stroke: #188038; opacity: 1 } 49% { transform: translateX(360px); fill: #188038; stroke: #188038; opacity: 1 } 57% { transform: translateX(360px); fill: #188038; stroke: #188038; opacity: 1 } 67% { transform: translateX(510px); fill: #188038; stroke: #188038; opacity: 1 } 71% { transform: translateX(540px); fill: #188038; stroke: #188038; opacity: 1 } 72% { transform: translateX(540px); fill: #188038; stroke: #188038; opacity: 1 } 80% { transform: translateX(540px); fill: #188038; stroke: #188038; opacity: 1 } 90% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 1 } 94% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 1 } 98% { transform: translateX(690px); fill: #188038; stroke: #188038; opacity: 0 } 100% { transform: translateX(0px); fill: #ffffff; stroke: #188038; opacity: 0 } }
.tz { animation: tz 12s infinite linear } .tk { animation: tk 12s infinite linear }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<rect width="900" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">CP 切开线性注意力：不交接状态，每个分片从零起算，边界处静默断开</text>
<text x="24" y="118" font-size="14" fill="#a50e0e" text-anchor="start" font-weight="700" >错：各分片独立</text>
<text x="24" y="138" font-size="13" fill="#5f6368" text-anchor="start" >initial_state=None</text>
<rect x="150" y="96" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="235" y="127" font-size="13" fill="#174ea6" text-anchor="middle" >分片 1</text>
<rect x="330" y="96" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="415" y="127" font-size="13" fill="#174ea6" text-anchor="middle" >分片 2</text>
<text x="325" y="90" font-size="16" fill="#d93025" text-anchor="middle" font-weight="700" >✕</text>
<rect x="332" y="98" width="14" height="46" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1.5" />
<rect x="510" y="96" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="595" y="127" font-size="13" fill="#174ea6" text-anchor="middle" >分片 3</text>
<text x="505" y="90" font-size="16" fill="#d93025" text-anchor="middle" font-weight="700" >✕</text>
<rect x="512" y="98" width="14" height="46" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1.5" />
<rect x="690" y="96" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="775" y="127" font-size="13" fill="#174ea6" text-anchor="middle" >分片 4</text>
<text x="685" y="90" font-size="16" fill="#d93025" text-anchor="middle" font-weight="700" >✕</text>
<rect x="692" y="98" width="14" height="46" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1.5" />
<circle cx="160" cy="108" r="7" fill="#188038" stroke="#188038" stroke-width="2" class="tz"/>
<text x="510" y="172" font-size="13" fill="#a50e0e" text-anchor="middle" >空心点：状态从零重来；红斜纹：短卷积每段开头缺左侧 halo</text>
<text x="24" y="248" font-size="14" fill="#0d652d" text-anchor="start" font-weight="700" >对：边界交接 S</text>
<text x="24" y="268" font-size="13" fill="#5f6368" text-anchor="start" >all-gather 路</text>
<rect x="150" y="226" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="235" y="257" font-size="13" fill="#174ea6" text-anchor="middle" >分片 1</text>
<rect x="330" y="226" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="415" y="257" font-size="13" fill="#174ea6" text-anchor="middle" >分片 2</text>
<line x1="311" y1="216" x2="339" y2="216" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="325" y="200" font-size="13" fill="#0d652d" text-anchor="middle" font-weight="700" >S</text>
<rect x="510" y="226" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="595" y="257" font-size="13" fill="#174ea6" text-anchor="middle" >分片 3</text>
<line x1="491" y1="216" x2="519" y2="216" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="505" y="200" font-size="13" fill="#0d652d" text-anchor="middle" font-weight="700" >S</text>
<rect x="690" y="226" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="775" y="257" font-size="13" fill="#174ea6" text-anchor="middle" >分片 4</text>
<line x1="671" y1="216" x2="699" y2="216" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="685" y="200" font-size="13" fill="#0d652d" text-anchor="middle" font-weight="700" >S</text>
<circle cx="160" cy="238" r="7" fill="#188038" stroke="#188038" stroke-width="2" class="tk"/>
<text x="510" y="300" font-size="13" fill="#5f6368" text-anchor="middle" >a2a 路改按头切，不产生分片边界</text>
</svg>
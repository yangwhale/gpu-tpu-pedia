@keyframes capk1 { 0% { opacity:1 } 5% { opacity:1 } 6% { opacity:.3 } 37% { opacity:.3 } 38% { opacity:1 } 71% { opacity:1 } 72% { opacity:.3 } 98% { opacity:.3 } 100% { opacity:1 } }

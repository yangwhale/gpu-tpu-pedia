<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图：一串逐步相对差有正有负，带符号平均（signed）接近 0，低于门槛；把负的柱取绝对值翻到上方后，平均值（MARE）升到门槛之上。例：+0.2% 和 −0.2% 两步，signed 为 0，MARE 为 0.2%。">
<title>signed 均值让正负偏差互相抵消：同一串差，signed 过门槛，先取绝对值的 MARE 不过</title>
<style>@keyframes flip { 0.00% { transform: scaleY(-1); } 3.00% { transform: scaleY(1); } 40.00% { transform: scaleY(1); } 55.00% { transform: scaleY(-1); } 100.00% { transform: scaleY(-1); } } .flip { animation: flip 10.0s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(-1); } @keyframes mare { 0.00% { opacity: 1; } 3.00% { opacity: 0; } 55.00% { opacity: 0; } 58.00% { opacity: 1; } 100.00% { opacity: 1; } } .mare { animation: mare 10.0s linear infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>

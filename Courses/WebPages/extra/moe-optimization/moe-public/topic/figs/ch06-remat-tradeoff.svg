<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 367" width="900" height="367" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：大号模型反向段两种 remat。full 每层反向后要重算，RS 正好藏在重算底下，只露一小截等待；custom 存了 context，重算块变短约 20%，但同样长的 RS 没东西盖，暴露等待涨约 65%，整段结束时间几乎一样、略晚不到 1%。">
<title>示意图：大号模型反向段两种 remat。full 每层反向后要重算，RS 正好藏在重算底下，只露一小截等待；custom 存了 context，重算块变短约 20%，但同样长的 RS 没东西盖，暴露等待涨约 65%，整段结束时间几乎一样、略晚不到 1%。</title>

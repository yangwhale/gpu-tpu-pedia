<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">不做 QAG 搬 2 字节、F 张卡各把完整权重量化一遍；QAG 先量化本地那份，搬的字节减半</text>
<text x="24" y="58" font-size="14" fill="#5f6368">动图（示意，单层、假设 AG 没藏住）：每组上行是通信，下行是计算；竖线是时间推进</text>

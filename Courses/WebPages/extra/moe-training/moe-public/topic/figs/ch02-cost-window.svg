<rect x="674.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="696.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">干等</text>
<rect x="731.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
<text x="753.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">buffer</text>
<text x="20.0" y="110.0" font-size="15" fill="#188038" text-anchor="start" font-weight="bold">表准：中间的计算刚好盖住通信，留一点余量</text>
<text x="20.0" y="141.0" font-size="14" fill="#202124" text-anchor="start">TC</text>
<text x="20.0" y="179.0" font-size="14" fill="#202124" text-anchor="start">SC</text>

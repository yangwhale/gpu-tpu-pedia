<line x1="574.72" y1="310.4" x2="596.32" y2="327.68" stroke="#1e8e3e" stroke-width="1.6" marker-end="url(#aG)"/>
<text x="609.28" y="337.44" class="xxs" fill="#1e8e3e" text-anchor="middle">Z−</text>
<text x="556" y="356" class="xxs" text-anchor="middle">每条 200 GB/s（双向），6 条合计 1,200</text>
<text x="20" y="586" class="xs"><tspan font-weight="700" fill="#202124">直径的差别是实打实的：</tspan>4×4×4 如果只是网格，最远要走 3+3+3 ＝ 9 跳；接成环面之后是 2+2+2 ＝ <tspan font-weight="700" fill="#202124">6 跳</tspan>。规模越大差得越多 </text>
<text x="20" y="601" class="xs">—— 这决定了 all-reduce 的最坏时延。</text>
<text x="20" y="632" class="xs"><tspan font-weight="700" fill="#d93025">但环面不是白拿的：</tspan>它要求切片在物理上必须是连续的一块立方体。所以 TPU 上你申请的不是「64 颗芯片」，是「一个 4×4×4」</text>
<text x="20" y="647" class="xs">—— <tspan font-weight="700" fill="#202124">形状本身是调度的一部分</tspan>，这一点在 §3 那张表里就已经埋下了。</text>
<text x="700" y="110" class="sec">同一根对数轴上，两边各能走多远</text>
<text x="700" y="130" class="xs">横轴是<tspan font-weight="700" fill="#202124">一个互联域里的加速器颗数</tspan>（对数）。真正要看的不是端点，是那条<tspan font-weight="700" fill="#d93025">红线</tspan>：过了它，你的通信代码就得换一套写法。</text>

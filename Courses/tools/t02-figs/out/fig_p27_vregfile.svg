<text x="20" y="26" class="ttl">核里只有<tspan font-weight="700">一套 vreg</tspan>　—— VPU、MXU、XLU 都从这里取，各开一个门</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#8430ce"/>
<text x="37" y="58" class="sm">vreg 堆（唯一的一份）</text>
<rect x="182.625" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="199.625" y="58" class="sm">VMEM 进出</text>
<rect x="276.25" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="293.25" y="58" class="sm">VPU</text>
<rect x="334.225" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="351.225" y="58" class="sm">MXU</text>
<rect x="392.20000000000005" y="48" width="11" height="11" rx="2" fill="#12786f"/>
<text x="409.20000000000005" y="58" class="sm">XLU</text>
<rect x="20" y="118" width="196" height="262" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="36" y="146" class="sec" fill="#1a73e8">VMEM</text>
<text x="36" y="166" class="xs" fill="#5f6368">片上便签本</text>
<text x="36" y="194" class="xs">所有数据进核的第一站。<tspan font-weight="700" fill="#202124">vreg 只</tspan></text>
<text x="36" y="211" class="xs"><tspan font-weight="700" fill="#202124">能从这里装填</tspan>，算完也只能写回</text>
<text x="36" y="228" class="xs">这里。</text>
<text x="36" y="268" class="numb" fill="#1a73e8">→</text>
<text x="62" y="268" class="xs">每周期 <tspan font-weight="700" fill="#202124">装 3 个</tspan> vreg</text>
<text x="36" y="298" class="numb" fill="#9aa0a6">←</text>
<text x="62" y="298" class="xs">每周期 <tspan font-weight="700" fill="#202124">写回 1 个</tspan></text>
<text x="36" y="366" class="xxs" fill="#9aa0a6">（v5p，公开资料）</text>

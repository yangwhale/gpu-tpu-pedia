<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="瀑布图，以单片 profile 步时为起点：多算约加 4%，跨 DCN 约加 5%，片内少等约减 6%，其他不到 1%，净多约 4%。">

<rect width="900" height="340" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >多片多付约一成步时，六成被片内少等抵掉，净多约 4%</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >AOT + HLO 通信重排下，多片 − 1 片，每项占 1 片 profile 步时；只画增量部分，示意</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="364" viewBox="0 0 900 364" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：XLA collective pipeliner 把圈末的 RS 挪进下一圈，和下一圈的计算重叠，代价是输入多活一圈、多占显存。单片上编译期 temp 约 87 GiB，没碰 92 GiB 准入线，挪成功，RS 藏住；多片上 temp 约 93 GiB，超线，推断挪动被拒，RS 留在原位暴露。">
<style>@keyframes k1 { 0% { opacity: 1; } 18% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } } .a2 { animation: k1 6s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k3 { 0% { transform: translateX(124.0px); } 18% { transform: translateX(124.0px); } 40% { transform: translateX(0.0px); } 100% { transform: translateX(0.0px); } } .a4 { animation: k3 6s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k5 { 0% { opacity: 0; } 42% { opacity: 0; } 44% { opacity: 1; } 100% { opacity: 1; } } .a6 { animation: k5 6s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k7 { 0% { transform: translateX(0.0px); } 18% { transform: translateX(0.0px); } 30% { transform: translateX(30.0px); } 36% { transform: translateX(30.0px); } 46% { transform: translateX(0.0px); } 100% { transform: translateX(0.0px); } } .a8 { animation: k7 6s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k9 { 0% { opacity: 0; } 36% { opacity: 0; } 38% { opacity: 1; } 100% { opacity: 1; } } .a10 { animation: k9 6s linear infinite; transform-box: fill-box; transform-origin: left center; } @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="900" height="364" fill="#ffffff"/>
<text x="450.0" y="34.0" font-size="20" fill="#202124" text-anchor="middle" font-weight="bold">pipeliner 拿显存换提前量：单片放得下，多片超线就挪不动</text>
<text x="450.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="middle">RS 挪过圈边界、和下一圈计算重叠，输入要多活一圈。右：编译期 temp 对准入线（96 − 4 = 92 GiB）。示意，无刻度</text>
<rect x="600.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="622.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">计算</text>
<rect x="657.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="679.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">RS</text>
<rect x="714.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="736.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">干等</text>
<text x="20.0" y="112.0" font-size="16" fill="#188038" text-anchor="start" font-weight="bold">单片：开 pipeliner 时 temp 约 87 GiB</text>
<text x="20.0" y="150.0" font-size="14" fill="#202124" text-anchor="start">TensorCore</text>
<text x="20.0" y="192.0" font-size="14" fill="#202124" text-anchor="start">SparseCore</text>
<rect x="140.0" y="130.0" width="212.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="246.0" y="150.0" font-size="14" fill="#174ea6" text-anchor="middle">第 i 圈计算</text>
<g><rect x="362" y="172" width="120" height="28" rx="5" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/><text x="422.0" y="191" font-size="14" fill="#b06000" text-anchor="middle">RS(i)</text></g>
<g class="a2" opacity="0"><rect x="362" y="130" width="120" height="30" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><text x="422" y="150" font-size="14" fill="#a50e0e" text-anchor="middle">等 RS</text></g>
<g class="a4"><line x1="360" y1="124" x2="360" y2="208" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3 3"/><rect x="364" y="130" width="250" height="30" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="489" y="150" font-size="14" fill="#174ea6" text-anchor="middle">第 i+1 圈计算</text></g>
<text x="492.0" y="191.0" font-size="14" fill="#0d652d" text-anchor="start" font-weight="bold" class="a6">过了圈边界，和下一圈计算重叠，藏住</text>
<rect x="800.0" y="120.0" width="40.0" height="84.0" rx="3" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<rect x="804.0" y="167.2" width="32.0" height="36.8" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
<line x1="792.0" y1="141.0" x2="848.0" y2="141.0" stroke="#d93025" stroke-width="2" stroke-dasharray="5 3"/>
<text x="788.0" y="146.0" font-size="13" fill="#a50e0e" text-anchor="end">92</text>
<text x="852.0" y="172.2" font-size="14" fill="#0d652d" text-anchor="start" font-weight="bold">≈87</text>
<text x="820.0" y="112.0" font-size="13" fill="#5f6368" text-anchor="middle">temp（GiB，截断轴）</text>
<line x1="20.0" y1="218.0" x2="880.0" y2="218.0" stroke="#dadce0" stroke-width="1"/>
<text x="20.0" y="250.0" font-size="16" fill="#d93025" text-anchor="start" font-weight="bold">多片：开 pipeliner 时 temp 约 93 GiB</text>
<text x="20.0" y="288.0" font-size="14" fill="#202124" text-anchor="start">TensorCore</text>
<text x="20.0" y="330.0" font-size="14" fill="#202124" text-anchor="start">SparseCore</text>
<rect x="140.0" y="268.0" width="212.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="246.0" y="288.0" font-size="14" fill="#174ea6" text-anchor="middle">第 i 圈计算</text>
<g class="a8"><rect x="362" y="310" width="120" height="28" rx="5" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/><text x="422.0" y="329" font-size="14" fill="#b06000" text-anchor="middle">RS(i)</text></g>
<rect x="362.0" y="268.0" width="120.0" height="30.0" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="422.0" y="288.0" font-size="14" fill="#a50e0e" text-anchor="middle">等 RS</text>
<line x1="484.0" y1="262.0" x2="484.0" y2="346.0" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="488.0" y="268.0" width="250.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="613.0" y="288.0" font-size="14" fill="#174ea6" text-anchor="middle">第 i+1 圈计算</text>
<text x="522.0" y="329.0" font-size="14" fill="#a50e0e" text-anchor="start" font-weight="bold" class="a10">想挪，超线被拒 [推断]，留在原位</text>
<rect x="800.0" y="258.0" width="40.0" height="84.0" rx="3" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
<rect x="804.0" y="273.8" width="32.0" height="68.2" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<line x1="792.0" y1="279.0" x2="848.0" y2="279.0" stroke="#d93025" stroke-width="2" stroke-dasharray="5 3"/>
<text x="788.0" y="284.0" font-size="13" fill="#a50e0e" text-anchor="end">92</text>
<text x="852.0" y="278.8" font-size="14" fill="#a50e0e" text-anchor="start" font-weight="bold">≈93</text>
<text x="820.0" y="250.0" font-size="13" fill="#5f6368" text-anchor="middle">temp（GiB，截断轴）</text>
</svg>

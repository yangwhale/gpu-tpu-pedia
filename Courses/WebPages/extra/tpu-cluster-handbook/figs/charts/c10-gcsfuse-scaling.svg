"296.6" r="6.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>1 台 × 64 路 = 5.82 GB/s（墙钟约 2 s）</title><circle cx="581.0" cy="277.6" r="6.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>16 台 × 32 路 = 56 GB/s（墙钟约 3 s）</title><circle cx="501.8" cy="179.3" r="6.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>16 台 × 32 路 = 60 GB/s（墙钟约 3 s）</title><circle cx="501.8" cy="176.3" r="6.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><text x="115.5" y="408.6" font-size="13" fill="#174ea6" font-weight="700">单线程 0.32</text><text x="353.3" y="359.7" font-size="13" fill="#174ea6">8 路 1.27</text><text x="509.8" y="318.6" font-size="13" fill="#174ea6">32 路 3.76</text><text x="571.0" y="265.6" font-size="13" fill="#174ea6" text-anchor="end">64 路 5.82（偏保守）</text><text x="113.5" y="308.7" font-size="13" fill="#0d652d">16 台 × 1 路 4.94</text><text x="491.8" y="164.3" font-size="13" fill="#0d652d" text-anchor="end" font-weight="700">16 台 × 32 路 56–60</text><text x="654.0" y="134.0" font-size="14" fill="#202124" font-weight="700">换算：拉 10 GB 环境 tar</text><text x="654.0" y="164.0" font-size="13.5" fill="#5f6368">单线程 cp / tar</text><text x="654.0" y="185.0" font-size="15" fill="#202124" font-weight="700">≈ 33 s</text><text x="654.0" y="210.0" font-size="13.5" fill="#5f6368">每台 32 路并发</text><text x="654.0" y="231.0" font-size="15" fill="#202124" font-weight="700">≈ 2–3 s</text><text x="654.0" y="256.0" font-size="13.5" fill="#5f6368">kubectl apply → 首次读</text><text x="654.0" y="277.0" font-size="15" fill="#202124" font-weight="700">≈ 4 s</text><text x="654.0" y="302.0" font-size="13.5" fill="#5f6368">首字节</text><text x="654.0" y="323.0" font-size="15" fill="#202124" font-weight="700">0.1–0.2 s</text></svg>
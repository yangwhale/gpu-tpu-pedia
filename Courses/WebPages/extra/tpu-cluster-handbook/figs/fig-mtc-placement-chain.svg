ddle" font-size="13" fill="#f9ab00">挪</text><rect x="416" y="400" width="42" height="34" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="437.0" y="422" text-anchor="middle" font-size="13" fill="#f9ab00">挪</text><rect x="462" y="400" width="42" height="34" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="483.0" y="422" text-anchor="middle" font-size="13" fill="#f9ab00">挪</text><rect x="508" y="400" width="42" height="34" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="529.0" y="422" text-anchor="middle" font-size="13" fill="#f9ab00">挪</text><rect x="554" y="400" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><text x="575.0" y="422" text-anchor="middle" font-size="13" fill="#1e8e3e">备件</text><rect x="600" y="400" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="621.0" y="422" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="646" y="400" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="667.0" y="422" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="692" y="400" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="713.0" y="422" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="738" y="400" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="759.0" y="422" text-anchor="middle" font-size="13" fill="#202124"></text><text x="792" y="422" text-anchor="start" font-size="13" fill="#b06000">只挪两者之间那段</text><text x="140" y="456" text-anchor="start" font-size="14" fill="#202124">蓝格：同一 pod 回同一节点，本机内存盘里正是自己那份；黄格：节点还是这批，但换了主人，</text><text x="140" y="480" text-anchor="start" font-size="14" fill="#202124">要靠 ④ 从同列补齐。10+ 片时一片 = 连续 4 格，挪一格就换了片内位置 [推断]</text><text x="60" y="520" text-anchor="start" font-size="14" fill="#202124">3 片演练实测（每片 1 个 cube）：同一组 cube 重建 → 48/48 个 pod 回原节点（读本地 3 s）；</text><text x="60" y="544" text-anchor="start" font-size="14" fill="#202124">换 1 个 cube → 节点重用 32/48，pod 回原节点 0～32 个不等，取决于备件排位</text><text x="490.0" y="588" text-anchor="middle" font-size="13" fill="#5f6368">出处：Kueue v0.17.1 tas_flavor_snapshot.go（sortedDomains / buildAssignment）、topology_ungater.go（readRanksForLabels）；实测落位数据</text></svg>

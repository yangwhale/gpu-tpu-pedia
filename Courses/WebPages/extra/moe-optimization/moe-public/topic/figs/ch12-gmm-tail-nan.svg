<rect x="374.0" y="130.0" width="38.0" height="32.0" rx="2" fill="url(#hatch)" stroke="#d93025" stroke-width="1.2"/>
<text x="393.0" y="151.0" font-size="13" fill="#a50e0e" text-anchor="middle" font-weight="700">NaN</text>
<text x="44.0" y="212.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">RHS</text>
<rect x="94.0" y="190.0" width="76.0" height="32.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="同一个反向层的两条时间线。1 片：FP8 权重 all-gather 在层末发，等 reduce-scatter 的窗口里 TensorCore 空着。多片：all-gather 挪到层首先发，收到后的量化和拼接融合计算被挤进等 reduce-scatter 的窗口里一起跑，等 RS 少约四分之一。">

<rect width="900" height="360" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >多片把 FP8 权重 AG 从层末挪到层首：融合计算被挤进等 RS 的窗口</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >同一个反向层，示意；读自一层的 trace，未逐层核</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />
<text x="44.0" y="83.0" font-size="13" fill="#202124" text-anchor="start" >计算</text>
<rect x="92.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#c6dafc" stroke="none" stroke-width="1.5" />
<text x="112.0" y="83.0" font-size="13" fill="#202124" text-anchor="start" >AG 后的量化 / 拼接 fusion</text>
<rect x="313.4" y="71.0" width="14.0" height="14.0" rx="3" fill="#e8710a" stroke="none" stroke-width="1.5" />
<text x="333.4" y="83.0" font-size="13" fill="#202124" text-anchor="start" >AG / RS（SC 上）</text>
<rect x="472.4" y="71.0" width="14.0" height="14.0" rx="3" fill="#d93025" stroke="none" stroke-width="1.5" />
<text x="492.4" y="83.0" font-size="13" fill="#202124" text-anchor="start" >TC 等 RS</text>
<text x="30.0" y="140.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >1 片</text>
<text x="120.0" y="140.0" font-size="13" fill="#5f6368" text-anchor="end" >TC</text>
<text x="120.0" y="180.0" font-size="13" fill="#5f6368" text-anchor="end" >SC</text>
<rect x="130.0" y="120.0" width="385.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="319.0" y="140.0" font-size="13" fill="#202124" text-anchor="middle" >层计算</text>
<rect x="515.0" y="120.0" width="224.0" height="30.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="627.0" y="140.0" font-size="13" fill="#d93025" text-anchor="middle" >等 RS</text>
<rect x="739.0" y="120.0" width="70.0" height="30.0" rx="3" fill="#c6dafc" stroke="#1a73e8" stroke-width="1.5" />
<text x="774.0" y="140.0" font-size="13" fill="#202124" text-anchor="middle" >fusion</text>
<rect x="480.0" y="164.0" width="252.0" height="24.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="606.0" y="181.0" font-size="13" fill="#202124" text-anchor="middle" >RS</text>
<rect x="396.0" y="164.0" width="70.0" height="24.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="431.0" y="181.0" font-size="13" fill="#202124" text-anchor="middle" >AG</text>
<text x="30.0" y="260.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >多片</text>
<text x="120.0" y="260.0" font-size="13" fill="#5f6368" text-anchor="end" >TC</text>
<text x="120.0" y="300.0" font-size="13" fill="#5f6368" text-anchor="end" >SC</text>
<rect x="130.0" y="240.0" width="385.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="319.0" y="260.0" font-size="13" fill="#202124" text-anchor="middle" >层计算</text>
<rect x="515.0" y="240.0" width="98.0" height="30.0" rx="3" fill="#c6dafc" stroke="#1a73e8" stroke-width="1.5" />
<text x="564.0" y="260.0" font-size="13" fill="#202124" text-anchor="middle" >fusion</text>
<rect x="613.0" y="240.0" width="168.0" height="30.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="697.0" y="260.0" font-size="13" fill="#d93025" text-anchor="middle" >等 RS</text>
<rect x="480.0" y="284.0" width="252.0" height="24.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="606.0" y="301.0" font-size="13" fill="#202124" text-anchor="middle" >RS</text>
<rect x="144.0" y="284.0" width="70.0" height="24.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="179.0" y="301.0" font-size="13" fill="#202124" text-anchor="middle" >AG</text>
<text x="144.0" y="328.0" font-size="13" fill="#e8710a" text-anchor="start" >↑ AG 层首先发</text>
<text x="396.0" y="208.0" font-size="13" fill="#e8710a" text-anchor="start" >↑ AG 在层末才发</text>
<text x="613.0" y="328.0" font-size="13" fill="#d93025" text-anchor="start" >每层等 RS 少约 1/4，loop fusion 多约 45%</text>
</svg>

<text x="355.0" y="160.0" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold" >约 +5%</text>
<text x="355.0" y="352.0" font-size="14" fill="#202124" text-anchor="middle" >跨 DCN</text>
<line x1="410.0" y1="168.0" x2="450.0" y2="168.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" />
<rect x="450.0" y="168.0" width="110.0" height="108.0" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
<text x="505.0" y="160.0" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold" >约 −6%</text>
<text x="505.0" y="352.0" font-size="14" fill="#202124" text-anchor="middle" >片内少等</text>
<line x1="560.0" y1="276.0" x2="600.0" y2="276.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" />
<rect x="600.0" y="268.8" width="110.0" height="7.2" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5" />

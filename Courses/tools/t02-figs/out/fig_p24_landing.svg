<svg viewBox="0 0 1400 886" width="1400" height="886" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="全课落点：一个分岔口，八节都是它的后果 —— 两边的差别不是谁更强，是把控制权交给谁">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">把控制权交给谁　—— <tspan font-weight="700" fill="#1a73e8">这门课看到的所有差别，都是同一个决定的后果</tspan></text>
<rect x="1270" y="10" width="110" height="22" rx="11" fill="#1a73e8"/>
<text x="1325.0" y="25" class="lbl" fill="#fff" text-anchor="middle">全课收尾 · 三</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">GPU 那一侧：交给硬件在运行时处理，也就是交给人</text>
<rect x="325.8" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="342.8" y="58" class="sm">TPU 那一侧：交给编译器在编译期算准，也就是接受它的脾气</text>
<rect x="677.6" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="694.6" y="58" class="sm">右格四句：换成别的两块硬件照样用</text>
<rect x="900.6" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="917.6" y="58" class="sm">⚠️ 红／绿只标是哪一侧，不含好坏 —— 这门课唯一的两边实测，赢的恰好是红那侧</text>
<rect x="20" y="124" width="1000" height="500" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="198" y="168" width="644" height="50" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
<text x="520" y="189" class="xxs" fill="#1a73e8" text-anchor="middle">整门课只有一个分岔口</text>
<text x="520" y="208" class="box" fill="#202124" text-anchor="middle">运行时才知道的那些事（形状、访问落在哪、谁忙谁闲），交给谁处理？</text>
<path d="M420 218 L420 218 L275 218 L275 237" stroke="#d93025" stroke-width="1.8" fill="none" marker-end="url(#aR)"/>
<path d="M620 218 L620 218 L765 218 L765 237" stroke="#1e8e3e" stroke-width="1.8" fill="none" marker-end="url(#aG)"/>
<rect x="46" y="240" width="458" height="54" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="275" y="263" class="box" fill="#d93025" text-anchor="middle">交给硬件，在运行时处理</text>
<text x="275" y="282" class="xxs" fill="#5f6368" text-anchor="middle">—— 也就是交给了人</text>
<rect x="536" y="240" width="458" height="54" rx="9" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.8"/>
<text x="765" y="263" class="box" fill="#1e8e3e" text-anchor="middle">交给编译器，在编译期算准</text>
<text x="765" y="282" class="xxs" fill="#5f6368" text-anchor="middle">—— 也就是接受它的脾气</text>
<rect x="36" y="314" width="4" height="284" rx="2" fill="#d93025"/>
<rect x="526" y="314" width="4" height="284" rx="2" fill="#1e8e3e"/>
<rect x="36" y="352" width="478" height="52" rx="6" fill="#fce8e6"/>
<rect x="526" y="352" width="478" height="52" rx="6" fill="#e6f4ea"/>
<text x="46" y="338" class="lbl" fill="#202124">① 同一次访存，要在路上做几个决定？</text>
<text x="994" y="338" class="xxs" fill="#9aa0a6" text-anchor="end">§2.1 · §3.6</text>
<line x1="46" y1="346" x2="994" y2="346" stroke="#dadce0" stroke-width="1.0"/>
<text x="56" y="366" class="xs"><tspan font-weight="700" fill="#202124">5 个运行时决策点</tspan><tspan fill="#9aa0a6"> —— 命中不中要跑起来才知道</tspan></text>
<text x="546" y="366" class="xs"><tspan font-weight="700" fill="#202124">0 个</tspan><tspan fill="#9aa0a6"> —— 全在编译期定死，走哪条路是算出来的</tspan></text>
<line x1="520" y1="394" x2="520" y2="436" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="36" y="448" width="478" height="52" rx="6" fill="#fce8e6"/>
<rect x="526" y="448" width="478" height="52" rx="6" fill="#e6f4ea"/>
<text x="46" y="434" class="lbl" fill="#202124">② 所以，代价出现在什么时候？</text>
<text x="994" y="434" class="xxs" fill="#9aa0a6" text-anchor="end">§5.5 · P-8</text>
<line x1="46" y1="442" x2="994" y2="442" stroke="#dadce0" stroke-width="1.0"/>
<text x="56" y="462" class="xs"><tspan font-weight="700" fill="#202124">每一次访存都付一点</tspan><tspan fill="#9aa0a6">，藏在运行时里，看不见也不用管</tspan></text>
<text x="546" y="462" class="xs"><tspan font-weight="700" fill="#202124">一次付清，但付在你身上</tspan><tspan fill="#9aa0a6"> —— </tspan><tspan font-weight="700" fill="#202124">冷启动 19 分</tspan>编译，热启动仍 7 分半，其中 16 次失败</text>
<text x="546" y="479" class="xs">重编每次都白付；而且要有人会写 Pallas</text>
<line x1="520" y1="490" x2="520" y2="532" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="36" y="544" width="478" height="52" rx="6" fill="#fce8e6"/>
<rect x="526" y="544" width="478" height="52" rx="6" fill="#e6f4ea"/>
<text x="46" y="530" class="lbl" fill="#202124">③ 所以，赌输了怎么办？</text>
<text x="994" y="530" class="xxs" fill="#9aa0a6" text-anchor="end">§2.1 落点</text>
<line x1="46" y1="538" x2="994" y2="538" stroke="#dadce0" stroke-width="1.0"/>
<text x="56" y="558" class="xs"><tspan font-weight="700" fill="#202124">运行时还能换一条路</tspan><tspan fill="#9aa0a6"> —— 硬件自己会绕</tspan></text>
<text x="546" y="558" class="xs"><tspan font-weight="700" fill="#202124">运行时无处补救</tspan><tspan fill="#9aa0a6"> —— 只能回去改代码，重来一遍编译</tspan></text>
<rect x="1036" y="124" width="344" height="500" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="1036" y="124" width="5" height="500" rx="3" fill="#1a73e8"/>
<text x="1054" y="150" class="sec" fill="#1a73e8">带出门的四句</text>
<text x="1054" y="170" class="xxs"><tspan fill="#9aa0a6">跟这两块硬件</tspan><tspan font-weight="700" fill="#202124">无关</tspan> —— 换成别的两块照样用。这四句是这门课真正能</text>
<text x="1054" y="184" class="xxs">迁移的部分。</text>
<rect x="1052" y="210" width="312" height="94" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="1064" y="234" class="num" fill="#1a73e8">1.</text>
<text x="1086" y="234" class="lbl">这个数是算出来的吗？</text>
<text x="1086" y="257" class="xxs"><tspan fill="#9aa0a6">是的话，</tspan><tspan font-weight="700" fill="#202124">算式写在它旁边了吗</tspan></text>
<text x="1352" y="294" class="xxs" fill="#9aa0a6" text-anchor="end">P-19</text>
<rect x="1052" y="310" width="312" height="94" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.1"/>
<text x="1064" y="334" class="num" fill="#1a73e8">2.</text>
<text x="1086" y="334" class="lbl">二进制还是十进制？</text>
<text x="1086" y="357" class="xxs"><tspan fill="#9aa0a6">官方 HBM 那栏是十进制。</tspan><tspan font-weight="700" fill="#202124">206 GB = 192 GiB，差 7.4%</tspan></text>
<text x="1352" y="394" class="xxs" fill="#9aa0a6" text-anchor="end">P-21 乙①</text>
<rect x="1052" y="410" width="312" height="94" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.1"/>
<text x="1064" y="434" class="num" fill="#1a73e8">3.</text>
<text x="1086" y="434" class="lbl">per chip、per device、还是 per core？</text>
<text x="1086" y="457" class="xxs"><tspan fill="#9aa0a6">v7 是 </tspan><tspan font-weight="700" fill="#202124">2 device / chip</tspan>，日志按 device 报。<tspan font-weight="700" fill="#202124">这一步错，</tspan></text>
<text x="1086" y="470" class="xxs"><tspan font-weight="700" fill="#202124">结论差一倍</tspan></text>
<text x="1352" y="494" class="xxs" fill="#9aa0a6" text-anchor="end">P-21 乙②</text>
<rect x="1052" y="510" width="312" height="94" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.1"/>
<text x="1064" y="534" class="num" fill="#1a73e8">4.</text>
<text x="1086" y="534" class="lbl">物理量还是可用量？</text>
<text x="1086" y="557" class="xxs"><tspan fill="#9aa0a6">94.74 GiB 是</tspan><tspan font-weight="700" fill="#202124">可用</tspan>的；2,500 是 <tspan font-weight="700" fill="#202124">dense</tspan> 不含稀疏</text>
<text x="1352" y="594" class="xxs" fill="#9aa0a6" text-anchor="end">P-21 乙③</text>
<rect x="20" y="648" width="1360" height="214" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="38" y="678" class="ttl" fill="#1a73e8">⭐ 两边的差别不是「谁更强」，而是「把控制权交给谁」</text>
<text x="38" y="702" class="sec"><tspan font-weight="700" fill="#202124">交给人，就得有人有能力写；交给编译器，就得接受它的脾气。</tspan></text>
<text x="38" y="740" class="lbl" fill="#d93025">⚠️ 这句话必须跟下面三条一起带走 —— 只带上面那句出门，它就只是一个立场</text>
<rect x="38" y="752" width="433.3333333333333" height="96" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="50" y="771" class="lbl" fill="#1a73e8">① 唯一的两边实测：GB300 快 1.31 倍</text>
<text x="50" y="789" class="xxs"><tspan font-weight="700" fill="#202124">它是一个点，不是一个界。</tspan><tspan fill="#9aa0a6">两个</tspan><tspan font-weight="700" fill="#202124">方向相反</tspan>且<tspan font-weight="700" fill="#202124">都没量过</tspan>的修正：EP16（882.3）没复测 → 可能</text>
<text x="50" y="802" class="xxs">到 <tspan font-weight="700" fill="#202124">1.35</tspan>；六条边界<tspan font-weight="700" fill="#202124">四条利于 GB300</tspan> → 可能更小。P-18 点名最重的是<tspan font-weight="700" fill="#202124">「软件成熟度」</tspan>。</text>
<rect x="483.3333333333333" y="752" width="433.3333333333333" height="96" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="495.3333333333333" y="771" class="lbl" fill="#1a73e8">② 手写 kernel 是生态差距，不是架构差距</text>
<text x="495.3333333333333" y="789" class="xxs"><tspan fill="#9aa0a6">照抄 P-3 的句式，因为它把话说全了：</tspan><tspan font-weight="700" fill="#202124">占优 + 类别 + 时效</tspan>。<tspan font-weight="700" fill="#202124">两者会随时间收敛，别混成</tspan></text>
<text x="495.3333333333333" y="802" class="xxs"><tspan font-weight="700" fill="#202124">一件事讲</tspan> —— 架构差距不会自己变小，生态差距会。</text>
<rect x="928.6666666666666" y="752" width="433.3333333333333" height="96" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="940.6666666666666" y="771" class="lbl" fill="#d93025">③ TPU 的赌注，这门课从没用数据兑现过</text>
<rect x="1272.0" y="758" width="80.0" height="19" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.0"/>
<text x="1312.0" y="771" class="xxs" fill="#d93025" text-anchor="middle">我们自己欠的</text>
<text x="940.6666666666666" y="789" class="xxs"><tspan fill="#9aa0a6">§0 立的是</tspan><tspan font-weight="700" fill="#202124">假设</tspan>（图底那一行）；§5.5 兑现的只是它的<tspan font-weight="700" fill="#202124">反面</tspan>。正面那一半全课一次都没兑现</text>
<text x="940.6666666666666" y="802" class="xxs">过。把它当已证结论回收，<tspan font-weight="700" fill="#202124">就是「用命名冒充证明」的同族错误</tspan>。</text>
<text x="1380" y="874" class="xxs" fill="#9aa0a6" text-anchor="end">落点这句从大纲第一版起就没改过 —— 变的是它下面那三条限定，那才是这门课挣来的</text>
</svg>
<path d="M130 165 h390" stroke="#5f6368" fill="none"/><text x="325" y="185" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#5f6368">一个周期：若干 KDA + 1 个 MLA；整网重复若干周期</text>
<text x="560" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124"><tspan font-weight="bold" fill="#1a73e8">KDA</tspan>：线性注意力，状态与序列长度无关</text>
<text x="560" y="104" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124"><tspan font-weight="bold" fill="#b06000">MLA</tspan>：低秩压缩 KV 的 softmax 注意力</text>
<text x="560" y="130" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124"><tspan font-weight="bold" fill="#1e8e3e">FFN</tspan>：前几层 dense，其余为 MoE</text>
<text x="560" y="156" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124">MoE：路由专家选 top-k + 共享专家</text>
<text x="20" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5f6368">示意图：方块个数不代表实际层数与比例；大小两个模型骨架相同、尺寸不同。</text>

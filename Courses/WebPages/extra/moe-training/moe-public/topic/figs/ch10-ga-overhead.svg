<text x="170.5" y="85.0" font-size="14" fill="#202124">优化器更新</text>
<rect x="262.5" y="73.0" width="22.0" height="13.0" rx="2" fill="#188038" />
<text x="290.5" y="85.0" font-size="14" fill="#202124">梯度累加 carry</text>
<rect x="413.3" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="441.3" y="85.0" font-size="14" fill="#202124">多出来的那截（原因未拆）</text>
<text x="20.0" y="169.0" font-size="16" fill="#202124" font-weight="700">GA = 1</text>

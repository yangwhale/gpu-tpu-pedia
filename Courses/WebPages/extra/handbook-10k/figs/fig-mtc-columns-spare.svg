" text-anchor="middle" font-size="13" fill="#1e8e3e">Kueue 重切时顶上</text><text x="60" y="408" text-anchor="start" font-size="14" fill="#202124">· 每 20 步：每台 host 把自己那份分片（权重＋优化器状态＋步数＋数据位置）写进本机内存</text><text x="60" y="432" text-anchor="start" font-size="14" fill="#202124">· 10+ 片做数据并行、切法相同 → 同一列 N 台的分片一模一样；坏 cube 那 16 台的数据，其余各片里各有一份</text><text x="60" y="456" text-anchor="start" font-size="14" fill="#202124">· 任何一台坏 → Kueue 驱逐整个任务，10+ 片全拆重切；其余各片多半落回原 cube</text><text x="490.0" y="484" text-anchor="middle" font-size="13" fill="#5f6368">出处：runbook 07 §7.4b；规模 10+ × 4x8x8 = 数十 cube / 片数 × 64 台 host；「列」定义见 mtc_replicator_ranks</text></svg>

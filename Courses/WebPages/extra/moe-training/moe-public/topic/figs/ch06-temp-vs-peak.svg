<text x="36.0" y="527.0" font-size="14" fill="#202124">temp 既不是硬判据也不是上界：初筛用 temp，终判看实机 peakBytesInUse。</text>
<text x="36.0" y="549.0" font-size="14" fill="#202124">差值从哪来未确认（xplane 也不含第 0 步和加载期）</text>
</svg>

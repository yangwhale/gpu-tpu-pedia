<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <text x="20" y="34" font-size="21" font-weight="bold" fill="#202124">QAG 不是一个开关，是五道锁：缺一道就静默不生效</text>
  <text x="20" y="60" font-size="15" fill="#5f6368">五道里只有 ③ ⑤（scale 和切分对齐）是数学要求，其余是这套实现自己加的条件</text>

  <g font-size="15">
    <rect x="20" y="92" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="36" y="120" fill="#174ea6">① Qwix <tspan font-family="monospace">fp8_full</tspan></text>
    <rect x="20" y="146" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="36" y="174" fill="#174ea6">② Tokamax GMM</text>
    <rect x="20" y="200" width="330" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="36" y="224" fill="#174ea6">③ per-expert scale</text>
    <text x="36" y="246" font-size="13" fill="#174ea6">（GMM 权重分组量化开关）</text>
    <rect x="20" y="266" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="36" y="294" fill="#174ea6">④ absmax 标定</text>
    <rect x="20" y="320" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="36" y="348" fill="#174ea6">⑤ <tspan font-family="monospace">shard_exp_on_fsdp</tspan></text>
  </g>

  <line x1="360" y1="228" x2="440" y2="170" stroke="#5f6368" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="360" y1="228" x2="440" y2="290" stroke="#5f6368" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="450" y="120" width="480" height="92" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.8"/>
  <text x="470" y="152" font-size="17" font-weight="bold" fill="#0d652d">五样全有 → QAG 生效</text>
  <text x="470" y="180" font-size="15" fill="#0d652d">专家权重按 FP8 all-gather，字节减半</text>
  <text x="470" y="202" font-size="14" fill="#0d652d">HLO 里 AllGather 的 dtype 是 f8e4m3fn</text>

  <rect x="450" y="240" width="480" height="92" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
  <text x="470" y="272" font-size="17" font-weight="bold" fill="#a50e0e">缺任何一样 → 退回非 QAG，数值对、只是慢</text>
  <text x="470" y="300" font-size="15" fill="#a50e0e">现在只打一次不带原因的 warning；fixed 标定路径仍无</text>
  <text x="470" y="322" font-size="14" fill="#a50e0e">关掉 QAG 慢 25–35%（knockout / 阶梯）</text>

</svg>

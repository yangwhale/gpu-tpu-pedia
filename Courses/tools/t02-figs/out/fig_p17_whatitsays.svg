<svg viewBox="0 0 1400 656" width="1400" height="656" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一组实测换三种问法得到三个不同答案：同精度 1.31 倍、各自最优精度 2.06 倍、每美元每瓦答不了；以及 FP8 在两边的兑现率一边 +50.6% 一边 +1.3%">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">这组数能说什么　—— <tspan font-weight="700" fill="#d93025">换一个问法，就换一个倍数</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="37" y="58" class="sm">口径最接近的一问</text>
<rect x="151.0" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="168.0" y="58" class="sm">换精度之后</text>
<rect x="247.5" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="264.5" y="58" class="sm">答不了 —— 而「答不了」也要占一格</text>
<rect x="20" y="124" width="760" height="372" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　同一批实测，三个问法</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">三根条同一根轴。</tspan><tspan font-weight="700" fill="#202124">分开讲，①② 听起来像互相矛盾的两个结论；并排放，它们只是同一件事的两种问法。</tspan></text>
<rect x="38" y="212" width="724" height="84" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="52" y="234" class="xs" fill="#1e8e3e"><tspan font-weight="700" fill="#202124">① 都跑 BF16（上一张图那组）</tspan></text>
<text x="52" y="254" class="xxs"><tspan fill="#9aa0a6">两边同精度、同 seq、同 64 个单元。</tspan><tspan font-weight="700" fill="#202124">口径最接近的一问</tspan>—— 仍有六条边界，见 P-18。</text>
<rect x="450" y="224" width="244" height="20" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="450" y="224" width="133.18333333333334" height="20" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="593.1833333333334" y="239" class="numb" fill="#1e8e3e">1.31×</text>
<text x="450" y="264" class="xxs" fill="#5f6368">GB300 6,242  ÷  v7 4,770  tok/s</text>
<rect x="38" y="304" width="724" height="84" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="52" y="326" class="xs" fill="#d93025"><tspan font-weight="700" fill="#202124">② 两边各自用最擅长的精度</tspan></text>
<text x="52" y="346" class="xxs"><tspan fill="#9aa0a6">GB300 换 </tspan><tspan class="mono" fill="#1967d2">fp8_mx</tspan>，v7 换 <tspan class="mono" fill="#1967d2">absmax</tspan> 生产配方。<tspan font-weight="700" fill="#202124">倍数从 1.31 跳到 2.06 —— 但这</tspan></text>
<text x="52" y="360" class="xxs"><tspan font-weight="700" fill="#202124">两个不是同一种 FP8，batch 也差 2.9 倍。</tspan></text>
<rect x="450" y="316" width="244" height="20" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="450" y="316" width="209.43333333333334" height="20" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="669.4333333333334" y="331" class="numb" fill="#d93025">2.06×</text>
<text x="450" y="356" class="xxs" fill="#5f6368">GB300 9,945  ÷  v7 4,830  tok/s</text>
<rect x="38" y="396" width="724" height="84" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="52" y="418" class="xs" fill="#9aa0a6"><tspan font-weight="700" fill="#202124">③ 每美元 / 每瓦</tspan></text>
<text x="52" y="438" class="xxs"><tspan font-weight="700" fill="#202124">牌价查得到，但采购价是谈出来的；两边的功耗也没有可比口径。</tspan><tspan fill="#9aa0a6">而这两样恰恰是采购</tspan></text>
<text x="52" y="452" class="xxs"><tspan fill="#9aa0a6">真正要的 —— 见上一节第 ④ 档。</tspan></text>
<rect x="450" y="408" width="244" height="20" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="572.0" y="423" class="numb" fill="#9aa0a6" text-anchor="middle">？</text>
<text x="704" y="423" class="numb" fill="#9aa0a6">答不了</text>
<text x="450" y="448" class="xxs" fill="#5f6368">牌价 ≠ 成交价 · 功耗无可比口径</text>
<rect x="792" y="124" width="588" height="372" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="810" y="150" class="sec">乙　·　同一张空头支票，两边兑现得完全不同</text>
<text x="810" y="170" class="xs"><tspan fill="#9aa0a6">浅槽＝峰值，深段＝实测 —— 和 P-15 甲格同一套画法。</tspan><tspan font-weight="700" fill="#202124">两边的 FP8 槽都正好是各自 BF16 槽的 2 倍。</tspan></text>
<rect x="810" y="212" width="552" height="92" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="824" y="234" class="box" fill="#1a73e8">GB300</text>
<text x="1348" y="236" class="numb" fill="#1e8e3e" text-anchor="end">+50.6%</text>
<rect x="824" y="248" width="200.0" height="18" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="824" y="248" width="68.32" height="18" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="816" y="261" class="xxs" fill="#5f6368" text-anchor="end">BF16</text>
<text x="900.3199999999999" y="261" class="xxs" fill="#1a73e8">854.0</text>
<text x="1032.0" y="261" class="xxs" fill="#9aa0a6">槽 2,500</text>
<rect x="824" y="274" width="400.0" height="18" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="824" y="274" width="102.87200000000001" height="18" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="816" y="287" class="xxs" fill="#5f6368" text-anchor="end">FP8 </text>
<text x="934.8720000000001" y="287" class="xxs" fill="#1a73e8">1285.9</text>
<text x="1232.0" y="287" class="xxs" fill="#9aa0a6">槽 5,000</text>
<rect x="810" y="312" width="552" height="92" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="824" y="334" class="box" fill="#1e8e3e">TPU v7</text>
<text x="1348" y="336" class="numb" fill="#d93025" text-anchor="end">+1.3%</text>
<rect x="824" y="348" width="184.56" height="18" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="824" y="348" width="52.984" height="18" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="816" y="361" class="xxs" fill="#5f6368" text-anchor="end">BF16</text>
<text x="884.984" y="361" class="xxs" fill="#1e8e3e">662.3</text>
<text x="1016.56" y="361" class="xxs" fill="#9aa0a6">槽 2,307</text>
<rect x="824" y="374" width="369.12" height="18" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="824" y="374" width="53.664" height="18" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="816" y="387" class="xxs" fill="#5f6368" text-anchor="end">FP8 </text>
<text x="885.664" y="387" class="xxs" fill="#1e8e3e">670.8</text>
<text x="1201.12" y="387" class="xxs" fill="#9aa0a6">槽 4,614</text>
<rect x="810" y="416" width="552" height="64" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="824" y="435" class="xs"><tspan font-weight="700" fill="#202124">⭐ 支票一样大，一边兑了一半，一边几乎没兑。</tspan><tspan fill="#9aa0a6">（同 GBS 2048 / MBS 1 的 C1；各自最优的 C2 是 +</tspan></text>
<text x="824" y="450" class="xs"><tspan fill="#9aa0a6">59.3%，但它把 batch 也翻倍了。）</tspan></text>
<text x="824" y="466" class="xxs"><tspan font-weight="700" fill="#202124">⚠️ 但这不能证明「差的是软件」</tspan><tspan fill="#9aa0a6">：算力翻倍而 HBM 带宽没翻倍，FP8 一样吃不满 —— </tspan><tspan font-weight="700" fill="#202124">那是硅片。我们没有能排除这</tspan></text>
<text x="824" y="479" class="xxs"><tspan font-weight="700" fill="#202124">一点的数据。</tspan></text>
<rect x="20" y="520" width="1360" height="112" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="38" y="548" class="sec">⭐ 去掉 P-18 那六条之后，还能说的只剩这一句 —— 抄走就能用</text>
<text x="38" y="574" class="xs"><tspan font-weight="700" fill="#202124">「在 Hunyuan3-295B-A21B、seq 4096、各 64 个计算单元、</tspan><tspan font-weight="700" fill="#d93025">以 2026 年 8 月两边的软件栈</tspan>，GB300 的每卡吞吐是 v7 每芯片的 <tspan font-weight="700" fill="#d93025">1.31 倍</tspan>（6,242 对 4,770 tok/s）；换成 TFLOP/s 口径是 1.29 倍，其中 <tspan font-weight="700" fill="#d93025">1.084 倍</tspan>来自峰值差（2,500 对 2,307），其余不来自</text>
<text x="38" y="593" class="xs">峰值。」</text>
<text x="38" y="614" class="xs"><tspan fill="#9aa0a6">一句话里有</tspan><tspan font-weight="700" fill="#202124">模型 · 规模 · 时间 · 单位 · 分解</tspan>五个槽位，而且分解那一段说的是「不来自峰值」不是「来自软件」—— <tspan font-weight="700" fill="#202124">后者我们没证明。比「GPU 快 30%」长了五倍，但半年后它还能被查。</tspan></text>
<text x="1380" y="644" class="xxs" fill="#9aa0a6" text-anchor="end">三个问法用的是同一批实测 · tok/s / 计算单元 · 同一个 Hunyuan3-295B-A21B · seq 4096 · 各 64 个单元 · 不能拿它说的话见 P-18</text>
</svg>
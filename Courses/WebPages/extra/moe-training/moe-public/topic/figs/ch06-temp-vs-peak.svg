<rect x="249.6" y="254.0" width="60.9" height="24.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<rect x="312.4" y="332.0" width="60.9" height="50.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />

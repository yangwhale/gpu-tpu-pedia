<svg viewBox="0 0 1400 786" width="1400" height="786" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TPU v7 与 GB300 两条调优爬升曲线：v7 六步从 445 爬到 662，仍低于 GB300 未调优时的 707">
<defs><style>

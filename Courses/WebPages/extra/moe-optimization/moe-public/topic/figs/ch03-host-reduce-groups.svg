<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：三个片，每片的 device 0 连成一组、device 1 连成一组，片内不同 device 从不相加。右：一组的 buffer 切成 N 份，每台 host 负责其中一份，收另外 N−1 家的那一份、加上自己的、再发回 N−1 家。">


<text x="246" y="243" class="xxs" fill="#8430ce" text-anchor="middle">派生</text>
<text x="52" y="260" class="xxs" fill="#5f6368">GB300 的 MFU</text>
<rect x="288" y="234" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="234" width="120.81423529411765" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<path d="M408.8 252 L417.8 252 L413.3 244 Z" fill="#9aa0a6"/>
<text x="424.8142352941177" y="247" class="xxs" fill="#9aa0a6">▲ 两分半后补上</text>
<text x="288" y="266" class="xxs" fill="#9aa0a6">08-05 → 08-31</text>
<text x="624" y="252" class="num" fill="#202124">26 天</text>
<text x="700" y="244" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">34.20%</tspan></text>
<rect x="880" y="236" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="251" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="242" class="xxs">改上游峰值那次<tspan font-weight="700" fill="#202124">正是漏掉它的那次</tspan> —— 两分半后撤 7,308 时才顺带补上。<tspan fill="#9aa0a6">⚠️ </tspan></text>
<text x="1000" y="255" class="xxs"><tspan fill="#9aa0a6">854.0 ÷ 2,500 = </tspan><tspan font-weight="700" fill="#202124">34.16%</tspan>，而仓库写的是 34.20%，这 0.04pp <tspan font-weight="700" fill="#202124">本轮查出来，</tspan></text>
<text x="1000" y="268" class="xxs"><tspan font-weight="700" fill="#202124">未定位</tspan></text>
<rect x="38" y="278" width="1324" height="56" rx="4" fill="#fcfcfd"/>
<rect x="38" y="278" width="4" height="56" rx="2" fill="#8430ce"/>
<text x="52" y="299" class="lbl" fill="#202124">+50%</text>
<rect x="224" y="287" width="44" height="16" rx="7" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.2"/>
<text x="246" y="299" class="xxs" fill="#8430ce" text-anchor="middle">归类</text>
<text x="52" y="316" class="xxs" fill="#5f6368">v7 调优收益（含 dvfs 频率档）</text>
<rect x="288" y="290" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="290" width="92.94117647058823" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="322" class="xxs" fill="#9aa0a6">08-11 → 08-31</text>
<text x="624" y="308" class="num" fill="#202124">20 天</text>
<text x="700" y="300" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">剥出频率档 → +38%</tspan></text>
<rect x="880" y="292" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="307" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="298" class="xxs">P-14 落点<tspan font-weight="700" fill="#202124">两轮审计</tspan> —— 锁频是硬件工作点，不是软件调优</text>
<rect x="38" y="334" width="4" height="56" rx="2" fill="#8430ce"/>
<rect x="34" y="332" width="1332" height="60" rx="6" fill="None" stroke="#1a73e8" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="1352" y="380" class="xxs" fill="#1a73e8" text-anchor="end">▲ 8.1 整个小节讲的就是这一行</text>
<text x="52" y="355" class="lbl" fill="#202124">7,308</text>
<rect x="224" y="343" width="44" height="16" rx="7" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.2"/>
<text x="246" y="355" class="xxs" fill="#8430ce" text-anchor="middle">派生</text>
<text x="52" y="372" class="xxs" fill="#5f6368">v7 FP8 的 tok/s/chip</text>
<rect x="288" y="346" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="346" width="4.647058823529412" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<rect x="292.6470588235294" y="346" width="69.70588235294117" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="370.35294117647055" y="359" class="xxs" fill="#d93025">← 漏改 15 天</text>
<text x="288" y="378" class="xxs" fill="#9aa0a6">08-15 → 08-31</text>
<text x="624" y="364" class="num" fill="#202124">16 天</text>
<text x="700" y="356" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">4,830</tspan></text>
<rect x="880" y="348" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="363" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="354" class="xxs"><tspan font-weight="700" fill="#202124">反推它的换算关系</tspan>：7,308 × 138.9 GFLOP ≈ 已撤回的 1,014.8</text>
<rect x="38" y="390" width="1324" height="56" rx="4" fill="#fcfcfd"/>
<rect x="38" y="390" width="4" height="56" rx="2" fill="#f9ab00"/>
<text x="52" y="411" class="lbl" fill="#202124">1,014.8</text>
<rect x="224" y="399" width="44" height="16" rx="7" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="246" y="411" class="xxs" fill="#f9ab00" text-anchor="middle">测的</text>
<text x="52" y="428" class="xxs" fill="#5f6368">v7 FP8 的 TFLOP/s/chip</text>
<rect x="288" y="402" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="402" width="4.647058823529412" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="434" class="xxs" fill="#9aa0a6">08-15 → 08-16</text>
<text x="624" y="420" class="num" fill="#202124">1 天</text>
<text x="700" y="412" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">637.0</tspan></text>
<rect x="880" y="404" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="419" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="410" class="xxs"><tspan font-weight="700" fill="#202124">自己复算专家数</tspan> —— 192 个里只算了 3 个</text>
<rect x="38" y="446" width="4" height="56" rx="2" fill="#9aa0a6"/>
<text x="52" y="467" class="lbl" fill="#202124">「软件效率之比」</text>
<rect x="224" y="455" width="44" height="16" rx="7" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="246" y="467" class="xxs" fill="#9aa0a6" text-anchor="middle">推的</text>
<text x="52" y="484" class="xxs" fill="#5f6368">P-15 乙格第二段的命名</text>
<rect x="288" y="458" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="458" width="4" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="490" class="xxs" fill="#9aa0a6">08-31 → 08-31</text>
<text x="624" y="476" class="num" fill="#202124">不到 1 天</text>
<text x="700" y="468" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">改叫「峰值以外」</tspan></text>
<rect x="880" y="460" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="475" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="466" class="xxs">审计 —— <tspan font-weight="700" fill="#202124">它错的不是数，是把一个恒等式当成了发现</tspan></text>
<line x1="38" y1="506" x2="1362" y2="506" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="6 4"/>
<rect x="38" y="514" width="1324" height="56" rx="4" fill="#fcfcfd"/>
<rect x="38" y="514" width="4" height="56" rx="2" fill="#d93025"/>
<text x="52" y="535" class="lbl" fill="#202124">2,250 / 4,500</text>
<rect x="224" y="523" width="44" height="16" rx="7" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="246" y="535" class="xxs" fill="#d93025" text-anchor="middle">套错</text>
<text x="52" y="552" class="xxs" fill="#5f6368">A4X 那页三张 MFU 表的分母</text>
<rect x="288" y="526" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="526" width="288.11764705882354" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="558" class="xxs" fill="#9aa0a6">06-30 → 08-31</text>
<text x="624" y="544" class="num" fill="#202124">62 天</text>
<text x="700" y="536" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">2,500 / 5,000</tspan></text>
<rect x="880" y="528" width="106" height="22" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="933" y="543" class="xxs" fill="#d93025" text-anchor="middle">利于 GPU 侧</text>
<text x="1000" y="534" class="xxs">画 P-12「先问分母」时<tspan font-weight="700" fill="#202124">回查 A4X 到底是哪个 SKU</tspan> —— 2,250 是 HGX B200 </text>
<text x="1000" y="547" class="xxs">的，这些 run 跑在 GB200 NVL72 上</text>
<rect x="38" y="570" width="4" height="56" rx="2" fill="#8430ce"/>
<text x="52" y="591" class="lbl" fill="#202124">22.4% 与 11.2%</text>
<rect x="224" y="579" width="44" height="16" rx="7" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.2"/>
<text x="246" y="591" class="xxs" fill="#8430ce" text-anchor="middle">口径</text>
<text x="52" y="608" class="xxs" fill="#5f6368">同一次 FP8 run 的两个 MFU</text>
<rect x="288" y="582" width="316" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="288" y="582" width="288.11764705882354" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="614" class="xxs" fill="#9aa0a6">06-30 → 08-31</text>
<text x="624" y="600" class="num" fill="#202124">62 天</text>
<text x="700" y="592" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">并列 20.1 / 10.1</tspan></text>
<rect x="880" y="584" width="106" height="22" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="933" y="599" class="xxs" fill="#d93025" text-anchor="middle">利于 GPU 侧</text>
<text x="1000" y="590" class="xxs">画 P-13「同一次 run 的四个 MFU」时，把表体和表注<tspan font-weight="700" fill="#202124">摆进同一个 2×2</tspan> —— 主</text>
<text x="1000" y="603" class="xxs">报的是大的那个</text>
<line x1="38" y1="628" x2="1362" y2="628" stroke="#dadce0" stroke-width="1.0"/>
<text x="52" y="650" class="xs"><tspan font-weight="700" fill="#202124">⭐ 同一个正确值，错了两次，方向相反。</tspan><tspan class="mono" fill="#1967d2">2,500 / 5,000</tspan> 既是 2,700 改过来的，也是 2,250 改过来的 —— 写这一课（主角是 v7）时<tspan font-weight="700" fill="#202124">猜高</tspan>，写 GPU 那页（主角是 A4X）时<tspan font-weight="700" fill="#202124">套错机型</tspan>（官方同代不同封装差 11.1%）。</text>
<text x="52" y="670" class="xs"><tspan font-weight="700" fill="#202124">⭐ 只有一根条有红段。</tspan><tspan fill="#9aa0a6">「上游撤了、下游没跟着撤」八笔里只发生过一次 —— </tspan><tspan font-weight="700" fill="#202124">不是常见故障，但那一次就是 15 天。</tspan></text>
<text x="52" y="690" class="xs"><tspan font-weight="700" fill="#202124">⚠️ 没有任何一个动作能抓到全部八笔。</tspan><tspan fill="#9aa0a6">2,700 没有上游，靠回查规格表；7,308 有上游，靠反推换算；「归类」那笔靠的是审计。</tspan><tspan font-weight="700" fill="#202124">这就是下一张要按来源分级的原因。</tspan></text>
<rect x="20" y="750" width="1360" height="178" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="776" class="sec">⚠️ 这一节在同一处栽了三次，第三次就栽在这张台账上</text>
<text x="38" y="796" class="xs"><tspan fill="#9aa0a6">前两次：上一张</tspan><tspan font-weight="700" fill="#202124">编了一套机制</tspan>（「按字符串搜所以搜不到」），这张图第一版<tspan font-weight="700" fill="#202124">编了一个落点</tspan>（「查最近有上游动过的数」，只覆盖八笔里的两笔）。这一次编的是<tspan font-weight="700" fill="#202124">记账口径</tspan> ——「五笔全部利于 TPU」是一个<tspan font-weight="700" fill="#202124">按图的边界记出来的账，不是按事实记出来的账</tspan>。<tspan font-weight="700" fill="#202124">三次都是先有形状，</tspan></text>
<text x="38" y="811" class="xs"><tspan font-weight="700" fill="#202124">再找证据。</tspan></text>
<rect x="38" y="820" width="322.0" height="74" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="50" y="839" class="lbl" fill="#d93025">① 第一版：5/5 全偏一边</text>
<text x="50" y="855" class="xxs"><tspan fill="#9aa0a6">我当时把它当成一个</tspan><tspan font-weight="700" fill="#202124">需要辩护的发现</tspan>，为它写了整整三步辩护。</text>
<rect x="372.0" y="820" width="322.0" height="74" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="384.0" y="839" class="lbl" fill="#d93025">② 审计：漏了三笔</text>
<text x="384.0" y="855" class="xxs"><tspan fill="#9aa0a6">§6 正文自己写着「</tspan><tspan font-weight="700" fill="#202124">这几处是回查时自己发现并改掉的</tspan>」—— 三笔一</text>
<text x="384.0" y="868" class="xxs">笔没进台账。<tspan font-weight="700" fill="#202124">理由是它们在 §6 不在 §8。</tspan></text>
<rect x="706.0" y="820" width="322.0" height="74" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="718.0" y="839" class="lbl" fill="#1e8e3e">③ 补上就是 6 : 2</text>
<text x="718.0" y="855" class="xxs"><tspan fill="#9aa0a6">而且那两笔不是勉强算的：一笔把 GB200 一整页 MFU 抬高 11%，</tspan></text>
<text x="718.0" y="868" class="xxs"><tspan fill="#9aa0a6">一笔让 FP8 run 用 </tspan><tspan font-weight="700" fill="#202124">BF16 分母</tspan> —— <tspan font-weight="700" fill="#202124">恰好是 v7 侧的反口径</tspan>（v7 </text>
<text x="718.0" y="881" class="xxs">的 FP8 一律按 4,614 报）。</text>
<rect x="1040.0" y="820" width="322.0" height="74" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="1052.0" y="839" class="lbl" fill="#1a73e8">④ 所以偏向跟的是「主角」</text>
<text x="1052.0" y="855" class="xxs"><tspan fill="#9aa0a6">不是「我想要的结论」，是</tspan><tspan font-weight="700" fill="#202124">这份文档在给谁做</tspan>。<tspan font-weight="700" fill="#202124">换个主角重读一遍</tspan></text>
<text x="1052.0" y="868" class="xxs"><tspan font-weight="700" fill="#202124">自己的数</tspan> —— 比「保持客观」可执行。</text>
<text x="38" y="914" class="xs"><tspan font-weight="700" fill="#202124">⑤ 原来那句「利于 GB300 的错没人有动机去找」被自己的记录证伪了</tspan><tspan fill="#9aa0a6"> —— 已知两处（R-6a / R-6b），</tspan><tspan font-weight="700" fill="#202124">而且两处都是自己找出来改掉的</tspan>。（P-18 那个 882.3 <tspan font-weight="700" fill="#202124">不能算进这一类</tspan>：不采用它是<tspan font-weight="700" fill="#202124">低估</tspan> GB300，方向相反。）能说的只剩更弱但为真的一句：<tspan font-weight="700" fill="#202124">这类错更容易被放着</tspan>。</text>
<text x="1380" y="940" class="xxs" fill="#9aa0a6" text-anchor="end">「改成了」那一列的每个值都能在仓库里查到 —— 一份台账不给正确值，读者就没法回查</text>
</svg>
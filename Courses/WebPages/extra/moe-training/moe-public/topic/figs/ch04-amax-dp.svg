<text x="170.0" y="134.0" font-size="13" fill="#5f6368" text-anchor="middle">权重（两边逐位相同）</text>
<text x="170.0" y="156.0" font-size="13" fill="#0d652d" text-anchor="middle">amax 在副本内求</text>
<rect x="640.0" y="84.0" width="180.0" height="90.0" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>

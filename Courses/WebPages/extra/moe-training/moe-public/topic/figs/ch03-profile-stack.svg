<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="四根横条分别是多片版、换 profile 前、换 profile 后两份的 profile 中位步，步时指数 47、46、42、41。蓝色纯计算段四根一样长，缩短的全是灰色的非计算段（暴露通信等）。">

<rect width="900" height="360" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >换 cost profile 只改了排位：纯计算一样长，缩的全是非计算那截</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >四份 profile 的中位步，长度按步时指数；计算段按「约占 47 的七成、互差不到 1%」画</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />
<text x="44.0" y="83.0" font-size="13" fill="#202124" text-anchor="start" >TC 纯计算</text>
<rect x="128.4" y="71.0" width="14.0" height="14.0" rx="3" fill="#e8710a" stroke="none" stroke-width="1.5" />
<text x="148.4" y="83.0" font-size="13" fill="#202124" text-anchor="start" >步时 − 计算（暴露通信为主）</text>
<text x="186.0" y="140.0" font-size="14" fill="#202124" text-anchor="end" >§8 多片版</text>
<rect x="200.0" y="116.0" width="394.8" height="34.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="594.8" y="116.0" width="169.2" height="34.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="774.0" y="140.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >指数 47</text>
<text x="186.0" y="198.0" font-size="14" fill="#202124" text-anchor="end" >换 profile 前</text>
<rect x="200.0" y="174.0" width="394.8" height="34.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="594.8" y="174.0" width="157.2" height="34.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="762.0" y="198.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >指数 46</text>
<text x="186.0" y="256.0" font-size="14" fill="#202124" text-anchor="end" >换 profile 后 A</text>
<rect x="200.0" y="232.0" width="394.8" height="34.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="594.8" y="232.0" width="109.2" height="34.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="714.0" y="256.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >指数 42</text>
<text x="186.0" y="314.0" font-size="14" fill="#202124" text-anchor="end" >换 profile 后 B</text>
<rect x="200.0" y="290.0" width="394.8" height="34.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="594.8" y="290.0" width="97.2" height="34.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="702.0" y="314.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >指数 41</text>
<line x1="594.8" y1="108.0" x2="594.8" y2="334.0" stroke="#1a73e8" stroke-width="1.2" stroke-dasharray="4 3" />
<text x="397.4" y="356.0" font-size="13" fill="#1a73e8" text-anchor="middle" >计算段：几份互差不到 1%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" role="img" aria-label="DCN all-reduce 中位延迟随切片数变化：28 个梯度合并并发从 2×4x4x4 的 22.6 毫秒涨到 8×4x8x8 的 57 毫秒；不合并时是合并的约 3 倍；6 KiB 地板也随片数上涨。更多片数未画，延迟继续上涨，验收以你自己集群的基线为准。" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif' class="chart"><title>DCN all-reduce 主要随「片数」涨；合并 28 个梯度永远快约 3 倍</title><desc>DCN all-reduce 中位延迟随切片数变化：28 个梯度合并并发从 2×4x4x4 的 22.6 毫秒涨到 8×4x8x8 的 57 毫秒；不合并时是合并的约 3 倍；6 KiB 地板也随片数上涨。更多片数未画，延迟继续上涨，验收以你自己集群的基线为准。</desc><style>.pt{cursor:default}.pt:hover>*:not(title),.pt:focus>*:not(title){stroke:#202124;stroke-width:2.2}.pt:focus{outline:none}</style><rect width="880" height="500" fill="#fff"/><text x="20.0" y="30.0" font-size="19" fill="#202124" font-weight="700">DCN all-reduce 主要随「片数」涨；合并 28 个梯度永远快约 3 倍</text><text x="20.0" y="52.0" font-size="14" fill="#5f6368">中位延迟（对数纵轴），每 case 20 次去首跑；实心 = 双网卡，空心 = 单网卡（≤ 4 片看不出差别）；只画到 8 片</text><line x1="20" y1="73" x2="34" y2="73" stroke="#1a73e8" stroke-width="3"/><text x="38.0" y="78.0" font-size="13.5" fill="#202124">28 个梯度合并后并发（最像训练反向）</text><line x1="298.68" y1="73" x2="312.68" y2="73" stroke="#e8710a" stroke-width="3"/><text x="316.7" y="78.0" font-size="13.5" fill="#202124">28 个梯度各自并发</text><line x1="455.86" y1="73" x2="469.86" y2="73" stroke="#9334e6" stroke-width="3"/><text x="473.9" y="78.0" font-size="13.5" fill="#202124">单个 64 MiB</text><line x1="575.78" y1="73" x2="589.78" y2="73" stroke="#5f6368" stroke-width="3"/><text x="593.8" y="78.0" font-size="13.5" fill="#202124">6 KiB 一次（地板）</text><line x1="76" y1="430.0" x2="696" y2="430.0" stroke="#eceff1"/><text x="68.0" y="434.5" font-size="13" fill="#5f6368" text-anchor="end">3</text><line x1="76" y1="393.6" x2="696" y2="393.6" stroke="#eceff1"/><text x="68.0" y="398.1" font-size="13" fill="#5f6368" text-anchor="end">5</text><line x1="76" y1="344.2" x2="696" y2="344.2" stroke="#eceff1"/><text x="68.0" y="348.7" font-size="13" fill="#5f6368" text-anchor="end">10</text><line x1="76" y1="294.9" x2="696" y2="294.9" stroke="#eceff1"/><text x="68.0" y="299.4" font-size="13" fill="#5f6368" text-anchor="end">20</text><line x1="76" y1="229.6" x2="696" y2="229.6" stroke="#eceff1"/><text x="68.0" y="234.1" font-size="13" fill="#5f6368" text-anchor="end">50</text><line x1="76" y1="180.2" x2="696" y2="180.2" stroke="#eceff1"/><text x="68.0" y="184.7" font-size="13" fill="#5f6368" text-anchor="end">100</text><line x1="76" y1="130.9" x2="696" y2="130.9" stroke="#eceff1"/><text x="68.0" y="135.4" font-size="13" fill="#5f6368" text-anchor="end">200</text><line x1="76" y1="102.0" x2="696" y2="102.0" stroke="#eceff1"/><text x="68.0" y="106.5" font-size="13" fill="#5f6368" text-anchor="end">300</text><text x="20" y="266.0" font-size="13.5" fill="#5f6368" text-anchor="middle" transform="rotate(-90 20 266.0)">毫秒（对数）</text><line x1="76" y1="430" x2="696" y2="430" stroke="#80868b"/><text x="153.5" y="450.0" font-size="13.5" fill="#202124" text-anchor="middle">2×4x4x4</text><text x="153.5" y="468.0" font-size="13" fill="#5f6368" text-anchor="middle">128 芯</text><text x="308.5" y="450.0" font-size="13.5" fill="#202124" text-anchor="middle">4×4x4x4</text><text x="308.5" y="468.0" font-size="13" fill="#5f6368" text-anchor="middle">256 芯</text><text x="463.5" y="450.0" font-size="13.5" fill="#202124" text-anchor="middle">4×4x8x8</text><text x="463.5" y="468.0" font-size="13" fill="#5f6368" text-anchor="middle">1,024 芯</text><text x="618.5" y="450.0" font-size="13.5" fill="#202124" text-anchor="middle">8×4x8x8</text><text x="618.5" y="468.0" font-size="13" fill="#5f6368" text-anchor="middle">2,048 芯</text><path d="M153.5 286.2 L308.5 258.4 L463.5 253.0 L618.5 220.3" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-linejoin="round"/><g class="pt" tabindex="0"><title>2×4x4x4（双网卡）28 个梯度合并后并发（最像训练反向）：22.6 ms</title><circle cx="153.5" cy="286.2" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x4x4（双网卡）28 个梯度合并后并发（最像训练反向）：33.4 ms</title><circle cx="304.5" cy="258.4" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x4x4（单网卡）28 个梯度合并后并发（最像训练反向）：33 ms</title><circle cx="317.5" cy="259.2" r="5.5" fill="#fff" stroke="#1a73e8" stroke-width="2.2"/></g><g class="pt" tabindex="0"><title>4×4x8x8（双网卡）28 个梯度合并后并发（最像训练反向）：36 ms</title><circle cx="459.5" cy="253.0" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x8x8（单网卡）28 个梯度合并后并发（最像训练反向）：37.4 ms</title><circle cx="472.5" cy="250.3" r="5.5" fill="#fff" stroke="#1a73e8" stroke-width="2.2"/></g><g class="pt" tabindex="0"><title>8×4x8x8（双网卡）28 个梯度合并后并发（最像训练反向）：57 ms</title><circle cx="618.5" cy="220.3" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><path d="M153.5 203.3 L308.5 178.8 L463.5 173.1 L618.5 142.9" fill="none" stroke="#e8710a" stroke-width="1.8" stroke-linejoin="round"/><g class="pt" tabindex="0"><title>2×4x4x4（双网卡）28 个梯度各自并发：72.4 ms</title><circle cx="153.5" cy="203.3" r="4.8" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x4x4（双网卡）28 个梯度各自并发：102 ms</title><circle cx="304.5" cy="178.8" r="4.8" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x4x4（单网卡）28 个梯度各自并发：108.1 ms</title><circle cx="317.5" cy="174.7" r="4.8" fill="#fff" stroke="#e8710a" stroke-width="2.2"/></g><g class="pt" tabindex="0"><title>4×4x8x8（双网卡）28 个梯度各自并发：110.6 ms</title><circle cx="459.5" cy="173.1" r="4.8" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4×4x8x8（单网卡）28 个梯度各自并发：113.4 ms</title><circle cx="472.5" cy="171.3" r="4.8" fill="#fff" stroke="#e8710a" stroke-width="2.2"/></g><g class="pt" tabindex="0"><title>8×4x8x8（双网卡）28 个梯度各自并发：169 ms</title><circle cx="618.5" cy="142.9" r="4.8" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><path d="M153.5 211.5 L308.5 186.4 L463.5 162.2 L618.5 165.3" fill
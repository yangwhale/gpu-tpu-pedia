<rect x="288" y="178" width="232.35294117647058" height="18" rx="3" fill="#e8eaed" stroke="#c8ccd0" stroke-width="1.4"/>
<text x="288" y="210" class="xxs" fill="#9aa0a6">07-12 → 08-31</text>
<text x="624" y="196" class="num" fill="#202124">50 天</text>
<text x="700" y="188" class="xxs"><tspan fill="#9aa0a6">→ </tspan><tspan font-weight="700" fill="#202124">2,500 / 5,000</tspan></text>
<rect x="880" y="180" width="106" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="933" y="195" class="xxs" fill="#1e8e3e" text-anchor="middle">利于 TPU</text>
<text x="1000" y="186" class="xxs">写这一课时<tspan font-weight="700" fill="#202124">回查官方规格表</tspan> —— 它从来没有出处，一处都不会报错</text>
<rect x="38" y="222" width="4" height="56" rx="2" fill="#8430ce"/>
<text x="52" y="243" class="lbl" fill="#202124">31.60%</text>

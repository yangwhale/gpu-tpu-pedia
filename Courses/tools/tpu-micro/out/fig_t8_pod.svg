<text x="20" y="26" class="ttl">从一颗到一个 pod　—— 关键不是能连多少，是在哪儿被迫换一套编程模型</text>
<rect x="1259" y="10" width="121" height="22" rx="11" fill="#d93025"/>
<text x="1319.5" y="25" class="lbl" fill="#fff" text-anchor="middle">第 8 / 8 张</text>

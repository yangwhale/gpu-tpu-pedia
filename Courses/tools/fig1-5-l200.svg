<svg viewBox="0 0 1000 320" width="100%" role="img" aria-label="第 1 节的落点：只有一边有的、两边量级相同的、以及算力除带宽撞在同一个数上">
<text class="svglbl" x="0" y="16" fill="#202124" style="font-size:13.5px">第 1 节的落点 —— 那张十行的表，真正要讲的只有这三格</text>
<text class="svgsm" x="0" y="35">按「硬度」分类，不按「层级」分类：谁是结构性差别、谁只是数字不同、谁是巧合</text>
<rect x="0" y="62" width="320" height="250" rx="10" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<rect x="0" y="62" width="320" height="46" rx="10" fill="#d93025"/>
<rect x="0" y="98" width="320" height="10" fill="#d93025"/>
<text class="svglbl" x="16" y="83" fill="#fff" style="font-size:13px">① 只有一边有的</text>
<text class="svgsm" x="16" y="100" fill="#ffffffcc">结构性差别 —— 参数表上看不出来</text>
<text class="svgsm" x="16" y="136" fill="#5f6368">TPU 没有</text>
<text class="svgsm" x="16" y="153" fill="#202124">「硬件自动管的片上缓存」这一整层</text>
<text class="svgsm" x="16" y="168" fill="#202124">CMEM = 0；GPU 那层是 126 MB 的 L2</text>
<text class="svgsm" x="16" y="188" fill="#5f6368">GPU 没有</text>
<text class="svgsm" x="16" y="205" fill="#202124">「可编程的专用协处理器」这一整层（无 SparseCore）</text>
<line x1="14" y1="260" x2="306" y2="260" stroke="#e8eaed"/>
<text class="svgsm" x="16" y="278" fill="#d93025" style="font-size:10px">⭐ 这两格是空的，不是小 ——</text>
<text class="svgsm" x="16" y="293" fill="#d93025" style="font-size:10px">第 2、3 节全从这儿长出来</text>
<rect x="340" y="62" width="320" height="250" rx="10" fill="#fff" stroke="#5f6368" stroke-width="1.6"/>
<rect x="340" y="62" width="320" height="46" rx="10" fill="#5f6368"/>
<rect x="340" y="98" width="320" height="10" fill="#5f6368"/>
<text class="svglbl" x="356" y="83" fill="#fff" style="font-size:13px">② 两边都有、量级相同</text>
<text class="svgsm" x="356" y="100" fill="#ffffffcc">数字接近，不构成差别</text>
<text class="svgsm" x="356" y="136" fill="#5f6368">算力</text>
<text class="svgsm" x="356" y="153" fill="#202124">2,307 对 2,500 TFLOPS</text>
<text class="svgnum" x="644" y="148" text-anchor="end" fill="#5f6368" style="font-size:17px">差 8%</text>
<text class="svgsm" x="356" y="188" fill="#5f6368">HBM 带宽</text>
<text class="svgsm" x="356" y="205" fill="#202124">7,380 对 8,000 GB/s</text>
<text class="svgnum" x="644" y="200" text-anchor="end" fill="#5f6368" style="font-size:17px">差 8%</text>
<line x1="354" y1="260" x2="646" y2="260" stroke="#e8eaed"/>
<text class="svgsm" x="356" y="278" fill="#5f6368" style="font-size:10px">这两条可以跳过 ——</text>
<text class="svgsm" x="356" y="293" fill="#5f6368" style="font-size:10px">都在 10% 以内，那不叫差别</text>
<rect x="680" y="62" width="320" height="250" rx="10" fill="#fff" stroke="#12786f" stroke-width="1.6"/>
<rect x="680" y="62" width="320" height="46" rx="10" fill="#12786f"/>
<rect x="680" y="98" width="320" height="10" fill="#12786f"/>
<text class="svglbl" x="696" y="83" fill="#fff" style="font-size:13px">③ 撞在同一个数上</text>
<text class="svgsm" x="696" y="100" fill="#ffffffcc">第 1 节唯一要背下来的</text>
<text class="svgsm" x="696" y="136" fill="#5f6368">TPU v7</text>
<text class="svgsm" x="696" y="153" fill="#202124">2,307 ÷ 7.38</text>
<text class="svgnum" x="984" y="148" text-anchor="end" fill="#12786f" style="font-size:17px">312.6</text>
<text class="svgsm" x="696" y="188" fill="#5f6368">GB200</text>
<text class="svgsm" x="696" y="205" fill="#202124">2,500 ÷ 8.00</text>
<text class="svgnum" x="984" y="200" text-anchor="end" fill="#12786f" style="font-size:17px">312.5</text>
<line x1="694" y1="260" x2="986" y2="260" stroke="#e8eaed"/>
<text class="svgsm" x="696" y="278" fill="#12786f" style="font-size:10px">⚠️ 相对差 0.03%，BF16 和 FP8 完全一样。</text>
<text class="svgsm" x="696" y="293" fill="#12786f" style="font-size:10px">「为什么一样」是推断；换 HGX B200 就是 281.3</text>
</svg>
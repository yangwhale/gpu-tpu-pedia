<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：同一个多片作业中途两次故障重启。JIT 那行每次启动都要先编译到首步，约 40 到 46 分钟；AOT 那行产物提前在 CPU 机上编好，每次启动只加载，首步约 7 到 8 分钟。下方进度条是到同一时刻真正在训练的累计时间，AOT 明显更长。">

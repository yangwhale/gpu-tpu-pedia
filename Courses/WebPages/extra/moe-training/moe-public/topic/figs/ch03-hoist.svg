<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="推断示意。上：层循环里每一层都发一次跨 DCN 的小统计量 all-reduce，每次都付一截地板，后面的层被往后推。下：每层只把统计量存下来，出循环后合成两个父级 all-reduce，只付两次地板，整体更短。">

<rect width="900" height="300" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >前向统计量 hoist（推断）：每层一截 DCN 地板 → 出循环后只剩两截</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >示意，层数与长度不按比例；未测稳态步时</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />

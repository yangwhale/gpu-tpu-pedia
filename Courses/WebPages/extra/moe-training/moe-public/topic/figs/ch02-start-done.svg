<svg xmlns="http://www.w3.org/2000/svg" width="900" height="316" viewBox="0 0 900 316" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：start 把通信交给 SparseCore，TensorCore 不等，继续算；done 是 TensorCore 指令流里的检查点，通信没完成时整个 TensorCore 停下，后面所有计算都往后推；输入 buffer 从 start 一直活到 done 才释放。">

<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="900" height="316" fill="#ffffff"/>
<text x="450.0" y="34.0" font-size="20" fill="#202124" text-anchor="middle" font-weight="bold">start 只是交出去，done 才是 TensorCore 停下的地方</text>
<text x="450.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="middle">一个异步通信在三条线上各留下什么：TensorCore 指令流、SparseCore 车道、显存里的输入 buffer。示意，无刻度</text>
<text x="20.0" y="120.0" font-size="14" fill="#202124" text-anchor="start">TensorCore</text>
<text x="20.0" y="180.0" font-size="14" fill="#202124" text-anchor="start">SparseCore</text>
<text x="20.0" y="236.0" font-size="14" fill="#0d652d" text-anchor="start">输入 buffer</text>
<rect x="160.0" y="100.0" width="113.7" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="218.3" y="120.0" font-size="14" fill="#174ea6" text-anchor="middle">计算</text>
<rect x="276.7" y="100.0" width="172.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="364.2" y="120.0" font-size="14" fill="#174ea6" text-anchor="middle">计算（与通信并行）</text>
<rect x="451.7" y="100.0" width="113.7" height="30.0" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="510.0" y="120.0" font-size="14" fill="#a50e0e" text-anchor="middle">整个停下</text>
<rect x="568.3" y="100.0" width="142.8" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="641.2" y="120.0" font-size="14" fill="#174ea6" text-anchor="middle">用结果的计算</text>
<rect x="714.2" y="100.0" width="142.8" height="30.0" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="787.1" y="120.0" font-size="14" fill="#174ea6" text-anchor="middle">不相干的计算也推后</text>
<rect x="276.7" y="160.0" width="288.7" height="30.0" rx="5" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="422.5" y="180.0" font-size="14" fill="#b06000" text-anchor="middle">通信在 SparseCore 上跑</text>
<rect x="276.7" y="220.0" width="288.7" height="22.0" rx="3" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
<text x="574.3" y="236.0" font-size="13" fill="#0d652d" text-anchor="start">活到 done 才释放</text>
<line x1="276.7" y1="86.0" x2="276.7" y2="250.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="276.7" y="82.0" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">start</text>
<line x1="565.3" y1="86.0" x2="565.3" y2="250.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="565.3" y="82.0" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">done</text>
<text x="20.0" y="290.0" font-size="14" fill="#202124" text-anchor="start">暴露的通信 = done 处那段红：停下的是整条指令流，不只是用结果的那条指令；start 越早、done 越晚，buffer 占得越久。</text>
</svg>

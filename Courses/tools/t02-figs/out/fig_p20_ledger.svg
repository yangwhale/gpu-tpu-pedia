<text x="20" y="26" class="ttl">八笔撤回，按活了多久排　—— <tspan font-weight="700" fill="#d93025">第一版只记了五笔，漏掉的三笔恰好方向相反</tspan></text>
<rect x="1292" y="10" width="88" height="22" rx="11" fill="#d93025"/>
<text x="1336.0" y="25" class="lbl" fill="#fff" text-anchor="middle">上一张的台账</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#c8ccd0"/>
<text x="37" y="58" class="sm">条上灰段＝上游还立着（或它自己就是源头），没人去看它</text>
<rect x="358.0" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="375.0" y="58" class="sm">条上红段＝上游已撤、它还挂着，真正的「漏改」</text>
<rect x="650.0" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="667.0" y="58" class="sm">绿牌＝撤回前利于 TPU（六笔，这是对我们不利的多数）</text>
<rect x="978.8" y="48" width="11" height="11" rx="2" fill="#f6c7c4"/>
<text x="995.8" y="58" class="sm">红牌＝撤回前利于 GPU 侧（两笔都在 A4X 那页，跑的是 GB200 不是 GB300）· 沿用 P-18 的厂商配色，不表示好坏</text>
<rect x="20" y="124" width="1360" height="602" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="xxs" fill="#9aa0a6">这一课撤回过的</text>
<text x="288" y="150" class="xxs" fill="#9aa0a6">活了多久（灰=没人看它 · 红=上游撤了它还挂着）</text>
<text x="624" y="150" class="xxs" fill="#9aa0a6">总寿命</text>
<text x="700" y="150" class="xxs" fill="#9aa0a6">改成了</text>
<text x="880" y="150" class="xxs" fill="#9aa0a6">撤回前偏向</text>
<text x="1000" y="150" class="xxs" fill="#9aa0a6">怎么被发现的</text>

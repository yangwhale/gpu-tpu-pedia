<svg viewBox="0 0 1400 978" width="1400" height="978" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="八个问题两种答案：这一课支撑得住的「各自擅长什么」，每一行自带出处和硬度">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">各自擅长什么　—— <tspan font-weight="700" fill="#1a73e8">八个问题，每个都有两种答案，没有一个有「更好的那种」</tspan></text>
<rect x="1270" y="10" width="110" height="22" rx="11" fill="#1a73e8"/>
<text x="1325.0" y="25" class="lbl" fill="#fff" text-anchor="middle">全课收尾 · 一</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">GPU 那一侧</text>
<rect x="118.80000000000001" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="135.8" y="58" class="sm">TPU 那一侧</text>
<rect x="217.60000000000002" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="234.60000000000002" y="58" class="sm">实测 ＝ 两边同口径的数 · 这张表 0 行</text>
<rect x="468.20000000000005" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="485.20000000000005" y="58" class="sm">机制 ＝ 逐站数出来的 · 5 行</text>
<rect x="666.475" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="683.475" y="58" class="sm">只有方向 ＝ 没有量 · 2 行</text>
<rect x="853.25" y="48" width="11" height="11" rx="2" fill="#8430ce"/>
<text x="870.25" y="58" class="sm">会收敛 ＝ 生态差距 · 1 行</text>
<rect x="20" y="124" width="1360" height="584" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="52" y="150" class="xxs" fill="#9aa0a6">这一课回答过的问题</text>
<text x="264" y="150" class="xxs" fill="#9aa0a6">GPU 那一侧的答案</text>
<text x="746" y="150" class="xxs" fill="#9aa0a6">TPU 那一侧的答案</text>
<text x="1228" y="150" class="xxs" fill="#9aa0a6">指回哪一节 · 这话有多硬</text>
<line x1="38" y1="158" x2="1362" y2="158" stroke="#dadce0" stroke-width="1.0"/>
<rect x="38" y="166" width="1324" height="62" rx="4" fill="#fcfcfd"/>
<rect x="24" y="170" width="5" height="54" rx="2" fill="#1a73e8"/>
<text x="34" y="192" class="xxs" fill="#202124">▶</text>
<text x="52" y="188" class="xs"><tspan font-weight="700" fill="#202124">① 形状变了，谁来适应？</tspan></text>
<rect x="254" y="172" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="188" class="xxs"><tspan font-weight="700" fill="#202124">硬件，在运行时。</tspan><tspan fill="#9aa0a6">同一次访存路上 </tspan><tspan font-weight="700" fill="#202124">5 个决策点</tspan>，命中不命中要跑起来才知道。</text>
<rect x="736" y="172" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="188" class="xxs"><tspan font-weight="700" fill="#202124">编译器，在编译期。</tspan><tspan fill="#9aa0a6">同一条路上 </tspan><tspan font-weight="700" fill="#202124">0 个</tspan> —— 赌赢了一个周期都不浪费，<tspan font-weight="700" fill="#d93025">赌输了运行时无处补救</tspan>。</text>
<text x="1228" y="190" class="xxs" fill="#5f6368">§2.1 访存逐站图</text>
<rect x="1228" y="198" width="38" height="17" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
<text x="1247.0" y="210" class="xxs" fill="#1a73e8" text-anchor="middle">机制</text>
<rect x="24" y="232" width="5" height="54" rx="2" fill="#1a73e8"/>
<text x="34" y="254" class="xxs" fill="#202124">▶</text>
<text x="52" y="250" class="xs"><tspan font-weight="700" fill="#202124">② 形状根本变不了呢？</tspan></text>
<rect x="254" y="234" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="250" class="xxs"><tspan font-weight="700" fill="#202124">把图关掉，照跑。</tspan><tspan fill="#9aa0a6">日志里就一行 </tspan><tspan class="mono" fill="#1967d2">Disable prefill CUDA graph</tspan> —— <tspan font-weight="700" fill="#202124">关了就永久关着</tspan>，便宜到能写</text>
<text x="264" y="263" class="xxs">进默认配置。</text>
<rect x="736" y="234" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="250" class="xxs"><tspan font-weight="700" fill="#202124">同样的开关这边也有</tspan>（<tspan class="mono" fill="#1967d2">--enforce-eager</tspan>）。<tspan fill="#9aa0a6">差的是标价：我们自己文档写着</tspan><tspan font-weight="700" fill="#202124">「预期开了能再快 2-3x」</tspan></text>
<text x="746" y="263" class="xxs">，而它被列进了<tspan font-weight="700" fill="#d93025">待办项</tspan>。</text>
<text x="1228" y="252" class="xxs" fill="#5f6368">§5.5 · P-7</text>
<rect x="1228" y="260" width="38" height="17" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
<text x="1247.0" y="272" class="xxs" fill="#1a73e8" text-anchor="middle">机制</text>
<rect x="38" y="290" width="1324" height="62" rx="4" fill="#fcfcfd"/>
<rect x="24" y="294" width="5" height="54" rx="2" fill="#1a73e8"/>
<text x="52" y="312" class="xs"><tspan font-weight="700" fill="#202124">③ head_dim=128 落在哪？</tspan></text>
<rect x="254" y="296" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="312" class="xxs"><tspan font-weight="700" fill="#202124">收缩维 16 的整整 8 倍。</tspan><tspan fill="#9aa0a6">切八条指令，</tspan><tspan font-weight="700" fill="#202124">一点不浪费</tspan>。</text>
<rect x="736" y="296" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="312" class="xxs"><tspan font-weight="700" fill="#202124">只喂满 256 收缩维的一半。</tspan><tspan fill="#9aa0a6">所以「head_dim 要对齐硬件」这条建议</tspan><tspan font-weight="700" fill="#202124">是有前提的</tspan>。</text>
<text x="1228" y="314" class="xxs" fill="#5f6368">§3.4</text>
<rect x="1228" y="322" width="38" height="17" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
<text x="1247.0" y="334" class="xxs" fill="#1a73e8" text-anchor="middle">机制</text>
<rect x="24" y="356" width="5" height="54" rx="2" fill="#1a73e8"/>
<text x="52" y="374" class="xs"><tspan font-weight="700" fill="#202124">④ 这条约束能传多远？</tspan></text>
<rect x="254" y="358" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="374" class="xxs"><tspan font-weight="700" fill="#202124">链子断在第 3 层。</tspan><tspan fill="#9aa0a6">是「对齐了更快」，</tspan><tspan font-weight="700" fill="#202124">不是「对不齐编译不过」</tspan>。</text>
<rect x="736" y="358" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="374" class="xxs"><tspan font-weight="700" fill="#202124">第 3 层是硬的</tspan><tspan fill="#9aa0a6">（Pallas block 末两维必须是 8 和 128 的倍数），一路传到</tspan><tspan font-weight="700" fill="#202124">模型架构</tspan>。</text>
<text x="1228" y="376" class="xxs" fill="#5f6368">§2.6</text>
<rect x="1228" y="384" width="38" height="17" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
<text x="1247.0" y="396" class="xxs" fill="#1a73e8" text-anchor="middle">机制</text>
<rect x="38" y="414" width="1324" height="62" rx="4" fill="#fcfcfd"/>
<rect x="24" y="418" width="5" height="54" rx="2" fill="#f9ab00"/>
<text x="34" y="440" class="xxs" fill="#202124">▶</text>
<text x="52" y="436" class="xs"><tspan font-weight="700" fill="#202124">⑤ 再连一台机器会怎样？</tspan></text>
<rect x="254" y="420" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="436" class="xxs"><tspan font-weight="700" fill="#202124">72 卡是一道硬边界。</tspan><tspan fill="#9aa0a6">越过去要换协议 —— </tspan><tspan font-weight="700" fill="#202124">到某一点突然掉下去</tspan>。</text>
<rect x="736" y="420" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="436" class="xxs"><tspan font-weight="700" fill="#202124">4 一路到 9,216，同一套 ICI。</tspan><tspan fill="#9aa0a6">是</tspan><tspan font-weight="700" fill="#202124">距离逐渐变远</tspan>，不是掉下去。<tspan font-weight="700" fill="#d93025">但 128 倍只衡量能延展多远，不衡量</tspan></text>
<text x="746" y="449" class="xxs"><tspan font-weight="700" fill="#d93025">谁跑得快。</tspan></text>
<text x="1228" y="438" class="xxs" fill="#5f6368">§1.2 · §4.1　三条刹车见 P-23 ①</text>
<rect x="1228" y="446" width="60" height="17" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.1"/>
<text x="1258.0" y="458" class="xxs" fill="#f9ab00" text-anchor="middle">只有方向</text>
<rect x="24" y="480" width="5" height="54" rx="2" fill="#8430ce"/>
<text x="52" y="498" class="xs"><tspan font-weight="700" fill="#202124">⑥ 越过编译器边界之后？</tspan></text>
<rect x="254" y="482" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="498" class="xxs"><tspan font-weight="700" fill="#202124">有大量现成的可抄。这一条 GPU 侧目前确实占优</tspan> —— 但它是<tspan font-weight="700" fill="#202124">生态差距，不是架构差距</tspan>。</text>
<rect x="736" y="482" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="498" class="xxs"><tspan font-weight="700" fill="#202124">得有人有能力写。</tspan><tspan fill="#9aa0a6">移植账单三笔：</tspan><tspan font-weight="700" fill="#202124">冷启动 19 分</tspan>编译到 server ready（热启动仍要 7 分半）、缓存不</text>
<text x="746" y="511" class="xxs">回退化重编、调参表是算法的 <tspan font-weight="700" fill="#202124">2.15 倍</tspan>。<tspan font-weight="700" fill="#d93025">⚠️ 这三笔只有 TPU 侧，GPU 侧没算过。</tspan></text>
<text x="1228" y="500" class="xxs" fill="#5f6368">P-3 · P-8</text>
<rect x="1228" y="508" width="82" height="17" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.1"/>
<text x="1269.0" y="520" class="xxs" fill="#8430ce" text-anchor="middle">会随时间收敛</text>
<rect x="38" y="538" width="1324" height="62" rx="4" fill="#fcfcfd"/>
<rect x="24" y="542" width="5" height="54" rx="2" fill="#1a73e8"/>
<text x="52" y="560" class="xs"><tspan font-weight="700" fill="#202124">⑦ 那道缝坏了怎么查？</tspan></text>
<rect x="254" y="544" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="560" class="xxs"><tspan font-weight="700" fill="#202124">查不了。</tspan><tspan fill="#9aa0a6">L2 跨 die 从约 21 掉到 16.8 TB/s，</tspan><tspan font-weight="700" fill="#202124">不出现在任何 API 里</tspan> —— 只表现为「这 kernel 莫</text>
<text x="264" y="573" class="xxs">名其妙慢了」。<tspan font-weight="700" fill="#d93025">（这两个数是第三方压测）</tspan></text>
<rect x="736" y="544" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="560" class="xxs"><tspan font-weight="700" fill="#202124">写在脸上。</tspan><tspan fill="#9aa0a6">那道缝如实暴露成两个 device —— </tspan><tspan font-weight="700" fill="#202124">麻烦，但可查</tspan>。</text>
<text x="1228" y="562" class="xxs" fill="#5f6368">§3.1</text>
<rect x="1228" y="570" width="38" height="17" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
<text x="1247.0" y="582" class="xxs" fill="#1a73e8" text-anchor="middle">机制</text>
<rect x="24" y="604" width="5" height="54" rx="2" fill="#f9ab00"/>
<text x="52" y="622" class="xs"><tspan font-weight="700" fill="#202124">⑧ 不占卡能先算出会不会 OOM 吗？</tspan></text>
<rect x="254" y="606" width="480" height="50" rx="6" fill="#fff" stroke="#fce8e6" stroke-width="1.2"/>
<text x="264" y="622" class="xxs"><tspan fill="#9aa0a6">这一课</tspan><tspan font-weight="700" fill="#202124">没有找到对应物</tspan>。<tspan font-weight="700" fill="#d93025">⚠️ 这是本课断言，没有考据过，不要当成「GPU 做不到」往外传。</tspan></text>
<rect x="736" y="606" width="480" height="50" rx="6" fill="#fff" stroke="#e6f4ea" stroke-width="1.2"/>
<text x="746" y="622" class="xxs"><tspan font-weight="700" fill="#202124">能。</tspan><tspan fill="#9aa0a6">AOT 算出的 74.95 / 73.11 / 21.75 / 29.62 与真机打印</tspan><tspan font-weight="700" fill="#202124">在它那一位小数的精度内完全吻合</tspan>（</text>
<text x="746" y="635" class="xxs">真机只打一位）。</text>
<text x="1228" y="624" class="xxs" fill="#5f6368">§5.6 · P-9</text>
<rect x="1228" y="632" width="60" height="17" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.1"/>
<text x="1258.0" y="644" class="xxs" fill="#f9ab00" text-anchor="middle">只有方向</text>
<line x1="38" y1="664" x2="1362" y2="664" stroke="#dadce0" stroke-width="1.0"/>
<text x="52" y="686" class="xs"><tspan font-weight="700" fill="#202124">⛔ 这张表里没有一行叫「所以 TPU 更适合规整训练」。</tspan><tspan fill="#9aa0a6">§0 立的那句「当假设成立，TPU 赢在省下来的面积」</tspan><tspan font-weight="700" fill="#202124">至今没有被数据兑现过</tspan> —— 第 5 节兑现的只是它的<tspan font-weight="700" fill="#202124">反面</tspan>（变长序列、MoE 路由）。把假设当已证结论回收，就是<tspan font-weight="700" fill="#202124">用命名冒充证明</tspan>，第 7 节为此返工过一次。</text>
<rect x="20" y="728" width="1360" height="66" rx="9" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
<text x="38" y="750" class="box" fill="#f9ab00">⚠️ 先钉一个口径：前面六节和第七节，比的不是同一块 GPU</text>
<rect x="38" y="758" width="386" height="26" rx="5" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.0"/>
<text x="48" y="775" class="xxs" fill="#5f6368">§1 – §6　拆封装 · 数 SM · 算 FLOP/byte</text>
<text x="414" y="775" class="xxs" fill="#202124" text-anchor="end">B200 ／ GB200 NVL72</text>
<rect x="440" y="758" width="232" height="26" rx="5" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.0"/>
<text x="450" y="775" class="xxs" fill="#5f6368">§7　两边的实测</text>
<text x="662" y="775" class="xxs" fill="#202124" text-anchor="end">GB300</text>
<rect x="690" y="758" width="672" height="26" rx="5" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.0"/>
<text x="700" y="775" class="xxs" fill="#5f6368">§1.4 那个 312 FLOP/byte 的拐点，换到 GB300 仍然成立</text>
<text x="1352" y="775" class="xxs" fill="#202124" text-anchor="end">2,500 ÷ 8.0 ＝ 312.5　分子分母都与 B200 相同　⚠️ 8.0 ＝ 576 ÷ 72 是推的，官方写的是「最高 576」</text>
<rect x="20" y="806" width="1360" height="148" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="834" class="sec">⛔ 这张表里「两边同口径实测」那一档是空的 —— 而这门课唯一的一组两边实测，跑的是「TPU 的赌注该成立」<tspan font-weight="700" fill="#d93025">最近的那一侧 —— 但也只近了一半</tspan></text>
<rect x="38" y="848" width="640" height="92" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="50" y="867" class="lbl" fill="#1a73e8">实测跑的是什么</text>
<text x="50" y="886" class="xxs"><tspan fill="#9aa0a6">Hunyuan3-295B-A21B 预训练，两边各 64 个计算单元、2026 年 8 月。</tspan><tspan font-weight="700" fill="#202124">这是离「假设成立」最近的一侧 —— 但只近了一半</tspan>：§0 列的两</text>
<text x="50" y="900" class="xxs">个反例里，形状固定排除了<tspan font-weight="700" fill="#202124">变长序列</tspan>，<tspan font-weight="700" fill="#d93025">而它仍然是个 192 专家的 MoE，另一个反例「MoE 路由」正是这组实测的主体</tspan><tspan fill="#9aa0a6">（P-18 最重的那条</tspan></text>
<text x="50" y="914" class="xxs"><tspan fill="#9aa0a6">边界就是靠它立起来的）。</tspan><tspan font-weight="700" fill="#d93025">结果：GB300 快 1.31 倍。</tspan></text>
<rect x="690" y="848" width="672" height="92" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="702" y="867" class="lbl" fill="#1a73e8">所以能说的只有这一句，一个字都不能多</text>
<text x="702" y="890" class="sec"><tspan font-weight="700" fill="#202124">机制上 TPU 的赌注在这类负载上成立；而在这一组 64 单元的实测里，它没有兑现。</tspan></text>
<text x="702" y="916" class="xxs"><tspan font-weight="700" fill="#202124">⚠️ 1.31 只能当一个点，不能当一个界。</tspan><tspan fill="#9aa0a6">它有两个</tspan><tspan font-weight="700" fill="#202124">方向相反</tspan>的修正，而<tspan font-weight="700" fill="#202124">两个都没量过</tspan>：GB300 侧更好的那组（EP16，882.3）没复测 → 差距可能</text>
<text x="702" y="930" class="xxs">到 <tspan font-weight="700" fill="#202124">1.35</tspan>；P-18 六条边界<tspan font-weight="700" fill="#202124">四条利于 GB300</tspan> → 差距可能更小。最重的两条是<tspan font-weight="700" fill="#202124">「软件成熟度，且会变」</tspan>和<tspan font-weight="700" fill="#202124">「64 是 GPU 的主场」</tspan>。</text>
<text x="1380" y="966" class="xxs" fill="#9aa0a6" text-anchor="end">▶ ＝ 现场念的三行，其余印在这里供课后回查　·　每一行的出处标号就写在同一行里 —— §9 是最容易被单独截走的一节，边界必须跟结论同框</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" role="img" aria-label="六次训练（1、2、4、8、10+ 片和下一档）从 apply 到第 0 步的分段横条：总长约 40 到 50 分钟，几乎不随片数变；每条里蓝段第一遍编译约 20–22 分钟、橙段第二遍约 18–21 分钟。最下面一条是另一次实测在 1 个 cube 上的冷缓存拆解：追踪约 3、降级约 12、XLA 编译约 2 分钟，第二遍再降级约 12、再编译约 2 分钟，共约 35 分钟。" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif' class="chart"><title>按下 apply 到第一步要 40–50 分钟：两大段各约 20 分钟，而且是把同一个程序编了两遍</title><desc>六次训练（1、2、4、8、10+ 片和下一档）从 apply 到第 0 步的分段横条：总长约 40 到 50 分钟，几乎不随片数变；每条里蓝段第一遍编译约 20–22 分钟、橙段第二遍约 18–21 分钟。最下面一条是另一次实测在 1 个 cube 上的冷缓存拆解：追踪约 3、降级约 12、XLA 编译约 2 分钟，第二遍再降级约 12、再编译约 2 分钟，共约 35 分钟。</desc><style>.pt{cursor:default}.pt:hover>*:not(title),.pt:focus>*:not(title){stroke:#202124;stroke-width:2.2}.pt:focus{outline:none}</style><rect width="880" height="520" fill="#fff"/><text x="20.0" y="30.0" font-size="19" fill="#202124" font-weight="700">按下 apply 到第一步要 40–50 分钟：两大段各约 20 分钟，而且是把同一个程序编了两遍</text><text x="20.0" y="52.0" font-size="14" fill="#5f6368">每根横条 = 一次训练从 kubectl apply 到第 0 步完成；灰 = 编组、起 pod、TPU 初始化，</text><text x="20.0" y="74.0" font-size="14" fill="#5f6368">蓝 = 第一遍编译，橙 = 第 0 步输入的切分声明对不上、同一个程序重编一遍（含第 0 步本身）。最下一条把编译拆开看</text><rect x="20" y="89" width="12" height="12" rx="2" fill="#dadce0"/><text x="38.0" y="100.0" font-size="13.5" fill="#202124">编组 + 起 pod + TPU 初始化</text><rect x="246.84000000000003" y="89" width="12" height="12" rx="2" fill="#1a73e8"/><text x="264.8" y="100.0" font-size="13.5" fill="#202124">第一遍编译</text><rect x="354.34000000000003" y="89" width="12" height="12" rx="2" fill="#e8710a"/><text x="372.3" y="100.0" font-size="13.5" fill="#202124">第二遍：同一程序重编 + 第 0 步</text><line x1="601.7" y1="95" x2="615.7" y2="95" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="4 3"/><text x="619.7" y="100.0" font-size="13.5" fill="#202124">虚线框：10+ 片只有总区间、未拆段</text><line x1="150" y1="462" x2="770" y2="462" stroke="#80868b"/><line x1="150.0" y1="122" x2="150.0" y2="462" stroke="#eceff1"/><line x1="150
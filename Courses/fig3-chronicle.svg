<text class="svglbl" x="16" y="473" fill="#7a5000" style="font-size:13px">⭐ 全图落点：三家公司，各自把旋钮拧了一遍 ——&#160;而且拧的过程全写在公开的 config 里</text>
<text class="svgsm" x="16" y="497" fill="#7a5000" style="font-size:15px"><tspan font-weight="700">MiniMax</tspan></text>
<text class="svgsm" x="118" y="497" fill="#7a5000" style="font-size:15px">线性（01）→&#160;<tspan font-weight="700">退回全注意力</tspan>（M2）→&#160;<tspan font-weight="700">稀疏</tspan>（M3）——&#160;三次转向，每次都公开写了为什么</text>
<text class="svgsm" x="16" y="516" fill="#7a5000" style="font-size:15px"><tspan font-weight="700">腾讯混元</tspan></text>
<text class="svgsm" x="118" y="516" fill="#7a5000" style="font-size:15px">Hy3 <tspan font-weight="700">80 层纯 GQA-8</tspan>（连线性都没上）→&#160;Hy4 <tspan font-weight="700">78 层全 Gated DSA</tspan>——&#160;<tspan font-weight="700">跳过线性那一支，直接进稀疏</tspan></text>
<text class="svgsm" x="16" y="535" fill="#7a5000" style="font-size:15px"><tspan font-weight="700">智谱 GLM</tspan></text>
<text class="svgsm" x="118" y="535" fill="#7a5000" style="font-size:15px">5 上 DSA →&#160;5.2 加 <tspan font-weight="700">IndexShare</tspan> →&#160;5.3-Flash <tspan font-weight="700">第一次线性＋稀疏同锅</tspan>——&#160;半年走完三步</text>
<text class="svglbl" x="16" y="571" fill="#174ea6" style="font-size:12px">⭐⭐ 再看一眼第二列：这次补完混元和 GLM，多出来一条原先看不见的线</text>
<text class="svgsm" x="16" y="591" fill="#174ea6" style="font-size:15px">混元 Hy4 的 <tspan font-weight="700">IndexCache</tspan> 和 GLM-5.2 的 <tspan font-weight="700">IndexShare</tspan> 是同一个想法：两家的 <tspan font-weight="700">indexer_types</tspan> 都是 <tspan font-weight="700">full, shared, shared, shared</tspan></text>
<text class="svgsm" x="16" y="613" fill="#174ea6" style="font-size:15px">稳态四层一循环（前几层各家不同）——&#160;每 4 层只有 1 层自己算索引。</text>
<text class="svgsm" x="16" y="635" fill="#174ea6" style="font-size:15px">⭐ 所以稀疏的<tspan font-weight="700">第二阶段</tspan>优化，已经不是「让每个 query 少看几块」，而是<tspan font-weight="700">「别每层都重新算一遍该看谁」</tspan>——&#160;<tspan font-weight="700">索引本身变成了新的开销。</tspan>这是 2026 年才冒出来的一层。</text>
</svg>
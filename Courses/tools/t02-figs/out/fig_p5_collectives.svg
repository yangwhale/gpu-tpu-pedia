<svg viewBox="0 0 1400 914" width="1400" height="914" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四个集合通信原语的来源与拓扑敏感度对照：all-gather、reduce-scatter、all-reduce 都可拆成环形通信，只有 all-to-all 要求任意两点直连">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">四个集合通信原语　—— 分别是<tspan font-weight="700" fill="#1a73e8">谁产生的</tspan>，以及<tspan font-weight="700" fill="#d93025">谁对拓扑敏感</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="37" y="58" class="sm">能拆成「沿环走一圈」</text>
<rect x="174.0" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="191.0" y="58" class="sm">每一对都要直接说话：环形算法要走很多轮</text>
<rect x="431.5" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="448.5" y="58" class="sm">小图里的点＝一张卡，线＝一次通信</text>
<rect x="20" y="128" width="1360" height="38" rx="8" fill="#f1f3f4"/>
<text x="34" y="152" class="lbl" fill="#202124">原语</text>
<text x="244" y="152" class="lbl" fill="#202124">谁产生它（★ ＝ 专题一讲过）</text>
<text x="714" y="152" class="lbl" fill="#202124">通信形状</text>
<text x="1014" y="152" class="lbl" fill="#202124">对拓扑敏感吗</text>
<line x1="20" y1="166" x2="1380" y2="166" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="200" class="box" fill="#1e8e3e">all-gather</text>
<text x="244" y="196" class="xs"><tspan font-weight="700" fill="#202124">★ 专题一「AG-RS」那条路的前半</tspan>：不送 token，改<tspan font-weight="700" fill="#202124">把专家权重取过来</tspan>，在本地算。</text>
<text x="244" y="217" class="xs">取之前要先把切开的权重收齐 —— 这一步就是 all-gather。</text>
<line x1="857.2811529493745" y1="210.29006727063228" x2="875.0547686046607" y2="223.20335492061952" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="879.5547686046607" y1="237.05293083790818" x2="872.7658515273185" y2="257.9470691620918" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="860.9846985779441" y1="266.5065778087482" x2="839.0153014220559" y2="266.5065778087482" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="827.2341484726815" y1="257.9470691620918" x2="820.4452313953393" y2="237.05293083790818" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="824.9452313953393" y1="223.20335492061952" x2="842.7188470506255" y2="210.29006727063228" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<circle cx="850.0" cy="205.0" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="882.3" cy="228.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="870.0" cy="266.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="830.0" cy="266.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="817.7" cy="228.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="850.0" y="297.0" class="xxs" fill="#5f6368" text-anchor="middle">5 个点，5 条边</text>
<text x="1014" y="198" class="xs">一般。<tspan font-weight="700" fill="#202124">拆成「沿环走一圈」就行</tspan> —— 每一跳只跟邻居说话，<tspan font-weight="700" fill="#d93025">torus 上天</tspan></text>
<text x="1014" y="215" class="xs"><tspan font-weight="700" fill="#d93025">然舒服</tspan>。</text>
<rect x="20" y="312" width="1360" height="146" rx="0" fill="#fafafa"/>
<line x1="20" y1="312" x2="1380" y2="312" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="346" class="box" fill="#1e8e3e">reduce-scatter</text>
<text x="244" y="342" class="xs"><tspan font-weight="700" fill="#202124">★ 同一条路的后半</tspan>：本地算完，再<tspan font-weight="700" fill="#202124">一边归约、一边把结果切回各卡</tspan>。</text>
<text x="244" y="363" class="xs"><tspan fill="#9aa0a6">这两行合起来 ＝ 专题一那张表的第二行。</tspan></text>
<line x1="857.2811529493745" y1="356.2900672706323" x2="875.0547686046607" y2="369.2033549206195" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="879.5547686046607" y1="383.0529308379082" x2="872.7658515273185" y2="403.9470691620918" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="860.9846985779441" y1="412.5065778087482" x2="839.0153014220559" y2="412.5065778087482" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="827.2341484726815" y1="403.9470691620918" x2="820.4452313953393" y2="383.0529308379082" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="824.9452313953393" y1="369.2033549206195" x2="842.7188470506255" y2="356.2900672706323" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<circle cx="850.0" cy="351.0" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="882.3" cy="374.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="870.0" cy="412.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="830.0" cy="412.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="817.7" cy="374.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="850.0" y="443.0" class="xxs" fill="#5f6368" text-anchor="middle">5 个点，5 条边</text>
<text x="1014" y="344" class="xs">一般。<tspan font-weight="700" fill="#202124">同样是沿环走一圈</tspan>，只是每跳多做一次加法。</text>
<line x1="20" y1="458" x2="1380" y2="458" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="492" class="box" fill="#1e8e3e">all-reduce</text>
<text x="244" y="488" class="xs"><tspan fill="#9aa0a6">专题一没讲过它 —— 那是一堂推理课，没有反向传播。</tspan></text>
<text x="244" y="509" class="xs">它 ＝ reduce-scatter ＋ all-gather，<tspan font-weight="700" fill="#202124">两圈</tspan>。<tspan font-weight="700" fill="#202124">这里只为把四个凑齐，展开留给专题五。</tspan></text>
<line x1="857.2811529493745" y1="502.2900672706323" x2="875.0547686046607" y2="515.2033549206195" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="879.5547686046607" y1="529.0529308379081" x2="872.7658515273185" y2="549.9470691620919" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="860.9846985779441" y1="558.5065778087483" x2="839.0153014220559" y2="558.5065778087483" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="827.2341484726815" y1="549.9470691620919" x2="820.4452313953393" y2="529.0529308379081" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<line x1="824.9452313953393" y1="515.2033549206195" x2="842.7188470506255" y2="502.2900672706323" stroke="#1e8e3e" stroke-width="1.4" marker-end="url(#aG)"/>
<circle cx="850.0" cy="531.0" r="21.0" fill="none" stroke="#1e8e3e" stroke-width="1.1" stroke-dasharray="4 4"/>
<circle cx="850.0" cy="497.0" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="882.3" cy="520.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="870.0" cy="558.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="830.0" cy="558.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<circle cx="817.7" cy="520.5" r="6.5" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="850.0" y="589.0" class="xxs" fill="#5f6368" text-anchor="middle">5 个点，走两圈</text>
<text x="1014" y="490" class="xs">一般。<tspan font-weight="700" fill="#202124">两圈还是圈</tspan>，拓扑友好度和上面两个一样。</text>
<rect x="20" y="604" width="1360" height="146" rx="0" fill="#fafafa"/>
<rect x="20" y="604" width="1360" height="146" rx="0" fill="#fce8e6"/>
<line x1="20" y1="604" x2="1380" y2="604" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="638" class="box" fill="#d93025">all-to-all</text>
<text x="244" y="634" class="xs"><tspan font-weight="700" fill="#d93025">★ 专题一「Dispatch / Combine」那条路</tspan>：<tspan font-weight="700" fill="#202124">把 token 送到专家那儿</tspan>，算完送回。</text>
<text x="244" y="655" class="xs">而那个专家<tspan font-weight="700" fill="#202124">可能在任意一张卡上</tspan>。<tspan fill="#9aa0a6">—— 和上面 AG-RS 那条是</tspan><tspan font-weight="700" fill="#202124">二选一</tspan>，不是并列。</text>
<line x1="850.0" y1="643.0" x2="882.3359215540352" y2="666.4934221912517" stroke="#d93025" stroke-width="1.1"/>
<line x1="850.0" y1="643.0" x2="869.9846985779441" y2="704.5065778087483" stroke="#d93025" stroke-width="1.1"/>
<line x1="850.0" y1="643.0" x2="830.0153014220559" y2="704.5065778087483" stroke="#d93025" stroke-width="1.1"/>
<line x1="850.0" y1="643.0" x2="817.6640784459648" y2="666.4934221912517" stroke="#d93025" stroke-width="1.1"/>
<line x1="882.3359215540352" y1="666.4934221912517" x2="869.9846985779441" y2="704.5065778087483" stroke="#d93025" stroke-width="1.1"/>
<line x1="882.3359215540352" y1="666.4934221912517" x2="830.0153014220559" y2="704.5065778087483" stroke="#d93025" stroke-width="1.1"/>
<line x1="882.3359215540352" y1="666.4934221912517" x2="817.6640784459648" y2="666.4934221912517" stroke="#d93025" stroke-width="1.1"/>
<line x1="869.9846985779441" y1="704.5065778087483" x2="830.0153014220559" y2="704.5065778087483" stroke="#d93025" stroke-width="1.1"/>
<line x1="869.9846985779441" y1="704.5065778087483" x2="817.6640784459648" y2="666.4934221912517" stroke="#d93025" stroke-width="1.1"/>
<line x1="830.0153014220559" y1="704.5065778087483" x2="817.6640784459648" y2="666.4934221912517" stroke="#d93025" stroke-width="1.1"/>
<circle cx="850.0" cy="643.0" r="6.5" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<circle cx="882.3" cy="666.5" r="6.5" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<circle cx="870.0" cy="704.5" r="6.5" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<circle cx="830.0" cy="704.5" r="6.5" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<circle cx="817.7" cy="666.5" r="6.5" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<text x="850.0" y="735.0" class="xxs" fill="#d93025" text-anchor="middle">5 个点，10 条边</text>
<text x="1014" y="636" class="xs"><tspan font-weight="700" fill="#d93025">极其敏感。</tspan><tspan font-weight="700" fill="#202124">它天生要求「任意两点直接说话」。</tspan>环形算法不是不能用，<tspan font-weight="700" fill="#202124">但</tspan></text>
<text x="1014" y="653" class="xs"><tspan font-weight="700" fill="#202124">要走很多轮，而且代价被 bisection 带宽卡死</tspan> —— <tspan font-weight="700" fill="#202124">这是四个里唯一一</tspan></text>
<text x="1014" y="670" class="xs"><tspan font-weight="700" fill="#202124">个会因为拓扑不同而差出数量级的。</tspan></text>
<rect x="20" y="128" width="1360" height="622" rx="8" fill="none" stroke="#dadce0" stroke-width="1.2"/>
<rect x="20" y="784" width="1360" height="114" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="812" class="sec">一句话记住区别 —— 顺便把 MoE 那件事接上</text>
<text x="38" y="838" class="xs"><tspan font-weight="700" fill="#202124">前三个都能拆成「沿着某个环走一圈」，所以在 torus 上也很舒服。</tspan>只有 all-to-all 天生要求任意两点直接说话 —— <tspan font-weight="700" fill="#d93025">它是唯一一个会因为拓扑不同而表现出数量级差异的原语。</tspan></text>
<text x="38" y="861" class="xs">这就把两件事接上了：<tspan font-weight="700" fill="#202124">为什么 MoE 是 TPU 上最难的那类负载</tspan>，以及<tspan font-weight="700" fill="#202124">为什么分组限制路由不是省算力的技巧，是省拓扑的技巧</tspan> —— 它限制的正是「一个 token 最多能跑到几台机器上去」。</text>
</svg>
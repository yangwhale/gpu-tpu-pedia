<text x="454" y="162" class="xxs" fill="#8430ce">一个 vreg ＝ 8 × 128</text>
<text x="454" y="246" class="xxs" fill="#5f6368">1024 个 32 位数 ＝ 4 KiB</text>
<text x="304" y="266" class="xs"><tspan font-weight="700" fill="#202124">64 × 8 × 128 × 4 B ＝ 256 KiB</tspan>，这就是一个核全部的</text>
<text x="304" y="283" class="xs">向量寄存器。</text>
<text x="304" y="306" class="xs"><tspan font-weight="700" fill="#d93025">没有「VPU 专用」和「MXU 专用」之分</tspan> —— 六十四个是一</text>
<text x="304" y="323" class="xs">个池子，编译器随便挑。</text>
<text x="304" y="366" class="xxs" fill="#9aa0a6">（v5p 是 64 个；v4 只有 32 个）</text>
<rect x="676" y="118" width="704" height="124" rx="9" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="692" y="142" class="box" fill="#1e8e3e">VPU　·　逐元素</text>
<text x="692" y="162" class="xs">每个 (lane, sublane) 位置上有 <tspan font-weight="700" fill="#202124">4 个互相独立的 ALU</tspan> —— <tspan font-weight="700" fill="#202124">8 × 128 × 4 ＝ 4096 个</tspan>，书里那个数就是这么来的。</text>
<text x="692" y="183" class="xs"><tspan font-weight="700" fill="#202124">一条指令吃的是两个完整 vreg</tspan>，写出第三个。每周期发 <tspan font-weight="700" fill="#202124">4 条</tspan>，而且 <tspan font-weight="700" fill="#202124">4 条可以各干各的</tspan>（vadd、vsub 同时跑）。</text>
<line x1="618" y1="180.0" x2="670" y2="180.0" stroke="#1e8e3e" stroke-width="1.8" marker-end="url(#aG)"/>
<rect x="676" y="254" width="704" height="58" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="692" y="278" class="box" fill="#d93025">MXU　·　矩阵乘</text>
<text x="692" y="298" class="xs">书里这句是原话：vreg「<tspan font-weight="700" fill="#202124">hold data for the VPU and MXU</tspan>」—— <tspan font-weight="700" fill="#202124">同一批寄存器，两个用户</tspan>。喂进去的 LHS 正好是 8 × 128。</text>
<line x1="618" y1="283.0" x2="670" y2="283.0" stroke="#d93025" stroke-width="1.8" marker-end="url(#aR)"/>
<rect x="676" y="324" width="704" height="56" rx="9" fill="#e0f2f0" stroke="#12786f" stroke-width="1.4"/>
<text x="692" y="348" class="box" fill="#12786f">XLU　·　跨 lane</text>
<text x="692" y="368" class="xs">横着走唯一的门。书里说要跨 lane，<tspan font-weight="700" fill="#202124">至少得过一趟 VMEM／XLU／SMEM</tspan> —— <tspan font-weight="700" fill="#202124">出了寄存器堆再回来</tspan>。</text>
<line x1="618" y1="352.0" x2="670" y2="352.0" stroke="#12786f" stroke-width="1.8" marker-end="url(#aK)"/>
<rect x="20" y="410" width="1360" height="104" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="38" y="438" class="sec">⭐ 于是「横着走为什么贵」有了一个更准的说法</text>
<text x="38" y="464" class="xs"><tspan font-weight="700" fill="#202124">不是「列与列之间没有连线」</tspan> —— 那是想当然。真正的差别是<tspan font-weight="700" fill="#202124">要不要出这个盒子</tspan>：纵向那三步 shuffle 在 ALU 里就地完成，数没离开 vreg；横向要跨 lane，就得<tspan font-weight="700" fill="#202124">把整个 vreg 交出去、绕一趟、再收回来</tspan>。</text>
<text x="38" y="487" class="sm" fill="#202124"><tspan font-weight="700" fill="#d93025">贵的是这趟往返，不是那一次加法。</tspan></text>
<rect x="20" y="530" width="1360" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="556" class="sec" fill="#1a73e8">⭐ 换算成 GPU 的词：书里给了一组对照</text>
<text x="38" y="582" class="xs"><tspan font-weight="700" fill="#202124">VPU 里的一个 ALU ≈ 一个 CUDA core</tspan>；<tspan font-weight="700" fill="#202124">VPU 的一条 lane ≈ 一个 warp scheduler</tspan>（就是那组通常 32 个 CUDA core 一起做 SIMD 的单位）。两边差的不是「有没有这些东西」，是<tspan font-weight="700" fill="#202124">谁在运行时挑活</tspan> —— 这正是 3.2 开头那张图右边一栏说的事。</text>
<rect x="20" y="622" width="1360" height="84" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="648" class="sec">⚠️ 这张图讲的是结构，不是 v7 的规格表</text>
<text x="38" y="674" class="xs">上面每个数（64 个 vreg、每位置 4 个 ALU、每周期 4 条指令、VMEM 每周期 3 读 1 写）<tspan font-weight="700" fill="#202124">都出自公开资料，而书里标的是 v5p</tspan> —— 它自己就说了 v4 只有 32 个 vreg，<tspan font-weight="700" fill="#202124">所以这些数会跨代变</tspan>。<tspan font-weight="700" fill="#202124">v7 没有同口径的公开数，别把这张图当 v7 的规格表用。</tspan></text>
</svg>
<svg viewBox="0 0 1400 726" width="1400" height="726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TPU 核内的向量寄存器堆是 VPU、MXU、XLU 共用的：不是每个单元一套寄存器，也不是挂在一条总线上">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230"><rect width="960" height="230" fill="#fff"/>
<text x="480" y="30" font-family="Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">FSDP 拉满、EP=1 不优化时：搬权重的时间明显多于算 [推断]</text>
<text x="178" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">搬</text>
<rect x="190" y="60" width="560" height="38" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="202" y="86" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124">前向 AG + 反向 AG + 梯度 RS（按微基准 AG 带宽估）</text>
<text x="178" y="148" font-family="Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">算</text>
<rect x="190" y="120" width="280" height="38" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="202" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#202124">模型 FLOPs ÷ 峰值</text>
<text x="20" y="200" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5f6368">示意图，条长不按比例；实测 AG 与估算同一量级，估算没有离谱。</text>
</svg>

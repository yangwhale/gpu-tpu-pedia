</g>
<g>
<rect x="30.0" y="293.0" width="300.0" height="28.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="180.0" y="311.7" font-size="13" fill="#202124" text-anchor="middle">shard 2 的 logits</text>
</g>
<g>
<rect x="30.0" y="327.0" width="300.0" height="28.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />

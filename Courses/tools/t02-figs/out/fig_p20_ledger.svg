<rect x="38" y="166" width="4" height="56" rx="2" fill="#d93025"/>
<text x="52" y="187" class="lbl" fill="#202124">2,700 / 5,400</text>
<rect x="224" y="175" width="44" height="16" rx="7" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="246" y="187" class="xxs" fill="#d93025" text-anchor="middle">编的</text>
<text x="52" y="204" class="xxs" fill="#5f6368">GB300 的 BF16 / FP8 峰值</text>

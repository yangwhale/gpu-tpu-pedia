<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：调度器按估计表决定 start 提前多少。表准时 start 到 done 之间的计算刚好盖住通信；估长了 start 发得太早，buffer 多活、占住车道，更急的通信排队暴露；估短了 start 发得太晚，done 处干等。">

<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="34.0" font-size="20" fill="#202124" text-anchor="middle" font-weight="bold">表一旧，窗口就错位：估长了发太早，估短了发太晚</text>
<text x="450.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="middle">调度器没有时钟，只按估计表决定 start 提前多少；虚框是表里以为的通信长度，实框是真实长度。示意，无刻度</text>
<rect x="560.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="582.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">计算</text>

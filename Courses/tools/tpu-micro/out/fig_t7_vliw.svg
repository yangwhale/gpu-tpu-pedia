<text x="20" y="26" class="ttl">延迟怎么被藏起来　—— 班表在编译期就排好了，跑的时候改不了</text>
<rect x="1259" y="10" width="121" height="22" rx="11" fill="#d93025"/>
<text x="1319.5" y="25" class="lbl" fill="#fff" text-anchor="middle">第 7 / 8 张</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">标量：发 DMA、算地址</text>
<rect x="176.3" y="48" width="11" height="11" rx="2" fill="#12786f"/>
<text x="193.3" y="58" class="sm">向量：VPU</text>
<rect x="268.775" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="285.775" y="58" class="sm">矩阵：MXU</text>
<rect x="361.25" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="378.25" y="58" class="sm">杂项</text>
<rect x="423.25" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="440.25" y="58" class="sm">灰色 ＝ 这一拍这个槽是空的（NOP）</text>
<text x="20" y="110" class="sec">一个 VLIW 指令包 ＝ 一拍要干的所有事，打成一包</text>
<text x="20" y="130" class="xs">没有乱序、没有记分板 —— <tspan font-weight="700" fill="#202124">哪条指令在第几拍发、发给哪个单元，全部写死在指令流里</tspan>。</text>
<rect x="20" y="146" width="62" height="42" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="51" y="172" class="lbl" fill="#1a73e8" text-anchor="middle">标量</text>
<rect x="88" y="146" width="62" height="42" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="119" y="172" class="lbl" fill="#1a73e8" text-anchor="middle">标量</text>
<rect x="170" y="146" width="62" height="42" rx="5" fill="#e0f2f0" stroke="#12786f" stroke-width="1.6"/>
<text x="201" y="172" class="lbl" fill="#12786f" text-anchor="middle">向量</text>
<rect x="238" y="146" width="62" height="42" rx="5" fill="#e0f2f0" stroke="#12786f" stroke-width="1.6"/>
<text x="269" y="172" class="lbl" fill="#12786f" text-anchor="middle">向量</text>
<rect x="306" y="146" width="62" height="42" rx="5" fill="#e0f2f0" stroke="#12786f" stroke-width="1.6"/>
<text x="337" y="172" class="lbl" fill="#12786f" text-anchor="middle">向量</text>
<rect x="374" y="146" width="62" height="42" rx="5" fill="#e0f2f0" stroke="#12786f" stroke-width="1.6"/>
<text x="405" y="172" class="lbl" fill="#12786f" text-anchor="middle">向量</text>
<rect x="456" y="146" width="62" height="42" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="487" y="172" class="lbl" fill="#1e8e3e" text-anchor="middle">矩阵</text>
<rect x="524" y="146" width="62" height="42" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="555" y="172" class="lbl" fill="#1e8e3e" text-anchor="middle">矩阵</text>
<rect x="606" y="146" width="62" height="42" rx="5" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="637" y="172" class="lbl" fill="#f9ab00" text-anchor="middle">杂项</text>
<rect x="688" y="146" width="152" height="42" rx="5" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="764" y="172" class="lbl" fill="#5f6368" text-anchor="middle">立即数 ×6</text>
<rect x="856" y="146" width="176" height="42" rx="5" fill="#fff" stroke="#202124" stroke-width="1.6"/>
<text x="944" y="166" class="box" fill="#202124" text-anchor="middle">合计 322 bit</text>
<text x="944" y="181" class="xxs" text-anchor="middle">TPU v2 / v3，公开论文</text>
<text x="20" y="202" class="xs"><tspan fill="#9aa0a6">这张槽位构成是 TPU v2 / v3 论文里的公开数字。</tspan><tspan font-weight="700" fill="#202124">v7 的 bundle 宽度和槽位构成，官方没有公开</tspan>（内部 ISA 定义里见到过 64 B 和 74 B 两种，但我没能确认</text>
<text x="20" y="217" class="xs">哪一份对应 v7，所以不写进图里）。这里画它，是因为<tspan font-weight="700" fill="#d93025">「一拍多槽、由编译器填」这个结构本身跨代没变</tspan>，变的只是每种槽有几个。</text>
<text x="20" y="298" class="sec">同一段依赖，编译器怎么排　—— 示意，不是实测 trace</text>
<line x1="116.0" y1="320" x2="116.0" y2="478" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="592.0" y1="320" x2="592.0" y2="478" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="354.0" y="314" class="xxs" fill="#5f6368" text-anchor="middle">DMA 在飞的这几拍，矩阵槽只能空着 —— 编译器要么找到别的活填进来，要么认了</text>
<text x="150.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">0</text>
<text x="218.0" y="332" class="xxs" fill="#9aa0a6" text-anchor="middle">1</text>

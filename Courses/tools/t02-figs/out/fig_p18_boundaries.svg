<svg viewBox="0 0 1400 610" width="1400" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六条不能拿 1.31 倍这个结论说的话，每条都标出它把倍数往哪一边推：四条利于 GB300，两条利于 TPU v7">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">不能拿它说的话　—— <tspan font-weight="700" fill="#d93025">六条，每条都标出它往哪边推</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">这一条把倍数推高（利于 GB300）· 共 4 条</text>
<rect x="289.57500000000005" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="306.57500000000005" y="58" class="sm">这一条把倍数压低（利于 TPU v7）· 共 2 条</text>
<rect x="565.475" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="582.475" y="58" class="sm">底带那条没有方向 —— 它是适用范围，不是偏置</text>
<rect x="20.0" y="128" width="444.0" height="150" rx="9" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<rect x="20.0" y="128" width="444.0" height="30" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<rect x="20.0" y="148" width="444.0" height="10" rx="0" fill="#fce8e6"/>
<text x="34.0" y="149" class="box" fill="#d93025">①</text>
<text x="56.0" y="149" class="lbl" fill="#202124">global batch 不一样</text>
<rect x="356.8" y="168" width="95.2" height="22" rx="11" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="404.4" y="183" class="xxs" fill="#d93025" text-anchor="middle">→ 利于 GB300</text>
<text x="34.0" y="206" class="xxs"><tspan font-weight="700" fill="#202124">问①</tspan> GB300 每步 <tspan font-weight="700" fill="#202124">2,048</tspan> 条序列，v7 等效 <tspan font-weight="700" fill="#202124">1,536</tspan>；<tspan font-weight="700" fill="#202124">问②</tspan> 更悬殊 —— <tspan font-weight="700" fill="#202124">4,096</tspan> 对 <tspan font-weight="700" fill="#202124">1,408</tspan>，差 <tspan font-weight="700" fill="#202124">2.</tspan></text>
<text x="34.0" y="220" class="xxs"><tspan font-weight="700" fill="#202124">9 倍</tspan>。<tspan fill="#9aa0a6">大 batch 摊薄固定开销。但 v7 的 batch 是被 </tspan><tspan font-weight="700" fill="#202124">94.74 GiB</tspan> 顶住的，不是被让的 —</text>
<text x="34.0" y="234" class="xxs">— 这一条本身就是硬件差异。</text>
<rect x="478.0" y="128" width="444.0" height="150" rx="9" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<rect x="478.0" y="128" width="444.0" height="30" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<rect x="478.0" y="148" width="444.0" height="10" rx="0" fill="#fce8e6"/>
<text x="492.0" y="149" class="box" fill="#d93025">②</text>
<text x="514.0" y="149" class="lbl" fill="#202124">64 这个规模是 GPU 的主场</text>
<rect x="814.8" y="168" width="95.2" height="22" rx="11" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="862.4" y="183" class="xxs" fill="#d93025" text-anchor="middle">→ 利于 GB300</text>
<text x="492.0" y="206" class="xxs"><tspan font-weight="700" fill="#202124">GB300 的 64 张卡全在一个 NVL72 域内</tspan>（域内没有「距离」），v7 是 4x4x4 环面（对角</text>
<text x="492.0" y="220" class="xxs">要绕好几跳）。<tspan fill="#9aa0a6">而这个模型吃的正是 </tspan><tspan font-weight="700" fill="#202124">all-to-all</tspan> —— 第 4 节论证过它是唯一在两种拓扑上</text>
<text x="492.0" y="234" class="xxs"><tspan font-weight="700" fill="#202124">表现分岔</tspan>的原语，而 TPU 的账要过了 72 颗才开始好看。</text>
<rect x="936.0" y="128" width="444.0" height="150" rx="9" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<rect x="936.0" y="128" width="444.0" height="30" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<rect x="936.0" y="148" width="444.0" height="10" rx="0" fill="#fce8e6"/>
<text x="950.0" y="149" class="box" fill="#d93025">③</text>
<text x="972.0" y="149" class="lbl" fill="#202124">重算策略不是同一件事</text>
<rect x="1272.8" y="168" width="95.2" height="22" rx="11" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="1320.4" y="183" class="xxs" fill="#d93025" text-anchor="middle">→ 利于 GB300</text>
<text x="950.0" y="206" class="xxs">两边图脚都写「不落盘 checkpoint」，<tspan font-weight="700" fill="#202124">但那说的是不写盘，不是不重算</tspan>。<tspan fill="#9aa0a6">GB300 侧重算</tspan><tspan font-weight="700" fill="#202124">全关</tspan></text>
<text x="950.0" y="220" class="xxs">（吃到 230 / 288 GB）；v7 侧 <tspan class="mono" fill="#1967d2">remat_policy=custom</tspan> + offload（91.94 / 94.74 </text>
<text x="950.0" y="234" class="xxs">GiB）。<tspan font-weight="700" fill="#202124">关重算本身就值 +5.2%。</tspan></text>
<rect x="20.0" y="294" width="444.0" height="150" rx="9" fill="#fff" stroke="#d93025" stroke-width="1.6"/>
<rect x="20.0" y="294" width="444.0" height="30" rx="9" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<rect x="20.0" y="314" width="444.0" height="10" rx="0" fill="#fce8e6"/>
<text x="34.0" y="315" class="box" fill="#d93025">④</text>
<text x="56.0" y="315" class="lbl" fill="#202124">两边软件成熟度差很多</text>
<rect x="310.0" y="334" width="142.0" height="22" rx="11" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="381.0" y="349" class="xxs" fill="#d93025" text-anchor="middle">→ 利于 GB300 · 且会变</text>
<text x="34.0" y="372" class="xxs"><tspan font-weight="700" fill="#202124">这一条是整节结论最重要的边界，所以必须在清单里而不只在 P-16 里。</tspan><tspan fill="#9aa0a6">如果差距和软件有关，</tspan></text>
<text x="34.0" y="386" class="xxs"><tspan fill="#9aa0a6">那么</tspan><tspan font-weight="700" fill="#202124">软件会变</tspan> —— 这组数是 2026 年 8 月那两套栈的状态，不是硬件属性。<tspan font-weight="700" fill="#202124">换个季度重测，</tspan></text>
<text x="34.0" y="400" class="xxs"><tspan font-weight="700" fill="#202124">第一个动的就是它。</tspan></text>
<rect x="478.0" y="294" width="444.0" height="150" rx="9" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<rect x="478.0" y="294" width="444.0" height="30" rx="9" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<rect x="478.0" y="314" width="444.0" height="10" rx="0" fill="#e6f4ea"/>
<text x="492.0" y="315" class="box" fill="#1e8e3e">⑤</text>
<text x="514.0" y="315" class="lbl" fill="#202124">v7 那 662.3 含一个频率档</text>
<rect x="831.6" y="334" width="78.4" height="22" rx="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="870.8" y="349" class="xxs" fill="#1e8e3e" text-anchor="middle">→ 利于 v7</text>
<text x="492.0" y="372" class="xxs"><tspan class="mono" fill="#1967d2">dvfs_p_state=7</tspan> 把频率锁到最高，单独值 <tspan font-weight="700" fill="#202124">+8.6%</tspan>；<tspan font-weight="700" fill="#202124">第 6 节的口径认为它属于硬件工作点，</tspan></text>
<text x="492.0" y="386" class="xxs"><tspan font-weight="700" fill="#202124">不算调优</tspan>。<tspan fill="#9aa0a6">GB300 侧没动过等价旋钮。</tspan><tspan font-weight="700" fill="#202124">这一条对我们自己不利，是我们自己的数。</tspan></text>
<rect x="936.0" y="294" width="444.0" height="150" rx="9" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<rect x="936.0" y="294" width="444.0" height="30" rx="9" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<rect x="936.0" y="314" width="444.0" height="10" rx="0" fill="#e6f4ea"/>
<text x="950.0" y="315" class="box" fill="#1e8e3e">⑥</text>
<text x="972.0" y="315" class="lbl" fill="#202124">「每芯片对每 GPU」已经是最优待</text>
<rect x="1289.6" y="334" width="78.4" height="22" rx="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="1328.8" y="349" class="xxs" fill="#1e8e3e" text-anchor="middle">→ 利于 v7</text>
<text x="950.0" y="372" class="xxs">v7 一颗 chip 是 <tspan font-weight="700" fill="#202124">2 个 device</tspan>，GB300 一张卡是 1 个。<tspan fill="#9aa0a6">按 device 比就是「1 颗 v7 </tspan></text>
<text x="950.0" y="386" class="xxs"><tspan fill="#9aa0a6">die 对 1 整张 GB300」，那样 v7 更吃亏 —— </tspan><tspan font-weight="700" fill="#202124">本课选的这个口径，已经是 v7 能拿到的最</tspan></text>
<text x="950.0" y="400" class="xxs"><tspan font-weight="700" fill="#202124">好的一个。</tspan>见 P-12 乙格。</text>
<rect x="20" y="470" width="1360" height="116" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="38" y="498" class="sec">⚠️ 还有第七条，它没有方向 —— 只有一个模型、一个规模。而第 7 节说过「三张图之后你会发现它是硬约束」，所以这里得演示它会怎么动</text>
<text x="38" y="524" class="xs"><tspan font-weight="700" fill="#202124">把规模从 64 推到 72 以上，这个倍数会往哪边动，第 4 节已经答过：</tspan><tspan fill="#9aa0a6">GB300 一侧要</tspan><tspan font-weight="700" fill="#202124">跨出 NVLink 域</tspan>，all-to-all 从「域内无距离」变成「过交换机、过网卡」；v7 的环面则<tspan font-weight="700" fill="#202124">继续线性延伸</tspan>，没有这个台阶。<tspan font-weight="700" fill="#202124">这一节测的 64，正好停在那个分岔点之前。</tspan></text>
<text x="38" y="545" class="xs"><tspan fill="#9aa0a6">所以「只有一个规模」不是客气话：</tspan><tspan font-weight="700" fill="#202124">它是这组数唯一一条我们能预判方向、却没有数据的边界</tspan> —— 而预判的方向恰好和上面那六条相反。<tspan font-weight="700" fill="#202124">要推翻这一节最省事的办法，不是质疑这 64 个单元上的任何一个数字，是去测 128 个。</tspan></text>
<text x="1380" y="598" class="xxs" fill="#9aa0a6" text-anchor="end">这一张是 P-17 的续页 —— 讲课时先放 P-17 让台下自己说，再放这一张对答案</text>
</svg>
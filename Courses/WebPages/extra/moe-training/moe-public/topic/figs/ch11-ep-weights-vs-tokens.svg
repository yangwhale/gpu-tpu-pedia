<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：EP=1，每个 device 存每个专家的一片，每层把专家权重 all-gather 到所有 device，量随专家参数走、与 token 数无关。右：EP&gt;1，每个 device 存整个专家，token 要 all-to-all 送去专家所在的 device 再送回来，前向 dispatch 加 combine、反向再各一次，量随 token 数乘 top-k 乘 hidden，最忙的 device 决定时长。"><title>左：EP=1，每个 device 存每个专家的一片，每层把专家权重 all-gather 到所有 device，量随专家参数走、与 token 数无关。右：EP&gt;1，每个 device 存整个专家，token 要 all-to-all 送去专家所在的 device 再送回来，前向 dispatch 加 combine、反向再各一次，量随 token 数乘 top-k 乘 hidden，最忙的 device 决定时长。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="470" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">换不换 EP，比的是搬什么：EP=1 搬权重，EP&gt;1 搬 token</text>

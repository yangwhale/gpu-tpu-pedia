<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" width="900" height="362" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="上半部分是一整步的时间条：已经是 FP8 的稠密乘法只占约 6%，打满峰值后整步最多快 1 到 2%；量化本身约 4%。下半部分：BF16 每个数搬 2 字节，FP8 搬 1 字节外加每列一个 scale，约一半。">
<title>FP8 的收益不在乘法上：稠密乘法只占整步约 6%，省的是搬运字节</title>
<defs><marker id="ar-5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ar-1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="ar-e8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ar-d93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar-188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar-202124" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d93025" stroke-width="2"/></pattern><pattern id="hatchg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bdc1c6" stroke-width="2"/></pattern></defs>
<rect width="900" height="362" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">FP8 的收益不在乘法上：稠密乘法只占整步约 6%，省的是搬运字节</text>
<text x="24" y="58" font-size="14" fill="#5f6368">示意（按比例）。上：一整步的时间条；下：all-gather 时每个数要搬几个字节</text>
<text x="60.0" y="96.0" font-size="14" fill="#5f6368" text-anchor="start">一整步</text>
<rect x="60.0" y="104.0" width="780.0" height="36.0" rx="2" fill="#f1f3f4" stroke="#dadce0" stroke-width="1"/>
<rect x="60.0" y="104.0" width="46.8" height="36.0" rx="0" fill="#1a73e8"/>
<rect x="97.4" y="104.0" width="9.4" height="36.0" rx="0" fill="url(#hatch)"/>
<rect x="106.8" y="104.0" width="31.2" height="36.0" rx="0" fill="#188038"/>
<text x="154.0" y="127.0" font-size="14" fill="#5f6368" text-anchor="start">其余：专家 GMM、注意力、通信等待……</text>
<path d="M83.4,140 V164" stroke="#1a73e8" stroke-width="1.5" fill="none"/>
<text x="60.0" y="184.0" font-size="14" fill="#174ea6" text-anchor="start" font-weight="700">稠密乘法（dot_general）约 6%，已到峰值约八成</text>
<text x="60.0" y="204.0" font-size="14" fill="#d93025" text-anchor="start">打满峰值 → 整步最多再快 1–2%</text>
<path d="M122.4,140 V154 H470 V164" stroke="#188038" stroke-width="1.5" fill="none"/>
<text x="470.0" y="184.0" font-size="14" fill="#0d652d" text-anchor="start" font-weight="700">量化本身 约 4%</text>
<text x="60.0" y="246.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">all-gather 每个数搬几个字节</text>
<text x="60.0" y="282.0" font-size="14" fill="#5f6368" text-anchor="start">BF16</text>
<rect x="150.0" y="264.0" width="42.0" height="28.0" rx="2" fill="#e8710a"/>
<rect x="196.0" y="264.0" width="42.0" height="28.0" rx="2" fill="#e8710a"/>
<text x="250.0" y="283.0" font-size="14" fill="#b06000" text-anchor="start">2 字节</text>
<text x="60.0" y="324.0" font-size="14" fill="#5f6368" text-anchor="start">FP8</text>
<rect x="150.0" y="306.0" width="42.0" height="28.0" rx="2" fill="#e8710a"/>
<rect x="196.0" y="306.0" width="5.0" height="28.0" rx="1" fill="#5f6368"/>
<text x="212.0" y="325.0" font-size="14" fill="#b06000" text-anchor="start">1 字节 ＋ 每列一个 scale（摊到 K 个数上）≈ 一半</text>
<rect x="560.0" y="268.0" width="4.0" height="26.0" rx="0" fill="#e8710a"/>
<text x="574.0" y="286.0" font-size="14" fill="#202124" text-anchor="start">收益在这里：AG 字节减半</text>
</svg>
# 05-slice.yaml —— §5.3 手动（BYO）Slice 模板。__X__ 占位由 05-list-partitions.sh --emit 填，或手填。
# 出处：字段与注解取自 GA 用户指南与线上对象。
# 规则：name ≤49 字符、^[a-z]([-a-z0-9]*[a-z0-9])?$；topology 每维 4 的倍数且非降序；partitionIds 个数 = A×B×C/64、不重复。
apiVersion: accelerator.gke.io/v1beta1
kind: Slice
metadata:
  name: __NAME__
  annotations:
    slice.gke.io/retry-on-failure: "true"     # 只对「创建期校验失败」自动重试
spec:
  type: tpu7x
  topology: __TOPOLOGY__
  partitionIds:
  - __PARTITION_IDS__

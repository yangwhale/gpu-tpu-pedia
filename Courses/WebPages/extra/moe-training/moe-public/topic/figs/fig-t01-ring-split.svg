<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"><rect width="960" height="470" fill="#fff"/>
<text x="480" y="30" font-family="Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">为什么拓扑能差一半：一根 8 节点物理环轴，整条给一个逻辑轴 vs 切给两个逻辑轴（2×4）</text>
<text x="40" y="72" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="start" fill="#202124" font-weight="bold">① 整条给一个大小为 8 的逻辑轴</text>
<line x1="180" y1="110" x2="265" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="265" y1="110" x2="350" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="350" y1="110" x2="435" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="435" y1="110" x2="520" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="520" y1="110" x2="605" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="605" y1="110" x2="690" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<line x1="690" y1="110" x2="775" y2="110" stroke="#1e8e3e" stroke-width="3"/>
<path d="M775,125 C775,180 180,180 180,125" fill="none" stroke="#1e8e3e" stroke-width="3"/>
<circle cx="180" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="180" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">0</text>
<circle cx="265" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="265" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">1</text>
<circle cx="350" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="350" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">2</text>
<circle cx="435" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="435" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">3</text>
<circle cx="520" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="520" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">4</text>
<circle cx="605" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="605" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">5</text>
<circle cx="690" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="690" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">6</text>
<circle cx="775" cy="110" r="15" fill="#fff" stroke="#202124" stroke-width="1.5"/>
<text x="775" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">7</text>
<text x="480" y="190" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#1e8e3e">环绕链路 7→0 也归这一组：首尾相接成环，两个方向都能跑满</text>
<text x="40" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="start" fill="#202124" font-weight="bold">② 切成 2×4：内层逻辑轴 4（连续 4 个节点），外层逻辑轴 2（隔 4 格配对）</text>
<line x1="180" y1="330" x2="265" y2="330" stroke="#1a73e8" stroke-width="3"/>
<line x1="265" y1="330" x2="350" y2="330" stroke="#1a73e8" stroke-width="3"/>
<line x1="350" y1="330" x2="435" y2="330" stroke="#1a73e8" stroke-width="3"/>
<line x1="520" y1="330" x2="605" y2="330" stroke="#e37400" stroke-width="3"/>
<line x1="605" y1="330" x2="690" y2="330" stroke="#e37400" stroke-width="3"/>
<line x1="690" y1="330" x2="775" y2="330" stroke="#e37400" stroke-width="3"/>
<line x1="435" y1="330" x2="520" y2="330" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M775,345 C775,400 180,400 180,345" fill="none" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M180,315 C180,245 520,245 520,315" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3"/>
<path d="M265,315 C265,270 605,270 605,315" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="3 3"/>
<text x="350.0" y="258" font-family="Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="middle" fill="#d93025">外层组 0↔4</text>
<text x="627" y="300" font-family="Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="start" fill="#d93025">外层组 1↔5</text>
<circle cx="180" cy="330" r="15" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="180" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">0</text>
<circle cx="265" cy="330" r="15" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="265" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">1</text>
<circle cx="350" cy="330" r="15" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="350" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">2</text>
<circle cx="435" cy="330" r="15" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="435" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">3</text>
<circle cx="520" cy="330" r="15" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
<text x="520" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">4</text>
<circle cx="605" cy="330" r="15" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
<text x="605" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">5</text>
<circle cx="690" cy="330" r="15" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
<text x="690" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">6</text>
<circle cx="775" cy="330" r="15" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
<text x="775" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle" fill="#202124">7</text>
<path d="M265,354 L265,362 L520,362 L520,354" fill="none" stroke="#d93025" stroke-width="1.5"/>
<text x="392.5" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="middle" fill="#d93025">0↔4 与 1↔5 走同一段链路</text>
<text x="480" y="418" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" text-anchor="middle" fill="#202124">内层组 {0–3}、{4–7} 各拿到一段、没有环绕（灰虚线不归它们用），成了一条线；外层组成员隔 4 格，几组共用同一段链路</text>
<text x="480" y="440" font-family="Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="middle" fill="#5f6368">示意图，只画一根轴；JAX 建 mesh 默认不许这样切（allow_split_physical_axes=False），理由是会降低总可用带宽</text>
</svg>
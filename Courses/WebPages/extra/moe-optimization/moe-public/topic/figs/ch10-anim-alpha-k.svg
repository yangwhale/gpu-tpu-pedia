<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 429" width="900" height="429" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：三行分别是每步跨 DCN 集合通信 1 次、20 次、160 次的通信耗时。灰色是带宽项，三行一样长；红色是每次一笔的固定延迟，随 α 从 0.2 ms 涨到 1 ms 一起变长。K=1 几乎看不出变化，K=20 长约 15%，K=160 约翻一倍。">
<title>示意动图：三行分别是每步跨 DCN 集合通信 1 次、20 次、160 次的通信耗时。灰色是带宽项，三行一样长；红色是每次一笔的固定延迟，随 α 从 0.2 ms 涨到 1 ms 一起变长。K=1 几乎看不出变化，K=20 长约 15%，K=160 约翻一倍。</title>
<defs><style>@keyframes k1{0.000%{opacity:1} 10.000%{opacity:1} 10.010%{opacity:0.0} 100.000%{opacity:0.0}}
.a02{animation:k1 10.0s linear infinite;}
@keyframes k2{0.000%{opacity:0.0} 9.990%{opacity:0.0} 10.000%{opacity:1} 70.000%{opacity:1} 70.010%{opacity:0.0} 100.000%{opacity:0.0}}
.amid{animation:k2 10.0s linear infinite;}
@keyframes k3{0.000%{opacity:0.0} 69.990%{opacity:0.0} 70.000%{opacity:1} 100.000%{opacity:1}}
.a1{animation:k3 10.0s linear infinite;}
@keyframes k4{0.000%{transform:scaleX(0.2)} 10.000%{transform:scaleX(0.2)} 70.000%{transform:scaleX(1.0)} 100.000%{transform:scaleX(1.0)}}
.r0{animation:k4 10.0s linear infinite;transform-box:fill-box;transform-origin:left center;}
@keyframes k5{0.000%{opacity:0.3} 69.990%{opacity:0.3} 70.000%{opacity:1} 100.000%{opacity:1}}
.p0{animation:k5 10.0s linear infinite;}
@keyframes k6{0.000%{transform:scaleX(0.2)} 10.000%{transform:scaleX(0.2)} 70.000%{transform:scaleX(1.0)} 100.000%{transform:scaleX(1.0)}}
.r1{animation:k6 10.0s linear infinite;transform-box:fill-box;transform-origin:left center;}
@keyframes k7{0.000%{opacity:0.3} 69.990%{opacity:0.3} 70.000%{opacity:1} 100.000%{opacity:1}}
.p1{animation:k7 10.0s linear infinite;}
@keyframes k8{0.000%{transform:scaleX(0.2)} 10.000%{transform:scaleX(0.2)} 70.000%{transform:scaleX(1.0)} 100.000%{transform:scaleX(1.0)}}
.r2{animation:k8 10.0s linear infinite;transform-box:fill-box;transform-origin:left center;}
@keyframes k9{0.000%{opacity:0.3} 69.990%{opacity:0.3} 70.000%{opacity:1} 100.000%{opacity:1}}
.p2{animation:k9 10.0s linear infinite;}
@media (prefers-reduced-motion: reduce) { * { animation: none !important } .a02{opacity:0.0} .amid{opacity:0.0} .a1{opacity:1} .r0{transform:scaleX(1.0)} .p0{opacity:1} .r1{transform:scaleX(1.0)} .p1{opacity:1} .r2{transform:scaleX(1.0)} .p2{opacity:1} }</style></defs>
<rect x="0" y="0" width="900" height="429" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">跨 zone 的 1 ms 怕不怕，看 K：每步跨 DCN 的集合通信越多，固定延迟被乘得越大</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意，无刻度（理论估算）。T ＝ K·2α ＋ M_shard / B；三行带宽项相同，α 从 0.2 ms 涨到 1 ms</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#5f6368" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">带宽项 M_shard / B</text>
<rect x="197.7" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="225.7" y="85.0" font-size="14" fill="#202124">延迟项 K·2α</text>
<text x="200.0" y="125.0" font-size="15" fill="#202124" font-weight="700">α ＝</text>
<text x="240.0" y="125.0" font-size="15" fill="#d93025" font-weight="700" class="a02">0.2 ms</text>
<text x="240.0" y="125.0" font-size="15" fill="#d93025" font-weight="700" class="a1">1 ms</text>
<text x="240.0" y="125.0" font-size="15" fill="#d93025" font-weight="700" class="amid">0.2 → 1 ms</text>
<text x="350.0" y="125.0" font-size="13" fill="#5f6368">（竖线＝α ＝ 0.2 ms 时的长度）</text>
<text x="20.0" y="177.0" font-size="16" fill="#202124" font-weight="700">K = 1</text>
<g>
<rect x="200.0" y="159.0" width="195.0" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="297.5" y="177.7" font-size="13" fill="#202124" text-anchor="middle">带宽项</text>
</g>
<rect x="395.0" y="159.0" width="2.0" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" class="r0" />
<line x1="395.4" y1="153.0" x2="395.4" y2="193.0" stroke="#202124" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="411.0" y="178.0" font-size="15" fill="#d93025" font-weight="700" class="p0">不到 1%</text>
<text x="20.0" y="251.0" font-size="16" fill="#202124" font-weight="700">K = 20</text>
<g>
<rect x="200.0" y="233.0" width="195.0" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="297.5" y="251.7" font-size="13" fill="#202124" text-anchor="middle">带宽项</text>
</g>
<rect x="395.0" y="233.0" width="40.6" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" class="r1" />
<line x1="403.1" y1="227.0" x2="403.1" y2="267.0" stroke="#202124" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="449.6" y="252.0" font-size="15" fill="#d93025" font-weight="700" class="p1">约 +15%</text>
<text x="20.0" y="325.0" font-size="16" fill="#202124" font-weight="700">K = 160</text>
<g>
<rect x="200.0" y="307.0" width="195.0" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="297.5" y="325.7" font-size="13" fill="#202124" text-anchor="middle">带宽项</text>
</g>
<rect x="395.0" y="307.0" width="325.0" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" class="r2" />
<line x1="460.0" y1="301.0" x2="460.0" y2="341.0" stroke="#202124" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="734.0" y="326.0" font-size="15" fill="#d93025" font-weight="700" class="p2">约翻一倍</text>
<rect x="20.0" y="383.0" width="860.0" height="32.0" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1.2" />
<rect x="20.0" y="383.0" width="4.0" height="32.0" rx="0" fill="#d93025" />
<text x="36.0" y="407.0" font-size="14" fill="#202124">K 怎么数：数一步里跨片的集合通信（GA > 1 要乘 GA，合并成一包的算一次）</text>
</svg>

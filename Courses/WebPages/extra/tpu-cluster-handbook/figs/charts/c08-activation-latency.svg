<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" role="img" aria-label="切片激活延迟分组散点：3 片中位约 1 分钟，10+ 片更久且有重试；本书脚本安静时 26–63 秒，与大任务同时激活时 161–172 秒；验收超时门槛建议不低于 5 分钟。" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif' class="chart"><title>切片激活要多久：看同时建几片、有没有人抢 cube —— 不看形状</title><desc>切片激活延迟分组散点：3 片中位约 1 分钟，10+ 片更久且有重试；本书脚本安静时 26–63 秒，与大任务同时激活时 161–172 秒；验收超时门槛建议不低于 5 分钟。</desc><style>.pt{cursor:default}.pt:hover>*:not(title),.pt:focus>*:not(title){stroke:#202124;stroke-width:2.2}.pt:focus{outline:none}</style><rect width="880" height="470" fill="#fff"/><text x="20.0" y="30.0" font-size="19" fill="#202124" font-weight="700">切片激活要多久：看同时建几片、有没有人抢 cube —— 不看形状</text><text x="20.0" y="52.0" font-size="14" fill="#5f6368">每个点 = 一个任务从建 Slice 到全部 ACTIVE（对数纵轴）；红点 = 有片重试过（多数是和手建子切片抢 cube）</text><circle cx="26" cy="73" r="5.5" fill="#1a73e8"/><text x="38.0" y="78.0" font-size="13.5" fill="#202124">实测任务，无重试</text><circle cx="174.0" cy="73" r="5.5" fill="#d93025"/><text x="186.0" y="78.0" font-size="13.5" fill="#202124">有片重试过</text><circle cx="281.5" cy="73" r="5.5" fill="#188038"/><text x="293.5" y="78.0" font-size="13.5" fill="#202124">本书脚本，安静时</text><circle cx="429.5" cy="73" r="5.5" fill="#e8710a"/><text x="441.5" y="78.0" font-size="13.5" fill="#202124">本书脚本，与更大规模任务同时激活</text><line x1="80" y1="387.0" x2="850" y2="387.0" stroke="#eceff1"/><text x="72.0" y="391.5" font-size="13" fill="#5f6368" text-anchor="end">20 s</text><line x1="80" y1="357.5" x2="850" y2="357.5" stroke="#eceff1"/><text x="72.0" y="362.0" font-size="13" fill="#5f6368" text-anchor="end">30 s</text><line x1="80" y1="307.0" x2="850" y2="307.0" stroke="#eceff1"/><text x="72.0" y="311.5" font-size="13" fill="#5f6368" text-anchor="end">1 min</text><line x1="80" y1="256.5" x2="850" y2="256.5" stroke="#eceff1"/><text x="72.0" y="261.0" font-size="13" fill="#5f6368" text-anchor="end">2 min</text><line x1="80" y1="189.7" x2="850" y2="189.7" stroke="#eceff1"/><text x="72.0" y="194.2" font-size="13" fill="#5f6368" text-anchor="end">5 min</text><line x1="80" y1="139.2" x2="850" y2="139.2" stroke="#eceff1"/><text x="72.0" y="143.7" font-size="13" fill="#5f6368" text-anchor="end">10 min</text><text x="24" y="255.0" font-size="13.5" fill="#5f6368" text-anchor="middle" transform="rotate(-90 24 255.0)">激活耗时（对数）</text><line x1="80" y1="408" x2="850" y2="408" stroke="#80868b"/><text x="176.2" y="428.0" font-size="13.5" fill="#202124" text-anchor="middle">3 片 × 4x4x4</text><text x="176.2" y="446.0" font-size="13" fill="#5f6368" text-anchor="middle">实测集群</text><text x="368.8" y="428.0" font-size="13.5" fill="#202124" text-anchor="middle">10+ 片 × 4x8x8</text><text x="368.8" y="446.0" font-size="13" fill="#5f6368" text-anchor="middle">实测集群</text><text x="561.2" y="428.0" font-size="13.5" fill="#202124" text-anchor="middle">本书脚本 · 安静时</text><text x="561.2" y="446.0" font-size="13" fill="#5f6368" text-anchor="middle">无人抢 cube</text><text x="753.8" y="428.0" font-size="13.5" fill="#202124" text-anchor="middle">本书脚本 · 繁忙时</text><text x="753.8" y="446.0" font-size="13" fill="#5f6368" text-anchor="middle">与更大规模任务同时</text><rect x="80" y="307.0" width="770" height="101.0" fill="#e6f4ea" fill-opacity="1.0"/><line x1="80.0" y1="189.7" x2="850.0" y2="189.7" stroke="#d93025" stroke-width="1.4" stroke-dasharray="6 4"/><text x="846.0" y="183.7" font-size="13" fill="#d93025" text-anchor="end">验收判超时的门槛别低于 5 min</text><text x="846.0" y="398.9" font-size="13" fill="#0d652d" text-anchor="end">安静基线 &lt; 1 min</text><g class="pt" tabindex="0"><title>57 s，3 片 4x4x4</title><circle cx="191.4" cy="310.4" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>51 s，3 片 4x4x4</title><circle cx="187.6" cy="319.0" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>51 s，3 片 4x4x4</title><circle cx="172.8" cy="318.6" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="1.2"/><
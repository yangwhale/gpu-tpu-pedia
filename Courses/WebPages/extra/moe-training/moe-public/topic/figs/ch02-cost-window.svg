<text x="20.0" y="220.0" font-size="15" fill="#e8710a" text-anchor="start" font-weight="bold">估长了：发得太早，buffer 多活、占住车道</text>
<text x="20.0" y="251.0" font-size="14" fill="#202124" text-anchor="start">TC</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意曲线。横轴存档间隔 τ，纵轴损失占比。存档钱 δ/τ 随间隔变长而下降，重做钱 τ/2M 随间隔变长而上升，两者相加再加上恒定的恢复钱 R/M 是一条 U 形曲线，最低点在 τ* = √(2δM)。存档变便宜（δ 变小）后，最低点左移变低，剩下的几乎全是恢复钱 R/M。">
<title>示意曲线。横轴存档间隔 τ，纵轴损失占比。存档钱 δ/τ 随间隔变长而下降，重做钱 τ/2M 随间隔变长而上升，两者相加再加上恒定的恢复钱 R/M 是一条 U 形曲线，最低点在 τ* = √(2δM)。存档变便宜（δ 变小）后，最低点左移变低，剩下的几乎全是恢复钱 R/M。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="444" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">存得勤付存档钱，存得稀付重做钱；存档便宜以后，剩下的几乎全是恢复钱</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">示意曲线，坐标轴不带刻度。badput ≈ δ/τ + (R + τ/2)/M，对 τ 求最小得 τ* = √(2δM)。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">存档贵（δ 大）</text>
<rect x="172.2" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="194.2" y="86.0" font-size="14" fill="#202124" text-anchor="start">存档便宜（δ 小）</text>
<rect x="334.5" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="356.5" y="86.0" font-size="14" fill="#202124" text-anchor="start">恢复钱 R/M</text>
<line x1="90.0" y1="400.0" x2="610.0" y2="400.0" stroke="#202124" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="90.0" y1="400.0" x2="90.0" y2="112.0" stroke="#202124" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="600.0" y="424.0" font-size="14" fill="#202124" text-anchor="end">存档间隔 τ</text>
<text x="98.0" y="124.0" font-size="14" fill="#202124" text-anchor="start">损失占比</text>
<rect x="91.0" y="332.8" width="510.0" height="67.2" rx="0" fill="#fce8e6" stroke="none" stroke-width="0"/>

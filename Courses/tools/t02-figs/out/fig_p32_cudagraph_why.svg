<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">CUDA Graph 快在哪　—— 省掉的是 <tspan font-weight="700">CPU 一条一条喂</tspan>，不是计算变快了</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="37" y="58" class="sm">CPU 在忙（发指令）</text>
<rect x="164.8" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="181.8" y="58" class="sm">GPU 在算（kernel）</text>
<rect x="313.05" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="330.05" y="58" class="sm">空等：GPU 闲着，在等 CPU</text>
<rect x="20" y="84" width="674" height="280" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="38" y="112" class="sec" fill="#9aa0a6">❌ 不开 graph：CPU 一条一条发</text>
<text x="38" y="134" class="xxs" fill="#5f6368">每个 kernel 都要走一遍驱动，GPU 干完就得等下一条</text>
<text x="36" y="185" class="xxs" fill="#5f6368">CPU</text>
<rect x="82" y="168" width="594" height="24" rx="3" fill="#fff" stroke="#9aa0a6" stroke-width="0.8"/>
<text x="36" y="245" class="xxs" fill="#5f6368">GPU</text>

# Hy3 64 GPU sleep-infinity pool — 单 ComputeDomain x 16 节点
#
# 与 07e 的 256 GPU (4 域) 版差异：
#   - 16 节点 = 64 GPU 正好装进一个 NVL72 subblock -> 只需 1 个 ComputeDomain
#   - 无跨域 RDMA，EP all-to-all 全走 NVLink，EP 最大可开到 64
#   - 规避 07e 的 4-CD IMEX clique 死结坑
#
# Pool 选型（bunny 2026-07-25 质检，5 个 pool 全 PASS，合计 88 节点/352 GPU）：
#   gb300-pool-0015  18 节点  NCCL 689.3 GB/s  <- 首选（本文件用它）
#   gb300-pool-0016  18 节点  NCCL 688.3 GB/s     备选
#   gb300-pool-0017  18 节点  NCCL 689.6 GB/s     备选
#   gb300-pool-0014  16 节点  NCCL 688.9 GB/s     刚好 16 台零余量；GKE STATUS 显示 ERROR
#                                                  是抱怨没凑够 18 台，节点本身健康
#   gb300-pool-0013  18 节点  NCCL 688.3 GB/s     1 WARN: pqcm 节点 DRAM correctable ECC>1000
#
# 为什么选 18 节点的池而不是刚好 16 台的 0014：
#   **集群 auto-repair 是关闭的**（刻意防误换机），节点坏了不会自愈。
#   18 节点池用 16 台 → 留 2 台同 subblock 热备，坏一台直接换标签，不用整池搬迁。
#
# 不要用：pool-0002（yangwhale 负载在跑 + 坏 COS）、pool-0006（infer 团队占用 + 坏 COS）、
#         pool-0009（空闲且 COS 好，但不在交付范围，要用先问 chris）
#
# 前置：目标 node pool 内 16 个节点已打 team=yangwhale 标签（pool = subblock，天然同域）。
# 应用：kubectl apply -f yw-pool-64.yaml
# 校验：kubectl get pods -l job=yw --no-headers | grep -c Running   # 应为 16
#       kubectl get computedomains | grep yw                        # 1 个 Ready
---
apiVersion: v1
kind: Service
metadata:
  name: yw
spec:
  selector:
    job: yw
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: yw-cd-a
spec:
  numNodes: 0            # 动态发现节点
  channel:
    resourceClaimTemplate:
      name: yw-ch-a
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: yw-mrdma-a
spec:
  spec:
    devices:
      requests:
      - name: req-mrdma
        exactly:
          deviceClassName: mrdma.google.com
          allocationMode: ExactCount
          count: 8       # GB300 CX-8 双端口 -> 8 PF（GB200 是 4）
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yw-a
spec:
  serviceName: yw
  replicas: 16
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: yw-a
  template:
    metadata:
      labels:
        app: yw-a
        job: yw
    spec:
      tolerations:
      - operator: "Exists"
      nodeSelector:
        cloud.google.com/gke-gpu: "true"
        cloud.google.com/gke-nodepool: gb300-pool-0015   # bunny 质检 PASS，18 节点留 2 台热备
        team: yangwhale
      affinity:
        podAffinity:
          # 16 pod 必须落同一 subblock（= 同一 NVLink domain），否则 EP 跨域
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [yw-a]
            topologyKey: cloud.google.com/gce-topology-subblock
        podAntiAffinity:
          # 每节点仅 1 pod（独占 4 GPU）
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: job
                operator: In
                values: [yw]
            topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: ar-pull-secret
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 250Gi
      containers:
      - name: nemo
        image: us-central1-docker.pkg.dev/tencent-gcp-taiji-poc/gb300-images/nemo-gb300-ready:26.06-v1
        securityContext:
          privileged: true
        resources:
          limits:
            nvidia.com/gpu: 4
          claims:
          - name: req-mrdma
          - name: compute-domain-channel
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        env:
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: NCCL_SOCKET_IFNAME
          value: "eth0"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        command: ["sleep", "infinity"]
      resourceClaims:
      - name: req-mrdma
        resourceClaimTemplateName: yw-mrdma-a
      - name: compute-domain-channel
        resourceClaimTemplateName: yw-ch-a

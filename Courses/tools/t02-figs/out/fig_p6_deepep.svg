<text x="20" y="26" class="ttl">实测：规模一大，<tspan font-weight="700" fill="#d93025">all-to-all 就掉</tspan>　—— 以及一个<tspan font-weight="700" fill="#d93025">塌掉的对照项</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="四个片各自算完一段后到集合通信会合。片 A、B、C 先到，红色等待条很长；片 D 是慢片，最后到，几乎不用等，测到的集合通信延迟反而最低。会合后大家一起通信，步时由 D 决定。">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="时间轴上，硬件静默算错在某一刻开始，之后写出的检查点都是坏的；10 到 22 分钟后芯片才报告警。如果只回退到告警前最近的一份检查点，那份已经是坏的；回退窗口留到 30 分钟以上，才能退到出错之前。">
<title>时间轴上，硬件静默算错在某一刻开始，之后写出的检查点都是坏的；10 到 22 分钟后芯片才报告警。如果只回退到告警前最近的一份检查点，那份已经是坏的；回退窗口留到 30 分钟以上，才能退到出错之前。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">硬件静默算错比告警早 10–22 min：只退一份，退到的还是坏档</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">示意：只有「10–22 min」「≥ 30 min」两段按比例，检查点间距是示意；方块是检查点。</text>

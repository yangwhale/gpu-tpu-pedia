.fly { animation: flyk 12s linear infinite; transform-box: fill-box; }
@keyframes capk0 { 0% { opacity:1 } 5% { opacity:1 } 6% { opacity:.3 } 7% { opacity:1 } 35% { opacity:1 } 36% { opacity:.3 } 98% { opacity:.3 } 100% { opacity:1 } }

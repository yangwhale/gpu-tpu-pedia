<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 437" width="900" height="437" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：fused MoE 前向是一个看不透的 custom call。残差不命名时，remat full 在反向先把整个 fused 前向再跑一遍才能做反向；把 route IDs 和 routing weights 命名存下后，反向直接拿它们跑 fused 反向，不再重放前向。">
<title>示意图：fused MoE 前向是一个看不透的 custom call。残差不命名时，remat full 在反向先把整个 fused 前向再跑一遍才能做反向；把 route IDs 和 routing weights 命名存下后，反向直接拿它们跑 fused 反向，不再重放前向。</title>
<defs><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><style></style></defs>
<rect x="0" y="0" width="900" height="437" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">kernel 的残差不命名，full remat 会在反向把整个 fused 前向再跑一遍</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意。fused MoE 前向是一个 custom call，remat 策略只认得带名字的中间量</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">计算</text>
<rect x="98.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="126.0" y="85.0" font-size="14" fill="#202124">多出来的重放</text>
<rect x="232.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#188038" />
<text x="260.0" y="85.0" font-size="14" fill="#202124">存进 HBM 的东西</text>
<text x="20.0" y="155.0" font-size="15" fill="#202124" font-weight="700">不命名</text>
<text x="20.0" y="225.0" font-size="13" fill="#5f6368">HBM 里存着</text>
<g>
<rect x="230.0" y="133.0" width="170.0" height="36.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />

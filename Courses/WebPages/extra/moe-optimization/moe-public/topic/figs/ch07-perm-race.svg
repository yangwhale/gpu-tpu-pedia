</g>
<g>
<rect x="470.0" y="240.0" width="34.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="487.0" y="262.4" font-size="15" fill="#a50e0e" text-anchor="middle">4</text>
</g>
<g>
<rect x="510.0" y="240.0" width="34.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="527.0" y="262.4" font-size="15" fill="#a50e0e" text-anchor="middle">3</text>
</g>
<g>
<rect x="550.0" y="240.0" width="34.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="567.0" y="262.4" font-size="15" fill="#a50e0e" text-anchor="middle">2</text>
</g>
<g>
<rect x="590.0" y="240.0" width="34.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="607.0" y="262.4" font-size="15" fill="#a50e0e" text-anchor="middle">6</text>
</g>
<g>
<rect x="630.0" y="240.0" width="34.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="647.0" y="262.4" font-size="15" fill="#a50e0e" text-anchor="middle">5</text>
</g>
<text x="682.0" y="262.0" font-size="14" fill="#a50e0e" text-anchor="start">← 同一批样本、顺序不同</text>
</svg>

<svg viewBox="0 0 1400 756" width="1400" height="756" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一个模型在 GB300 与 TPU v7 上的实测：854.0 对 662.3 TFLOP/s；1.29 倍的差距里峰值只占 1.084 倍，剩下的 1.19 是余项、不等于软件">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">两边的实测　—— <tspan font-weight="700" fill="#1e8e3e">同一个模型、同一个规模，两边各自调到目前的水位</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">GB300 NVL72 · 64 GPU</text>
<rect x="185.5" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="202.5" y="58" class="sm">TPU v7 · 64 chips</text>
<rect x="332.02500000000003" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="349.02500000000003" y="58" class="sm">浅槽＝该平台的 BF16 dense 峰值，深段＝实测</text>
<rect x="619.425" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="636.425" y="58" class="sm">两段差值，长度几乎相同</text>
<rect x="20" y="124" width="836" height="452" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　两条共轴的条：槽是峰值，填充是实测</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">同一根绝对刻度的横轴。</tspan><tspan font-weight="700" fill="#202124">下面那两段红色标注是这一格的重点</tspan>，别急着看数字。</text>
<text x="838" y="174" class="xxs" fill="#5f6368" text-anchor="end">横轴：TFLOP/s（BF16 dense）　满程 = 2,500</text>
<text x="44" y="236" class="box" fill="#202124">GB300 NVL72　64 GPU</text>
<text x="44" y="254" class="xxs" fill="#5f6368">机型 a4x-max · 单 NVLink 域 16 节点</text>
<rect x="260" y="224" width="470.0" height="30" rx="4" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="260" y="224" width="160.552" height="30" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
<text x="430.552" y="244" class="numb" fill="#1a73e8">854.0</text>
<text x="740.0" y="244" class="xxs" fill="#5f6368">峰值 2,500</text>
<text x="44" y="276" class="xs"><tspan font-weight="700" fill="#202124">MFU 34.2%</tspan>　·　<tspan font-weight="700" fill="#202124">6,242 tok/s / 计算单元</tspan>　·　step 21.0 s　·　GBS 2048　·　TP1 PP2 VPP8 EP32 · MBS 1</text>
<text x="44" y="294" class="xxs"><tspan font-weight="700" fill="#202124">⚠️ 这一侧没到顶</tspan><tspan fill="#9aa0a6">：同一张扫点表里 EP 32→16 是 </tspan><tspan font-weight="700" fill="#202124">882.3 / 6,450（+3.3%）</tspan>，未跟进复测。<tspan font-weight="700" fill="#202124">所以下面所有倍数都是下限。</tspan></text>
<text x="44" y="328" class="box" fill="#202124">TPU v7　64 chips（4x4x4）</text>
<text x="44" y="346" class="xxs" fill="#5f6368">128 device · 3D torus 一个切片</text>
<rect x="260" y="316" width="433.716" height="30" rx="4" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<rect x="260" y="316" width="124.5124" height="30" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.8"/>
<text x="394.5124" y="336" class="numb" fill="#1e8e3e">662.3</text>
<text x="703.716" y="336" class="xxs" fill="#5f6368">峰值 2,307</text>
<text x="44" y="368" class="xs"><tspan font-weight="700" fill="#202124">MFU 28.71%</tspan>　·　<tspan font-weight="700" fill="#202124">4,770 tok/s / 计算单元</tspan>　·　step 20.61 s　·　等效 GBS 1536　·　DP1×FSDP128 · pdbs 12 · dvfs 7</text>
<text x="44" y="386" class="xxs"><tspan font-weight="700" fill="#202124">这一侧撞墙了</tspan>：tile、XLA flag、SparseCore 卸载、推 batch 四个方向共 8 格实验，<tspan font-weight="700" fill="#202124">无一正收益</tspan>。</text>
<rect x="38" y="408" width="800" height="66" rx="8" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.0"/>
<line x1="384.5124" y1="224" x2="384.5124" y2="430" stroke="#d93025" stroke-width="0.9" stroke-dasharray="2 4"/>
<line x1="420.552" y1="224" x2="420.552" y2="430" stroke="#d93025" stroke-width="0.9" stroke-dasharray="2 4"/>
<rect x="384.5124" y="430" width="36.03960000000001" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="402.5322" y="424" class="num" fill="#d93025" text-anchor="middle">实测差 191.7</text>
<text x="402.5322" y="464" class="xxs" fill="#5f6368" text-anchor="middle">＝ 662.3 的 29%</text>
<line x1="693.716" y1="224" x2="693.716" y2="430" stroke="#d93025" stroke-width="0.9" stroke-dasharray="2 4"/>
<line x1="730" y1="224" x2="730" y2="430" stroke="#d93025" stroke-width="0.9" stroke-dasharray="2 4"/>
<rect x="693.716" y="430" width="36.28399999999999" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="711.858" y="424" class="num" fill="#d93025" text-anchor="middle">峰值差 193.0</text>
<text x="711.858" y="464" class="xxs" fill="#5f6368" text-anchor="middle">＝ 2,307 的 8.4%</text>
<text x="50" y="444" class="xxs" fill="#5f6368">同一条基线上比长度 →</text>
<rect x="38" y="486" width="800" height="72" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="52" y="508" class="xs"><tspan font-weight="700" fill="#202124">⭐ 这两段在图上几乎一样长 —— 193.0 对 191.7 TFLOP/s。</tspan><tspan fill="#9aa0a6">但一段是 2,307 的 </tspan><tspan font-weight="700" fill="#202124">8.4%</tspan>，另一段是 662.3 的 <tspan font-weight="700" fill="#202124">29%</tspan>。</text>
<text x="52" y="529" class="xs"><tspan font-weight="700" fill="#202124">差距要相除，不能相减。</tspan><tspan fill="#9aa0a6">相减出来的两个数一样大，相除出来的差 3.4 倍 —— 而下一格那个 </tspan><tspan font-weight="700" fill="#202124">1.084 × 1.190</tspan> 之所以是乘法，理由就在这里。</text>
<rect x="868" y="124" width="512" height="452" rx="10" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="886" y="150" class="sec">乙　·　把这 1.29 倍拆开 —— 只拆得动一半</text>
<rect x="886" y="168" width="476" height="44" rx="8" fill="#e8f0fe" stroke="#202124" stroke-width="1.4"/>
<text x="1124.0" y="196" class="box" fill="#202124" text-anchor="middle">854.0 ÷ 662.3  =  1.29  =  1.084 × 1.190</text>
<rect x="892" y="234" width="146.64513833576837" height="34" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="965.3225691678842" y="256" class="numb" fill="#d93025" text-anchor="middle">1.084</text>
<rect x="1038.6451383357685" y="234" width="317.3548616642317" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="1197.3225691678842" y="256" class="numb" fill="#1a73e8" text-anchor="middle">1.190</text>
<text x="892" y="286" class="xxs" fill="#5f6368">↑ 段长按对数切 —— 两项是相乘的，按 0.084 : 0.190 切就是把乘法当成了加法</text>
<rect x="886" y="310" width="476" height="68" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="900" y="332" class="lbl" fill="#d93025">① 峰值之比　—— 能算清的那段</text>
<text x="1348" y="332" class="num" fill="#202124" text-anchor="end">2,500 ÷ 2,307</text>
<text x="900" y="350" class="xxs"><tspan fill="#9aa0a6">官方 dense BF16，两边都按 P-12 的口径取。</tspan><tspan font-weight="700" fill="#202124">这一段不用调，买回来就是它。</tspan></text>
<rect x="886" y="386" width="476" height="68" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="900" y="408" class="lbl" fill="#1a73e8">② 峰值以外　—— 余项，不等于「软件」</text>
<text x="1348" y="408" class="num" fill="#202124" text-anchor="end">34.160% ÷ 28.708%</text>
<text x="900" y="426" class="xxs"><tspan font-weight="700" fill="#202124">这不是量出来的，是除剩下的。</tspan><tspan fill="#9aa0a6">软件在里面，</tspan><tspan font-weight="700" fill="#202124">非峰值的硬件也在里面</tspan>：HBM 带宽、片上 SRAM、MXU </text>
<text x="900" y="439" class="xxs">收缩维形状、互联拓扑。</text>
<rect x="886" y="468" width="476" height="96" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="900" y="490" class="xs"><tspan font-weight="700" fill="#202124">⚠️ 这个式子恒成立，所以它不是一个发现。</tspan><tspan fill="#9aa0a6">因为 MFU ≡ 实测 ÷ 峰值，任意两个数都能这</tspan></text>
<text x="900" y="507" class="xs"><tspan fill="#9aa0a6">么拆。</tspan></text>
<text x="900" y="526" class="xs"><tspan fill="#9aa0a6">它证明的只有一件事：</tspan><tspan font-weight="700" fill="#202124">这 1.19 倍不来自峰值差</tspan>。至于它有多少来自软件 —— <tspan font-weight="700" fill="#202124">这张图答不了，</tspan></text>
<text x="900" y="543" class="xs"><tspan font-weight="700" fill="#202124">下一张才答。</tspan></text>
<rect x="20" y="604" width="1360" height="124" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="38" y="632" class="sec">⚠️ 换一个单位，倍数就变 —— 而变掉的那 1.5% 正好是第 6 节讲的那件事</text>
<text x="38" y="658" class="xs"><tspan font-weight="700" fill="#202124">按 TFLOP/s 算，GB300 是 v7 的 1.29 倍；按 tok/s 算，是 1.31 倍</tspan><tspan fill="#9aa0a6">（6,242 ÷ 4,770）。两个数都对，差在</tspan><tspan font-weight="700" fill="#202124">分子那条公式</tspan> ——同一个模型、同一条 token，两边的分析式 FLOP 公式给出的答案<tspan font-weight="700" fill="#202124">差 1.5%</tspan>。<tspan font-weight="700" fill="#202124">差多少不重要，差本身才重要。</tspan></text>
<text x="38" y="681" class="xs"><tspan font-weight="700" fill="#202124">token 是能数出来的，TFLOP/s 里还夹着一条公式。</tspan><tspan fill="#9aa0a6">所以两个都报的时候，把 tok/s 放在前面。</tspan><tspan font-weight="700" fill="#202124">这不是吹毛求疵：1.5% 在这里无关紧要，但它证明了那条公式确实是两边各写各的</tspan> ——下一次遇到的不一定还是 1.5%，而 P-13 甲格里那个漏白名单的例子是 5 倍。</text>
<text x="1380" y="744" class="xxs" fill="#9aa0a6" text-anchor="end">同一个 Hunyuan3-295B-A21B（80 层 · 192 专家）· seq 4096 · 合成数据 · 两边都不落盘 checkpoint（但重算策略不同，见 P-18 第 ⑤ 条）· 两边都是我们自己跑的</text>
</svg>
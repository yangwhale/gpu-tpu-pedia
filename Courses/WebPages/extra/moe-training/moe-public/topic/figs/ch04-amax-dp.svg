<text x="450.0" y="190.0" font-size="13" fill="#a50e0e" text-anchor="middle">amax 的 MAX：每步几十条小包（恒等操作）＋ dW 的 SUM</text>
<path d="M314,142 H586" stroke="#e8710a" stroke-width="4" fill="none" marker-start="url(#ar-e8710a)" marker-end="url(#ar-e8710a)"/>

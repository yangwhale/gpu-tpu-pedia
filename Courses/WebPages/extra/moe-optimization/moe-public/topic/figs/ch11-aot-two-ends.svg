<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="CPU 交叉 AOT 流程：CPU 编译机带一串 LIBTPU_INIT_ARGS 跑 train_compile，产出 pickle 经 GCS Fuse 交给每台 TPU host，host 带自己的一串 flag 加载就跑。三处不一致都不报错：两端 flag 串不同时多半按编译时的环境跑；kernel 目标平台没设 tpu 静默走 JAX reference；不走 create_model 时 fp8_full 静默仍是 BF16。"><title>CPU 交叉 AOT 流程：CPU 编译机带一串 LIBTPU_INIT_ARGS 跑 train_compile，产出 pickle 经 GCS Fuse 交给每台 TPU host，host 带自己的一串 flag 加载就跑。三处不一致都不报错：两端 flag 串不同时多半按编译时的环境跑；kernel 目标平台没设 tpu 静默走 JAX reference；不走 create_model 时 fp8_full 静默仍是 BF16。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="392" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">CPU 交叉 AOT：flag 在编译端就写进产物，三处对不上都不报错</text>
<text x="24.0" y="60.0" font-size="14" fill="#3c4043" text-anchor="start">上排是正常流程；下排红框是三个静默坑，都发生在编译端</text>
<rect x="24.0" y="96.0" width="250.0" height="140.0" rx="8" fill="none" stroke="#5f6368" stroke-width="1.6"/>
<text x="40.0" y="122.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">CPU 编译机</text>
<text x="40.0" y="150.0" font-size="13" fill="#3c4043" text-anchor="start">JAX_PLATFORMS=cpu</text>
<text x="40.0" y="172.0" font-size="13" fill="#3c4043" text-anchor="start">LIBTPU_INIT_ARGS = 串 A</text>
<text x="40.0" y="194.0" font-size="13" fill="#3c4043" text-anchor="start">kernel 目标平台 = tpu</text>
<text x="40.0" y="216.0" font-size="13" fill="#1a73e8" text-anchor="start" font-weight="700">train_compile</text>
<rect x="330.0" y="126.0" width="220.0" height="80.0" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="440.0" y="156.0" font-size="15" fill="#1a73e8" text-anchor="middle" font-weight="700">编好的 executable</text>
<text x="440.0" y="178.0" font-size="13" fill="#3c4043" text-anchor="middle">（编译期 flag 已在程序里）</text>
<line x1="274.0" y1="166.0" x2="326.0" y2="166.0" stroke="#1a73e8" stroke-width="1.8" marker-end="url(#ar1a73e8)"/>
<rect x="606.0" y="96.0" width="270.0" height="140.0" rx="8" fill="none" stroke="#5f6368" stroke-width="1.6"/>
<text x="622.0" y="122.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">每台 TPU host</text>
<text x="622.0" y="150.0" font-size="13" fill="#3c4043" text-anchor="start">LIBTPU_INIT_ARGS = 串 B</text>
<text x="622.0" y="172.0" font-size="13" fill="#3c4043" text-anchor="start">加载 executable，直接跑</text>
<text x="622.0" y="194.0" font-size="13" fill="#3c4043" text-anchor="start">不再编译</text>
<line x1="550.0" y1="166.0" x2="602.0" y2="166.0" stroke="#1a73e8" stroke-width="1.8" marker-end="url(#ar1a73e8)"/>
<text x="577.0" y="154.0" font-size="13" fill="#3c4043" text-anchor="middle">GCS</text>
<text x="577.0" y="184.0" font-size="13" fill="#3c4043" text-anchor="middle">Fuse</text>
<rect x="24.0" y="268.0" width="270.0" height="104.0" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38.0" y="294.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="700">串 A ≠ 串 B</text>
<text x="38.0" y="318.0" font-size="14" fill="#a50e0e" text-anchor="start">多半不报错，按编译时的环境跑</text>
<text x="38.0" y="352.0" font-size="13" fill="#0d652d" text-anchor="start">对策：两端读同一份 flag 文件</text>
<rect x="314.0" y="268.0" width="270.0" height="104.0" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="328.0" y="294.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="700">kernel 平台没设 tpu</text>
<text x="328.0" y="318.0" font-size="14" fill="#a50e0e" text-anchor="start">静默走 JAX reference</text>
<text x="328.0" y="352.0" font-size="13" fill="#0d652d" text-anchor="start">对策：逐个确认选的是 TPU 版</text>
<rect x="604.0" y="268.0" width="270.0" height="104.0" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="618.0" y="294.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="700">没走 create_model</text>
<text x="618.0" y="318.0" font-size="14" fill="#a50e0e" text-anchor="start">fp8_full 静默仍是 BF16</text>
<text x="618.0" y="352.0" font-size="13" fill="#0d652d" text-anchor="start">对策：数 HLO 里 f8 操作数</text>
<path d="M150,236 L150,264" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ard93025)"/>
<path d="M439,236 L439,264" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ard93025)"/>
<path d="M728,236 L728,264" fill="none" stroke="#d93025" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ard93025)"/></svg>

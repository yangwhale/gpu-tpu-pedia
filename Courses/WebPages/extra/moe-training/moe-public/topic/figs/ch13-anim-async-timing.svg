@keyframes rvc { 0% { transform: translateX(0px); opacity: 0 } 11% { transform: translateX(0px); opacity: 0 } 12% { transform: translateX(0px); opacity: 1 } 80% { transform: translateX(730px); opacity: 1 } 84% { transform: translateX(730px); opacity: 0 } 100% { transform: translateX(730px); opacity: 0 } }
.rvm { animation: rvm 9s infinite linear } .rvc { animation: rvc 9s infinite linear }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }

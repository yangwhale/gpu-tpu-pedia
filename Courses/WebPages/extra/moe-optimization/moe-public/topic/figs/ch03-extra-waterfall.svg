<text x="655.0" y="352.0" font-size="14" fill="#202124" text-anchor="middle" >其他</text>
<line x1="710.0" y1="268.8" x2="750.0" y2="268.8" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" />

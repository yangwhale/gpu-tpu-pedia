<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="KDA 按 64 字一块切开。每块内部做并行矩阵乘，块与块之间只传一张每头 d 乘 d 的状态表 S，S 的大小与序列长度无关。前向从左往右扫，反向从右往左倒序扫块、块间传 dS 并重算中间量。">
<title>KDA 分块扫描：块内并行乘，块间只传一张固定大小的状态表，反向倒着再扫一遍</title>

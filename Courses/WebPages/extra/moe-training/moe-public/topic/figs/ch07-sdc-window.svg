<text x="380.0" y="154.0" font-size="14" fill="#a50e0e" text-anchor="middle">开始静默算错</text>
<rect x="380.0" y="180.0" width="352.0" height="10.0" rx="2" fill="#fce8e6" stroke="none" stroke-width="0"/>
<line x1="732.0" y1="160.0" x2="732.0" y2="232.0" stroke="#202124" stroke-width="2"/>
<text x="732.0" y="154.0" font-size="14" fill="#202124" text-anchor="middle">HBM 不可纠正错误告警</text>
<text x="556.0" y="176.0" font-size="14" fill="#a50e0e" text-anchor="middle">相隔 10–22 min</text>
<path d="M728.0,240 C702.0,280 670,280 642,234" stroke="#d93025" stroke-width="2" fill="none"/>
<text x="686.0" y="294.0" font-size="14" fill="#a50e0e" text-anchor="middle">只退最近一份：已经是坏的</text>
<line x1="252.0" y1="320.0" x2="732.0" y2="320.0" stroke="#188038" stroke-width="2"/>
<line x1="252.0" y1="312.0" x2="252.0" y2="328.0" stroke="#188038" stroke-width="2"/>
<line x1="732.0" y1="312.0" x2="732.0" y2="328.0" stroke="#188038" stroke-width="2"/>
<text x="492.0" y="346.0" font-size="14" fill="#0d652d" text-anchor="middle">回退窗口 ≥ 30 min：退到出错之前</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fce8e6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="920" height="400" fill="#fff"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">配额按全部池配，健康的只有 127–128 个 cube：日报两次都报超配</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#5f6368">单位：Kueue 配额（每 cube 64）；两次日报都来自实测集群；条长为示意，不按比例</text>

  <!-- row 1: quota -->
  <text x="30" y="100" font-size="14" font-weight="bold" fill="#202124">Σ nominalQuota</text>
  <text x="30" y="120" font-size="13" fill="#5f6368">按池数 × 64 配</text>
  <rect x="250" y="86" width="560" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="816" y="110" font-size="13" font-weight="bold" fill="#202124">池数 × 64</text>

  <!-- row 2 -->
  <text x="30" y="170" font-size="14" font-weight="bold" fill="#202124">第一天日报</text>
  <text x="30" y="190" font-size="13" fill="#5f6368">健康 128 cube</text>
  <rect x="250" y="156" width="470" height="36" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <rect x="720" y="156" width="90" height="36" fill="url(#hatch)" stroke="#d93025" stroke-width="1.5"/>
  <text x="485" y="180" text-anchor="middle" font-size="14" fill="#202124">128 × 64 = 8,192</text>

  <!-- row 3 -->
  <text x="30" y="240" font-size="14" font-weight="bold" fill="#202124">第二天日报</text>
  <text x="30" y="260" font-size="13" fill="#5f6368">健康 127 cube</text>
  <rect x="250" y="226" width="466" height="36" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <rect x="716" y="226" width="94" height="36" fill="url(#hatch)" stroke="#d93025" stroke-width="1.5"/>
  <text x="483" y="250" text-anchor="middle" font-size="14" fill="#202124">健康容量 8,128</text>

  <!-- legend -->
  <rect x="560" y="284" width="22" height="16" fill="url(#hatch)" stroke="#d93025" stroke-width="1.5"/>
  <text x="590" y="297" font-size="13" fill="#d93025">配额超出健康容量的部分</text>

  <!-- rule -->
  <rect x="30" y="322" width="860" height="56" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="460" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">每天该满足：Σ nominalQuota ≤ min(128, 健康 − S) × 64</text>
  <text x="460" y="368" text-anchor="middle" font-size="13" fill="#202124">日报第 2 段只发现不改；超了按 03 §3.5 调小</text>
</svg>

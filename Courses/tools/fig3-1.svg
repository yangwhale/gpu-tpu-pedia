<svg viewBox="0 0 1400 608" width="100%" role="img" aria-label="CUDA 六层线程组织，每一层是被什么硬件麻烦逼出来的，以及 TPU 一层都没有">
<text class="svglbl" x="0" y="17" fill="#202124" style="font-size:14px">那六层为什么是六层 ——&#160;<tspan font-weight="700">每一层都是被一个具体的麻烦逼出来的</tspan></text>
<text class="svgsm" x="0" y="37">包含关系看下面的折叠全表，钉在哪块硅上看 G-3，什么时候定的看 P-31 ——&#160;这张只答一个问题：为什么要有这一层</text>
<text class="svgsm" x="0" y="74" fill="#5f6368">层</text>
<text class="svgsm" x="210" y="74" fill="#5f6368">有多大</text>
<text class="svgsm" x="350" y="74" fill="#5f6368">它保证了什么</text>
<text class="svglbl" x="700" y="74" fill="#e8710a" style="font-size:12px">⚡ 为什么会有这一层</text>
<rect x="684" y="56" width="716" height="402" rx="10" fill="#fef7e0"/>
<rect x="0" y="100" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.25"/>
<text class="svglbl" x="12" y="113" fill="#202124" style="font-size:13px">grid</text>
<text class="svgsm" x="12" y="130" fill="#5f6368">grid</text>
<text class="svgsm" x="210" y="113" fill="#202124">整个 kernel 的全部 block</text>
<text class="svgsm" x="350" y="113" fill="#5f6368">只剩 L2 和 HBM ——&#160;没有片上快捷通道</text>
<text class="svgsm" x="700" y="113" fill="#bba15a">——&#160;它是边界，不是被逼出来的</text>
<line x1="0" y1="148" x2="1400" y2="148" stroke="#e8eaed"/>
<rect x="7" y="162" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.38"/>
<text class="svglbl" x="19" y="175" fill="#202124" style="font-size:13px">cluster</text>
<text class="svgsm" x="19" y="192" fill="#5f6368">thread block cluster</text>
<text class="svgsm" x="210" y="175" fill="#202124">≤ 8 块（B200 可 opt-in 到 16）</text>
<text class="svgsm" x="350" y="175" fill="#5f6368">同一个 GPC 内，能直接读写别的块的 shared memory</text>
<text class="svgsm" x="700" y="175" fill="#7a5000">一个 SM 那 227 KiB 不够用了。代价：邻居的暂存要走 GPC 网络，比自己那块慢</text>
<line x1="0" y1="210" x2="1400" y2="210" stroke="#e8eaed"/>
<rect x="14" y="224" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.51"/>
<text class="svglbl" x="26" y="237" fill="#202124" style="font-size:13px">线程块</text>
<text class="svgsm" x="26" y="254" fill="#5f6368">CTA / block</text>
<text class="svgsm" x="210" y="237" fill="#202124">≤ 1,024 线程 ＝ ≤ 32 warp</text>
<text class="svgsm" x="350" y="237" fill="#5f6368">保证落在同一个 SM：共享 shared memory、能 __syncthreads</text>
<text class="svgsm" x="700" y="237" fill="#7a5000">「谁跟谁能共用暂存、能对齐脚步」需要一条边界 ——&#160;CTA 就是这个作用域</text>
<line x1="0" y1="272" x2="1400" y2="272" stroke="#e8eaed"/>
<rect x="21" y="286" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.64"/>
<text class="svglbl" x="33" y="299" fill="#202124" style="font-size:13px">warp 组</text>
<text class="svgsm" x="33" y="316" fill="#5f6368">warpgroup</text>
<text class="svgsm" x="210" y="299" fill="#202124">4 个 warp ＝ 128 线程</text>
<text class="svgsm" x="350" y="299" fill="#5f6368">一条 wgmma 由这 128 个线程整体发出</text>
<text class="svgsm" x="700" y="299" fill="#7a5000">Tensor Core 大到一个 warp 的寄存器喂不饱了，发指令的单位只好往上抬一级</text>
<line x1="0" y1="334" x2="1400" y2="334" stroke="#e8eaed"/>
<rect x="28" y="348" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.77"/>
<text class="svglbl" x="40" y="361" fill="#202124" style="font-size:13px">warp</text>
<text class="svgsm" x="40" y="378" fill="#5f6368">warp</text>
<text class="svgsm" x="210" y="361" fill="#202124">32 个线程</text>
<text class="svgsm" x="350" y="361" fill="#5f6368">共用一条指令流、天然锁步；分支分歧只在这一层内发生</text>
<text class="svgsm" x="700" y="361" fill="#7a5000">取指译码太贵。取一次、译一次、32 份数据一起算 ——&#160;管理成本摊薄 32 倍</text>
<line x1="0" y1="396" x2="1400" y2="396" stroke="#e8eaed"/>
<rect x="35" y="410" width="3" height="36" rx="1.5" fill="#1a73e8" opacity="0.90"/>
<text class="svglbl" x="47" y="423" fill="#202124" style="font-size:13px">线程</text>
<text class="svgsm" x="47" y="440" fill="#5f6368">thread</text>
<text class="svgsm" x="210" y="423" fill="#202124">1 个</text>
<text class="svgsm" x="350" y="423" fill="#5f6368">自己的寄存器。没有自己的命运 ——&#160;跟着所在的 warp 走</text>
<text class="svgsm" x="700" y="423" fill="#bba15a">——&#160;它是边界，不是被逼出来的</text>
<rect x="0" y="476" width="1400" height="52" rx="8" fill="#fff" stroke="#d93025"/>
<text class="svgsm" x="16" y="497" fill="#d93025">⚠️ 两个最容易混成一个的数：<tspan font-weight="700">1,024 是「一个 block 的上限」</tspan>（＝32 warp），不是一个 SM 的上限。</text>
<text class="svgsm" x="16" y="515" fill="#d93025">一个 SM 同时驻留 <tspan font-weight="700">64 个 warp ＝ 2,048 线程</tspan>（B200 / H100 / A100；Turing 只有一半）——&#160;这才是「有没有别的活可切」的本钱。</text>
<rect x="0" y="538" width="1400" height="70" rx="8" fill="#e6f4ea" stroke="#1e8e3e"/>
<text class="svglbl" x="16" y="561" fill="#0b6b30">⭐ 这六层没有一层是为了「让程序好写」加的</text>
<text class="svgsm" x="16" y="581" fill="#0b6b30">它们合起来，就是<tspan font-weight="700">「运行时适应」这个赌注的组织成本</tspan>——&#160;要在运行时换人、分工、组队，就得把这些层级做进硬件，再配上调度器、记分板、常驻的巨大寄存器堆。</text>
<text class="svgsm" x="16" y="599" fill="#0b6b30"><tspan font-weight="700">✕ TPU 这一整列是空的。</tspan>它不做「运行时换人」这个决定，于是这六层同时失去存在的理由 ——&#160;下面 T-3 那两个空格，就是这一列在对照表上的样子。</text>
</svg>
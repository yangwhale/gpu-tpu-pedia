apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: slice-controller
    control-plane: controller-manager

  name: slice-controller-controller-manager
  namespace: slice-controller-system
spec:
  # Two replicas, not one. The manager serves three webhooks that all use
  # `failurePolicy: Fail` with no namespaceSelector (see the bottom of this
  # file), so while no Pod is serving :9443 the API server rejects every Job
  # CREATE in the cluster. A single replica makes an ordinary node drain a
  # cluster-wide outage.
  #
  # Safe because `--leader-elect` is set below: the second Pod serves webhook
  # traffic but does not reconcile, so slices are never carved twice.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slice-controller
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: slice-controller
        control-plane: controller-manager
    spec:
      # PREFERRED, not required. Required anti-affinity would be a stronger
      # guarantee, but if the second Pod could not be placed it would stay
      # Pending, the Deployment would never report ready, and Helm would sit on
      # `Still creating...` until it timed out, for a pod we only want as
      # insurance. With 18 default-pool nodes
      # the scheduler spreads these in practice anyway.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: slice-controller
                  control-plane: controller-manager
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --zap-log-level=3
        - --feature-gates=UseRetryMechanismForSliceCreation=true
        # PATHWAYS-TUNED (recommended for Pathways workloads).
        # See handbook chapter 03 for context.
        #
        # All FOUR of the recommended args are set. If the two qps/burst flags
        # CrashLoopBackOff the container, the image is too old (see below) --
        # fix the image, do not drop the flags.
        #
        # activation-timeout: the binary's default is 3m, so this is a 20x
        # increase, and it is not a comfort margin. Production is 144 cubes x 16
        # nodes = 2,304 TPU hosts and a slice does not activate until its nodes
        # are up. 3m was only ever survivable because the rehearsal has 0 chips
        # and nothing has to actually activate.
        - --activation-timeout=60m
        # Place slices on HEALTHY *and* DEGRADED nodes. With HEALTHY-only, a
        # single degraded node in a 4x4x4 cube can make the whole cube
        # unschedulable, and at 144 cubes that is a near-certainty rather than
        # an edge case.
        #
        # This is ALREADY the binary's default. Stated explicitly so that a
        # future image changing the default cannot silently change our
        # behaviour -- the cost is one line, the failure it prevents is silent.
        - --default-slice-health-node-affinity=HEALTHY_AND_DEGRADED
        # Client-side rate limit for this controller's calls to kube-apiserver.
        #
        # !! THESE TWO REQUIRE v0.8.0-200 OR LATER -- DO NOT PAIR THEM WITH
        # !! `:latest`. That tag still resolves to v0.8.0-195, which
        # does not define either flag, and Go's flag package answers an unknown
        # flag by printing usage and exiting non-zero:
        #   flag provided but not defined: -kube-api-qps
        # Terraform shows only `helm_release: Still modifying...` while the pod
        # CrashLoopBackOffs.
        #
        # Evidence they are supported: a validated cluster
        # runs v0.8.0-200 with exactly these two args,
        # running for weeks across a restart. An undefined flag could not
        # survive one start, let alone two.
        #
        # Why they matter at our size: without them the effective limit is
        # controller-runtime's, not raw client-go's -- GetConfigWithContext
        # raises an unset QPS/Burst to 20/30, not 5/10 (verified against
        # pkg/client/config/config.go). Reads come from the informer cache, so
        # 20 qps bounds writes and status updates rather than steady-state
        # reconciliation. The exposure is bulk slice creation across 144 slices.
        - --kube-api-qps=100
        - --kube-api-burst=200

        command:
        - /manager
        # PINNED. Do not use `:latest`: it still resolves to v0.8.0-195,
        # which is missing --kube-api-qps / --kube-api-burst.
        #
        # v0.8.0-200 is not a guess. It is the build validated with Kueue
        # 0.18.x, this AdmissionCheck controllerName, a three-level Topology,
        # and one node pool per 4x4x4 cube (16 x tpu7x-standard-4t each) --
        # the same layout this book sets up.
        #
        # Validated digest:
        #   sha256:2d44e79eb24304102a5c207288771d4d6de403a5f80346ac2fabd6e99fac7be3
        # (`:latest` currently resolves to sha256:4db67b9e30b2...)
        #
        # Still a tag, not a digest, so still mutable in principle. Pin the
        # digest once Google confirms the validated build -- at which
        # point the answer may instead be a newer tag.
        # 使用方渲染：tag 后面钉上 digest（k8s 以 digest 为准，tag 只作可读标注）。digest 出处见文件头。
        # !! 交付前要升级：v0.8.0-200 是本书实测用的版本，但不含恢复路径修复，
        # !! 要 >= v0.8.0-203 + kueue-tpu-ac 新版本（版本号以 Google 确认为准）（07 §7.2、09 D10）。v0.8.0-203 的 digest 向 Google 要（待确认）。
        # !! 拿到后只改下面这一行，步骤见 03 §3.3「升级到含修复的版本」（未实测），升级后重跑 07 §7.3。
        image: tpuongke/kueue-slice-controller:v0.8.0-200@sha256:2d44e79eb24304102a5c207288771d4d6de403a5f80346ac2fabd6e99fac7be3
        # Defensive, and cheap. A version tag should be immutable by convention,
        # but nothing enforces that on Docker Hub, and this repo has already
        # demonstrated a moving alias.
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "12"
            memory: 32Gi
          requests:
            cpu: "8"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      # Keep the controller off autoscaled CPU pools. On such a pool a
      # controller Pod can be evicted by a scale-down with
      # no TPU workload involved. A non-zero floor makes that less likely, not
      # impossible: anything above the floor is still reclaimable.
      # `default-pool` is declared in the reference blueprint and is the same pool CoreDNS
      # targets via `coredns_node_pool`; if that pool is ever renamed, this
      # line has to change with it.
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      # Without this the manager is BestEffort-adjacent in eviction terms: under
      # node pressure the kubelet ranks it alongside user workloads, and it is
      # the thing that has to be running for user workloads to be admitted at
      # all.
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: slice-controller-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: slice-controller-webhook-server-cert
---
# -----------------------------------------------------------------------------
# ResourceQuota -- this is what makes `priorityClassName: system-cluster-critical`
# on the Deployment legal. It is a gate, not a budget.
#
# GKE only admits Pods with `system-node-critical` / `system-cluster-critical`
# in namespaces that already hold a ResourceQuota whose scopeSelector names
# those classes. Without it the Deployment applies cleanly and then the
# ReplicaSet cannot create a single Pod:
#
#   Error creating: insufficient quota to match these scopes:
#   [{PriorityClass In [system-node-critical system-cluster-critical]}]
#
# The rollout then never completes and Helm waits until it times out, and
# `kubectl apply --dry-run=server` does NOT catch it,
# because the rejection happens at Pod creation, not at Deployment admission.
#
# `pods: 1G` mirrors what GKE itself puts in kube-system, gke-managed-cim and
# gke-managed-system. The number is deliberately meaningless: the object exists
# to opt the namespace in, and a real limit here would only be a tripwire for a
# future replica increase.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gcp-critical-pods
  namespace: slice-controller-system
spec:
  hard:
    pods: 1G
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values:
      - system-node-critical
      - system-cluster-critical
---
# -----------------------------------------------------------------------------
# PodDisruptionBudget -- required, not optional, given the webhooks below.
#
# All three webhook configurations use `failurePolicy: Fail` with no
# namespaceSelector. If no manager Pod is serving :9443, the API server rejects
# EVERY Job CREATE in the cluster, not just TPU ones. `replicas: 2` only helps
# if something stops both from being evicted at once -- a node drain, a pool
# upgrade, or a rollout will otherwise happily take both.
#
# minAvailable: 1 rather than maxUnavailable: 1 so the guarantee survives if
# someone later changes the replica count.
# -----------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/name: slice-controller
    control-plane: controller-manager
  name: slice-controller-controller-manager
  namespace: slice-controller-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slice-controller
      control-plane: controller-manager
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    control-plane: controller-manager
  name: slice-controller-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: slice-controller-webhook-service
      namespace: slice-controller-system
      path: /mutate-batch-v1-job
  failurePolicy: Fail
  name: mjob.kb.io
  rules:
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - jobs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: slice-controller-webhook-service
      namespace: slice-controller-system
      path: /mutate-jobset-x-k8s-io-v1alpha2-jobset
  failurePolicy: Fail
  name: mjobset.kb.io
  rules:
  - apiGroups:
    - jobset.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    resources:
    - jobsets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: slice-controller-webhook-service
      namespace: slice-controller-system
      path: /mutate-leaderworkerset-x-k8s-io-v1-leaderworkerset
  failurePolicy: Fail
  name: mleaderworkerset.kb.io
  rules:
  - apiGroups:
    - leaderworkerset.x-k8s.io
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - leaderworkersets
  sideEffects: None

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：朴素实现对每个非空的对端与本地专家组合各发一次动态远程拷贝，次数是对端数乘本地专家数，收发两端靠 semaphore 配对，EP4 验证时死锁。右：本地先计数、按专家区间对齐，打包成一块紧凑 slab，每个对端只发一次批量拷贝。">

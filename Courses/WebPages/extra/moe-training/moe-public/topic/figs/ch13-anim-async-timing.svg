<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="上：默认异步派发，Python 很快把第 1 到第 4 步都派发出去，设备一步一步慢慢算，Python 在派发点之间量到的步时远小于真实步时。下：步尾加 block_until_ready，Python 等设备算完再派发下一步，量到的间隔等于真实步时。">
<title>JAX 异步派发：Python 记下的是「派发完」的时间，不是「算完」的时间</title>

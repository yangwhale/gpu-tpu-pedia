<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="4 个 device、4 个头、序列切 4 段的示意。左：按序列切，每个 device 是一列，拿一段序列的全部头。中间一次 all-to-all，格子换 device。右：按头切，每个 device 是一行，拿某个头的完整序列，状态沿整行从头递推到尾，不用跨 device 传状态。出注意力后再 all-to-all 换回去。">
<title>Ulysses 式 CP：一次 all-to-all 把「按序列切」换成「按头切」，递推在头内原样跑完</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>
<style>
@keyframes mv { 0% { transform: translate(0px,0); opacity: 0 } 10% { transform: translate(0px,0); opacity: 0 } 11% { transform: translate(0px,0); opacity: 1 } 36% { transform: translate(480px,0); opacity: 1 } 37% { transform: translate(480px,0); opacity: 0 } 100% { transform: translate(480px,0); opacity: 0 } }
@keyframes nw { 0% { opacity: 0 } 14% { opacity: 0 } 32% { opacity: 1 } 100% { opacity: 1 } }
@keyframes tok { 0% { transform: translateX(220px); opacity: 1 } 6% { transform: translateX(220px); opacity: 1 } 9% { transform: translateX(220px); opacity: 0 } 38% { transform: translateX(0px); opacity: 0 } 40% { transform: translateX(0px); opacity: 1 } 78% { transform: translateX(220px); opacity: 1 } 100% { transform: translateX(220px); opacity: 1 } }
.mv { animation: mv 11s infinite ease-in-out; opacity: 0 } .nw { animation: nw 11s infinite ease-in-out } .tok { animation: tok 11s infinite linear }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>

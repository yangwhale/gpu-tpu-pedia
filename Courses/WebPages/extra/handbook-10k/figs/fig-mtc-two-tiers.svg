<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8e3e"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d93025"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#fff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">MTC 两层检查点：落回原 cube 读本地，换了 cube 只能读 GCS</text>

  <!-- local tier -->
  <rect x="30" y="60" width="330" height="140" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="195" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a73e8">本地层：每台 host 的内存</text>
  <text x="195" y="118" text-anchor="middle" font-size="14" fill="#202124">ramdisk，挂到 /local</text>
  <text x="195" y="143" text-anchor="middle" font-size="14" fill="#202124">快</text>
  <text x="195" y="168" text-anchor="middle" font-size="14" fill="#202124">演练时每 20 步存一次</text>

  <!-- persistent tier -->
  <rect x="560" y="60" width="330" height="140" rx="12" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="725" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#9334e6">持久层：GCS HNS 桶</text>
  <text x="725" y="118" text-anchor="middle" font-size="14" fill="#202124">慢，但换了机器还在</text>
  <text x="725" y="143" text-anchor="middle" font-size="14" fill="#202124">MTC 从不删备份</text>
  <text x="725" y="168" text-anchor="middle" font-size="14" fill="#202124">演练时每 40 步存一次</text>

  <line x1="365" y1="130" x2="553" y2="130" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/>
  <text x="459" y="118" text-anchor="middle" font-size="14" fill="#5f6368">replicator 定期写入</text>

  <!-- restore paths -->
  <rect x="30" y="250" width="400" height="140" rx="12" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="230" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8e3e">重切落回原来的 cube</text>
  <text x="230" y="308" text-anchor="middle" font-size="14" fill="#202124">host 编号不变 → 读本地层</text>
  <text x="230" y="333" text-anchor="middle" font-size="14" fill="#202124">实测 63 GiB / 约 3 s</text>
  <text x="230" y="358" text-anchor="middle" font-size="13" fill="#5f6368">（这个模型上只比 GCS 省约 20 s）</text>

  <rect x="490" y="250" width="400" height="140" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="690" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#d93025">重切换了 cube</text>
  <text x="690" y="308" text-anchor="middle" font-size="14" fill="#202124">本地副本在，但被 MaxText 列校验拒收</text>
  <text x="690" y="333" text-anchor="middle" font-size="14" fill="#202124">→ 退回持久层（40 步倍数）</text>
  <text x="690" y="358" text-anchor="middle" font-size="13" fill="#5f6368">实测 6/6 次</text>

  <line x1="195" y1="204" x2="210" y2="245" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="725" y1="204" x2="710" y2="245" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
</svg>

# =============================================================================
# 03-kueue-values.yaml —— §3.2 Kueue Helm values（chart oci://registry.k8s.io/kueue/charts/kueue）
#
# 出处：参考集群蓝图，除下面标「使用方新增」的一行外逐字照抄（含原注释）
#
# 用 Helm 装的原因：controller Deployment 和 ConfigMap kueue-manager-config 归同一个 release 管，
#   改配置 = 改这个文件 + helm upgrade，可 helm rollback
#
# 和实测集群线上 ConfigMap 的差别：
#   | 项                              | 本文件（参考集群）          | 实测集群                                   |
#   |---------------------------------|-----------------------------|--------------------------------------------------|
#   | waitForPodsReady                | 生效：30m / recovery 10m；backoffLimitCount 使用方改回 5（参考集群为 null） | **整段注释掉**（= 关闭）                |
#   | manageJobsWithoutQueueName      | true + 22 个排除 ns（+1 使用方新增）| 注释掉（= false，不带队列名的 Job 不归 Kueue 管） |
#   | groupKindConcurrency            | Pod/Job/JobSet/... 20       | Job 5 / Pod 5 / Workload 10 / LQ 5 / CQ 5        |
#   | clientConnection                | qps 200 / burst 400         | qps 300 / burst 500                              |
#   | metrics.enableClusterQueueResources | true                    | 注释掉                                           |
#   | integrations                    | 6 个                        | 另含 mpijob/ray*/appwrapper/trainjob             |
#   | featureGates                    | TAS + FailureRecoveryPolicy | 容器参数里没有 --feature-gates（用 v0.17 默认值）|
#   | 版本 / 副本 / 资源               | 0.18.x（本书按 env.sh 装 0.18.10）；3 × 16 CPU / 64Gi | v0.17；3 × req 4 CPU/16Gi、lim 8 CPU/32Gi |
#
# 使用方新增：managedJobsNamespaceSelector 的排除列表加 `rb-inspect`（= env.sh 的 $INSPECT_NS，改名要两处一起改）。
#   原因：manageJobsWithoutQueueName: true 时，被管 namespace 里不带 kueue.x-k8s.io/queue-name 的 Job
#   「will be suspended and never started unless they are assigned a queue」；在排除列表里的 namespace，
#   Job 类只在「不带队列名」时豁免，Pod 类（pod/deployment/statefulset）则彻底不管
#   04 §4.1 的逐台巡检（手动 Slice + 钉 hostname 的单 pod Job）在实测集群上能跑，是因为那里 manageJobsWithoutQueueName 关着；
#   放进排除 namespace 就是在这一个 namespace 里复现同样的条件。
#   代价：这个 namespace 里的 TPU pod 不占 Kueue 配额——只在维护窗口用，用完 04 §4.9 清干净。
#
# 版本：chart 版本 = $KUEUE_VERSION（不带 v 前缀，GA 指南写法 `--version 0.15.5`）
#
# =============================================================================
controllerManager:
  replicas: 3
  featureGates:
  - name: TopologyAwareScheduling
    enabled: true
  # Recommended for Pathways. Recovers pods that get stuck
  # in Terminating instead of leaving the workload wedged.
  #
  # This gate has existed since Kueue 0.15 as Alpha/default-false and its
  # definition is byte-identical in release-0.17 and release-0.18, so it is
  # already available on 0.17 and is not tied to any 0.18 patch
  # release.
  - name: FailureRecoveryPolicy
    enabled: true
  manager:
    resources:
      requests:
        cpu: "16"
        memory: "64Gi"
      limits:
        cpu: "16"
        memory: "64Gi"
  tolerations:
  - key: "components.gke.io/gke-managed-components"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
      enableClusterQueueResources: true
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      # Raised from 5. Keys are controller-runtime `GroupKind.String()`;
      # anything absent from this map silently runs 1 worker, which is why `Pod` is
      # listed. The four 1s serialise Kueue's shared cache -- do not raise them.
      groupKindConcurrency:
        Pod: 20
        Job.batch: 20
        JobSet.jobset.x-k8s.io: 20
        LeaderWorkerSet.leaderworkerset.x-k8s.io: 20
        Deployment.apps: 20
        StatefulSet.apps: 20
        Workload.kueue.x-k8s.io: 20
        LocalQueue.kueue.x-k8s.io: 1
        Cohort.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 1
        ResourceFlavor.kueue.x-k8s.io: 1
    # Sized together with the concurrency settings above; each replica
    # has 16 CPU to spend. burst is 2x qps.
    clientConnection:
      qps: 200
      burst: 400
    manageJobsWithoutQueueName: true
    managedJobsNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kueue-system
            - jobset-system
            - lws-system
            - gmp-system
            - gmp-public
            - cert-manager
            - pathways-job-system
            - agent-sandbox-system
            - slice-controller-system
            - gke-managed-system
            - gke-managed-cim
            - gke-managed-volumepopulator
            - gke-managed-lustrecsi
            - gke-managed-spo
            - gke-managed-networking-dra-driver
            - gke-managed-mldiagnostics
            - gke-managed-checkpointing
            - gke-managed-agentsandbox
            - kyverno
            - rb-inspect          # 本手册新增：04 §4.1 巡检 Job / 网卡检查 DaemonSet / kubectl debug 用。见文件头
    # PATHWAYS-TUNED (recommended for Pathways). Previous values are shown so the
    # change is auditable: timeout 60m, recoveryTimeout 5m, timestamp Creation,
    # backoffLimitCount 5.
    #
    # !! CLUSTER-WIDE, NOT PATHWAYS-ONLY !!
    # There is exactly one Kueue config per cluster, and `manageJobsWithoutQueueName:
    # true` above puts every non-system namespace under Kueue's management. So
    # `backoffLimitCount: null` means *every* workload on the cluster --
    # existing ones and any added later -- requeues forever and never
    # fails out on its own. That is a deliberate trade for Pathways' recovery
    # model, not an oversight. If a workload needs bounded retries, that is a
    # separate-cluster conversation, not a config edit.
    waitForPodsReady:
      timeout: 30m
      recoveryTimeout: 10m
      blockAdmission: false
      requeuingStrategy:
        timestamp: Eviction
        backoffLimitCount: 5      # 验证过的集群设成 null（无限重排）；不跑 Pathways 时恢复为 5：
                                  # 一个坏任务（如编译出的 HBM 超限后挂住）无限重排 = 每轮全量重切、烧 multi-MIG 配额和 GCE 读配额。
        backoffBaseSeconds: 60
        backoffMaxSeconds: 3600
    integrations:
      frameworks:
      - "pod"
      - "batch/job"
      - "jobset.x-k8s.io/jobset"
      - "leaderworkerset.x-k8s.io/leaderworkerset"
      - "deployment"
      - "statefulset"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="上：vmap 套在带 scalar-prefetch 参数的 kernel 上，JAX 退回显式循环，每个 batch 单独 launch 一次，每次都有流水线首尾气泡和切片拷贝。下：kernel 原生带 batch 维（或展平成 B·T），一次 launch，只有一组首尾气泡和一次拷贝，更早结束。">

# 03-slice-controller.yaml —— §3.3 kueue-slice-controller（= kueue-tpu-ac / Kueue Slice Provisioner）
#
# 出处：参考集群蓝图渲染而来（原注释保留）
#
#   它是 GA 用户指南「Install Kueue Slice Provisioner」heredoc 的加固版：heredoc 是 1 副本、无 PDB、无 ResourceQuota
#
# 渲染时替换的模板变量（取自参考集群蓝图里 slice-controller 段的模板变量）：
#   cpu_request "8" / memory_request 16Gi / cpu_limit "12" / memory_limit 32Gi
#   实测集群线上是 requests 4 CPU / 16Gi、limits 8 CPU / 32Gi，两者都跑通过。
# 唯一的非模板改动：image 在 tag 后钉 digest
#   sha256:2d44e79eb24304102a5c207288771d4d6de403a5f80346ac2fabd6e99fac7be3
#
# 交付前要升级：v0.8.0-200 不含恢复路径修复，要 >= v0.8.0-203 + kueue-tpu-ac 新版本（版本号以 Google 确认为准）（07 §7.2、09 D10）；v0.8.0-203 digest 待确认，
#   升级步骤见 03 §3.3「升级到含修复的版本」[未实测]。下面 image 行附近的英文注释讲的是「为什么不用 :latest、为什么至少 v0.8.0-200」，不是交付版本。
# 用法：kubectl apply --server-side -f 03-slice-controller.yaml    （§3.3）
# 回滚：先删 MutatingWebhookConfiguration，再删其余（§3.3 回滚段；顺序反了会让 fail-closed webhook 把全集群 Job 创建拦死）

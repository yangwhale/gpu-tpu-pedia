<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="960" height="430" fill="#fff"/>
  <text x="20" y="34" font-size="21" font-weight="bold" fill="#202124">要问的是「藏住了没有」，不是「跑得快不快」</text>
  <text x="20" y="60" font-size="15" fill="#5f6368">AG 交给 SparseCore 跑，TensorCore 同时算 GMM；AG 开始得太晚，TensorCore 就只能干等</text>

  <!-- 上：没藏住 -->
  <text x="20" y="102" font-size="16" font-weight="bold" fill="#d93025">没藏住：AG(L+2) 开始太晚</text>
  <text x="20" y="148" font-size="15" fill="#202124">TensorCore</text>
  <text x="20" y="198" font-size="15" fill="#202124">SparseCore</text>
  <rect x="130" y="126" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="230" y="150" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L)</text>
  <rect x="334" y="126" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="434" y="150" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L+1)</text>
  <rect x="538" y="126" width="130" height="36" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="603" y="150" font-size="15" text-anchor="middle" fill="#a50e0e">等（暴露）</text>
  <rect x="672" y="126" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="772" y="150" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L+2)</text>
  <rect x="160" y="176" width="190" height="34" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="255" y="199" font-size="15" text-anchor="middle" fill="#0d652d">AG(L+1)</text>
  <rect x="400" y="176" width="268" height="34" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="534" y="199" font-size="15" text-anchor="middle" fill="#8a5a00">AG(L+2)</text>
  <line x1="668" y1="214" x2="668" y2="120" stroke="#d93025" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="684" y="199" font-size="14" fill="#a50e0e">做完才能算 GMM(L+2)</text>

  <!-- 下：藏住 -->
  <text x="20" y="262" font-size="16" font-weight="bold" fill="#1e8e3e">藏住：AG(L+2) 在 GMM(L+1) 期间做完</text>
  <text x="20" y="308" font-size="15" fill="#202124">TensorCore</text>
  <text x="20" y="358" font-size="15" fill="#202124">SparseCore</text>
  <rect x="130" y="286" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="230" y="310" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L)</text>
  <rect x="334" y="286" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="434" y="310" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L+1)</text>
  <rect x="538" y="286" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="638" y="310" font-size="15" text-anchor="middle" fill="#174ea6">GMM(L+2)</text>
  <rect x="160" y="336" width="170" height="34" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="245" y="359" font-size="15" text-anchor="middle" fill="#0d652d">AG(L+1)</text>
  <rect x="340" y="336" width="190" height="34" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="435" y="359" font-size="15" text-anchor="middle" fill="#0d652d">AG(L+2)</text>
  <text x="760" y="310" font-size="14" fill="#0d652d">省下的就是「等」那一段</text>

  <text x="20" y="410" font-size="14" fill="#5f6368">同一个 AG 在 SparseCore 上执行多久、在 TensorCore 上暴露多久，是两个数（01 §3）。示意图，不按比例。</text>
</svg>

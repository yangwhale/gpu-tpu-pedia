<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" width="960" height="552" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图：三片，每片四台主机，每台主机的内存盘存着自己那一份分片，各片同一位置的主机存的是同一份，互为 peer。第一幕，进程重启或删 pod，内存盘还在，每台主机就地读自己那份；第二幕，片 2 的主机 1 换成新机器，内存盘是空的，从片 1 同位置的 peer 拉一份补齐；片内各主机存的是不同分片，彼此补不了。同位置 peer 全丢（整池）或本地层被拒，才回 GCS。">
<title>动图：三片，每片四台主机，每台主机的内存盘存着自己那一份分片，各片同一位置的主机存的是同一份，互为 peer。第一幕，进程重启或删 pod，内存盘还在，每台主机就地读自己那份；第二幕，片 2 的主机 1 换成新机器，内存盘是空的，从片 1 同位置的 peer 拉一份补齐；片内各主机存的是不同分片，彼此补不了。同位置 peer 全丢（整池）或本地层被拒，才回 GCS。</title>
<style>
@keyframes podk { 0% { opacity:1 } 8% { opacity:1 } 12% { opacity:.15 } 16% { opacity:1 } 20% { opacity:.15 } 24% { opacity:1 } 100% { opacity:1 } }

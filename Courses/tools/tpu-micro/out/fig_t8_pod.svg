<text x="20" y="110" class="sec">为什么是「环面」而不是「网格」</text>
<text x="20" y="130" class="xs">每颗芯片有 <tspan font-weight="700" fill="#202124">6 条 ICI 物理链路</tspan>，对应三维的正负方向。把最边上的一颗和最那头的一颗接起来 —— <tspan font-weight="700" fill="#d93025">多接这一条，直径就少一半</tspan>。</text>

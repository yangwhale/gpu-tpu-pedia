<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="条形图：弱扩展效率等于 1 片步时除以 N 片步时。1 片关 pipeliner 是旧代码，指数 45。10+ 片 AOT 中间档指数 47，比值约 96–97%。10+ 片生产配方换了更快的新代码，指数 41，比值超过 100%，说明分母过期。要同代码重跑 1 片当分母。"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker></defs><rect width="900" height="370" fill="#fff"/><text x="450.0" y="30.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle" fill="#202124" font-weight="bold">分母过期：1 片是旧代码跑的，10+ 片换上更快的新代码，效率就「冲过」100%</text>
<text x="450.0" y="53.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#5f6368">弱扩展效率 ＝ 1 片步时 ÷ N 片步时；条长 ＝ 步时指数（越短越快）</text>
<text x="316.0" y="110.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">1 片 pipeliner 关</text>
<text x="316.0" y="128.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="end" fill="#5f6368">旧代码 · 当分母</text>
<rect x="330.0" y="98.0" width="315.0" height="26.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="340.0" y="116.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">指数 45</text>
<text x="316.0" y="174.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">10+ 片 AOT 中间档</text>
<rect x="330.0" y="156.0" width="329.0" height="26.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="340.0" y="174.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">指数 47</text>
<text x="679.0" y="174.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="start" fill="#202124">45 ÷ 47 → 约 96–97%</text>
<text x="316.0" y="226.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">10+ 片生产配方</text>
<text x="316.0" y="244.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="end" fill="#5f6368">更快的新代码</text>
<rect x="330.0" y="214.0" width="287.0" height="26.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="340.0" y="232.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">指数 41</text>
<text x="679.0" y="232.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="start" fill="#d93025" font-weight="bold">45 ÷ 41 → 超过 100%</text>
<text x="316.0" y="284.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">1 片，同代码重跑</text>
<text x="316.0" y="302.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="end" fill="#5f6368">还没跑</text>
<rect x="330.0" y="272.0" width="287.0" height="26.0" rx="3" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="340.0" y="290.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="start" fill="#5f6368" font-weight="bold">？</text>
<text x="679.0" y="290.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="start" fill="#5f6368">该用的分母</text>
<line x1="645.0" y1="88.0" x2="645.0" y2="322.0" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="645.0" y="338.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#5f6368">分母的长度</text></svg>
<svg viewBox="0 0 1000 470" width="100%" role="img" aria-label="TPU v7 芯片全景：一颗芯片两个 chiplet，每个 chiplet 一个 TensorCore、两个 SparseCore、96 GB HBM">
<text class="svglbl" x="0" y="16" fill="#202124" style="font-size:13.5px">TPU v7（Ironwood）一颗 chip —— 双 chiplet，两个 chiplet 各有独立的内存空间</text>
<text class="svgsm" x="0" y="35">来源：Google Cloud 官方 TPU7x 文档（结构与容量）＋ JAX 公开源码里的芯片信息表（片上尺寸）</text>
<rect x="0" y="48" width="1000" height="318" rx="12" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
<text class="svgsm" x="14" y="66">一颗 chip</text>
<rect x="16" y="76" width="468" height="276" rx="10" fill="#f8f9fa" stroke="#1a73e8"/>
<text class="svglbl" x="32" y="98" fill="#1a73e8">chiplet 1　=　JAX 眼里的 device 0</text>
<rect x="32" y="108" width="330" height="130" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
<text class="svglbl" x="44" y="128" fill="#1a73e8">TensorCore ×1</text>
<rect x="44" y="138" width="140" height="20" rx="4" fill="#1a73e8"/>
<text class="svgsm" x="52" y="152" fill="#fff">MXU ×2</text>
<text class="svgsm" x="194" y="152">256 × 256 脉动阵列</text>
<rect x="44" y="162" width="140" height="20" rx="4" fill="#9334e6"/>
<text class="svgsm" x="52" y="176" fill="#fff">VPU</text>
<text class="svgsm" x="194" y="176">逐元素 · 峰值低 2 个数量级</text>
<rect x="44" y="186" width="140" height="20" rx="4" fill="#9334e6"/>
<text class="svgsm" x="52" y="200" fill="#fff">XLU</text>
<text class="svgsm" x="194" y="200">转置 / 归约 / 排列</text>
<rect x="44" y="210" width="140" height="20" rx="4" fill="#d93025"/>
<text class="svgsm" x="52" y="224" fill="#fff">标量单元 ×1</text>
<text class="svgsm" x="194" y="224">产生所有地址 —— 只有一个</text>
<rect x="370" y="108" width="98" height="130" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
<text class="svglbl" x="380" y="128" fill="#7a5000">SparseCore</text>
<text class="svgnum" x="380" y="150" fill="#7a5000">× 2</text>
<text class="svgsm" x="380" y="168" fill="#7a5000">16 subcore</text>
<text class="svgsm" x="380" y="185" fill="#7a5000">× 16 lane</text>
<text class="svgsm" x="380" y="202" fill="#7a5000">VMEM 512 KiB</text>
<text class="svgsm" x="380" y="219" fill="#7a5000">无 MXU</text>
<rect x="32" y="248" width="436" height="22" rx="4" fill="#fff" stroke="#1e8e3e"/>
<text class="svglbl" x="42" y="263" fill="#1e8e3e">VMEM</text>
<text class="svgsm" x="112" y="263" fill="#1e8e3e">64 MiB · 编译器显式管</text>
<rect x="32" y="274" width="436" height="22" rx="4" fill="#fff" stroke="#5f6368"/>
<text class="svglbl" x="42" y="289" fill="#5f6368">SMEM</text>
<text class="svgsm" x="112" y="289" fill="#5f6368">1 MiB</text>
<rect x="32" y="300" width="436" height="22" rx="4" fill="#fff" stroke="#d93025" stroke-dasharray="4 3"/>
<text class="svglbl" x="42" y="315" fill="#d93025">CMEM</text>
<text class="svgsm" x="112" y="315" fill="#d93025">0 —— 没有这一层</text>
<rect x="32" y="326" width="436" height="18" rx="4" fill="#9334e6"/>
<text class="svgsm" x="42" y="339" fill="#fff">HBM 96 GB —— 这个 chiplet 私有，不与另一个共享地址空间</text>
<rect x="516" y="76" width="468" height="276" rx="10" fill="#f8f9fa" stroke="#1a73e8"/>
<text class="svglbl" x="532" y="98" fill="#1a73e8">chiplet 2　=　JAX 眼里的 device 1</text>
<rect x="532" y="108" width="330" height="130" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
<text class="svglbl" x="544" y="128" fill="#1a73e8">TensorCore ×1</text>
<rect x="544" y="138" width="140" height="20" rx="4" fill="#1a73e8"/>
<text class="svgsm" x="552" y="152" fill="#fff">MXU ×2</text>
<text class="svgsm" x="694" y="152">256 × 256 脉动阵列</text>
<rect x="544" y="162" width="140" height="20" rx="4" fill="#9334e6"/>
<text class="svgsm" x="552" y="176" fill="#fff">VPU</text>
<text class="svgsm" x="694" y="176">逐元素 · 峰值低 2 个数量级</text>
<rect x="544" y="186" width="140" height="20" rx="4" fill="#9334e6"/>
<text class="svgsm" x="552" y="200" fill="#fff">XLU</text>
<text class="svgsm" x="694" y="200">转置 / 归约 / 排列</text>
<rect x="544" y="210" width="140" height="20" rx="4" fill="#d93025"/>
<text class="svgsm" x="552" y="224" fill="#fff">标量单元 ×1</text>
<text class="svgsm" x="694" y="224">产生所有地址 —— 只有一个</text>
<rect x="870" y="108" width="98" height="130" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
<text class="svglbl" x="880" y="128" fill="#7a5000">SparseCore</text>
<text class="svgnum" x="880" y="150" fill="#7a5000">× 2</text>
<text class="svgsm" x="880" y="168" fill="#7a5000">16 subcore</text>
<text class="svgsm" x="880" y="185" fill="#7a5000">× 16 lane</text>
<text class="svgsm" x="880" y="202" fill="#7a5000">VMEM 512 KiB</text>
<text class="svgsm" x="880" y="219" fill="#7a5000">无 MXU</text>
<rect x="532" y="248" width="436" height="22" rx="4" fill="#fff" stroke="#1e8e3e"/>
<text class="svglbl" x="542" y="263" fill="#1e8e3e">VMEM</text>
<text class="svgsm" x="612" y="263" fill="#1e8e3e">64 MiB · 编译器显式管</text>
<rect x="532" y="274" width="436" height="22" rx="4" fill="#fff" stroke="#5f6368"/>
<text class="svglbl" x="542" y="289" fill="#5f6368">SMEM</text>
<text class="svgsm" x="612" y="289" fill="#5f6368">1 MiB</text>
<rect x="532" y="300" width="436" height="22" rx="4" fill="#fff" stroke="#d93025" stroke-dasharray="4 3"/>
<text class="svglbl" x="542" y="315" fill="#d93025">CMEM</text>
<text class="svgsm" x="612" y="315" fill="#d93025">0 —— 没有这一层</text>
<rect x="532" y="326" width="436" height="18" rx="4" fill="#9334e6"/>
<text class="svgsm" x="542" y="339" fill="#fff">HBM 96 GB —— 这个 chiplet 私有，不与另一个共享地址空间</text>
<rect x="486" y="200" width="30" height="46" rx="5" fill="#e8710a"/>
<text class="svgsm" x="501" y="219" text-anchor="middle" fill="#fff">D2D</text>
<text class="svgsm" x="501" y="234" text-anchor="middle" fill="#fff">×6</text>
<text class="svglbl" x="0" y="392" fill="#202124">整颗 chip 对外：</text>
<text class="svgsm" x="112" y="392" fill="#1a73e8">HBM</text>
<text class="svgsm" x="146" y="392">192（官方表写 GiB、正文写 GB）· 7,380 GB/s</text>
<text class="svgsm" x="412" y="392" fill="#1a73e8">ICI</text>
<text class="svgsm" x="446" y="392">1,200 GB/s 双向 · 每轴 200 GB/s · 3D torus</text>
<text class="svgsm" x="712" y="392" fill="#1a73e8">算力</text>
<text class="svgsm" x="746" y="392">BF16 2,307 TFLOPS ｜ FP8 4,614 TFLOPS</text>
<line x1="0" y1="404" x2="1000" y2="404" stroke="#e8eaed"/>
<text class="svgsm" x="0" y="424" fill="#202124">① 一颗 chip = 2 个 device。所有框架日志按 device 报 —— 容量除以 2 才是你的额度</text>
<text class="svgsm" x="0" y="441" fill="#202124">② 两个 chiplet 各有独立地址空间（不再是上代的统一 MegaCore）。跨 chiplet 要走 D2D + 集合通信，不是随手读写 —— 好在 D2D 比一条 1D ICI 链路快 6 倍</text>
<text class="svgsm" x="0" y="458" fill="#d93025">③ 片上 SRAM 全是显式管理的，CMEM = 0 —— 这一整层在 GPU 那边叫 cache，在这里根本不存在（§2）</text>
</svg>
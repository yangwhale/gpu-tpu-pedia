<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="横轴是单个 all-reduce 包的大小（对数，示意），纵轴是耗时，取合并那一列。6 到 36 KiB 约 22 毫秒，160 KiB 24 毫秒，都贴着地板；15 MiB 升到 65 毫秒，64 MiB 到 160 毫秒。">

<rect width="900" height="400" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >小包都贴着约 21–22 ms 地板：DCN 先怕发起次数，再怕字节</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >单个 DCN all-reduce 耗时（host 侧中位，§2 表合并列）；横轴对数、示意</text>
<line x1="110.0" y1="346.0" x2="840.0" y2="346.0" stroke="#5f6368" stroke-width="1.5" />
<line x1="110.0" y1="96.0" x2="110.0" y2="346.0" stroke="#5f6368" stroke-width="1.5" />
<text x="840.0" y="380.0" font-size="13" fill="#5f6368" text-anchor="end" >包大小（对数）→</text>
<text x="100.0" y="100.0" font-size="13" fill="#5f6368" text-anchor="end" >耗时</text>
<rect x="111.0" y="311.6" width="729.0" height="6.0" rx="0" fill="#fce8e6" stroke="none" stroke-width="1.5" />
<line x1="110.0" y1="315.3" x2="840.0" y2="315.3" stroke="#d93025" stroke-width="1.5" stroke-dasharray="6 4" />
<text x="836.0" y="337.3" font-size="14" fill="#d93025" text-anchor="end" >地板 ≈ 21–22 ms：一次发起的固定开销</text>
<polyline points="214.1,314.6 379.5,311.7 698.6,253.1 800.0,117.4" fill="none" stroke="#e8710a" stroke-width="2" stroke-dasharray="2 4"/>
<circle cx="214.1" cy="314.6" r="6" fill="#1a73e8"/>
<text x="214.1" y="364.0" font-size="13" fill="#202124" text-anchor="middle" >6–36 KiB</text>
<text x="224.1" y="304.6" font-size="13" fill="#1a73e8" text-anchor="start" >≈22 ms</text>
<circle cx="379.5" cy="311.7" r="6" fill="#1a73e8"/>
<text x="379.5" y="364.0" font-size="13" fill="#202124" text-anchor="middle" >160 KiB</text>
<text x="389.5" y="301.7" font-size="13" fill="#1a73e8" text-anchor="start" >24 ms</text>
<circle cx="698.6" cy="253.1" r="6" fill="#1a73e8"/>
<text x="698.6" y="364.0" font-size="13" fill="#202124" text-anchor="middle" >15 MiB</text>
<text x="688.6" y="243.1" font-size="13" fill="#1a73e8" text-anchor="end" >65 ms</text>
<circle cx="800.0" cy="117.4" r="6" fill="#1a73e8"/>
<text x="800.0" y="364.0" font-size="13" fill="#202124" text-anchor="middle" >64 MiB</text>
<text x="790.0" y="107.4" font-size="13" fill="#1a73e8" text-anchor="end" >160 ms</text>
</svg>

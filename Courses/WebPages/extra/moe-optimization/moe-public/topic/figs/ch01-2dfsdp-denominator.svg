<text x="266.0" y="324.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">1024 芯片</text>
<text x="884.0" y="312.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">约 97%</text></svg>
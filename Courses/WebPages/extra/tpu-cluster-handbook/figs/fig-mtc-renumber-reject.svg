<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="980" height="490" fill="#fff"/><text x="490.0" y="32" text-anchor="middle" font-size="18" fill="#202124" font-weight="bold">为什么换一个 cube，本地层就整体作废：编号按节点名排序发</text><text x="490.0" y="64" text-anchor="middle" font-size="14" fill="#5f6368">每格 = 一个 cube（16 台 host），按节点名里的池 hash 排序；格里是这 16 台拿到的编号段</text><text x="50" y="114" text-anchor="end" font-size="14" fill="#202124" font-weight="bold">换之前</text><rect x="70" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="95.0" y="113" text-anchor="middle" font-size="13" fill="#202124">0</text><rect x="124" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="149.0" y="113" text-anchor="middle" font-size="13" fill="#202124">16</text><rect x="178" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="203.0" y="113" text-anchor="middle" font-size="13" fill="#202124">32</text><rect x="232" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="257.0" y="113" text-anchor="middle" font-size="13" fill="#202124">48</text><rect x="286" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="311.0" y="113" text-anchor="middle" font-size="13" fill="#202124">64</text><rect x="340" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="365.0" y="113" text-anchor="middle" font-size="13" fill="#202124">80</text><rect x="394" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="419.0" y="113" text-anchor="middle" font-size="13" fill="#202124">96</text><rect x="448" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="473.0" y="113" text-anchor="middle" font-size="13" fill="#202124">112</text><rect x="502" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="527.0" y="113" text-anchor="middle" font-size="13" fill="#202124">128</text><rect x="556" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="581.0" y="113" text-anchor="middle" font-size="13" fill="#202124">144</text><rect x="610" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="635.0" y="113" text-anchor="middle" font-size="13" fill="#202124">160</text><rect x="664" y="90" width="50" height="36" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/><text x="689.0" y="113" text-anchor="middle" font-size="13" fill="#202124">176</text><rect x="718" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="743.0" y="113" text-anchor="middle" font-size="13" fill="#202124">192</text><rect x="772" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="797.0" y="113" text-anchor="middle" font-size="13" fill="#202124">208</text><rect x="826" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="851.0" y="113" text-anchor="middle" font-size="13" fill="#202124">224</text><rect x="880" y="90" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="905.0" y="113" text-anchor="middle" font-size="13" fill="#202124">240</text><text x="50" y="214" text-anchor="end" font-size="14" fill="#202124" font-weight="bold">换之后</text><rect x="70" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="95.0" y="213" text-anchor="middle" font-size="13" fill="#202124">0</text><rect x="124" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="149.0" y="213" text-anchor="middle" font-size="13" fill="#202124">16</text><rect x="178" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="203.0" y="213" text-anchor="middle" font-size="13" fill="#202124">32</text><rect x="232" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="257.0" y="213" text-anchor="middle" font-size="13" fill="#202124">48</text><rect x="286" y="190" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/><text x="311.0" y="213" text-anchor="middle" font-size="13" fill="#202124">64</text><rect x="340" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="365.0" y="213" text-anchor="middle" font-size="13" fill="#202124">80</text><rect x="394" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="419.0" y="213" text-anchor="middle" font-size="13" fill="#202124">96</text><rect x="448" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="473.0" y="213" text-anchor="middle" font-size="13" fill="#202124">112</text><rect x="502" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="527.0" y="213" text-anchor="middle" font-size="13" fill="#202124">128</text><rect x="556" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="581.0" y="213" text-anchor="middle" font-size="13" fill="#202124">144</text><rect x="610" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="635.0" y="213" text-anchor="middle" font-size="13" fill="#202124">160</text><rect x="664" y="190" width="50" height="36" rx="4" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/><text x="689.0" y="213" text-anchor="middle" font-size="13" fill="#202124">176</text><rect x="718" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="743.0" y="213" text-anchor="middle" font-size="13" fill="#202124">192</text><rect x="772" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="797.0" y="213" text-anchor="middle" font-size="13" fill="#202124">208</text><rect x="826" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="851.0" y="213" text-anchor="middle" font-size="13" fill="#202124">224</text><rect x="880" y="190" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="905.0" y="213" text-anchor="middle" font-size="13" fill="#202124">240</text><path d="M311.0,128 L365.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M365.0,128 L419.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M419.0,128 L473.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M473.0,128 L527.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M527.0,128 L581.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M581.0,128 L635.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><path d="M635.0,128 L689.0,186" stroke="#5f6368" stroke-width="1.2" marker-end="url(#ar)"/><text x="311" y="248" text-anchor="middle" font-size="13" fill="#1e8e3e">备件的名字排在这里</text><text x="689" y="82" text-anchor="middle" font-size="13" fill="#d93025">坏 cube</text><text x="502" y="268" text-anchor="middle" font-size="14" fill="#b06000">中间这 7 个 cube 的 host 编号整段 +16 → 校验认为手上是「另一列」写的分片</text><text x="60" y="310" text-anchor="start" font-size="15" fill="#202124">1. MaxText 从最新步往回走，挨台问：你手上这份是不是你这一列写的？</text><text x="60" y="338" text-anchor="start" font-size="15" fill="#d93025">2. 一台说「不是」→ 全体放弃本地层（3 片实测换 1 个 cube：10–28 台说不是）</text><text x="60" y="366" text-anchor="start" font-size="15" fill="#d93025">3. 去 GCS 找最近的持久层步数：换 cube 的 6 次全退回，每次多丢 14–36 步</text><text x="60" y="394" text-anchor="start" font-size="15" fill="#1e8e3e">4. 离线核实：被拒的数据其实都对。演练每片 4 路数据并行，同分片＝序号模 4 相同；校验按模 16 认列，严了 4 倍</text><text x="60" y="422" text-anchor="start" font-size="15" fill="#1e8e3e">　 生产配置片内不做数据并行，不会这样误拒</text><text x="490.0" y="478" text-anchor="middle" font-size="13" fill="#5f6368">示意：只画 16 个 cube，实际集群更多；挪位范围取决于备件名字排在哪。</text></svg>

<rect x="112.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#e8710a" />
<text x="140.0" y="85.0" font-size="14" fill="#202124">沿 EP 轴 all-gather 的数据</text>
<text x="30.0" y="127.0" font-size="16" fill="#202124" font-weight="700">原来：先 gather 再 top-k</text>
<text x="30.0" y="169.0" font-size="13" fill="#5f6368">本地 logits</text>
<g>
<rect x="30.0" y="177.0" width="300.0" height="40.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="180.0" y="201.7" font-size="13" fill="#202124" text-anchor="middle">E 列（专家数）</text>
</g>

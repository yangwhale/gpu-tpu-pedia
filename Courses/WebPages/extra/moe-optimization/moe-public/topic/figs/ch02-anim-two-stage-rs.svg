<g class="a16"><line x1="190.0" y1="316" x2="190.0" y2="394" stroke="#202124" stroke-width="1.5" opacity="0.55"/></g>
<line x1="546.2" y1="104.0" x2="546.2" y2="398.0" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3 3"/>

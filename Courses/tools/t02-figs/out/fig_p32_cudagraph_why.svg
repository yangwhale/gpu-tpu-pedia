<rect x="210" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="244" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="274" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="274" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="308" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="338" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="338" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="372" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="402" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="402" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="436" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="466" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="466" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="500" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="530" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="530" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="564" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="594" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="594" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="628" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<line x1="658" y1="226" x2="658" y2="260" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="654" y="272" class="xxs" fill="#5f6368" text-anchor="end">跑完</text>
<rect x="706" y="84" width="674" height="280" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="724" y="112" class="sec" fill="#1e8e3e">✅ 开 graph：一次提交，GPU 连着跑</text>
<text x="724" y="134" class="xxs" fill="#5f6368">整张 DAG 在 capture 时定死，之后 CPU 只发一条 replay</text>
<text x="722" y="185" class="xxs" fill="#5f6368">CPU</text>
<rect x="768" y="168" width="594" height="24" rx="3" fill="#fff" stroke="#9aa0a6" stroke-width="0.8"/>
<text x="722" y="245" class="xxs" fill="#5f6368">GPU</text>
<rect x="768" y="228" width="594" height="24" rx="3" fill="#fff" stroke="#9aa0a6" stroke-width="0.8"/>
<rect x="768" y="171" width="132" height="18" rx="2" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="0.9"/>
<text x="908" y="185" class="xxs" fill="#1e8e3e">一条 replay</text>
<rect x="768" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="798" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="828" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="858" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="888" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="918" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="948" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="978" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<rect x="1008" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>
<line x1="1344" y1="226" x2="1344" y2="260" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="1034" y="272" class="xxs" fill="#1e8e3e" text-anchor="end">跑完</text>
<line x1="1038" y1="286" x2="1344" y2="286" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="1191.0" y="302" class="xxs" fill="#1e8e3e" text-anchor="middle">省下来的全是空等</text>
<text x="38" y="306" class="xs">kernel 越小，<tspan font-weight="700" fill="#d93025">红色空隙占的比例越大</tspan>。推理 decode 一个 token 步里 kernel 又多又碎，<tspan font-weight="700" fill="#202124">很容易走到「CPU 喂不过来、GPU 闲</tspan></text>
<text x="38" y="324" class="xs"><tspan font-weight="700" fill="#202124">着」的地步</tspan>。</text>
<text x="724" y="306" class="xs"><tspan font-weight="700" fill="#202124">两边的蓝格子一样多、一样宽</tspan> —— <tspan font-weight="700" fill="#d93025">kernel 该跑多久还是跑多久</tspan>。右边早早收工，省的<tspan font-weight="700" fill="#202124">全部</tspan>是格子之间那段空等。</text>
<rect x="20" y="386" width="1360" height="104" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="38" y="412" class="sec">🔢 那笔账：为什么「发指令」能吃掉几十毫秒</text>
<text x="38" y="436" class="xs">单次 kernel launch，CPU 端<tspan font-weight="700" fill="#202124">大致 5–10 微秒</tspan>（量级，不是规格）。　→　MoE 训练一个 step 有<tspan font-weight="700" fill="#202124">上万个 kernel</tspan>（专家数 × 层数 × 前后向）　→　<tspan font-weight="700" fill="#202124">光是发，就是几十毫秒的主机开销</tspan>。</text>
<text x="38" y="456" class="xs"><tspan font-weight="700" fill="#202124">开 graph 之后这一整笔变成一次 replay。</tspan>所以收益跟<tspan font-weight="700" fill="#202124">「kernel 有多碎、有多少个」成正比</tspan> —— <tspan font-weight="700" fill="#d93025">kernel 极碎的负载上，开与不开差到三倍以上是实测见过的量级</tspan><tspan fill="#9aa0a6">（具体数字跟模型和集群强相关，这里只给量级）</tspan>。</text>
<rect x="20" y="512" width="1360" height="104" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="538" class="sec" fill="#1a73e8">＋ 还有一小块，在 GPU 那一侧</text>
<text x="38" y="562" class="xs">直线型 graph 重复 launch 时，<tspan font-weight="700" fill="#202124">节点之间的间隙也被优化掉一部分，约 60 纳秒一个节点</tspan>（NVIDIA 给的数）。上万个节点就是<tspan font-weight="700" fill="#202124">毫秒级</tspan> —— 比不上主机那一笔，但不是零。</text>
<text x="38" y="582" class="xxs"><tspan fill="#9aa0a6">代价也要说：</tspan><tspan font-weight="700" fill="#202124">首次 launch 仍然要把整张图的 work description 上传到 GPU</tspan>，这笔一次性成本跑不掉，图改了还得再付一部分。所以 graph 只对「同一张图反复跑很多遍」的场景划算。</text>
<rect x="20" y="638" width="1360" height="106" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="38" y="666" class="sec" fill="#d93025">⭐ 落点：快的是「喂」这个动作，不是「算」这个动作</text>
<text x="38" y="692" class="xs">这一条决定了后面两张图。<tspan font-weight="700" fill="#202124">既然省的是主机侧的发射开销，那 kernel 内部就没有任何理由发生变化</tspan> —— 事实也确实如此，下一张图专门拆开看。</text>
<text x="38" y="713" class="xs"><tspan font-weight="700" fill="#202124">一个能当场用的推论</tspan>：<tspan font-weight="700" fill="#d93025">kernel 越碎，CUDA Graph 收益越大；反过来，一个从头跑到尾的大 GEMM，开 graph 几乎白开。</tspan><tspan fill="#9aa0a6">（这一条是我从机制推的，不是谁的原话 —— 但它可以直接拿去测。）</tspan></text>
<rect x="20" y="766" width="1360" height="92" rx="10" fill="#fff" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="38" y="792" class="sec">⚠️ 出处分层</text>
<text x="38" y="816" class="xs"><tspan font-weight="700" fill="#202124">查到的</tspan>：直线型 graph 重复 launch 每节点约省 60 ns；首次 launch 需上传 work description，这笔成本只付一次、图更新时补付一部分 —— 出自 NVIDIA 开发者博客。</text>
<text x="38" y="836" class="xxs"><tspan font-weight="700" fill="#202124">量级不是规格</tspan>：单次 launch 5–10 微秒会随驱动、CPU、参数个数变。　<tspan font-weight="700" fill="#d93025">我推的</tspan>：「碎 kernel 收益大、大 GEMM 白开」是从机制推的结论。</text>
</svg>
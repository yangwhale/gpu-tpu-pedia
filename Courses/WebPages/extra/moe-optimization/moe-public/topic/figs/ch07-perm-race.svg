<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="原始样本顺序 1 到 6。正常的 lane 把打乱排列 P 套一次，得到 3 6 1 5 2 4；输掉竞争的线程拿到的是这份已经打乱过的列表，又套了一次 P，得到 1 4 3 2 6 5。两条 lane 里每个样本都完好，只是顺序不同。">
<title>原始样本顺序 1 到 6。正常的 lane 把打乱排列 P 套一次，得到 3 6 1 5 2 4；输掉竞争的线程拿到的是这份已经打乱过的列表，又套了一次 P，得到 1 4 3 2 6 5。两条 lane 里每个样本都完好，只是顺序不同。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="310" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">样本没坏、顺序却不一样：输掉竞争的线程把同一个排列又套了一遍</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">示意。数字是样本编号；P＝这个 epoch 的打乱排列。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">样本</text>
<rect x="100.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="122.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">顺序和别的 lane 不同</text>
<text x="80.0" y="130.0" font-size="14" fill="#5f6368" text-anchor="start">原始</text>
<g>
<rect x="80.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="97.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">1</text>
</g>
<g>
<rect x="120.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="137.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">2</text>
</g>
<g>
<rect x="160.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="177.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">3</text>
</g>
<g>
<rect x="200.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="217.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">4</text>
</g>
<g>
<rect x="240.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="257.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">5</text>
</g>
<g>
<rect x="280.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="297.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">6</text>
</g>
<line x1="322.0" y1="157.0" x2="422.0" y2="157.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="372.0" y="148.0" font-size="13" fill="#5f6368" text-anchor="middle">套一次 P</text>
<text x="430.0" y="130.0" font-size="14" fill="#202124" text-anchor="start">正常 lane（赢了的线程）</text>
<g>
<rect x="430.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="447.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">3</text>
</g>
<g>
<rect x="470.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="487.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">6</text>
</g>
<g>
<rect x="510.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="527.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">1</text>
</g>
<g>
<rect x="550.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="567.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">5</text>
</g>
<g>
<rect x="590.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="607.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">2</text>
</g>
<g>
<rect x="630.0" y="140.0" width="34.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="647.0" y="162.4" font-size="15" fill="#174ea6" text-anchor="middle">4</text>
</g>
<line x1="547.0" y1="178.0" x2="547.0" y2="236.0" stroke="#d93025" stroke-width="1.5" marker-end="url(#ahr)"/>
<text x="557.0" y="210.0" font-size="13" fill="#a50e0e" text-anchor="start">拿着已打乱的列表又套一次 P</text>
<text x="430.0" y="294.0" font-size="14" fill="#a50e0e" text-anchor="start">输掉竞争的线程：P∘P</text>
<g>

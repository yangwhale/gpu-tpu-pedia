# =============================================================================
# 06-envbuild-pod.yaml —— 06c §6.2：在 CPU 池上构建一次 Python 环境 tar 并上传 GCS（其余 worker 只解压）
#   （参考 JIT 基线作业用的 tar 就是这个 pod 构建的；退出码 0，脚本最后打印 ENV_BUILD_OK）。
#   脚本逐行照抄，只做了下表的参数化，另把 Artifact Registry PyPI 代理改成「有就用、没有就走默认 PyPI」。
#   产物约 10.3 GB。
#
# 占位（由 06-build-env.sh 用 envsubst 填，默认值见 06-build-env.sh）：
#   ${ENVBUILD_POD} pod 名              ${NS} namespace            ${SYSTEM_POOL} 跑在哪个 CPU 池（实测集群 default-pool）
#   ${GITHUB_SECRET} 私仓 token Secret   ${MAXTEXT_REPO} / ${MAXTEXT_BRANCH} / ${MAXTEXT_COMMIT}  代码版本（训练方给）
#   ${LIBTPU_VERSION} libtpu 版本        ${AR_PYPI} AR PyPI 远程仓库 host/path（可空）
#   ${PROJECT} ${DATA_BUCKET} ${ENV_TAR} 上传目标 gs://$DATA_BUCKET/$ENV_TAR
#   ${IMAGE}  基础镜像，必须与 06-jobset.sh 生成的 JobSet 同一个 digest
# 注意（实测）：本 pod 不挂 gcsfuse，所以在没开 Workload Identity 的池上也能跑（实测集群就是在
#   未开 WI 的 default-pool 上跑的，那时 metadata server 给的是节点 SA 的 token）；02-create-cluster.sh 现在给系统池开 GKE_METADATA，
#   token 会换成 pod 的 K8s SA 所绑定的身份——下面的权限要授给那个身份，而不是节点 SA。
# 权限前提 [推断]：pod 的 K8s SA（Workload Identity）对桶有 roles/storage.objectUser（上传），
#   用 AR 时还要 roles/artifactregistry.reader（原脚本从 metadata server 取 token 访问 AR）。
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: ${ENVBUILD_POD}
  namespace: ${NS}
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: ${SYSTEM_POOL}
  containers:
  - name: b
    image: ${IMAGE}
    imagePullPolicy: IfNotPresent
    resources:
      requests: {cpu: "4", memory: 12Gi, ephemeral-storage: 40Gi}
    env:
    - name: GITHUB_TOKEN
      valueFrom: {secretKeyRef: {key: token, name: "${GITHUB_SECRET}"}}
    - {name: UV_HTTP_RETRIES, value: "15"}
    - {name: PIP_RETRIES, value: "15"}
    command: [bash, -c]
    args:
    - |
      set -eo pipefail
      if [ -n "${AR_PYPI}" ]; then
        AR_TOKEN=$(curl -s -H 'Metadata-Flavor: Google' http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
        export UV_INDEX_URL="https://oauth2accesstoken:${AR_TOKEN}@${AR_PYPI}"
        export UV_DEFAULT_INDEX="$UV_INDEX_URL" PIP_INDEX_URL="$UV_INDEX_URL"
      fi
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      set -x
      git clone --branch="${MAXTEXT_BRANCH}" ${MAXTEXT_REPO} /root/maxtext
      cd /root/maxtext && git checkout ${MAXTEXT_COMMIT}
      pip install uv
      uv venv --python 3.12 --seed maxtext_venv
      source maxtext_venv/bin/activate
      uv pip install -e '.[tpu]' --resolution=lowest
      install_maxtext_tpu_github_deps
      uv pip install -U --no-deps libtpu==${LIBTPU_VERSION} -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
      uv pip uninstall optax 2>/dev/null || true
      uv pip install git+https://github.com/google-deepmind/optax
      uv pip install yq
      mkdir -p /root/maxtext/.bin
      curl -fsSL -o /root/maxtext/.bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 && chmod +x /root/maxtext/.bin/jq
      PATH=/root/maxtext/.bin:$PATH yq --version && PATH=/root/maxtext/.bin:$PATH jq --version
      python -c 'import jax,jaxlib,importlib.metadata as m;print("VERSIONS jax",jax.__version__,"jaxlib",jaxlib.__version__,"libtpu",m.version("libtpu"),"qwix",m.version("qwix"),"tokamax",m.version("tokamax"),"optax",m.version("optax"))'
      uv pip freeze > /root/maxtext/.env-freeze.txt
      echo "maxtext=${MAXTEXT_COMMIT} image=${IMAGE} libtpu=${LIBTPU_VERSION} built=$(date -u +%FT%TZ)" > /root/maxtext/.env-info
      set +x
      git config --global --unset url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf
      git -C /root/maxtext remote set-url origin ${MAXTEXT_REPO}
      deactivate
      tar -C / -cf /tmp/env.tar root/maxtext && ls -la /tmp/env.tar
      python3 -m venv /tmp/up && /tmp/up/bin/pip -q install google-cloud-storage
      /tmp/up/bin/python - <<'PY'
      from google.cloud import storage
      b=storage.Client(project="${PROJECT}").bucket("${DATA_BUCKET}")
      bl=b.blob("${ENV_TAR}"); bl.chunk_size=256*1024*1024
      bl.upload_from_filename("/tmp/env.tar"); print("UPLOADED", bl.name)
      PY
      echo ENV_BUILD_OK

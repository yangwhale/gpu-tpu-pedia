<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" width="960" height="458" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="七层超时按应有的检测顺序从内到外排成七行。左边灰条是现状默认值（对数长度）：最内层 TensorStore 单个 GCS 请求没有上限，Orbax 存档超时比存档间隔还长，shutdown barrier 与 restore 各 300 秒赛跑，Orbax 内的 jax 初始化写死 900 秒，jax 分布式初始化 1800 秒，MegaScale hang 检测 5 分钟，拓扑发现 4000 秒，长短毫无顺序。右边蓝条是应有的样子：从内到外一层比一层长，任何一层都有上限。">
<title>七层超时按应有的检测顺序从内到外排成七行。左边灰条是现状默认值（对数长度）：最内层 TensorStore 单个 GCS 请求没有上限，Orbax 存档超时比存档间隔还长，shutdown barrier 与 restore 各 300 秒赛跑，Orbax 内的 jax 初始化写死 900 秒，jax 分布式初始化 1800 秒，MegaScale hang 检测 5 分钟，拓扑发现 4000 秒，长短毫无顺序。右边蓝条是应有的样子：从内到外一层比一层长，任何一层都有上限。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="458" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">超时没排序：最内层没有上限，最外层又最慢</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">从上到下＝应有的检测顺序（内 → 外）。灰条按默认值取对数；虚线＝默认值没有数；蓝条是应有的阶梯（示意）。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">现状默认值</text>
<rect x="142.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="164.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">没有上限</text>
<rect x="246.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="268.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">应有：内层先超时</text>
<text x="250.0" y="124.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">现状</text>
<text x="720.0" y="124.0" font-size="15" fill="#174ea6" text-anchor="start" font-weight="700">应有（示意）</text>
<line x1="700.0" y1="108.0" x2="700.0" y2="414.0" stroke="#dadce0" stroke-width="1.5"/>
<text x="24.0" y="153.0" font-size="14" fill="#202124" text-anchor="start">TensorStore 单个 GCS 请求</text>
<rect x="250.0" y="138.0" width="340.0" height="20.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<line x1="590.0" y1="148.0" x2="620.0" y2="148.0" stroke="#d93025" stroke-width="2" marker-end="url(#ahr)"/>
<text x="260.0" y="153.0" font-size="14" fill="#a50e0e" text-anchor="start">无 deadline：写卡 20 min 也不报错</text>
<rect x="720.0" y="138.0" width="28.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="193.0" font-size="14" fill="#202124" text-anchor="start">Orbax 存档超时</text>
<line x1="250.0" y1="188.0" x2="310.0" y2="188.0" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320.0" y="193.0" font-size="14" fill="#202124" text-anchor="start">库默认（无数值），比存档间隔还长</text>
<rect x="720.0" y="178.0" width="58.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="233.0" font-size="14" fill="#202124" text-anchor="start">shutdown barrier / restore</text>
<rect x="250.0" y="218.0" width="20.0" height="20.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="278.0" y="233.0" font-size="14" fill="#202124" text-anchor="start">300 s / 300 s 赛跑</text>
<rect x="720.0" y="218.0" width="88.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="273.0" font-size="14" fill="#202124" text-anchor="start">Orbax 内的 jax 初始化</text>
<rect x="250.0" y="258.0" width="138.8" height="20.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="396.8" y="273.0" font-size="14" fill="#202124" text-anchor="start">900 s，写死</text>
<rect x="720.0" y="258.0" width="118.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="313.0" font-size="14" fill="#202124" text-anchor="start">jax 分布式初始化</text>
<rect x="250.0" y="298.0" width="213.7" height="20.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="471.7" y="313.0" font-size="14" fill="#202124" text-anchor="start">1,800 s</text>
<rect x="720.0" y="298.0" width="148.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="353.0" font-size="14" fill="#202124" text-anchor="start">MegaScale hang 检测</text>
<rect x="250.0" y="338.0" width="20.0" height="20.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="278.0" y="353.0" font-size="14" fill="#202124" text-anchor="start">5 min</text>
<rect x="720.0" y="338.0" width="178.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="393.0" font-size="14" fill="#202124" text-anchor="start">MegaScale 拓扑发现</text>
<rect x="250.0" y="378.0" width="300.0" height="20.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="558.0" y="393.0" font-size="14" fill="#202124" text-anchor="start">4,000 s</text>
<rect x="720.0" y="378.0" width="208.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="24.0" y="440.0" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700">现状：内层该先报的错被外层盖住，故障要等最慢那层超时才暴露。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" width="900" height="415" role="img" aria-label="动图示意，前向几层。上：HBM 放得下两层权重，下一层的 AG 在这一层计算时就发出，计算一层接一层，几乎不等。下：HBM 只放得下一层，下一层的 AG 必须等这一层算完、buffer 释放后才能发，TensorCore 每层都干等，整步更晚结束。绿色条是每层权重 buffer 在 HBM 里的存活时间。"><style>
@keyframes sw2 { 0% { transform: translate(0px,0px); opacity: 0 } 7.0% { transform: translate(0px,0px); opacity: 0 } 10.0% { transform: translate(0px,0px); opacity: 1 } 85% { transform: translate(679.4px,0px); opacity: 1 } 100% { transform: translate(679.4px,0px); opacity: 1 } }
.sw2 { animation: sw2 11s linear infinite; }
@keyframes sw4 { 0% { transform: translate(0px,0px); opacity: 0 } 7.0% { transform: translate(0px,0px); opacity: 0 } 10.0% { transform: translate(0px,0px); opacity: 1 } 85% { transform: translate(679.4px,0px); opacity: 1 } 100% { transform: translate(679.4px,0px); opacity: 1 } }
.sw4 { animation: sw4 11s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }

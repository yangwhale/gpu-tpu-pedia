<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f3f4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa0a6" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="920" height="400" fill="#fff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">健康数刚好在 SLO 线 130 时：S 取 16，128 cube 的任务永远准入不了</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#5f6368">保证配额 = min(128, 当日 HEALTHY − S) × 64；下图按 cube 数画，横轴 0 → 144</text>

  <!-- scale: x = 200 + cube * 4.5 ; 144 -> 848 -->
  <!-- row 1: S = 16 -->
  <text x="30" y="110" font-size="16" font-weight="bold" fill="#d93025">S = 16</text>
  <text x="30" y="132" font-size="13" fill="#5f6368">把规划空出的 16</text>
  <text x="30" y="150" font-size="13" fill="#5f6368">直接当 S</text>
  <rect x="200" y="96" width="513" height="44" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="456" y="124" text-anchor="middle" font-size="15" fill="#202124">保证配额 114 cube</text>
  <rect x="713" y="96" width="72" height="44" fill="url(#hatch)" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="759" y="160" text-anchor="end" font-size="13" fill="#5f6368">留空 16</text>

  <!-- row 2: S = 2–4 -->
  <text x="30" y="215" font-size="16" font-weight="bold" fill="#1e8e3e">S = 2–4</text>
  <text x="30" y="237" font-size="13" fill="#5f6368">推荐：16 已体现在</text>
  <text x="30" y="255" font-size="13" fill="#5f6368">「最大任务 128」里</text>
  <rect x="200" y="200" width="576" height="44" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="488" y="228" text-anchor="middle" font-size="15" fill="#202124">保证配额 126–128 cube</text>
  <rect x="776" y="200" width="9" height="44" fill="url(#hatch)" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="793" y="228" text-anchor="start" font-size="13" fill="#5f6368">空闲</text>

  <!-- markers -->
  <line x1="776" y1="80" x2="776" y2="290" stroke="#1a73e8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="785" y1="80" x2="785" y2="290" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="848" y1="80" x2="848" y2="290" stroke="#dadce0" stroke-width="1.5"/>
  <text x="776" y="306" text-anchor="middle" font-size="13" fill="#1a73e8">128</text>
  <text x="803" y="306" text-anchor="middle" font-size="13" fill="#5f6368">130</text>
  <text x="852" y="306" text-anchor="middle" font-size="13" fill="#5f6368">144</text>
  <text x="713" y="306" text-anchor="middle" font-size="13" fill="#d93025">114</text>
  <text x="200" y="306" text-anchor="middle" font-size="13" fill="#5f6368">0</text>
  <text x="776" y="76" text-anchor="end" font-size="13" fill="#1a73e8">最大任务 128 cube ▸</text>

  <!-- takeaways -->
  <rect x="30" y="324" width="425" height="58" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="242" y="348" text-anchor="middle" font-size="14" fill="#202124">114 &lt; 128：只有 144 全健康那天</text>
  <text x="242" y="370" text-anchor="middle" font-size="14" fill="#202124">配额才够 128</text>
  <rect x="465" y="324" width="425" height="58" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="677" y="348" text-anchor="middle" font-size="14" fill="#202124">坏一片后还有 2–4 个健康 cube 可重切</text>
  <text x="677" y="370" text-anchor="middle" font-size="14" fill="#202124">S 取 2 时配额仍封顶 128</text>
</svg>

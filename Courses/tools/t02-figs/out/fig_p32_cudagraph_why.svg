<rect x="146" y="171" width="30" height="18" rx="2" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="0.9"/>
<rect x="146" y="231" width="34" height="18" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="180" y="231" width="30" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.9"/>

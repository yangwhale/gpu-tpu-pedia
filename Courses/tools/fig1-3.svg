<svg viewBox="0 0 1000 678" width="100%" role="img" aria-label="TPU v7 与 B200 的存储层级对照，共用一根纵轴，空格子表示该层不存在">
<text class="svglbl" x="0" y="16" fill="#202124" style="font-size:13.5px">把两边挂在同一根纵轴上 —— 同一高度＝同一层级，空格子就是「这边没有这一层」</text>
<text class="svgsm" x="0" y="35">纵轴：大体按离计算单元由近到远。中间那两行（协处理器 · 小单元）不是存储，是挂在核里的部件，单独看</text>
<text class="svglbl" x="168" y="60" fill="#1e8e3e">TPU v7（口径逐行标注，不统一）</text>
<text class="svglbl" x="592" y="60" fill="#1a73e8">GB200（口径逐行标注，不统一）</text>
<line x1="154" y1="70" x2="154" y2="574" stroke="#dadce0"/>
<text class="svglbl" x="142" y="92" text-anchor="end" fill="#202124">寄存器</text>
<text class="svgsm" x="142" y="108" text-anchor="end">离计算单元最近</text>
<rect x="168" y="70" width="404" height="70" rx="7" fill="#fff" stroke="#1e8e3e" stroke-width="0.8"/>
<text class="svgsm" x="182" y="92" fill="#202124">向量寄存器 8 × 128 × 32 bit = 4 KiB／个</text>
<text class="svgsm" x="182" y="109" fill="#202124">累加器 128 个</text>
<rect x="592" y="70" width="408" height="70" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="0.8"/>
<text class="svgsm" x="606" y="92" fill="#202124">寄存器堆 64K × 32 bit = 256 KB／SM</text>
<text class="svgsm" x="606" y="109" fill="#202124">每线程最多 255 个</text>
<text class="svglbl" x="142" y="176" text-anchor="end" fill="#202124">片上 · 显式管</text>
<text class="svgsm" x="142" y="192" text-anchor="end">谁放什么，由人或编译器决定</text>
<rect x="168" y="154" width="404" height="70" rx="7" fill="#fff" stroke="#1e8e3e" stroke-width="0.8"/>
<text class="svgsm" x="182" y="176" fill="#202124">VMEM 64 MiB／核（＝／device）</text>
<text class="svgsm" x="182" y="193" fill="#202124">SMEM 1 MiB</text>
<text class="svgsm" x="182" y="210" fill="#202124">—— 编译器排布，没有自动行为</text>
<rect x="592" y="154" width="408" height="70" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="0.8"/>
<text class="svgsm" x="606" y="176" fill="#202124">shared memory 最多 228 KB／SM</text>
<text class="svgsm" x="606" y="193" fill="#202124">—— 写 kernel 的人用 __shared__ 手工搬</text>
<text class="svglbl" x="142" y="260" text-anchor="end" fill="#202124">片上 · 自动管</text>
<text class="svgsm" x="142" y="276" text-anchor="end">硬件替你决定放什么</text>
<rect x="168" y="238" width="404" height="70" rx="7" fill="#fafafa" stroke="#9aa0a6" stroke-dasharray="6 5"/>
<text class="svgnum" x="370.0" y="264" text-anchor="middle" fill="#d93025">CMEM = 0</text>
<text class="svgsm" x="370.0" y="283" text-anchor="middle" fill="#d93025">GPU 那边整整一层，在这里根本不存在</text>
<rect x="592" y="238" width="408" height="70" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="0.8"/>
<text class="svgsm" x="606" y="260" fill="#202124">L1（与 shared 合计上限 256 KB／SM）</text>
<text class="svgsm" x="606" y="277" fill="#202124">L2 126 MB／GPU</text>
<text class="svgsm" x="606" y="294" fill="#202124">—— 全自动，你只能提示不能指定</text>
<text class="svglbl" x="142" y="344" text-anchor="end" fill="#202124">可编程协处理器</text>
<text class="svgsm" x="142" y="360" text-anchor="end">矩阵单元干不了的活</text>
<rect x="168" y="322" width="404" height="70" rx="7" fill="#fff" stroke="#1e8e3e" stroke-width="0.8"/>
<text class="svgsm" x="182" y="344" fill="#202124">SparseCore × 4／chip（＝ 2／device）</text>
<text class="svgsm" x="182" y="361" fill="#202124">可编程：前缀和 · 排序 · 计数 · gather / scatter</text>
<rect x="592" y="322" width="408" height="70" rx="7" fill="#fafafa" stroke="#9aa0a6" stroke-dasharray="6 5"/>
<text class="svgnum" x="796.0" y="348" text-anchor="middle" fill="#d93025">（没有可编程的）</text>
<text class="svgsm" x="796.0" y="367" text-anchor="middle" fill="#d93025">矩阵单元干不了的活，只能回到 CUDA core 手写</text>
<text class="svgsm" x="796.0" y="383" text-anchor="middle" fill="#d93025">TMA 是固定功能搬运，TPU 也有 DMA 引擎 —— 不算这一格</text>
<text class="svglbl" x="142" y="428" text-anchor="end" fill="#202124">零碎活的小单元</text>
<text class="svgsm" x="142" y="444" text-anchor="end">矩阵乘和逐元素之外</text>
<rect x="168" y="406" width="404" height="70" rx="7" fill="#fff" stroke="#1e8e3e" stroke-width="0.8"/>
<text class="svgsm" x="182" y="428" fill="#202124">XLU 跨 lane 单元 × 2（公开资料，未标代次）</text>
<text class="svgsm" x="182" y="445" fill="#202124">转置 · 跨 lane 归约 · shuffle —— 公开资料明写「慢且贵」</text>
<text class="svgsm" x="182" y="462" fill="#202124">⚠️ 超越函数<tspan font-weight="700">另算一类</tspan>：Pallas 成本模型里 transcendentals ≠ flops</text>
<rect x="592" y="406" width="408" height="70" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="0.8"/>
<text class="svgsm" x="606" y="428" fill="#202124">SFU × 4／处理块（个数沿用 Hopper 画法）</text>
<text class="svgsm" x="606" y="445" fill="#202124">exp · rcp · rsqrt 等超越函数</text>
<text class="svgsm" x="606" y="462" fill="#202124">⚠️ 跨 lane 靠 warp shuffle 指令，官方没把它单列成部件</text>
<text class="svglbl" x="142" y="512" text-anchor="end" fill="#202124">芯片外</text>
<text class="svgsm" x="142" y="528" text-anchor="end">HBM</text>
<rect x="168" y="490" width="404" height="70" rx="7" fill="#fff" stroke="#1e8e3e" stroke-width="0.8"/>
<text class="svgsm" x="182" y="512" fill="#202124">96 GiB／device（＝ 192 GiB ÷ 2）</text>
<text class="svgsm" x="182" y="529" fill="#202124">整 chip 7,380 GB/s</text>
<rect x="592" y="490" width="408" height="70" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="0.8"/>
<text class="svgsm" x="606" y="512" fill="#202124">186 GB／GPU（软件可见；物理 192 GB）</text>
<text class="svgsm" x="606" y="529" fill="#202124">8,000 GB/s</text>
<line x1="0" y1="586" x2="1000" y2="586" stroke="#e8eaed"/>
<rect x="0" y="598" width="1000" height="66" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
<text class="svglbl" x="18" y="620" fill="#7a5000">⭐ 片上 SRAM 的量级相当、归属完全相反：B200 的 L2 是 126 MB，v7 的 VMEM 是 64 MiB × 2 核 ＝ 128 MiB ＝ 134 MB（大约 6%）</text>
<text class="svgsm" x="18" y="639" fill="#7a5000">一边全部落在「自动管」那一格，一边全部落在「显式管」那一格 —— 同样一百多 MB 的片上 SRAM，一个替你适应，一个让你安排。</text>
<text class="svgsm" x="18" y="656" fill="#7a5000">这就是第 0 节那两条出身，第一次以数字的形式出现。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="980" height="600" fill="#fff"/><text x="490.0" y="32" text-anchor="middle" font-size="18" fill="#202124" font-weight="bold">其余各片为什么能落回原地：四个环节都是确定性的</text><rect x="26" y="58" width="218" height="170" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="135.0" y="86" text-anchor="middle" font-size="16" fill="#1a73e8" font-weight="bold">① Kueue 挑 cube</text><text x="135.0" y="116" text-anchor="middle" font-size="13" fill="#202124">空闲健康 cube 容量打平</text><text x="135.0" y="142" text-anchor="middle" font-size="13" fill="#202124">→ 按分区号升序取前几十个</text><text x="135.0" y="168" text-anchor="middle" font-size="13" fill="#202124">坏 host 的 cube 只剩 15 台</text><text x="135.0" y="194" text-anchor="middle" font-size="13" fill="#202124">装不下一片 → 自动跳过</text><path d="M246,143 L266,143" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/><rect x="270" y="58" width="218" height="170" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="379.0" y="86" text-anchor="middle" font-size="16" fill="#1a73e8" font-weight="bold">② pod 落节点</text><text x="379.0" y="116" text-anchor="middle" font-size="13" fill="#202124">rank = 第几片×64 + 片内第几台</text><text x="379.0" y="142" text-anchor="middle" font-size="13" fill="#202124">全部主机按（分区号, 主机名）</text><text x="379.0" y="168" text-anchor="middle" font-size="13" fill="#202124">排好，rank 依次对号</text><text x="379.0" y="194" text-anchor="middle" font-size="13" fill="#202124">同一组 cube → 同一张表</text><path d="M490,143 L510,143" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/><rect x="514" y="58" width="218" height="170" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/><text x="623.0" y="86" text-anchor="middle" font-size="16" fill="#1e8e3e" font-weight="bold">③ 内存盘属于节点</text><text x="623.0" y="116" text-anchor="middle" font-size="13" fill="#202124">/local 由 MTC 的 CSI 驱动</text><text x="623.0" y="142" text-anchor="middle" font-size="13" fill="#202124">挂在节点上</text><text x="623.0" y="168" text-anchor="middle" font-size="13" fill="#202124">pod 删了、重建了，</text><text x="623.0" y="194" text-anchor="middle" font-size="13" fill="#202124">内存盘和里面的存档还在</text><path d="M734,143 L754,143" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/><rect x="758" y="58" width="218" height="170" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/><text x="867.0" y="86" text-anchor="middle" font-size="16" fill="#1e8e3e" font-weight="bold">④ replicator 补齐</text><text x="867.0" y="116" text-anchor="middle" font-size="13" fill="#202124">按 runtime index 放文件</text><text x="867.0" y="142" text-anchor="middle" font-size="13" fill="#202124">（= 第几片×64 + 列）</text><text x="867.0" y="168" text-anchor="middle" font-size="13" fill="#202124">缺的从同列 peer</text><text x="867.0" y="194" text-anchor="middle" font-size="13" fill="#202124">或 GCS 备份灌回</text><text x="490.0" y="262" text-anchor="middle" font-size="15" fill="#202124" font-weight="bold">但「落回原 cube」不等于「每个 pod 回原节点」：要看备件的分区号排在哪</text><text x="130" y="322" text-anchor="end" font-size="14" fill="#202124" font-weight="bold">换之前</text><rect x="140" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="161.0" y="322" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="186" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="207.0" y="322" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="232" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="253.0" y="322" text-anchor="middle" font-size="13" fill="#202124"></text><rect x="278" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text 
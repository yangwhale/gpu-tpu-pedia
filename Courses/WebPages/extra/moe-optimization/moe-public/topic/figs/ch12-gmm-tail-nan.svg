<rect x="24.0" y="76.0" width="414.0" height="4.0" rx="0" fill="#d93025"/>
<text x="38.0" y="102.0" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700">改前：只 mask RHS</text>
<text x="44.0" y="152.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">LHS</text>

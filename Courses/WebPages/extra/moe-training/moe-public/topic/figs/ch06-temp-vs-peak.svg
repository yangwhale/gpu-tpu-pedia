<text x="666.7" y="487.0" font-size="13" fill="#5f6368" text-anchor="middle">4 个高于</text>
<rect x="20.0" y="503.0" width="860.0" height="54.0" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1.2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="两个切片：片内芯片之间用粗蓝线 ICI 直连；跨片时数据先从芯片下到 host CPU，再经网卡走数据中心网络 DCN 到另一片的 host，再上到芯片。每次跨片发起都有毫秒级固定开销。">

<rect width="900" height="440" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >片内芯片直连走 ICI；跨片的每一次通信都要先绕到 host，再上 DCN</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >示意：芯片数不按比例；跨 slice 永远走 DCN，哪怕在同一个 pod</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />

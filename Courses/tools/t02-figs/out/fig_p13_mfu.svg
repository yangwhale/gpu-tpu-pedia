<svg viewBox="0 0 1400 672" width="1400" height="672" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MFU 的分子与分母各有若干合法选择：同一次实测只换分母就能合法报出 10.1% 到 22.4% 四个不同的 MFU，跨度 2.2 倍">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">MFU 是一个分数　—— <tspan font-weight="700" fill="#d93025">上下两头都是选择，而且都不会报错</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">能把结果改一倍以上</text>
<rect x="162.5" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="179.5" y="58" class="sm">改得少，但同样要交代</text>
<rect x="316.5" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="333.5" y="58" class="sm">这一列才是这台机器该用的</text>
<rect x="20" y="124" width="424" height="372" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="36" y="150" class="sec">甲　·　分子：我算出来的那个数</text>
<text x="36" y="170" class="xs"><tspan fill="#9aa0a6">框架日志里那个 TFLOP/s </tspan><tspan font-weight="700" fill="#202124">不是量出来的，是一条公式算出来的</tspan> —— 而公式有版</text>
<text x="36" y="186" class="xs">本。</text>
<rect x="36" y="212" width="392" height="92" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="50" y="234" class="xs" fill="#d93025"><tspan font-weight="700" fill="#202124">算力公式漏了一个白名单</tspan></text>
<text x="414" y="236" class="num" fill="#d93025" text-anchor="end">约 5×</text>
<text x="50" y="256" class="xxs">算力统计函数<tspan font-weight="700" fill="#202124">按模型家族分叉</tspan>。漏加模型名时<tspan font-weight="700" fill="#202124">它不报错</tspan> —— 只是用错误的宽度去量</text>
<text x="50" y="270" class="xxs">专家、并漏掉共享专家。<tspan font-weight="700" fill="#d93025">我们移植时中过这一枪。</tspan></text>
<rect x="36" y="314" width="392" height="92" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="50" y="336" class="xs" fill="#f9ab00"><tspan font-weight="700" fill="#202124">重算的 FLOP 算不算</tspan></text>
<text x="414" y="338" class="num" fill="#f9ab00" text-anchor="end">4/3</text>
<text x="50" y="358" class="xxs">算进去叫 HFU，不算叫 MFU。<tspan fill="#9aa0a6">全量重算下前向被算两遍，两者相差 </tspan><tspan font-weight="700" fill="#202124">4/3 ≈ 1.33×</tspan></text>
<text x="50" y="372" class="xxs"> —— 这是定义推出来的，不是测出来的。<tspan font-weight="700" fill="#202124">主流框架报的都是 MFU 口径。</tspan></text>
<rect x="36" y="416" width="392" height="54" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="50" y="438" class="xs" fill="#f9ab00"><tspan font-weight="700" fill="#202124">attention 平方项按 causal 折半吗</tspan></text>
<text x="414" y="440" class="num" fill="#f9ab00" text-anchor="end">看序列长度</text>
<text x="50" y="460" class="xxs"><tspan fill="#9aa0a6">短序列上无所谓；128K 那一档它就是大头。</tspan></text>
<rect x="456" y="124" width="452" height="372" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="472" y="150" class="sec">中　·　同一次 run，四个 MFU</text>
<text x="472" y="170" class="xs"><tspan font-weight="700" fill="#202124">实测 503 TFLOP/s/GPU，一行代码没改。</tspan><tspan fill="#9aa0a6">下面四个格子只是换了除数。</tspan></text>
<text x="655.0" y="224" class="lbl" fill="#d93025" text-anchor="middle">2,250 / 4,500</text>
<text x="655.0" y="240" class="xxs" fill="#5f6368" text-anchor="middle">HGX B200 的峰值</text>
<text x="821.0" y="224" class="lbl" fill="#1e8e3e" text-anchor="middle">2,500 / 5,000</text>
<text x="821.0" y="240" class="xxs" fill="#5f6368" text-anchor="middle">GB200 —— 实际跑的这台</text>
<line x1="472" y1="250" x2="900" y2="250" stroke="#dadce0" stroke-width="1.0"/>
<text x="476" y="292" class="box" fill="#202124">÷ BF16 峰值</text>
<rect x="576" y="258" width="158" height="58" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="655.0" y="290" class="ttl" fill="#d93025" text-anchor="middle">22.4%</text>
<text x="655.0" y="307" class="xxs" fill="#5f6368" text-anchor="middle">← 那份文档主报</text>
<rect x="742" y="258" width="158" height="58" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="821.0" y="290" class="ttl" fill="#1e8e3e" text-anchor="middle">20.1%</text>
<text x="476" y="358" class="box" fill="#202124">÷ FP8 峰值</text>
<rect x="576" y="324" width="158" height="58" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="655.0" y="356" class="ttl" fill="#d93025" text-anchor="middle">11.2%</text>
<text x="655.0" y="373" class="xxs" fill="#5f6368" text-anchor="middle">← 表注里又给了</text>
<rect x="742" y="324" width="158" height="58" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="821.0" y="356" class="ttl" fill="#1e8e3e" text-anchor="middle">10.1%</text>
<line x1="478" y1="408" x2="894" y2="408" stroke="#202124" stroke-width="2.0"/>
<line x1="478" y1="403" x2="478" y2="413" stroke="#202124" stroke-width="2.0"/>
<line x1="894" y1="403" x2="894" y2="413" stroke="#202124" stroke-width="2.0"/>
<text x="478" y="398" class="num" fill="#202124">10.1%</text>
<text x="894" y="398" class="num" fill="#d93025" text-anchor="end">22.4%</text>
<text x="682.0" y="428" class="box" fill="#d93025" text-anchor="middle">2.2 倍　·　而这四个格子只动了分母</text>
<rect x="472" y="438" width="420" height="52" rx="8" fill="#fff" stroke="#202124" stroke-width="1.2"/>
<text x="486" y="458" class="xs"><tspan font-weight="700" fill="#202124">甲那三个、乙那四个，一次都没动，而且能叠乘。</tspan><tspan font-weight="700" fill="#d93025">2.2 倍是</tspan><tspan font-weight="700" fill="#202124">下限</tspan>。</text>
<rect x="932" y="124" width="448" height="372" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="948" y="150" class="sec">乙　·　分母：我选的那个峰值</text>
<text x="948" y="170" class="xs"><tspan fill="#9aa0a6">四个都有官方出处。</tspan><tspan font-weight="700" fill="#202124">难的不是找到一个，是说清用了哪一个。</tspan></text>
<rect x="948" y="212" width="416" height="62" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="962" y="234" class="xs" fill="#d93025"><tspan font-weight="700" fill="#202124">dense 还是 sparse</tspan></text>
<text x="1350" y="236" class="num" fill="#d93025" text-anchor="end">2×</text>
<text x="962" y="254" class="xxs">官方脚注写着 <tspan font-weight="700" fill="#202124">sparse 是 dense 的两倍</tspan>。<tspan font-weight="700" fill="#d93025">头条数字默认给 sparse。</tspan></text>
<rect x="948" y="284" width="416" height="46" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="962" y="306" class="xs" fill="#f9ab00"><tspan font-weight="700" fill="#202124">哪一个 SKU</tspan></text>
<text x="1350" y="308" class="num" fill="#f9ab00" text-anchor="end">1.11×</text>
<text x="962" y="326" class="xxs"><tspan fill="#9aa0a6">见上一张图。</tspan></text>
<rect x="948" y="340" width="416" height="46" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="962" y="362" class="xs" fill="#d93025"><tspan font-weight="700" fill="#202124">per chip 还是 per device</tspan></text>
<text x="1350" y="364" class="num" fill="#d93025" text-anchor="end">2×</text>
<text x="962" y="382" class="xxs"><tspan fill="#9aa0a6">见上一张图。</tspan></text>
<rect x="948" y="396" width="416" height="62" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="962" y="418" class="xs" fill="#d93025"><tspan font-weight="700" fill="#202124">拿哪一种精度的峰值</tspan></text>
<text x="1350" y="420" class="num" fill="#d93025" text-anchor="end">2×</text>
<text x="962" y="438" class="xxs"><tspan font-weight="700" fill="#202124">一次 FP8 的 run，用 BF16 峰值量还是 FP8 峰值量。</tspan><tspan fill="#9aa0a6">两种都有人做，都说得通。</tspan></text>
<text x="948" y="486" class="xxs" fill="#5f6368">↖ 中间那张表只演示了其中两条：「哪个 SKU」和「哪种精度」。</text>
<rect x="20" y="524" width="1360" height="120" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="552" class="sec">⭐ 所以报 MFU 的时候，把这一整行一起报出来 —— 这是这一节唯一要带走的动作</text>
<text x="38" y="578" class="xs"><tspan font-weight="700" fill="#202124">MFU 20.1% ＝ 503 TFLOP/s ÷ 2,500（GB200 · BF16 · dense · per GPU）· 分子：框架内建公式，不含重算 · 公式版本＝当时那个 commit</tspan><tspan fill="#9aa0a6">　—— 一行，抄走就能用。</tspan></text>
<text x="38" y="601" class="xs"><tspan font-weight="700" fill="#d93025">写不出这一行，就别报百分比。</tspan><tspan fill="#9aa0a6">退一步报</tspan><tspan font-weight="700" fill="#202124">吞吐本身</tspan>（tokens/s，或者「跑完一步要几秒」）—— 那个数虽然也有口径，但至少<tspan font-weight="700" fill="#202124">台下能直接感觉到快慢</tspan>，而百分比不行。<tspan font-weight="700" fill="#202124">下一张讲的就是：什么时候该退这一步。</tspan></text>
<text x="1380" y="660" class="xxs" fill="#9aa0a6" text-anchor="end">实测：A4X（GB200 NVL72）2 节点 8 GPU · Qwen3 类 MoE · seq 16384 · FP8 训练，实测 503 TFLOP/s/GPU · 峰值口径见上一张图</text>
</svg>
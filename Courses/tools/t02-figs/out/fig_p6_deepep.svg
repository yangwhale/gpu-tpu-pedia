<text x="707.625" y="58" class="sm">纵轴＝相对 8 GPU 的百分比，不是绝对带宽</text>
<text x="20" y="116" class="sec">主图以 8 GPU 为 100%　—— 画绝对值会把后三条压成贴地直线</text>

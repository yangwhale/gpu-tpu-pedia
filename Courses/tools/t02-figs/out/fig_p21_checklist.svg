<svg viewBox="0 0 1400 858" width="1400" height="858" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一个数该配多少话：五级来源分级、落笔前的三句自问、以及这一课查完仍然没有答案的六处">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">落笔之前　—— <tspan font-weight="700" fill="#1a73e8">一个数该配多少话，取决于它是哪儿来的</tspan></text>
<rect x="1193" y="10" width="187" height="22" rx="11" fill="#1a73e8"/>
<text x="1286.5" y="25" class="lbl" fill="#fff" text-anchor="middle">P-19 / P-20 的对页</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">实心点＝这一级在本课坏过一笔（台账共八笔，散在四级上）</text>
<rect x="369.5" y="48" width="11" height="11" rx="2" fill="#e8eaed"/>
<text x="386.5" y="58" class="sm">空心圈＝这一级本课没犯过 —— 不代表它安全</text>
<rect x="640.8" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="657.8" y="58" class="sm">乙格三句都是单位问题，30 秒能查完</text>
<rect x="20" y="114" width="812" height="502" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="140" class="sec">甲　·　来源分级 —— 越往下，越要把过程写出来</text>
<text x="38" y="162" class="xs"><tspan fill="#9aa0a6">P-20 台账「类型」那一列的六个词就落在这五级上：</tspan><tspan font-weight="700" fill="#202124">编的 / 套错→①、测的→②、派生 / 口径 / 归类→④、推的→⑤</tspan>，<tspan font-weight="700" fill="#202124">③ 一次都没用上</tspan>。</text>
<text x="56" y="190" class="xxs" fill="#9aa0a6">等级</text>
<text x="172" y="190" class="xxs" fill="#9aa0a6">这一课的实例</text>
<text x="330" y="190" class="xxs" fill="#9aa0a6">该怎么写</text>
<text x="560" y="190" class="xxs" fill="#9aa0a6">它是怎么坏的</text>
<text x="782" y="190" class="xxs" fill="#9aa0a6" text-anchor="middle">犯过</text>
<line x1="38" y1="197" x2="814" y2="197" stroke="#dadce0" stroke-width="1.0"/>
<rect x="38" y="204" width="776" height="70" rx="4" fill="#fcfcfd"/>
<rect x="38" y="204" width="4" height="70" rx="2" fill="#1e8e3e"/>
<text x="56" y="230" class="lbl" fill="#1e8e3e">① 官方规格</text>
<text x="56" y="248" class="xxs" fill="#1e8e3e">编的 / 套错</text>
<text x="172" y="228" class="xs"><tspan font-weight="700" fill="#202124">2,500 / 2,307</tspan><tspan fill="#9aa0a6"> dense BF16</tspan></text>
<text x="330" y="228" class="xxs">给出<tspan font-weight="700" fill="#202124">口径</tspan>：dense 还是含稀疏、每 chip 还是每</text>
<text x="330" y="242" class="xxs"> device</text>
<text x="560" y="228" class="xxs"><tspan font-weight="700" fill="#202124">两种坏法，方向相反</tspan><tspan fill="#9aa0a6"> —— 2,700 没出处（猜</tspan></text>
<text x="560" y="242" class="xxs"><tspan fill="#9aa0a6">高）；2,250 规格是真的，</tspan><tspan font-weight="700" fill="#202124">套错机型</tspan>（猜低）</text>
<circle cx="774.5" cy="232.0" r="5.5" fill="#d93025"/>
<circle cx="789.5" cy="232.0" r="5.5" fill="#d93025"/>
<text x="782" y="258" class="xxs" fill="#d93025" text-anchor="middle">2 笔</text>
<rect x="38" y="274" width="4" height="70" rx="2" fill="#1e8e3e"/>
<text x="56" y="300" class="lbl" fill="#1e8e3e">② 自己实测</text>
<text x="56" y="318" class="xxs" fill="#1e8e3e">测的</text>
<text x="172" y="298" class="xs"><tspan font-weight="700" fill="#202124">854.0 / 662.3</tspan><tspan fill="#9aa0a6"> TFLOP/s</tspan></text>
<text x="330" y="298" class="xxs">连 <tspan font-weight="700" fill="#202124">step time + 配置 + 规模</tspan> 一起给，缺一样</text>
<text x="330" y="312" class="xxs">就不可复现</text>
<text x="560" y="298" class="xxs"><tspan font-weight="700" fill="#202124">测量本身错了</tspan><tspan fill="#9aa0a6"> —— 1,014.8 漏 all-gather</tspan></text>
<circle cx="782.0" cy="302.0" r="5.5" fill="#d93025"/>
<text x="782" y="328" class="xxs" fill="#d93025" text-anchor="middle">1 笔</text>
<rect x="38" y="344" width="776" height="70" rx="4" fill="#fcfcfd"/>
<rect x="38" y="344" width="4" height="70" rx="2" fill="#1a73e8"/>
<text x="56" y="370" class="lbl" fill="#1a73e8">③ 他人实测</text>
<text x="56" y="388" class="xxs" fill="#9aa0a6">（台账里没有）</text>
<text x="172" y="368" class="xs"><tspan font-weight="700" fill="#202124">707.2</tspan><tspan fill="#9aa0a6"> 厂商官方 recipe</tspan></text>
<text x="330" y="368" class="xxs">注明<tspan font-weight="700" fill="#202124">谁跑的、什么配置</tspan>，以及能不能跟自己的对</text>
<text x="330" y="382" class="xxs">齐</text>
<text x="560" y="368" class="xxs"><tspan font-weight="700" fill="#202124">配置对不齐却并排放</tspan><tspan fill="#9aa0a6"> —— 本课没犯过</tspan></text>
<circle cx="782.0" cy="372" r="5.5" fill="#fff" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="782" y="394" class="xxs" fill="#9aa0a6" text-anchor="middle">0 笔</text>
<rect x="38" y="414" width="4" height="70" rx="2" fill="#f9ab00"/>
<text x="56" y="440" class="lbl" fill="#f9ab00">④ 算出来的</text>
<text x="56" y="458" class="xxs" fill="#f9ab00">派生 / 口径 / 归类</text>
<text x="172" y="438" class="xs"><tspan font-weight="700" fill="#202124">MFU</tspan>、<tspan font-weight="700" fill="#202124">tok/s/chip</tspan></text>
<text x="330" y="438" class="xxs"><tspan font-weight="700" fill="#202124">把算式写在它旁边</tspan>：tok/s/chip = pdbs × </text>
<text x="330" y="452" class="xxs">8192 ÷ step</text>
<text x="560" y="438" class="xxs"><tspan font-weight="700" fill="#202124">八笔里独占一半</tspan><tspan fill="#9aa0a6"> —— 上游撤了没跟着撤（7,</tspan></text>
<text x="560" y="452" class="xxs"><tspan fill="#9aa0a6">308、31.60%）、分母没交代、加数里混进不</tspan></text>
<text x="560" y="466" class="xxs"><tspan fill="#9aa0a6">该加的项</tspan></text>
<circle cx="774.5" cy="435.0" r="5.5" fill="#d93025"/>
<circle cx="789.5" cy="435.0" r="5.5" fill="#d93025"/>
<circle cx="774.5" cy="449.0" r="5.5" fill="#d93025"/>
<circle cx="789.5" cy="449.0" r="5.5" fill="#d93025"/>
<text x="782" y="468" class="xxs" fill="#d93025" text-anchor="middle">4 笔</text>
<rect x="38" y="484" width="776" height="70" rx="4" fill="#fcfcfd"/>
<rect x="38" y="484" width="4" height="70" rx="2" fill="#d93025"/>
<text x="56" y="510" class="lbl" fill="#d93025">⑤ 推出来的</text>
<text x="56" y="528" class="xxs" fill="#d93025">推的</text>
<text x="172" y="508" class="xs">没有直接测量的一切</text>
<text x="330" y="508" class="xxs">写清<tspan font-weight="700" fill="#202124">推导链</tspan>，明确标成「估」——别给它一个像结</text>
<text x="330" y="522" class="xxs">论的名字</text>
<text x="560" y="508" class="xxs"><tspan font-weight="700" fill="#202124">换个名字就当成发现</tspan><tspan fill="#9aa0a6"> —— 「软件效率之比」</tspan></text>
<circle cx="782.0" cy="512.0" r="5.5" fill="#d93025"/>
<text x="782" y="538" class="xxs" fill="#d93025" text-anchor="middle">1 笔</text>
<rect x="38" y="562" width="776" height="46" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="52" y="580" class="xxs"><tspan font-weight="700" fill="#202124">八笔不是一级一笔：④ 独占四笔（一半），③ 零笔。</tspan><tspan fill="#9aa0a6"> ④ 危险恰恰因为</tspan><tspan font-weight="700" fill="#202124">它有出处</tspan>（出处是 ① 或 ②），看上去已经处理过了。</text>
<text x="52" y="596" class="xxs"><tspan fill="#9aa0a6">而 ③ 的零笔</tspan><tspan font-weight="700" fill="#202124">什么都证明不了</tspan> —— 这一课总共只引用过<tspan font-weight="700" fill="#202124">一个</tspan>他人实测的数，<tspan font-weight="700" fill="#202124">样本 1 里出 0 个错</tspan>。</text>
<rect x="844" y="114" width="536" height="502" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="862" y="140" class="sec">乙　·　落笔前的三句自问</text>
<text x="862" y="162" class="xs"><tspan fill="#9aa0a6">三句都是</tspan><tspan font-weight="700" fill="#202124">单位问题</tspan>，不是态度问题 ——「要仔细」不可执行。</text>
<rect x="862" y="198" width="500" height="100" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.0"/>
<rect x="862" y="198" width="4" height="100" rx="2" fill="#1a73e8"/>
<text x="878" y="222" class="lbl" fill="#1a73e8">①</text>
<text x="900" y="222" class="box" fill="#202124">二进制还是十进制？</text>
<text x="878" y="242" class="xxs">官方 HBM 那一栏是<tspan font-weight="700" fill="#202124">十进制</tspan>。206 GB 就是 192 GiB，差 <tspan font-weight="700" fill="#202124">7.4%</tspan> —— 足够把「刚好装下」变成 OOM。</text>
<rect x="878" y="268" width="466" height="20" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.0"/>
<text x="886" y="282" class="xxs"><tspan fill="#9aa0a6">本课取值：</tspan>判 OOM 一律用 <tspan font-weight="700" fill="#202124">94.74 GiB/device</tspan></text>
<rect x="862" y="308" width="500" height="100" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.0"/>
<rect x="862" y="308" width="4" height="100" rx="2" fill="#1a73e8"/>
<text x="878" y="332" class="lbl" fill="#1a73e8">②</text>
<text x="900" y="332" class="box" fill="#202124">per chip、per device、还是 per core？</text>
<text x="878" y="352" class="xxs">v7 是 <tspan font-weight="700" fill="#202124">2 device / chip</tspan>，而框架日志按 device 报。<tspan font-weight="700" fill="#d93025">这一步错，结论差一倍。</tspan></text>
<rect x="878" y="378" width="466" height="20" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.0"/>
<text x="886" y="392" class="xxs"><tspan fill="#9aa0a6">本课取值：</tspan>per-chip = 日志读数 <tspan font-weight="700" fill="#202124">× 2</tspan></text>
<rect x="862" y="418" width="500" height="100" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.0"/>
<rect x="862" y="418" width="4" height="100" rx="2" fill="#1a73e8"/>
<text x="878" y="442" class="lbl" fill="#1a73e8">③</text>
<text x="900" y="442" class="box" fill="#202124">这是物理量，还是可用量？</text>
<text x="878" y="462" class="xxs">94.74 GiB 是<tspan font-weight="700" fill="#202124">可用的</tspan>不是标称的；2,500 是 <tspan font-weight="700" fill="#202124">dense 的</tspan>不是含稀疏的。两边必须用同一种。</text>
<rect x="878" y="488" width="466" height="20" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.0"/>
<text x="886" y="502" class="xxs"><tspan fill="#9aa0a6">本课取值：</tspan>全课统一：可用 HBM + dense 峰值</text>
<rect x="862" y="532" width="500" height="50" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.4"/>
<text x="876" y="552" class="xxs"><tspan font-weight="700" fill="#202124">④ 已经由 P-19 给了：</tspan><tspan fill="#9aa0a6">这个数的上游，最近有东西动过吗？</tspan></text>
<text x="876" y="568" class="xxs"><tspan font-weight="700" fill="#202124">四句合起来才是完整的检查表。</tspan></text>
<rect x="20" y="640" width="1360" height="194" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="668" class="sec">⚠️ 这一课查完仍然没有答案的六处 —— 写出来，才使得前面那些有答案的部分可信</text>
<text x="38" y="690" class="xs"><tspan fill="#9aa0a6">两种「查不到」不是一回事：</tspan><tspan font-weight="700" fill="#202124">外部</tspan>＝官方没公布，我们查不到；<tspan font-weight="700" fill="#202124">自己没做</tspan>＝没人拦着，是我们没去做。<tspan font-weight="700" fill="#202124">后一种更该写出来</tspan><tspan fill="#9aa0a6"> —— 尤其最后一条，2.06 倍是全课最大的那个数，而它现在挂的两条限制都只是「口径」。</tspan></text>
<rect x="38.0" y="712" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="50.0" y="730" class="lbl" fill="#d93025">B200 到底几个 SM</text>
<rect x="421.3333333333333" y="718" width="38" height="16" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<text x="440.3333333333333" y="730" class="xxs" fill="#9aa0a6" text-anchor="middle">外部</text>
<text x="50.0" y="745" class="xxs"><tspan fill="#9aa0a6">第三方拆解一致给 148（物理 160），</tspan><tspan font-weight="700" fill="#202124">NVIDIA 官方文档从未写过</tspan></text>
<text x="50.0" y="759" class="xxs">→ 148 / 592 及派生<tspan font-weight="700" fill="#202124">一律注「第三方拆解」</tspan></text>
<rect x="483.3333333333333" y="712" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="495.3333333333333" y="730" class="lbl" fill="#d93025">138.9 与 137.2 差 1.2%</text>
<rect x="866.6666666666666" y="718" width="38" height="16" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<text x="885.6666666666666" y="730" class="xxs" fill="#9aa0a6" text-anchor="middle">外部</text>
<text x="495.3333333333333" y="745" class="xxs"><tspan fill="#9aa0a6">同一个 GFLOP/token，两条推导链对不上，未定位</tspan></text>
<text x="495.3333333333333" y="759" class="xxs">→ P-15 图上<tspan font-weight="700" fill="#202124">索性不提这个数</tspan></text>
<rect x="928.6666666666666" y="712" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="940.6666666666666" y="730" class="lbl" fill="#d93025">B300 是不是双 die 封装</text>
<rect x="1312.0" y="718" width="38" height="16" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.0"/>
<text x="1331.0" y="730" class="xxs" fill="#9aa0a6" text-anchor="middle">外部</text>
<text x="940.6666666666666" y="745" class="xxs"><tspan fill="#9aa0a6">本课只考据过 B200 是双 die，B300 没查到</tspan></text>
<text x="940.6666666666666" y="759" class="xxs">→ P-18 ⑥ <tspan font-weight="700" fill="#202124">只按 device 抽象说</tspan></text>
<rect x="38.0" y="772" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="50.0" y="790" class="lbl" fill="#d93025">GB300 的 EP16 没复测</text>
<rect x="399.3333333333333" y="778" width="60" height="16" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.0"/>
<text x="429.3333333333333" y="790" class="xxs" fill="#d93025" text-anchor="middle">自己没做</text>
<text x="50.0" y="805" class="xxs"><tspan fill="#9aa0a6">882.3 是扫点表自己标的 BF16 最优，没跟进</tspan></text>
<text x="50.0" y="819" class="xxs">→ §7 所有倍数<tspan font-weight="700" fill="#202124">都写成下限</tspan></text>
<rect x="483.3333333333333" y="772" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="495.3333333333333" y="790" class="lbl" fill="#d93025">软件成熟度差多少</text>
<rect x="844.6666666666666" y="778" width="60" height="16" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.0"/>
<text x="874.6666666666666" y="790" class="xxs" fill="#d93025" text-anchor="middle">自己没做</text>
<text x="495.3333333333333" y="805" class="xxs"><tspan fill="#9aa0a6">只能看出方向，没有能量化它的实验</tspan></text>
<text x="495.3333333333333" y="819" class="xxs">→ P-18 ④ <tspan font-weight="700" fill="#202124">只定性写「会变」</tspan></text>
<rect x="928.6666666666666" y="772" width="433.3333333333333" height="54" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="940.6666666666666" y="790" class="lbl" fill="#d93025">GB300 那条 FP8 路的收敛</text>
<rect x="1290.0" y="778" width="60" height="16" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.0"/>
<text x="1320.0" y="790" class="xxs" fill="#d93025" text-anchor="middle">自己没做</text>
<text x="940.6666666666666" y="805" class="xxs"><tspan fill="#9aa0a6">v7 侧因伤收敛剔掉了 </tspan><tspan class="mono" fill="#1967d2">fixed</tspan>，<tspan font-weight="700" fill="#202124">同一把尺子没量过对面</tspan></text>
<text x="940.6666666666666" y="819" class="xxs">→ P-17 甲② 的 2.06 倍<tspan font-weight="700" fill="#202124">要加第三条限制</tspan></text>
<text x="1380" y="846" class="xxs" fill="#9aa0a6" text-anchor="end">③ 那一格是空的 —— 凑个例子会更整齐，但那正是这一节反对的事</text>
</svg>
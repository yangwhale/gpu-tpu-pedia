<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 467" width="900" height="467" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：ring-of-experts 下每个 shard 有一块本地 token 的路由 logits，宽度是专家数。左边先 all-gather 整块 logits 再在每个 shard 上算 top-k；右边先在本地算 top-k，只 all-gather 选中的专家编号和权重，宽度是 top-k。搬的字节差「专家数 ÷ top-k」倍，反向的 reduce-scatter 同比。">
<title>示意图：ring-of-experts 下每个 shard 有一块本地 token 的路由 logits，宽度是专家数。左边先 all-gather 整块 logits 再在每个 shard 上算 top-k；右边先在本地算 top-k，只 all-gather 选中的专家编号和权重，宽度是 top-k。搬的字节差「专家数 ÷ top-k」倍，反向的 reduce-scatter 同比。</title>
<defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><style></style></defs>
<rect x="0" y="0" width="900" height="467" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">先在本地算 top-k 再 all-gather：搬的东西从「专家数」那么宽缩到「top-k」那么宽</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意，宽窄只表意，不按真实比例。ring-of-experts（EP > 1）下，每层都要沿 EP 轴 gather 路由结果</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：左边是编译期的堆模拟器，按每个 buffer 的存活区间把它们摆进一块连续空间，摆出来的最高处就是 temp；右边是实机读到的在用量曲线，底下多一截各程序几乎一样的常驻，峰值读 peakBytesInUse，多数程序反而落在 temp 那条线下面。下方数轴：24 份程序的实机峰值减 temp 落在 −8 到 +4 GiB，中位 −3 GiB。">
<title>示意图：左边是编译期的堆模拟器，按每个 buffer 的存活区间把它们摆进一块连续空间，摆出来的最高处就是 temp；右边是实机读到的在用量曲线，底下多一截各程序几乎一样的常驻，峰值读 peakBytesInUse，多数程序反而落在 temp 那条线下面。下方数轴：24 份程序的实机峰值减 temp 落在 −8 到 +4 GiB，中位 −3 GiB。</title>
<defs><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><style></style></defs>
<rect x="0" y="0" width="900" height="571" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">temp 是编译器在纸上的摆法，实机峰值是分配器的真账：两者差 −8 到 +4 GiB</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意。左边是编译器按存活区间把 buffer 摆进连续地址；右边是实机读到的在用量，两边纵向同一比例</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">随程序变化的临时 buffer</text>

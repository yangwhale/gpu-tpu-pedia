<svg viewBox="0 0 1400 840" width="1400" height="840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一对硬件的三个比值：收缩维差 16 倍、单个计算单元的每周期吞吐差 128 倍、一条指令的输出块最多差 512 倍。三者量的不是同一件事">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">同一对硬件，<tspan font-weight="700">三把尺子</tspan>　—— 16 倍、128 倍、512 倍，量的是三件不同的事</text>
<rect x="1281" y="10" width="99" height="22" rx="11" fill="#d93025"/>
<text x="1330.5" y="25" class="lbl" fill="#fff" text-anchor="middle">3.4 的自查</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">GPU 侧</text>
<rect x="95.80000000000001" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="112.80000000000001" y="58" class="sm">TPU v7 侧</text>
<rect x="190.57500000000002" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="207.57500000000002" y="58" class="sm">本课反复说的那个「128 倍」在这一行</text>
<rect x="20" y="84" width="1360" height="120" rx="10" fill="#fff" stroke="#1a73e8" stroke-width="1.8"/>
<rect x="20" y="84" width="6" height="120" rx="0" fill="#1a73e8"/>
<text x="40" y="112" class="sec" fill="#1a73e8">尺子一　收缩维 K</text>
<text x="40" y="134" class="xs">一条指令<tspan font-weight="700" fill="#202124">一次能吃多深</tspan>。它决定 <tspan class="mono" fill="#1967d2">head_dim</tspan> </text>
<text x="40" y="150" class="xs">撞不撞墙。</text>
<rect x="366" y="114" width="21.25" height="22" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="397.25" y="130" class="lbl" fill="#1a73e8">GPU Tensor Core　K ＝ 16</text>
<text x="356" y="130" class="xs" fill="#5f6368" text-anchor="end">16</text>
<rect x="366" y="152" width="340" height="22" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="716" y="168" class="lbl" fill="#1e8e3e">TPU MXU 的收缩边 ＝ 256</text>
<text x="356" y="168" class="xs" fill="#5f6368" text-anchor="end">256</text>
<text x="1010" y="122" class="numb" fill="#1a73e8">16 ×</text>
<text x="1010" y="140" class="xxs" fill="#5f6368">256 ÷ 16</text>
<text x="1010" y="162" class="xs"><tspan font-weight="700" fill="#202124">这一节真正算出来的就是这个数。</tspan>head_dim ＝ 128 打 TPU 不打 GPU，</text>
<text x="1010" y="177" class="xs">全从这一行来。</text>
<rect x="20" y="214" width="1360" height="120" rx="10" fill="#fff" stroke="#d93025" stroke-width="1.8"/>
<rect x="20" y="214" width="6" height="120" rx="0" fill="#d93025"/>
<text x="40" y="242" class="sec" fill="#d93025">尺子二　单个单元多大</text>
<text x="40" y="264" class="xs"><tspan font-weight="700" fill="#202124">一个</tspan> Tensor Core／MXU <tspan font-weight="700" fill="#202124">每个周期</tspan>能做多少</text>
<text x="40" y="280" class="xs">次乘加。量的是硬件，不是指令。</text>
<rect x="366" y="244" width="6" height="22" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="382" y="260" class="lbl" fill="#1a73e8">GPU 一个 Tensor Core　1,024 乘加/周期</text>
<text x="356" y="260" class="xs" fill="#5f6368" text-anchor="end">1,024</text>
<rect x="366" y="282" width="340" height="22" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="716" y="298" class="lbl" fill="#1e8e3e">TPU 一个 MXU　131,072 乘加/周期（256×256×2）</text>
<text x="356" y="298" class="xs" fill="#5f6368" text-anchor="end">131,072</text>
<text x="1010" y="252" class="numb" fill="#d93025">128 ×</text>
<text x="1010" y="270" class="xxs" fill="#5f6368">131,072 ÷ 1,024</text>
<text x="1010" y="292" class="xs"><tspan font-weight="700" fill="#d93025">本课反复说的 128 倍是这一行。</tspan>它出自 3.7 的账表，<tspan font-weight="700" fill="#202124">不是 3.4 算出来</tspan></text>
<text x="1010" y="307" class="xs"><tspan font-weight="700" fill="#202124">的。</tspan></text>
<rect x="20" y="344" width="1360" height="120" rx="10" fill="#fff" stroke="#f9ab00" stroke-width="1.8"/>
<rect x="20" y="344" width="6" height="120" rx="0" fill="#f9ab00"/>
<text x="40" y="372" class="sec" fill="#f9ab00">尺子三　一条指令的输出块</text>
<text x="40" y="394" class="xs">M × N 有多少个位置。<tspan font-weight="700" fill="#202124">这把尺子最容易被当</tspan></text>
<text x="40" y="410" class="xs"><tspan font-weight="700" fill="#202124">成前两把</tspan> —— 而它<tspan font-weight="700" fill="#d93025">随指令变，一个数都钉不</tspan></text>
<text x="40" y="426" class="xs"><tspan font-weight="700" fill="#d93025">住</tspan>。</text>
<rect x="366" y="366" width="340" height="18" rx="3" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="716" y="379" class="lbl" fill="#1e8e3e">TPU MXU　256 × 256 ＝ 65,536</text>
<rect x="366" y="388" width="170.0" height="18" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="546.0" y="401" class="xs" fill="#1a73e8">tcgen05.mma　128 × 256　32,768 个位置　→ 2 倍</text>
<rect x="366" y="411" width="85.0" height="18" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="461.0" y="424" class="xs" fill="#1a73e8">wgmma　64 × 256　16,384 个位置　→ 4 倍</text>
<rect x="366" y="434" width="6" height="18" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="382" y="447" class="xs" fill="#1a73e8">mma.sync　16 × 8　128 个位置　→ 512 倍</text>
<text x="1010" y="382" class="numb" fill="#f9ab00">512 ×  ~  2 ×</text>
<text x="1010" y="400" class="xxs" fill="#5f6368">同一对硬件，三个答案</text>
<text x="1010" y="422" class="xs"><tspan font-weight="700" fill="#202124">取决于你拿哪条指令来比。</tspan><tspan fill="#9aa0a6">所以这把尺子适合讲道理，不适合报数字。</tspan></text>
<text x="366" y="460" class="xxs">* 尺子二的 GPU 条与尺子三的 mma.sync 条真实长度不足 3 px，已钳到 6 px 才画得出来 —— 这两根<tspan fill="#d93025">不按比例</tspan>，看数字。</text>
<rect x="20" y="486" width="1360" height="104" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.8"/>
<text x="38" y="514" class="sec" fill="#d93025">⚠️ 三个数都是对的 —— 错的是随手抓一个当「那个 128 倍」</text>
<text x="38" y="540" class="xs"><tspan font-weight="700" fill="#202124">它们量的东西根本不同</tspan>：尺子一量<tspan font-weight="700" fill="#202124">指令能吃多深</tspan>，尺子二量<tspan font-weight="700" fill="#202124">硬件一个周期能做多少</tspan>，尺子三量<tspan font-weight="700" fill="#202124">一条指令产出多大一块</tspan>。<tspan font-weight="700" fill="#d93025">把任意两把混起来，都会算出一个不存在的结论。</tspan></text>
<text x="38" y="561" class="xs"><tspan font-weight="700" fill="#202124">这门课自己踩过一次</tspan>：3.4 的标题一度写着「这里出那个 128 倍」，而这一节从头到尾只产出 16 倍。<tspan fill="#9aa0a6">已改。留在这里当例子 —— 这类错读起来完全通顺，只有把三把尺子摆在一起才看得见。</tspan></text>
<rect x="20" y="612" width="1360" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
<text x="38" y="640" class="sec" fill="#1a73e8">⭐ 落点：报比值之前，先说清楚你在量什么</text>
<text x="38" y="666" class="xs"><tspan font-weight="700" fill="#202124">「GPU 和 TPU 差多少倍」这个问题，没有单一答案 —— 它取决于你量的是哪一维。</tspan>同一对硬件，换把尺子就换个数，而三个数都能拿出出处。</text>
<text x="38" y="687" class="xs"><tspan font-weight="700" fill="#202124">能带走的一条习惯</tspan>：<tspan font-weight="700" fill="#d93025">看到一个倍数，先问它的分子分母各是什么单位。</tspan><tspan fill="#9aa0a6">这条习惯比记住 16、128、512 这三个数有用得多 —— 数字会换代，问法不会。</tspan></text>
<rect x="20" y="734" width="1360" height="86" rx="10" fill="#fff" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="38" y="760" class="sec">⚠️ 出处分层</text>
<text x="38" y="784" class="xs"><tspan font-weight="700" fill="#202124">查到的</tspan>：K ＝ 16 与三条指令的 M×N 出自 PTX ISA；MXU 256×256、262,144 FLOP/周期/MXU 出自公开工程博客。</text>
<text x="38" y="804" class="xxs"><tspan font-weight="700" fill="#d93025">口径要照搬、不要升级</tspan>：GPU 单核 1,024 乘加/周期在 3.7 的账表里标的是<tspan font-weight="700" fill="#202124">「官方 ＋ 推导」</tspan>，这里沿用同一个标注。<tspan fill="#9aa0a6">它是 128 倍那一行的分母，分母的成色决定整行的成色。</tspan></text>
</svg>
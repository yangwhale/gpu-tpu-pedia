<svg xmlns="http://www.w3.org/2000/svg" width="900" height="434" viewBox="0 0 900 434" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：一个 reduce-scatter 的三种做法。条的高度是这一段要搬的数据量，宽度是时间。不拆为基线 100%；先走 Y/Z/core 合成的 128 路宽路、数据缩到 1/128 后再走短轴 X4，约为基线三分之二；反过来让全量先挤短轴 X4，约为基线的 160%。">
<style>@keyframes k1 { 0% { transform: scaleX(0); } 6% { transform: scaleX(0); } 52% { transform: scaleX(1); } 100% { transform: scaleX(1); } } .a2 { animation: k1 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k3 { 0% { transform: translateX(0.0px); } 6% { transform: translateX(0.0px); } 52% { transform: translateX(356.2px); } 100% { transform: translateX(356.2px); } } .a4 { animation: k3 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k5 { 0% { transform: scaleX(0); } 6% { transform: scaleX(0); } 34% { transform: scaleX(1); } 100% { transform: scaleX(1); } } .a6 { animation: k5 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k7 { 0% { transform: scaleX(0); } 34% { transform: scaleX(0); } 37% { transform: scaleX(1); } 100% { transform: scaleX(1); } } .a8 { animation: k7 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k9 { 0% { transform: translateX(0.0px); } 6% { transform: translateX(0.0px); } 37% { transform: translateX(238.7px); } 100% { transform: translateX(238.7px); } } .a10 { animation: k9 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k11 { 0% { transform: scaleX(0); } 6% { transform: scaleX(0); } 66% { transform: scaleX(1); } 100% { transform: scaleX(1); } } .a12 { animation: k11 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k13 { 0% { transform: scaleX(0); } 66% { transform: scaleX(0); } 80% { transform: scaleX(1); } 100% { transform: scaleX(1); } } .a14 { animation: k13 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @keyframes k15 { 0% { transform: translateX(0.0px); } 6% { transform: translateX(0.0px); } 80% { transform: translateX(570.0px); } 100% { transform: translateX(570.0px); } } .a16 { animation: k15 10s linear infinite; transform-box: fill-box; transform-origin: left center; } @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="900" height="434" fill="#ffffff"/>
<text x="450.0" y="34.0" font-size="20" fill="#202124" text-anchor="middle" font-weight="bold">大头走宽路，小尾走窄路：同样两段，顺序反了慢一倍多</text>
<text x="450.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="middle">条的高度 = 这一段要搬的数据量，宽度 = 时间。总长按正文的相对值画（基线 = 100%，未开三件套）；段内怎么分是示意</text>
<rect x="560.0" y="76.0" width="16.0" height="14.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="582.0" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">宽路 YZC128</text>
<rect x="711.5" y="76.0" width="16.0" height="14.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="733.5" y="88.0" font-size="13" fill="#5f6368" text-anchor="start">窄路 X4</text>
<text x="20.0" y="153.0" font-size="15" fill="#5f6368" text-anchor="start" font-weight="bold">不拆（基线）</text>
<rect x="190.0" y="112.0" width="354.2" height="70.0" rx="3" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="190.0" y="112.0" width="354.2" height="70.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5" class="a2"/>
<text x="368.1" y="152.0" font-size="14" fill="#202124" text-anchor="middle">整块一段</text>
<text x="554.2" y="153.0" font-size="15" fill="#5f6368" text-anchor="start" font-weight="bold">100%</text>
<g class="a4"><line x1="190.0" y1="108" x2="190.0" y2="186" stroke="#202124" stroke-width="1.5" opacity="0.55"/></g>
<text x="20.0" y="257.0" font-size="15" fill="#188038" text-anchor="start" font-weight="bold">YZC128 → X4</text>

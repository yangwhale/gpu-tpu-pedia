<svg viewBox="0 0 1400 966" width="1400" height="966" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AOT 提前编译：在普通 CPU 上为手上没有的 TPU 拓扑编译训练步，得到每个 device 的显存分解，并与真机打印的数字逐位吻合">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">静态换回来的那一样　—— <tspan font-weight="700" fill="#1e8e3e">不占一张卡，先把账算清楚</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="37" y="58" class="sm">真的走了一遍</text>
<rect x="128.0" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="145.0" y="58" class="sm">被替换掉的那一环／要盯的那个数</text>
<rect x="20" y="124" width="636" height="460" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　凭什么不用卡</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">四环里</tspan><tspan font-weight="700" fill="#202124">只有一环是假的</tspan>，其余三环跟真机上一模一样。</text>
<rect x="38" y="186" width="600" height="50" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="207" class="box" fill="#1e8e3e">配置文件</text>
<text x="230" y="207" class="xs">模型、并行策略、batch、remat、XLA flag ——</text>
<text x="230" y="222" class="xs">跟真会跑的那份<tspan font-weight="700" fill="#202124">一字不差</tspan></text>
<line x1="338.0" y1="236" x2="338.0" y2="256" stroke="#5f6368" stroke-width="1.4" marker-end="url(#aK)"/>
<rect x="38" y="256" width="600" height="50" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="52" y="277" class="box" fill="#d93025">一副假的设备网格</text>
<text x="230" y="277" class="xs">唯一被替换掉的一环。</text>
<text x="230" y="292" class="xs"><tspan font-weight="700" fill="#202124">告诉编译器「有 64 芯片、拓扑长这样」</tspan></text>
<line x1="338.0" y1="306" x2="338.0" y2="326" stroke="#5f6368" stroke-width="1.4" marker-end="url(#aK)"/>
<rect x="38" y="326" width="600" height="50" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="347" class="box" fill="#1e8e3e">只造形状，不造张量</text>
<text x="230" y="347" class="xs"><tspan font-weight="700" fill="#202124">编译这一步本来就只看形状和 dtype</tspan>，值不参与 ——</text>
<text x="230" y="362" class="xs">所以这一环<tspan font-weight="700" fill="#202124">跟真机一模一样</tspan>，省掉的只是把数填进去</text>
<line x1="338.0" y1="376" x2="338.0" y2="396" stroke="#5f6368" stroke-width="1.4" marker-end="url(#aK)"/>
<rect x="38" y="396" width="600" height="50" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="417" class="box" fill="#1e8e3e">XLA 完整走一遍</text>
<text x="230" y="417" class="xs">图优化、降到机器码、分配显存 ——</text>
<text x="230" y="432" class="xs"><tspan font-weight="700" fill="#202124">这一步没有任何东西是假的</tspan></text>
<rect x="38" y="470" width="600" height="86" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="496" class="xs"><tspan font-weight="700" fill="#202124">这就是 5.5 那句话的正面。</tspan>那一节说「形状是编译期常量，所以换形状要收费」；<tspan font-weight="700" fill="#202124">反过来，编译期既然什么都知道，</tspan></text>
<text x="52" y="512" class="xs"><tspan font-weight="700" fill="#202124">编译期就能回答问题。</tspan><tspan font-weight="700" fill="#d93025">代价和红利是同一件事的两面。</tspan></text>
<rect x="676" y="124" width="704" height="460" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="694" y="150" class="sec">乙　·　算出来的是<tspan font-weight="700" fill="#d93025">每个 device 的一本账</tspan></text>
<text x="694" y="170" class="xs"><tspan fill="#9aa0a6">单位 </tspan><tspan font-weight="700" fill="#202124">GiB</tspan> —— <tspan font-weight="700" fill="#202124">跟编译器报 OOM 那条 94.74 同一个口径，可以直接比</tspan>。</text>
<line x1="1151.8004" y1="188" x2="1151.8004" y2="372" stroke="#202124" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1157.8004" y="200" class="num" fill="#202124">94.74</text>
<text x="1157.8004" y="214" class="xxs" fill="#202124">GiB／device</text>
<text x="694" y="209" class="lbl" fill="#202124">argument_size</text>
<rect x="824" y="199" width="75.255" height="15" rx="3" fill="#5f6368"/>
<text x="907.255" y="211" class="num" fill="#5f6368">21.75</text>
<text x="694" y="225" class="xxs"><tspan fill="#9aa0a6">输入：权重 ＋ 优化器状态的本地分片</tspan></text>
<text x="694" y="253" class="lbl" fill="#202124">output_size</text>
<rect x="824" y="243" width="75.255" height="15" rx="3" fill="#5f6368"/>
<text x="907.255" y="255" class="num" fill="#5f6368">21.75</text>
<text x="694" y="269" class="xxs"><tspan fill="#9aa0a6">输出</tspan></text>
<text x="694" y="297" class="lbl" fill="#d93025">temp_size</text>
<rect x="824" y="287" width="259.327" height="15" rx="3" fill="#d93025"/>
<text x="1091.327" y="299" class="num" fill="#d93025">74.95</text>
<text x="694" y="313" class="xxs"><tspan fill="#9aa0a6">临时／scratch —— </tspan><tspan font-weight="700" fill="#202124">判 OOM 只看这一项</tspan></text>
<text x="694" y="341" class="lbl" fill="#202124">generated_code</text>
<rect x="824" y="331" width="2" height="15" rx="3" fill="#5f6368"/>
<text x="832.9342" y="343" class="num" fill="#5f6368">0.27</text>
<text x="694" y="357" class="xxs"><tspan fill="#9aa0a6">代码本身</tspan></text>
<line x1="694" y1="366" x2="1362" y2="366" stroke="#dadce0" stroke-width="1"/>
<text x="694" y="385" class="lbl" fill="#202124">host_temp_size</text>
<rect x="824" y="375" width="102.4852" height="15" rx="3" fill="#fff" stroke="#5f6368" stroke-width="1"/>
<text x="934.4852" y="387" class="num" fill="#5f6368">29.62</text>
<text x="694" y="401" class="xxs"><tspan fill="#9aa0a6">host 侧临时（offload 用）—— </tspan><tspan font-weight="700" fill="#202124">不占 device HBM，不受上面那条线管</tspan></text>
<rect x="694" y="420" width="668" height="104" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="708" y="444" class="xs"><tspan font-weight="700" fill="#d93025">判 OOM 只看 temp_size，别把 argument 加进去。</tspan>早期那个「argument ＋ temp ＋ 代码」的公式<tspan font-weight="700" fill="#202124">偏保守，会把跑得动的配置</tspan></text>
<text x="708" y="460" class="xs"><tspan font-weight="700" fill="#202124">误判成 OOM</tspan>。<tspan font-weight="700" fill="#202124">原因是 argument 里有 21.75 GiB 跟输出是同一块内存（别名）</tspan>，两笔不能相加。</text>
<text x="708" y="480" class="xs"><tspan font-weight="700" fill="#202124">temp 是 argument 的 3.4 倍</tspan> —— 这个配置的显存大头<tspan font-weight="700" fill="#202124">不是权重，是激活和 scratch</tspan>。<tspan fill="#9aa0a6">想省显存该动 remat 和 batch，不是去</tspan></text>
<text x="708" y="496" class="xs"><tspan fill="#9aa0a6">切权重。</tspan></text>
<rect x="694" y="534" width="668" height="38" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="708" y="556" class="xs"><tspan font-weight="700" fill="#202124">⚠️ 这本账里没有「跑多快」。</tspan><tspan fill="#9aa0a6">AOT 只回答装不装得下、编不编得过，一个吞吐数字都给不了。</tspan></text>
<rect x="20" y="612" width="1360" height="190" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="38" y="638" class="sec">丙　·　凭什么信它　—— <tspan font-weight="700" fill="#1e8e3e">在真机打印的精度内完全吻合</tspan></text>
<text x="38" y="658" class="xs"><tspan fill="#9aa0a6">同一份配置：左边是 CPU 上算出来的，右边是 64 芯片真跑起来之后自己打印的。</tspan><tspan font-weight="700" fill="#202124">左边这几个数就是乙格那本账</tspan>，同一个口径（GiB）—— 所以丙格证的不是「又量了一遍」，是<tspan font-weight="700" fill="#202124">「AOT 算的 ＝ 真机得到的」</tspan>。</text>
<rect x="38" y="696" width="316" height="62" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="716" class="lbl" fill="#202124">temp（pdbs=12）</text>
<text x="52" y="744" class="xxs" fill="#5f6368">AOT 算的</text>
<text x="134" y="746" class="numb" fill="#202124">74.95</text>
<text x="206" y="744" class="xxs" fill="#5f6368">真机打的</text>
<text x="288" y="746" class="numb" fill="#1e8e3e">75.0</text>
<rect x="366" y="696" width="316" height="62" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="380" y="716" class="lbl" fill="#202124">temp（pdbs=13）</text>
<text x="380" y="744" class="xxs" fill="#5f6368">AOT 算的</text>
<text x="462" y="746" class="numb" fill="#202124">73.11</text>
<text x="534" y="744" class="xxs" fill="#5f6368">真机打的</text>
<text x="616" y="746" class="numb" fill="#1e8e3e">73.1</text>
<rect x="694" y="696" width="316" height="62" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="708" y="716" class="lbl" fill="#202124">argument</text>
<text x="708" y="744" class="xxs" fill="#5f6368">AOT 算的</text>
<text x="790" y="746" class="numb" fill="#202124">21.75</text>
<text x="862" y="744" class="xxs" fill="#5f6368">真机打的</text>
<text x="944" y="746" class="numb" fill="#1e8e3e">21.7</text>
<rect x="1022" y="696" width="316" height="62" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="1036" y="716" class="lbl" fill="#202124">host temp</text>
<text x="1036" y="744" class="xxs" fill="#5f6368">AOT 算的</text>
<text x="1118" y="746" class="numb" fill="#202124">29.62</text>
<text x="1190" y="744" class="xxs" fill="#5f6368">真机打的</text>
<text x="1272" y="746" class="numb" fill="#1e8e3e">29.6</text>
<text x="38" y="782" class="xs"><tspan font-weight="700" fill="#202124">它给的不是估算，就是编译器在真机上会得到的同一份账</tspan><tspan fill="#9aa0a6">（因为算这份账的本来就是同一个编译器）。⚠️ 但能说的只到这儿 —— </tspan><tspan font-weight="700" fill="#202124">真机那栏只打三位有效数字</tspan>，推不出「一个字节都不差」。真正的字节级证据是另一组：同一份配置在两台机器上编，产物 md5 一模一样。</text>
<rect x="20" y="830" width="1360" height="108" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="38" y="858" class="sec">⚠️ 讲这张图最容易讲错的一句：它不是用来省编译时间的</text>
<text x="38" y="884" class="xs">「提前编译」这四个字会把人往那儿引，但账不是那么算的：<tspan font-weight="700" fill="#202124">64 芯片上真机编译只要 46 秒</tspan>，而启动到第一步一共 227 秒 —— <tspan font-weight="700" fill="#d93025">编译只占 1/5</tspan>。<tspan font-weight="700" fill="#202124">带上预编译产物：227 秒 → 175.6 秒，省 51 秒</tspan><tspan fill="#9aa0a6">（编译本体 46 秒换成加载 400 MB 产物的 2.15 秒；余下约 8 秒源记录</tspan></text>
<text x="38" y="903" class="xs"><tspan fill="#9aa0a6">没拆，这里也不硬凑）</tspan>。</text>
<text x="38" y="926" class="xs"><tspan font-weight="700" fill="#202124">它真正省掉的是这个循环：排队 → 抢到 64 张卡 → 跑起来发现装不下 → 退出 → 重排队。</tspan><tspan font-weight="700" fill="#d93025">那是小时级的，而且占着别人的容量。</tspan><tspan font-weight="700" fill="#202124">一次探针约两分钟、一台普通 CPU 机器 —— 每换一次配置就跑一遍，没有理由省。</tspan></text>
<text x="1380" y="954" class="xxs" fill="#9aa0a6" text-anchor="end">实测：Hunyuan3-295B-A21B（80 层）· 目标 64 芯片 · 一台普通 CPU 机器 · 单个探针约 2 分钟；含存产物上传的全流程约 5 分钟</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：all-reduce 带宽项 2(S−1)/S，1 片 0、2 片 1、8 片 1.75，第一跳最大。右：关 pipeliner 同口径实测步时指数 45、47、50，1 到 2 片多约 4%，2 到 8 片再多约 7%，第二跳反而更大。">


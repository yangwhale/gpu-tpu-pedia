<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图，机理是推断：四台主机依次通过四个阶段：建 pod、TPU 初始化、MTC 握手与读档、编译与首步，每道门等最后一台到才放行。TPU 初始化前主机 3 卡住，其余三台在门口干等，直到这一环超时，全体重来。下方按比例画出顺利时约 6 分钟、挂住时 30 到 66 分钟。">
<title>动图，机理是推断：四台主机依次通过四个阶段：建 pod、TPU 初始化、MTC 握手与读档、编译与首步，每道门等最后一台到才放行。TPU 初始化前主机 3 卡住，其余三台在门口干等，直到这一环超时，全体重来。下方按比例画出顺利时约 6 分钟、挂住时 30 到 66 分钟。</title>
<style>
@keyframes dk0 { 0% { transform: translateX(0px) } 5% { transform: translateX(0px) } 6% { transform: translateX(-326px) } 14% { transform: translateX(-180px) } 22% { transform: translateX(-180px) } 34% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
.dot0 { animation: dk0 10s linear infinite; transform-box: fill-box; }
@keyframes dk1 { 0% { transform: translateX(0px) } 5% { transform: translateX(0px) } 6% { transform: translateX(-326px) } 16% { transform: translateX(-180px) } 22% { transform: translateX(-180px) } 34% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
.dot1 { animation: dk1 10s linear infinite; transform-box: fill-box; }
@keyframes dk2 { 0% { transform: translateX(0px) } 5% { transform: translateX(0px) } 6% { transform: translateX(-326px) } 18% { transform: translateX(-180px) } 22% { transform: translateX(-180px) } 34% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
.dot2 { animation: dk2 10s linear infinite; transform-box: fill-box; }
@keyframes dk3 { 0% { transform: translateX(0px) } 5% { transform: translateX(0px) } 6% { transform: translateX(-260px) } 20% { transform: translateX(-114px) } 22% { transform: translateX(-114px) } 29% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
.dot3 { animation: dk3 10s linear infinite; transform-box: fill-box; }
@keyframes dc3 { 0% { fill:#d93025 } 5% { fill:#d93025 } 6% { fill:#1a73e8 } 29% { fill:#1a73e8 } 30% { fill:#d93025 } 100% { fill:#d93025 } }
.dot3 { animation: dk3 10s linear infinite, dc3 10s linear infinite; transform-box: fill-box; }
@keyframes stkk { 0% { opacity:1 } 5% { opacity:1 } 6% { opacity:0 } 29% { opacity:0 } 31% { opacity:1 } 100% { opacity:1 } }
.stk { animation: stkk 10s linear infinite; transform-box: fill-box; }
@keyframes tmk { 0% { transform: scaleX(1) } 5% { transform: scaleX(1) } 6% { transform: scaleX(0) } 34% { transform: scaleX(0) } 80% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
.tmr { animation: tmk 10s linear infinite; transform-box: fill-box; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="434" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">恢复是一串「等最后一个到」：一台卡住，全体等到那一环超时</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">上半示意（「每段等最后一台」是推断），卡在 TPU 初始化（START_SESSION）；下半按比例画（192 芯片演练）。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">主机</text>
<rect x="100.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="122.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">卡住 / 干等</text>
<line x1="270.0" y1="134.0" x2="270.0" y2="278.0" stroke="#5f6368" stroke-width="3"/>
<text x="270.0" y="126.0" font-size="14" fill="#202124" text-anchor="middle">建 pod</text>
<line x1="450.0" y1="134.0" x2="450.0" y2="278.0" stroke="#5f6368" stroke-width="3"/>
<text x="450.0" y="126.0" font-size="14" fill="#202124" text-anchor="middle">TPU 初始化</text>
<line x1="630.0" y1="134.0" x2="630.0" y2="278.0" stroke="#5f6368" stroke-width="3"/>
<text x="630.0" y="126.0" font-size="14" fill="#202124" text-anchor="middle">MTC 握手 + 读档</text>
<line x1="810.0" y1="134.0" x2="810.0" y2="278.0" stroke="#5f6368" stroke-width="3"/>
<text x="810.0" y="126.0" font-size="14" fill="#202124" text-anchor="middle">编译 + 首步</text>
<text x="110.0" y="126.0" font-size="14" fill="#5f6368" text-anchor="middle">打断</text>
<line x1="110.0" y1="134.0" x2="110.0" y2="278.0" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="24.0" y="161.0" font-size="14" fill="#5f6368" text-anchor="start">主机 0</text>
<line x1="110.0" y1="156.0" x2="900.0" y2="156.0" stroke="#dadce0" stroke-width="1"/>
<circle class="dot0" cx="436" cy="156" r="9" fill="#1a73e8"/>
<text x="24.0" y="195.0" font-size="14" fill="#5f6368" text-anchor="start">主机 1</text>
<line x1="110.0" y1="190.0" x2="900.0" y2="190.0" stroke="#dadce0" stroke-width="1"/>
<circle class="dot1" cx="436" cy="190" r="9" fill="#1a73e8"/>
<text x="24.0" y="229.0" font-size="14" fill="#5f6368" text-anchor="start">主机 2</text>
<line x1="110.0" y1="224.0" x2="900.0" y2="224.0" stroke="#dadce0" stroke-width="1"/>
<circle class="dot2" cx="436" cy="224" r="9" fill="#1a73e8"/>
<text x="24.0" y="263.0" font-size="14" fill="#5f6368" text-anchor="start">主机 3</text>
<line x1="110.0" y1="258.0" x2="900.0" y2="258.0" stroke="#dadce0" stroke-width="1"/>
<circle class="dot3" cx="370" cy="258" r="9" fill="#d93025"/>
<text x="370.0" y="288.0" font-size="13" fill="#a50e0e" text-anchor="middle" class="stk">卡住</text>
<rect x="300.0" y="300.0" width="300.0" height="14.0" rx="3" fill="none" stroke="#d93025" stroke-width="1.2"/>
<rect class="tmr" x="300" y="300" width="300" height="14" rx="3" fill="#fce8e6"/>
<text x="610.0" y="312.0" font-size="14" fill="#a50e0e" text-anchor="start">其余主机在门口干等，直到这一环超时 → 全体重来</text>
<text x="24.0" y="377.0" font-size="14" fill="#202124" text-anchor="start">顺利（9 次里 5 次）</text>
<rect x="200.0" y="362.0" width="60.0" height="20.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="270.0" y="377.0" font-size="14" fill="#174ea6" text-anchor="start">约 6 min（读检查点只占半分钟）</text>
<text x="24.0" y="413.0" font-size="14" fill="#202124" text-anchor="start">挂住（9 次里 4 次）</text>
<rect x="200.0" y="398.0" width="300.0" height="20.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<rect x="500.0" y="398.0" width="360.0" height="20.0" rx="3" fill="#ffffff" stroke="#d93025" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="870.0" y="413.0" font-size="14" fill="#a50e0e" text-anchor="start">30–66 min</text>
</svg>

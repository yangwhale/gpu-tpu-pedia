<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图示意：左边是一张卡的 HBM，权重固定，激活和余量此消彼长；右边是时间线。第一帧是 full remat：激活小、余量大，本层多一截重算，下一层的专家权重 AG 提前发，盖在本层计算下面。随后改成多存激活：激活长高、余量变小，AG 只能晚发，本层算完要干等它到齐，出现红色暴露等待；再回到 full remat 循环。"><title>动图示意：左边是一张卡的 HBM，权重固定，激活和余量此消彼长；右边是时间线。第一帧是 full remat：激活小、余量大，本层多一截重算，下一层的专家权重 AG 提前发，盖在本层计算下面。随后改成多存激活：激活长高、余量变小，AG 只能晚发，本层算完要干等它到齐，出现红色暴露等待；再回到 full remat 循环。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><style>
.fb { transform-box: fill-box; }
.act { transform-origin: 50% 100%; animation: act 11s ease-in-out infinite; }
.slk { transform-origin: 50% 0%; animation: slk 11s ease-in-out infinite; }
.ag  { animation: ag 11s ease-in-out infinite; }
.nx  { animation: nx 11s ease-in-out infinite; }
.gap { transform-origin: 0% 50%; transform: scaleX(0); animation: gap 11s ease-in-out infinite; }
.pa  { animation: pa 11s ease-in-out infinite; }
.pb  { opacity: 0; animation: pb 11s ease-in-out infinite; }
@keyframes act { 0%,18% { transform: scaleY(1) } 36%,64% { transform: scaleY(2.6) } 80%,100% { transform: scaleY(1) } }
@keyframes slk { 0%,18% { transform: scaleY(1) } 36%,64% { transform: scaleY(0.3333) } 80%,100% { transform: scaleY(1) } }
@keyframes ag  { 0%,18% { transform: translateX(0px) } 36%,64% { transform: translateX(120px) } 80%,100% { transform: translateX(0px) } }
@keyframes nx  { 0%,18% { transform: translateX(0px) } 36%,64% { transform: translateX(60px) } 80%,100% { transform: translateX(0px) } }
@keyframes gap { 0%,18% { transform: scaleX(0) } 36%,64% { transform: scaleX(1) } 80%,100% { transform: scaleX(0) } }
@keyframes pa  { 0%,20% { opacity: 1 } 30%,70% { opacity: 0 } 78%,100% { opacity: 1 } }
@keyframes pb  { 0%,26% { opacity: 0 } 36%,64% { opacity: 1 } 74%,100% { opacity: 0 } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style><rect width="900" height="420" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">余量被激活吃掉，下一层的 AG 就只能晚发，露在关键路径上</text>
<text x="24.0" y="60.0" font-size="14" fill="#3c4043" text-anchor="start">示意（高度、长度都不按比例，不带刻度）：左＝一张卡的 HBM，右＝时间线</text>
<rect x="60.0" y="110.0" width="130.0" height="290.0" rx="4" fill="none" stroke="#5f6368" stroke-width="1.2"/>
<line x1="44.0" y1="130.0" x2="206.0" y2="130.0" stroke="#5f6368" stroke-width="1.6"/>
<text x="212.0" y="135.0" font-size="13" fill="#3c4043" text-anchor="start">HBM 上限</text>
<rect x="60.0" y="300.0" width="130.0" height="100.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.4"/>
<text x="125.0" y="345.0" font-size="13" fill="#3c4043" text-anchor="middle">权重·梯度</text>
<text x="125.0" y="365.0" font-size="13" fill="#3c4043" text-anchor="middle">优化器</text>
<rect class="fb act" x="60.0" y="250.0" width="130.0" height="50.0" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.4"/>
<rect class="fb slk" x="60.0" y="130.0" width="130.0" height="120.0" rx="2" fill="#feefe3" stroke="#e8710a" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="125.0" y="156.0" font-size="14" fill="#e8710a" text-anchor="middle" font-weight="700">余量</text>
<text x="125.0" y="290.0" font-size="14" fill="#188038" text-anchor="middle" font-weight="700">激活</text>
<text x="292.0" y="222.0" font-size="13" fill="#3c4043" text-anchor="end">TensorCore</text>
<text x="292.0" y="280.0" font-size="13" fill="#3c4043" text-anchor="end">通信</text>
<rect x="300.0" y="200.0" width="220.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="410.0" y="222.0" font-size="14" fill="#174ea6" text-anchor="middle">第 i 层计算</text>
<rect class="fb gap" x="520.0" y="200.0" width="100.0" height="34.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<g class="pa">
<rect x="520.0" y="200.0" width="40.0" height="34.0" rx="4" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="540.0" y="222.0" font-size="13" fill="#0d652d" text-anchor="middle">重算</text>
</g>
<g class="nx">
<rect x="560.0" y="200.0" width="220.0" height="34.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="670.0" y="222.0" font-size="14" fill="#174ea6" text-anchor="middle">第 i+1 层计算</text>
</g>
<g class="ag">
<rect x="310.0" y="262.0" width="200.0" height="30.0" rx="4" fill="#feefe3" stroke="#e8710a" stroke-width="1.6"/>
<text x="410.0" y="282.0" font-size="14" fill="#b06000" text-anchor="middle">第 i+1 层权重 AG</text>
</g>
<text class="pb" x="570.0" y="254.0" font-size="14" fill="#d93025" text-anchor="middle" font-weight="700">暴露等待</text>
<text x="300.0" y="186.0" font-size="13" fill="#3c4043" text-anchor="start">第 i+1 层要等它的 AG 到齐才能开算</text>
<g class="pa">
<text x="300.0" y="334.0" font-size="15" fill="#188038" text-anchor="start" font-weight="700">full remat：激活少存、多一截重算，余量大</text>
<text x="300.0" y="358.0" font-size="14" fill="#0d652d" text-anchor="start">调度器拿余量换提前量：AG 早发，整段盖在本层计算下面</text>
</g>
<g class="pb">
<text x="300.0" y="334.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="700">多存激活：余量被吃掉</text>
<text x="300.0" y="358.0" font-size="14" fill="#a50e0e" text-anchor="start">提前发的 AG 要先占 buffer，放不下就只能晚发 → 本层算完干等</text>
</g></svg>

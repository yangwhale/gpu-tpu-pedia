<svg viewBox="0 0 1400 728" width="1400" height="728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两次漏改的真实机制：文件就在手上，改了别处，跳过了它 ——不是搜索能力问题，是注意力问题">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">同一个漏法，两次　—— <tspan font-weight="700" fill="#d93025">而两次都不是「搜不到」</tspan></text>
<rect x="1270" y="10" width="110" height="22" rx="11" fill="#d93025"/>
<text x="1325.0" y="25" class="lbl" fill="#fff" text-anchor="middle">撤源数，漏派生数</text>
<rect x="20" y="124" width="676" height="442" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="20" y="124" width="5" height="442" rx="3" fill="#f9ab00"/>
<text x="40" y="151" class="sec" fill="#f9ab00">血缘一　·　代价 15 天</text>
<rect x="40" y="168" width="636" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
<text x="52" y="183" class="xxs" fill="#f9ab00">源数　·　自己测错了</text>
<text x="52" y="202" class="numb" fill="#202124">1,014.8</text>
<text x="664" y="202" class="xxs" fill="#5f6368" text-anchor="end">TFLOP/s/chip　·　生 08-15，08-16 撤回</text>
<line x1="66" y1="220" x2="66" y2="236" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="40" y="236" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="52" y="251" class="xxs" fill="#8430ce">派生数　·　÷ 138.9 GFLOP/token</text>
<text x="52" y="270" class="numb" fill="#202124">7,308</text>
<text x="664" y="270" class="xxs" fill="#5f6368" text-anchor="end">tok/s/chip</text>
<line x1="66" y1="288" x2="66" y2="304" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="40" y="304" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="52" y="319" class="xxs" fill="#8430ce">它撑起的那句话</text>
<text x="52" y="338" class="box" fill="#202124">「v7 的 FP8 已反超 GB300 +17%」</text>
<text x="664" y="338" class="xxs" fill="#5f6368" text-anchor="end">7,308 对 6,242</text>
<rect x="40" y="372" width="636" height="112" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.2"/>
<text x="52" y="392" class="lbl">08-16　<tspan class="mono" fill="#1967d2">8c46582</tspan>　标题：「清掉<tspan font-weight="700" fill="#202124">全部</tspan>失效的 1,014.8」</text>
<text x="52" y="419" class="xxs"><tspan fill="#9aa0a6">它</tspan><tspan font-weight="700" fill="#202124">做到了标题说的事</tspan> —— 正文列的四处表格行都清掉了。</text>
<text x="52" y="444" class="xxs"><tspan font-weight="700" fill="#202124">但它改的是 </tspan><tspan class="mono" fill="#1967d2">README.md</tspan> 的第 26 行和第 137 行。</text>
<text x="52" y="469" class="xxs"><tspan fill="#9aa0a6">而那句「已反超」就在</tspan><tspan font-weight="700" fill="#202124">同一个文件的第 51 行</tspan> —— 第 52 行还挂着一条 ⚠️「口径提醒：7,308 是 v7 的 FP8……」。</text>
<rect x="40" y="496" width="636" height="50" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text x="54" y="520" class="numb" fill="#d93025">孤儿期 15 天</text>
<text x="662" y="520" class="xxs" fill="#5f6368" text-anchor="end">08-16 上游撤 → 08-31 它才撤</text>
<text x="54" y="536" class="xxs" fill="#5f6368">上游已经撤了、它还挂着的那段时间</text>
<rect x="704" y="124" width="676" height="442" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<rect x="704" y="124" width="5" height="442" rx="3" fill="#d93025"/>
<text x="724" y="151" class="sec" fill="#d93025">血缘二　·　代价不到 1 天</text>
<rect x="724" y="168" width="636" height="52" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="736" y="183" class="xxs" fill="#d93025">源数　·　从来没有出处</text>
<text x="736" y="202" class="numb" fill="#202124">2,700 / 5,400</text>
<text x="1348" y="202" class="xxs" fill="#5f6368" text-anchor="end">GB300 峰值　·　生 07-12，08-31 撤回</text>
<line x1="750" y1="220" x2="750" y2="236" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="724" y="236" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="736" y="251" class="xxs" fill="#8430ce">派生数　·　拿它当分母（只有 BF16 那个 2,700）</text>
<text x="736" y="270" class="numb" fill="#202124">31.60%</text>
<text x="1348" y="270" class="xxs" fill="#5f6368" text-anchor="end">GB300 的 MFU</text>
<line x1="750" y1="288" x2="750" y2="304" stroke="#5f6368" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="724" y="304" width="636" height="52" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
<text x="736" y="319" class="xxs" fill="#8430ce">它进了哪儿</text>
<text x="736" y="338" class="box" fill="#202124">跟 v7 并排的对照表</text>
<text x="1348" y="338" class="xxs" fill="#5f6368" text-anchor="end">并排比了 26 天</text>
<rect x="724" y="372" width="636" height="112" rx="8" fill="#fcfcfd" stroke="#dadce0" stroke-width="1.2"/>
<text x="736" y="392" class="lbl">08-31　<tspan class="mono" fill="#1967d2">483128b</tspan>　标题：「修正 GB300 峰值」</text>
<text x="736" y="419" class="xxs"><tspan fill="#9aa0a6">峰值改对了，一共动了</tspan><tspan font-weight="700" fill="#202124">十个文件</tspan>。</text>
<text x="736" y="444" class="xxs"><tspan font-weight="700" fill="#202124">那十个里，正好包含含 31.60% 的那三个</tspan> —— <tspan class="mono" fill="#1967d2">EXPERIMENT-LOG.md</tspan>、<tspan class="mono" fill="#1967d2">README.md</tspan>、<tspan class="mono" fill="#1967d2">README.en.md</tspan>。</text>
<text x="736" y="469" class="xxs"><tspan fill="#9aa0a6">三处一个都没改到。</tspan><tspan font-weight="700" fill="#202124">同日 </tspan><tspan class="mono" fill="#1967d2">e2d0dc4</tspan> 才补上。</text>
<rect x="724" y="496" width="636" height="50" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="738" y="520" class="numb" fill="#202124">孤儿期 不到 1 天</text>
<text x="1346" y="520" class="xxs" fill="#5f6368" text-anchor="end">08-31 上游撤 → 同日补齐</text>
<text x="738" y="536" class="xxs" fill="#5f6368">上游已经撤了、它还挂着的那段时间</text>
<rect x="20" y="590" width="1360" height="114" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="618" class="sec">⭐ 两次都不是「搜不到」—— 文件就在手上，改了别处，跳过了它</text>
<text x="38" y="644" class="xs"><tspan fill="#9aa0a6">所以「撤回后记得搜一遍下游」这条规矩</tspan><tspan font-weight="700" fill="#202124">是废话</tspan>：<tspan font-weight="700" fill="#202124">搜索从来不是瓶颈，注意力才是。</tspan>改上游的人视线锁在要改的那一处，<tspan font-weight="700" fill="#202124">同一个文件里隔二十几行的下游数照样看不见</tspan>。</text>
<text x="38" y="665" class="xs"><tspan font-weight="700" fill="#202124">⭐ 所以把负担挪到落笔时：一个数如果是算出来的，就把算式写在它旁边</tspan><tspan fill="#9aa0a6"> —— </tspan><tspan class="mono" fill="#1967d2">7,308 = 1,014.8e12 ÷ 138.9e9</tspan>。这样改上游的人<tspan font-weight="700" fill="#202124">在同一屏上就能看见它</tspan>。<tspan font-weight="700" fill="#202124">另外：第二次代价小，不是因为更仔细，是因为撤回和复查在同一天</tspan> —— 缩短这两者的间隔能安排，「更仔细」</text>
<text x="38" y="683" class="xs">不能。</text>
<text x="1380" y="716" class="xxs" fill="#9aa0a6" text-anchor="end">两条血缘的 diff 行号、文件清单均已对本仓库 git 历史逐条核对</text>
</svg>
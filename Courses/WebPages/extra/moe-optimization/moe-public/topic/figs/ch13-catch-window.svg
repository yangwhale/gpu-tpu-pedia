<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="一条非线性的步数轴，五个点。左边三格是检查点：编译后 HLO 抓优化没开上；第 0 步比 loss、aux 各分项和梯度，抓前向数值错和路由 ID 配错这类梯度错；第 1 步参数抓反向与优化器的错，包括分布式状态错。右边两格灰色，是只看 loss 时这些错才露出来的时刻：路由 ID 配错第 199 步才看出，分片顺序错第 1000 步差约负 5%。底下红框是代价，越往右越贵。">
<title>越早的检查越便宜：左边三格能提前抓的错，只看 loss 要等到右边两格</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>

<rect width="900" height="404" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">越早的检查越便宜：左边三格能提前抓的错，只看 loss 要等到右边两格</text>
<rect x="536" y="66" width="350" height="214" rx="10" fill="#f1f3f4" stroke="none" stroke-width="1.5" />
<line x1="40" y1="250" x2="870" y2="250" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
<rect x="32" y="74" width="156" height="132" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" />
<text x="110" y="96" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >优化没开上</text>
<text x="110" y="120" font-size="13" fill="#5f6368" text-anchor="middle" >grep f8 乘法、</text>
<text x="110" y="140" font-size="13" fill="#5f6368" text-anchor="middle" >Pallas custom-call、</text>
<text x="110" y="160" font-size="13" fill="#5f6368" text-anchor="middle" >pass 计数</text>
<text x="110" y="196" font-size="13" fill="#174ea6" text-anchor="middle" >O 类</text>
<line x1="110" y1="208" x2="110" y2="242" stroke="#dadce0" stroke-width="1.5"/>
<circle cx="110" cy="250" r="7" fill="#1a73e8"/>
<text x="110" y="270" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >编译后 HLO</text>
<rect x="80" y="378" width="60" height="14" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="202" y="74" width="156" height="132" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" />
<text x="280" y="96" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >前向与梯度</text>
<text x="280" y="120" font-size="13" fill="#5f6368" text-anchor="middle" >loss、aux 各分项、</text>
<text x="280" y="140" font-size="13" fill="#5f6368" text-anchor="middle" >grad norm、梯度对拍</text>
<text x="280" y="196" font-size="13" fill="#174ea6" text-anchor="middle" >N01、N07、表 4.4</text>
<line x1="280" y1="208" x2="280" y2="242" stroke="#dadce0" stroke-width="1.5"/>
<circle cx="280" cy="250" r="7" fill="#1a73e8"/>
<text x="280" y="270" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >第 0 步</text>
<rect x="250" y="368" width="60" height="24" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="372" y="74" width="156" height="132" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" />
<text x="450" y="96" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >反向与优化器</text>
<text x="450" y="120" font-size="13" fill="#5f6368" text-anchor="middle" >第 0 步只验了前向，</text>
<text x="450" y="140" font-size="13" fill="#5f6368" text-anchor="middle" >要比第 1 步参数</text>
<text x="450" y="196" font-size="13" fill="#174ea6" text-anchor="middle" >D05</text>
<line x1="450" y1="208" x2="450" y2="242" stroke="#dadce0" stroke-width="1.5"/>
<circle cx="450" cy="250" r="7" fill="#1a73e8"/>
<text x="450" y="270" font-size="14" fill="#202124" text-anchor="middle" font-weight="700" >第 1 步参数</text>
<rect x="420" y="356" width="60" height="36" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="542" y="74" width="156" height="132" rx="8" fill="none" stroke="#dadce0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="620" y="96" font-size="14" fill="#5f6368" text-anchor="middle" font-weight="700" >若只看 loss</text>
<text x="620" y="120" font-size="13" fill="#5f6368" text-anchor="middle" >路由 ID 配错（N01）</text>
<text x="620" y="140" font-size="13" fill="#5f6368" text-anchor="middle" >第 199 步才看出</text>
<line x1="620" y1="208" x2="620" y2="242" stroke="#dadce0" stroke-width="1.5"/>
<circle cx="620" cy="250" r="7" fill="#5f6368"/>
<text x="620" y="270" font-size="14" fill="#5f6368" text-anchor="middle" font-weight="700" >几百步</text>
<rect x="590" y="332" width="60" height="60" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="712" y="74" width="156" height="132" rx="8" fill="none" stroke="#dadce0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="790" y="96" font-size="14" fill="#5f6368" text-anchor="middle" font-weight="700" >若只看 loss</text>
<text x="790" y="120" font-size="13" fill="#5f6368" text-anchor="middle" >分片顺序错（D05）</text>
<text x="790" y="140" font-size="13" fill="#5f6368" text-anchor="middle" >第 1000 步差约 −5%</text>
<line x1="790" y1="208" x2="790" y2="242" stroke="#dadce0" stroke-width="1.5"/>
<circle cx="790" cy="250" r="7" fill="#5f6368"/>
<text x="790" y="270" font-size="14" fill="#5f6368" text-anchor="middle" font-weight="700" >上千步</text>
<rect x="760" y="302" width="60" height="90" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="40" y="344" font-size="13" fill="#a50e0e" text-anchor="start" >代价：</text>
<text x="40" y="362" font-size="13" fill="#a50e0e" text-anchor="start" >重跑与作废</text>
</svg>
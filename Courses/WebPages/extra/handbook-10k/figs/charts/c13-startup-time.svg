idth="1"/></g><text x="561.9" y="217.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">19</text><text x="686.2" y="217.0" font-size="14" fill="#202124" font-weight="700">约 44 min</text><text x="138.0" y="255.0" font-size="14" fill="#202124" text-anchor="end">8 片 · 2,048 芯</text><g class="pt" tabindex="0"><title>8 片 · 编组 + 起 pod + TPU 初始化：约 4 min</title><rect x="150.0" y="239.0" width="45.3" height="22.0" fill="#dadce0" fill-opacity="1.0" stroke="#fff" stroke-width="1"/></g><g class="pt" tabindex="0"><title>8 片 · 第一遍编译：约 22 min</title><rect x="195.3" y="239.0" width="265.9" height="22.0" fill="#1a73e8" fill-opacity="1.0" stroke="#fff" stroke-width="1"/></g><text x="328.2" y="255.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">22</text><g class="pt" tabindex="0"><title>8 片 · 第二遍（重编）+ 第 0 步：约 19 min</title><rect x="461.2" y="239.0" width="231.3" height="22.0" fill="#e8710a" fill-opacity="1.0" stroke="#fff" stroke-width="1"/></g><text x="576.8" y="255.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">19</text><text x="700.5" y="255.0" font-size="14" fill="#202124" font-weight="700">约 46 min</text><text x="138.0" y="293.0" font-size="14" fill="#202124" text-anchor="end">10+ 片 · 数千芯</text><g class="pt" tabindex="0"><title>10+ 片 · apply → 第 0 步：40–50 min（两遍编译各约 20 min）</title><rect x="150.0" y="277.0" width="476.9" height="22.0" fill="#fff" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 3"/></g><text x="388.5" y="293.0" font-size="13" fill="#202124" text-anchor="middle">未拆段：编组 + 起 pod + 两遍编译（各约 20 min）</text><line x1="626.9" y1="288.0" x2="746.2" y2="288.0" stroke="#5f6368" stroke-width="1.6"/><line x1="626.9" y1="281.0" x2="626.9" y2="295.0" stroke="#5f6368" stroke-width="1.6"/><line x1="746.2" y1="281.0" x2="746.2" y2="295.0" stroke="#5f6368" stroke-width="1.6"/><text x="754.2" y="293.0" font-size="14" fill="#202124" font-weight="700">40–50 min</text><text x="138.0" y="331.0" font-size="14" fill="#202124
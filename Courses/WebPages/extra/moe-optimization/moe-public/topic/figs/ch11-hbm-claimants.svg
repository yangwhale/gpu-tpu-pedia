<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="HBM 余量由四方共用：从下往上是权重、梯度与优化器状态，激活（A14 remat 档位定），加大 PDB（B07），pipeliner 多扛的一圈 buffer（B01），剩下的才是 placement 提前发通信用的余量（A02）。三条线：96 GiB 标称容量，94.74 GiB 运行时上限，92 GiB 是 placement 准入线（96 − 4）。"><title>HBM 余量由四方共用：从下往上是权重、梯度与优化器状态，激活（A14 remat 档位定），加大 PDB（B07），pipeliner 多扛的一圈 buffer（B01），剩下的才是 placement 提前发通信用的余量（A02）。三条线：96 GiB 标称容量，94.74 GiB 运行时上限，92 GiB 是 placement 准入线（96 − 4）。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="470" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">HBM 余量是四方共用的一份：前三方每多拿一截，placement 的提前量就少一截</text>
<text x="24.0" y="60.0" font-size="14" fill="#3c4043" text-anchor="start">一张卡的 HBM 从下往上堆（示意，高度不按比例）；三条横线是平台常数</text>
<rect x="150.0" y="322.0" width="150.0" height="130.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.4"/>
<text x="225.0" y="392.0" font-size="13" fill="#3c4043" text-anchor="middle">权重·梯度·优化器</text>
<line x1="306.0" y1="387.0" x2="336.0" y2="387.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="2 3"/>
<text x="344.0" y="392.0" font-size="14" fill="#3c4043" text-anchor="start">换模型才变</text>
<rect x="150.0" y="250.0" width="150.0" height="72.0" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.4"/>
<text x="225.0" y="291.0" font-size="13" fill="#0d652d" text-anchor="middle">激活</text>
<line x1="306.0" y1="286.0" x2="336.0" y2="286.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="2 3"/>
<text x="344.0" y="291.0" font-size="14" fill="#0d652d" text-anchor="start">A14 remat：多存一样，多占一截</text>
<rect x="150.0" y="212.0" width="150.0" height="38.0" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.4"/>
<text x="225.0" y="236.0" font-size="13" fill="#0d652d" text-anchor="middle">加大 PDB</text>
<line x1="306.0" y1="231.0" x2="336.0" y2="231.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="2 3"/>
<text x="344.0" y="236.0" font-size="14" fill="#0d652d" text-anchor="start">B07：放得下的判断是编译器口径</text>
<rect x="150.0" y="180.0" width="150.0" height="32.0" rx="2" fill="#e6f4ea" stroke="#188038" stroke-width="1.4"/>
<text x="225.0" y="201.0" font-size="13" fill="#0d652d" text-anchor="middle">pipeliner</text>
<line x1="306.0" y1="196.0" x2="336.0" y2="196.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="2 3"/>
<text x="344.0" y="201.0" font-size="14" fill="#0d652d" text-anchor="start">B01：本圈末的通信挪到下一圈，输入多活一圈</text>
<rect x="150.0" y="140.0" width="150.0" height="40.0" rx="2" fill="#ffffff" stroke="#e8710a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="225.0" y="165.0" font-size="14" fill="#e8710a" text-anchor="middle" font-weight="700">余量</text>
<line x1="306.0" y1="162.0" x2="336.0" y2="162.0" stroke="#e8710a" stroke-width="1" stroke-dasharray="2 3"/>
<text x="344.0" y="166.0" font-size="14" fill="#e8710a" text-anchor="start" font-weight="700">A02 placement：只能用剩下这截换「更早发通信」</text>
<line x1="100.0" y1="102.0" x2="310.0" y2="102.0" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="318.0" y="107.0" font-size="13" fill="#3c4043" text-anchor="start">96 GiB  每 device 标称容量</text>
<line x1="100.0" y1="120.0" x2="310.0" y2="120.0" stroke="#202124" stroke-width="1.6"/>
<text x="318.0" y="125.0" font-size="13" fill="#202124" text-anchor="start">94.74 GiB  运行时上限（实机 peakBytesInUse 终判）</text>
<line x1="100.0" y1="140.0" x2="310.0" y2="140.0" stroke="#e8710a" stroke-width="1.6"/>
<text x="318.0" y="145.0" font-size="13" fill="#b06000" text-anchor="start">92 GiB  placement 准入线 ＝ 96 − 4</text></svg>

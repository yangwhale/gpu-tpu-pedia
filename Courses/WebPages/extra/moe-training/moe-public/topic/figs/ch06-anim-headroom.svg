<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：同一段四层计算，上行显存余量大，下一层的专家权重 AG 提前一层发起，两个接收 buffer 同时占着 HBM，计算不停；下行多存了激活，HBM 只放得下一个在途 buffer，下一层的 AG 只能等上一层算完才发，每层之间露出红色的等待，整段明显更晚结束。右侧竖条是同一时刻的 HBM 占用。">

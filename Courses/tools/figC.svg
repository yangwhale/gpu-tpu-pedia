<svg viewBox="0 0 1000 560" width="100%" role="img" aria-label="GPU 与 TPU 的两条出身，以及这门课的主线：同一个 FlashAttention 在两边各跑一遍，分岔点只有一处">
<defs><marker id="mapArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0.8 L8,4 L0,7.2 z" fill="#9aa0a6"/></marker></defs>
<text class="svglbl" x="0" y="16" fill="#202124" style="font-size:13.5px">整门课只有一个根：两条出身不同，于是每一层都不同</text>
<rect x="0" y="34" width="488" height="196" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
<text class="svgnum" x="20" y="62" fill="#1a73e8" style="font-size:17px">GPU</text>
<text class="svglbl" x="20" y="82" fill="#1a73e8">出身：图形处理器</text>
<text class="svgsm" x="20" y="108" fill="#202124" style="font-size:11.5px">要伺候大量互不相干的小任务</text>
<text class="svgsm" x="20" y="128" fill="#202124" style="font-size:11.5px">形状、访问模式、控制流全都无法预知</text>
<text class="svgsm" x="20" y="148" fill="#202124" style="font-size:11.5px">→ 面积大半花在「应付各种情况」上</text>
<text class="svgsm" x="20" y="168" fill="#202124" style="font-size:11.5px">cache 层次 · warp 调度 · 海量并发线程</text>
<rect x="20" y="192" width="292" height="26" rx="13" fill="#1a73e8"/>
<text class="svglbl" x="166" y="209" text-anchor="middle" fill="#fff">不知道你要跑什么　→　处处留一手</text>
<rect x="512" y="34" width="488" height="196" rx="10" fill="#e6f4ea" stroke="#1e8e3e"/>
<text class="svgnum" x="532" y="62" fill="#1e8e3e" style="font-size:17px">TPU</text>
<text class="svglbl" x="532" y="82" fill="#1e8e3e">出身：为矩阵乘定做的 ASIC</text>
<text class="svgsm" x="532" y="108" fill="#202124" style="font-size:11.5px">从第一天就只服务神经网络</text>
<text class="svgsm" x="532" y="128" fill="#202124" style="font-size:11.5px">形状规则、访问可预测、控制流静态</text>
<text class="svgsm" x="532" y="148" fill="#202124" style="font-size:11.5px">→ 省下的面积全给计算单元</text>
<text class="svgsm" x="532" y="168" fill="#202124" style="font-size:11.5px">无 cache · 编译期定布局 · 巨大的 MXU</text>
<rect x="532" y="192" width="292" height="26" rx="13" fill="#1e8e3e"/>
<text class="svglbl" x="678" y="209" text-anchor="middle" fill="#fff">早就知道你要跑什么　→　一手都不留</text>
<text class="svgsm" x="500" y="140" text-anchor="middle" fill="#80868b" style="font-size:15px">vs</text>
<path d="M500 232 v14" stroke="#80868b" stroke-width="1.2"/>
<text class="svglbl" x="0" y="266" fill="#202124" style="font-size:13px">于是这门课只做一件事：<tspan font-weight="700" fill="#d93025">同一个 FlashAttention，两边各跑一遍，看它从哪儿开始分岔</tspan></text>
<rect x="0.0" y="282" width="153" height="92" rx="10" fill="#fff" stroke="#5f6368" stroke-width="1.2"/>
<text class="svgsm" x="12.0" y="300" fill="#80868b">出发前</text>
<text class="svglbl" x="12.0" y="319" fill="#5f6368" style="font-size:12.5px">为什么是它</text>
<text class="svgsm" x="12.0" y="338" fill="#3c4043">S 矩阵 32 GiB</text>
<text class="svgsm" x="12.0" y="353" fill="#3c4043">两边都放不下</text>
<text class="svgsm" x="12.0" y="368" fill="#3c4043">→ 别把 S 写出来</text>
<rect x="169.4" y="282" width="153" height="92" rx="10" fill="#fff" stroke="#1a73e8" stroke-width="1.2"/>
<text class="svgsm" x="181.4" y="300" fill="#80868b">第 0–1 节</text>
<text class="svglbl" x="181.4" y="319" fill="#1a73e8" style="font-size:12.5px">先架量具</text>
<text class="svgsm" x="181.4" y="338" fill="#3c4043">算力 ÷ 带宽</text>
<text class="svgsm" x="181.4" y="353" fill="#3c4043">312.6 对 312.5</text>
<text class="svgsm" x="181.4" y="368" fill="#3c4043">两边胃口一样</text>
<path d="M155.4 328 h9" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#mapArrow)"/>
<rect x="338.8" y="282" width="153" height="92" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2.2"/>
<text class="svgsm" x="350.8" y="300" fill="#80868b">第 2 节</text>
<text class="svglbl" x="350.8" y="319" fill="#d93025" style="font-size:12.5px">⭐ 分岔在这里</text>
<text class="svgsm" x="350.8" y="338" fill="#3c4043">同一次访存</text>
<text class="svgsm" x="350.8" y="353" fill="#3c4043">一边有 cache</text>
<text class="svgsm" x="350.8" y="368" fill="#3c4043">一边没有</text>
<path d="M324.8 328 h9" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#mapArrow)"/>
<rect x="508.2" y="282" width="153" height="92" rx="10" fill="#fff" stroke="#9334e6" stroke-width="1.2"/>
<text class="svgsm" x="520.2" y="300" fill="#80868b">第 3 节</text>
<text class="svglbl" x="520.2" y="319" fill="#9334e6" style="font-size:12.5px">形状对不对得齐</text>
<text class="svgsm" x="520.2" y="338" fill="#3c4043">一条指令吃多大</text>
<text class="svgsm" x="520.2" y="353" fill="#3c4043">两边差 16 倍</text>
<text class="svgsm" x="520.2" y="368" fill="#3c4043">并排走完全程</text>
<path d="M494.2 328 h9" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#mapArrow)"/>
<rect x="677.6" y="282" width="153" height="92" rx="10" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text class="svgsm" x="689.6" y="300" fill="#80868b">第 5 节</text>
<text class="svglbl" x="689.6" y="319" fill="#1e8e3e" style="font-size:12.5px">分岔的本质</text>
<text class="svgsm" x="689.6" y="338" fill="#3c4043">搬运谁来安排</text>
<text class="svgsm" x="689.6" y="353" fill="#3c4043">运行时 · 编译期</text>
<text class="svgsm" x="689.6" y="368" fill="#3c4043">三次出场合一</text>
<path d="M663.6 328 h9" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#mapArrow)"/>
<rect x="847.0" y="282" width="153" height="92" rx="10" fill="#fff" stroke="#e8710a" stroke-width="1.2"/>
<text class="svgsm" x="859.0" y="300" fill="#80868b">第 6–9 节</text>
<text class="svglbl" x="859.0" y="319" fill="#e8710a" style="font-size:12.5px">跑完之后</text>
<text class="svgsm" x="859.0" y="338" fill="#3c4043">拿到两个数</text>
<text class="svgsm" x="859.0" y="353" fill="#3c4043">能不能比？</text>
<text class="svgsm" x="859.0" y="368" fill="#3c4043">以及我算错的</text>
<path d="M833.0 328 h9" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#mapArrow)"/>
<path d="M584.7 374 v14 h-120 v14" fill="none" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="0" y="402" width="1000" height="54" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="4 3"/>
<text class="svglbl" x="16" y="424" fill="#3c4043" style="font-size:12.5px">第 4 节｜岔路</text>
<text class="svglbl" x="126" y="424" fill="#3c4043">一张卡装不下的时候 —— NVLink 域　vs　ICI 环面</text>
<text class="svgsm" x="16" y="444" fill="#5f6368">FlashAttention 在这一节不在场：它单卡就跑完了，撞不到卡间。主角换成 MoE 的 dispatch / combine —— 只想跟着主线走，这一节可以先跳过，第 5 节回主线</text>
<rect x="0" y="474" width="1000" height="80" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<text class="svglbl" x="20" y="500" fill="#a50e0e" style="font-size:13px">⭐ 如果只记一件事：两边的差别不是十几处，<tspan font-weight="700">是一处</tspan></text>
<text class="svgsm" x="20" y="521" fill="#3c4043" style="font-size:11.5px">把一块数据从 HBM 搬进片上，<tspan font-weight="700">谁来安排</tspan>。GPU 那边有 cache 在运行时替你猜，TPU 那边没有、编译期就排死了。</text>
<text class="svgsm" x="20" y="540" fill="#3c4043" style="font-size:11.5px">形状要对齐到 8 × 128、一条指令吃多大、kernel 谁来写、连一台机器要付什么代价 ——&#160;<tspan font-weight="700">全都是这一处往下长出来的</tspan>。</text>
</svg>
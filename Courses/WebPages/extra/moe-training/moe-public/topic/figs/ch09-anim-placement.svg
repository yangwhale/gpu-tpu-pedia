<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图，示意。上面一组是 HLO 通信重排关：反向每层算完，本层梯度 reduce-scatter 才发，TensorCore 停下来等它做完再算下一层。下面一组是 HLO 通信重排开：同样的 reduce-scatter 滑到下一层的反向计算底下发，TensorCore 不用停，只有最后一层的还露在外面。活一样多，只是塞进了别人干活的空档。">
<title>动图，示意。上面一组是 HLO 通信重排关：反向每层算完，本层梯度 reduce-scatter 才发，TensorCore 停下来等它做完再算下一层。下面一组是 HLO 通信重排开：同样的 reduce-scatter 滑到下一层的反向计算底下发，TensorCore 不用停，只有最后一层的还露在外面。活一样多，只是塞进了别人干活的空档。</title>
<style>
@keyframes gapk { 0% { opacity:1 } 6% { opacity:1 } 7% { opacity:0 } 72% { opacity:0 } 80% { opacity:1 } 100% { opacity:1 } }
.gap { animation: gapk 10s linear infinite; transform-box: fill-box; }
@keyframes plc { 0% { transform: translateX(0px) } 5% { transform: translateX(0px) } 6% { transform: translateX(-792px) } 70% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
.plc { animation: plc 10s linear infinite; transform-box: fill-box; }
@keyframes plh { 0% { transform: translateX(0px); opacity: 0 } 5% { transform: translateX(0px); opacity: 0 } 6% { transform: translateX(0px); opacity: 1 } 70% { transform: translateX(784px); opacity: 1 } 71% { transform: translateX(784px); opacity: 0 } 100% { transform: translateX(784px); opacity: 0 } }
.plh { animation: plh 10s linear infinite; transform-box: fill-box; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>

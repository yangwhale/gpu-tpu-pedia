<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图：上面一组不做 QAG，all-gather 搬 BF16 字节，期间计算在等，收齐后每张卡把完整权重量化一遍，再做 GMM。下面一组 QAG，先量化本地分片，all-gather 只搬一半字节，等待变短，GMM 更早开始，整层提前结束。">
<title>不做 QAG 搬 2 字节、F 张卡各把完整权重量化一遍；QAG 先量化本地那份，搬的字节减半</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左边七个来源，括号里是 4 节表格的行号。只有全部 token 的预测误差进入 lm_loss，曲线和对照看着一样。其余六条都从 lm_loss 下面绕过去，分三类：aux loss 和 z-loss、router 统计口径不进 lm_loss；负载均衡项放大要 GA 大于 1、qk_clip 要 logits 过阈值，短程对拍里条件没触发；scan 长跑漂移原因未定位、要长跑才显现，bf16 累加的小偏差测试容差太松抓不到。">
<title>lm_loss 看不见的三类错</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>

<rect width="900" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">lm_loss 看不见的三类错</text>
<rect x="470" y="78" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
<text x="540" y="104" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="700" >lm_loss</text>
<line x1="614" y1="98" x2="690" y2="98" stroke="#1a73e8" stroke-width="2" marker-end="url(#ab)"/>
<text x="698" y="103" font-size="14" fill="#0d652d" text-anchor="start" font-weight="700" >曲线和对照看着一样</text>
<rect x="30" y="63" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="44" y="85" font-size="14" fill="#174ea6" text-anchor="start" >全部 token 的预测误差</text>
<line x1="334" y1="80" x2="466" y2="80" stroke="#1a73e8" stroke-width="3" marker-end="url(#ab)"/>
<rect x="30" y="133" width="300" height="34" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5" />
<text x="44" y="155" font-size="14" fill="#202124" text-anchor="start" >aux loss / z-loss（4.4：静默为 0）</text>
<path d="M334 150 L420 150 C 444 150, 436 124, 460 124 L622 124 C 646 124, 638 150, 662 150 L690 150" stroke="#d93025" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<rect x="30" y="177" width="300" height="34" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5" />
<text x="44" y="199" font-size="14" fill="#202124" text-anchor="start" >router 统计口径（4.8）</text>
<path d="M334 194 L420 194 C 444 194, 436 128, 460 128 L622 128 C 646 128, 638 194, 662 194 L690 194" stroke="#d93025" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<rect x="30" y="235" width="300" height="34" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5" />
<text x="44" y="257" font-size="14" fill="#202124" text-anchor="start" >负载均衡项放大（4.2：GA&gt;1 才有）</text>
<path d="M334 252 L420 252 C 444 252, 436 132, 460 132 L622 132 C 646 132, 638 252, 662 252 L690 252" stroke="#e8710a" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<rect x="30" y="279" width="300" height="34" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5" />
<text x="44" y="301" font-size="14" fill="#202124" text-anchor="start" >qk_clip（4.7：logits 过阈值才截）</text>
<path d="M334 296 L420 296 C 444 296, 436 136, 460 136 L622 136 C 646 136, 638 296, 662 296 L690 296" stroke="#e8710a" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<rect x="30" y="337" width="300" height="34" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" />
<text x="44" y="359" font-size="14" fill="#202124" text-anchor="start" >scan 长跑漂移（4.5：原因未定位）</text>
<path d="M334 354 L420 354 C 444 354, 436 140, 460 140 L622 140 C 646 140, 638 354, 662 354 L690 354" stroke="#5f6368" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<rect x="30" y="381" width="300" height="34" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" />
<text x="44" y="403" font-size="14" fill="#202124" text-anchor="start" >bf16 累加（4.6）</text>
<path d="M334 398 L420 398 C 444 398, 436 144, 460 144 L622 144 C 646 144, 638 398, 662 398 L690 398" stroke="#5f6368" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<path d="M694 150 L704 150 L704 194 L694 194" stroke="#d93025" stroke-width="2" fill="none"/>
<text x="714" y="177.0" font-size="14" fill="#a50e0e" text-anchor="start" font-weight="700" >不进 lm_loss</text>
<path d="M694 252 L704 252 L704 296 L694 296" stroke="#e8710a" stroke-width="2" fill="none"/>
<text x="714" y="279.0" font-size="14" fill="#b06000" text-anchor="start" font-weight="700" >短程对拍里条件没触发</text>
<path d="M694 354 L704 354 L704 398 L694 398" stroke="#5f6368" stroke-width="2" fill="none"/>
<text x="714" y="381.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" >长跑才显现 / 容差太松</text>
</svg>
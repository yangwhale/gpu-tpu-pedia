<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="一步里 HBM 占用随时间变化的示意曲线。两个 XLA pass 开着时峰值顶破 94.74 GiB 上限，DP2 要 104 GiB；关掉后峰值落到上限以下，较小多片配置 heap 约 83 GiB。两条曲线不是同一配置，各 pass 怎么抬峰值未拆。">


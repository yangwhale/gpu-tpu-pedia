# Hunyuan3 smoke-test config — same STRUCTURE as hunyuan3-295b, tiny dimensions.
# Purpose: exercise every code path (dense layer 0 + MoE layers, sigmoid routing
# with expert bias, shared expert, MTP) on 4 chips in seconds instead of minutes.
decoder_block: "hunyuan3"
base_num_decoder_layers: 4
base_emb_dim: 4096
base_mlp_dim: 13312
base_num_query_heads: 64
base_num_kv_heads: 8
head_dim: 128
vocab_size: 120832
mlp_activations: ["silu", "linear"]
normalization_layer_epsilon: 1.0e-5
enable_dropout: False
logits_via_embedding: False
use_qk_norm: True
attention_bias: False
rope_max_timescale: 11158840
rope_type: "default"
max_position_embeddings: 262144
num_experts: 192
num_experts_per_tok: 8
base_moe_mlp_dim: 1536
shared_experts: 1
first_num_dense_layers: 1
routed_score_func: "sigmoid"
routed_bias: True
routed_scaling_factor: 2.826
norm_topk_prob: False
moe_router_dtype: "float32"
mtp_num_layers: 1

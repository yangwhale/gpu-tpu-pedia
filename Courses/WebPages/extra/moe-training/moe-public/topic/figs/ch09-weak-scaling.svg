<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左图：横轴片数 1、2、8、16，纵轴步时指数。pipeliner 开的线 37、52、55、60，pipeliner 关的线 45、47、50。开的那条 1 到 2 片跳得最高，是因为 1 片还开着单片跨迭代 pipeliner。右图：两跳的增量对比。带宽项预期第二跳只有第一跳的 0.75 倍；pipeliner 关的同口径实测是约 +2 点、约 +3 点，第二跳反而更大；pipeliner 开的比值只有约 0.2 倍，分母混进了单片 pipeliner。">
<title>左图：横轴片数 1、2、8、16，纵轴步时指数。pipeliner 开的线 37、52、55、60，pipeliner 关的线 45、47、50。开的那条 1 到 2 片跳得最高，是因为 1 片还开着单片跨迭代 pipeliner。右图：两跳的增量对比。带宽项预期第二跳只有第一跳的 0.75 倍；pipeliner 关的同口径实测是约 +2 点、约 +3 点，第二跳反而更大；pipeliner 开的比值只有约 0.2 倍，分母混进了单片 pipeliner。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="464" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">1 → 2 片那一跳最大，是因为同时关掉了单片 pipeliner；同口径下第二跳反而更大</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">左：步时指数（片数轴等距，不按比例）。右：两跳增量之比。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">pipeliner 开</text>
<rect x="167.2" y="74.0" width="16.0" height="14.0" rx="2" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="189.2" y="86.0" font-size="14" fill="#202124" text-anchor="start">pipeliner 关（同口径）</text>
<rect x="380.4" y="74.0" width="16.0" height="14.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="402.4" y="86.0" font-size="14" fill="#202124" text-anchor="start">只看带宽项的预期</text>
<line x1="80.0" y1="420.0" x2="510.0" y2="420.0" stroke="#202124" stroke-width="1.2"/>
<text x="110.0" y="442.0" font-size="14" fill="#202124" text-anchor="middle">1 片</text>
<text x="230.0" y="442.0" font-size="14" fill="#202124" text-anchor="middle">2 片</text>
<text x="350.0" y="442.0" font-size="14" fill="#202124" text-anchor="middle">8 片</text>
<text x="470.0" y="442.0" font-size="14" fill="#202124" text-anchor="middle">16 片</text>
<path d="M110,362.0 L230,237.7 L350,212.9 L470,171.4" stroke="#1a73e8" stroke-width="3" fill="none"/>
<circle cx="110" cy="362.0" r="6" fill="#1a73e8"/>
<text x="110.0" y="352.0" font-size="14" fill="#1a73e8" text-anchor="middle" font-weight="700">37</text>
<circle cx="230" cy="237.7" r="6" fill="#1a73e8"/>
<text x="230.0" y="227.7" font-size="14" fill="#1a73e8" text-anchor="middle" font-weight="700">52</text>
<circle cx="350" cy="212.9" r="6" fill="#1a73e8"/>
<text x="350.0" y="202.9" font-size="14" fill="#1a73e8" text-anchor="middle" font-weight="700">55</text>
<circle cx="470" cy="171.4" r="6" fill="#1a73e8"/>
<text x="470.0" y="161.4" font-size="14" fill="#1a73e8" text-anchor="middle" font-weight="700">60</text>
<path d="M110,295.7 L230,279.1 L350,254.3" stroke="#e8710a" stroke-width="3" fill="none"/>
<circle cx="110" cy="295.7" r="6" fill="#e8710a"/>
<text x="110.0" y="315.7" font-size="14" fill="#e8710a" text-anchor="middle" font-weight="700">45</text>
<circle cx="230" cy="279.1" r="6" fill="#e8710a"/>
<text x="230.0" y="299.1" font-size="14" fill="#e8710a" text-anchor="middle" font-weight="700">47</text>
<circle cx="350" cy="254.3" r="6" fill="#e8710a"/>
<text x="350.0" y="274.3" font-size="14" fill="#e8710a" text-anchor="middle" font-weight="700">50</text>
<text x="124.0" y="368.0" font-size="13" fill="#174ea6" text-anchor="start">1 片还开着单片 pipeliner</text>
<text x="580.0" y="126.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">第二跳 ÷ 第一跳</text>
<text x="580.0" y="156.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">带宽项预期 2(S−1)/S</text>
<text x="580.0" y="176.0" font-size="13" fill="#5f6368" text-anchor="start">0 → 1 → 1.75</text>
<text x="580.0" y="202.0" font-size="13" fill="#5f6368" text-anchor="start">1→2</text>
<rect x="620.0" y="189.0" width="70.0" height="18.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="580.0" y="226.0" font-size="13" fill="#5f6368" text-anchor="start">2→8</text>
<rect x="620.0" y="213.0" width="52.5" height="18.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="704.0" y="218.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">0.75 倍</text>
<text x="580.0" y="260.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">pipeliner 关（同口径）</text>
<text x="580.0" y="280.0" font-size="13" fill="#5f6368" text-anchor="start">约 +2 点，约 +3 点</text>
<text x="580.0" y="306.0" font-size="13" fill="#5f6368" text-anchor="start">1→2</text>
<rect x="620.0" y="293.0" width="70.0" height="18.0" rx="2" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="580.0" y="330.0" font-size="13" fill="#5f6368" text-anchor="start">2→8</text>
<rect x="620.0" y="317.0" width="105.0" height="18.0" rx="2" fill="#feefe3" stroke="#e8710a" stroke-width="1.5"/>
<text x="739.0" y="322.0" font-size="14" fill="#e8710a" text-anchor="start" font-weight="700">第二跳更大</text>
<text x="580.0" y="364.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700">pipeliner 开</text>
<text x="580.0" y="384.0" font-size="13" fill="#5f6368" text-anchor="start">37 → 52 → 55</text>
<text x="580.0" y="410.0" font-size="13" fill="#5f6368" text-anchor="start">1→2</text>
<rect x="620.0" y="397.0" width="70.0" height="18.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="580.0" y="434.0" font-size="13" fill="#5f6368" text-anchor="start">2→8</text>
<rect x="620.0" y="421.0" width="14.0" height="18.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="704.0" y="426.0" font-size="14" fill="#1a73e8" text-anchor="start" font-weight="700">约 0.2 倍</text>
</svg>

<text x="64" y="403.0" class="xxs" fill="#5f6368" text-anchor="end">85%</text>
<line x1="76" y1="344.0" x2="636" y2="344.0" stroke="#eceff1" stroke-width="1" stroke-dasharray="3 4"/>
<text x="64" y="348.0" class="xxs" fill="#5f6368" text-anchor="end">90%</text>
<line x1="76" y1="289.0" x2="636" y2="289.0" stroke="#eceff1" stroke-width="1" stroke-dasharray="3 4"/>
<text x="64" y="293.0" class="xxs" fill="#5f6368" text-anchor="end">95%</text>
<line x1="76" y1="234.0" x2="636" y2="234.0" stroke="#dadce0" stroke-width="1"/>
<text x="64" y="238.0" class="xxs" fill="#5f6368" text-anchor="end">100%</text>
<line x1="76" y1="179.0" x2="636" y2="179.0" stroke="#eceff1" stroke-width="1" stroke-dasharray="3 4"/>
<text x="64" y="183.0" class="xxs" fill="#5f6368" text-anchor="end">105%</text>
<text x="169.33333333333331" y="522" class="lbl" fill="#202124" text-anchor="middle">8 GPU</text>
<text x="169.33333333333331" y="540" class="xxs" fill="#5f6368" text-anchor="middle">（2 节点）</text>
<text x="356.0" y="522" class="lbl" fill="#202124" text-anchor="middle">16 GPU</text>
<text x="356.0" y="540" class="xxs" fill="#5f6368" text-anchor="middle">（4 节点）</text>
<text x="542.6666666666667" y="522" class="lbl" fill="#202124" text-anchor="middle">32 GPU</text>
<text x="542.6666666666667" y="540" class="xxs" fill="#5f6368" text-anchor="middle">（8 节点）</text>

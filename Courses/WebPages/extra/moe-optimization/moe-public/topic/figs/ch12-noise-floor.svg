<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="一条从 0 到 0.05% 的轴。TPU 不同版本、不同机器两次 run 逐位相同，差为 0；GPU 同配置两次 run，MTP 差 0.004%，LM 差 0.041%；对拍门槛 0.02%，放宽后 0.04%，仍在 GPU 自身噪声之内。">
<title>GPU 自己重跑就差 0.041%，是门槛 0.02% 的两倍：门槛压在噪声底之下，过不过像抽签</title>
<defs><marker id="ar-5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ar-1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="ar-e8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ar-d93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar-188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar-202124" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d93025" stroke-width="2"/></pattern><pattern id="hatchg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bdc1c6" stroke-width="2"/></pattern></defs>
<rect width="900" height="310" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">GPU 自己重跑就差 0.041%，是门槛 0.02% 的两倍：门槛压在噪声底之下，过不过像抽签</text>
<text x="24" y="58" font-size="14" fill="#5f6368">按比例画在同一条 loss 相对差的轴上（0 到 0.05%，不画刻度，只标章内给出的数）</text>
<rect x="80.0" y="152.0" width="606.8" height="36.0" rx="2" fill="#feefe3"/>
<text x="140.0" y="176.0" font-size="14" fill="#b06000" text-anchor="start">GPU 参考自己的噪声底（LM）</text>
<line x1="80.0" y1="188.0" x2="820.0" y2="188.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ar-5f6368)"/>
<text x="824.0" y="214.0" font-size="13" fill="#5f6368" text-anchor="end">loss 相对差</text>
<circle cx="80.0" cy="188" r="6" fill="#1a73e8"/>
<text x="76.0" y="112.0" font-size="14" fill="#174ea6" text-anchor="start" font-weight="700">TPU 对 TPU：0（逐位相同）</text>
<circle cx="139.2" cy="188" r="6" fill="#e8710a"/>
<text x="139.2" y="240.0" font-size="14" fill="#b06000" text-anchor="start" font-weight="700">GPU 对 GPU（MTP）0.004%</text>
<line x1="376.0" y1="120.0" x2="376.0" y2="188.0" stroke="#d93025" stroke-width="2" stroke-dasharray="6 4"/>
<text x="376.0" y="112.0" font-size="14" fill="#a50e0e" text-anchor="middle" font-weight="700">门槛 0.02%</text>
<line x1="672.0" y1="152.0" x2="672.0" y2="220.0" stroke="#d93025" stroke-width="2" stroke-dasharray="6 4"/>
<text x="672.0" y="240.0" font-size="14" fill="#a50e0e" text-anchor="end" font-weight="700">放宽后 0.04%</text>
<circle cx="686.8" cy="188" r="6" fill="#e8710a"/>
<text x="686.8" y="112.0" font-size="14" fill="#b06000" text-anchor="end" font-weight="700">GPU 对 GPU（LM）0.041%</text>
<rect x="24.0" y="270.0" width="4.0" height="26.0" rx="0" fill="#188038"/>
<text x="38.0" y="288.0" font-size="14" fill="#202124" text-anchor="start">TPU 侧零噪声 → 比对里的随机性全部来自 GPU 参考；先量参考的噪声带，门槛定在它之上</text>
</svg>
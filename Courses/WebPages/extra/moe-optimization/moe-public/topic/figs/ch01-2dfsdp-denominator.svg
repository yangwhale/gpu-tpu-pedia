<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="示意条形图（归因是推断）。效率等于 64 芯片步时除以 1024 芯片步时。纯 FSDP：基线加通信增量，效率约 88%。把同样的增量放到慢约 25% 的 2D 基线上，效率已约 90%，这一段可由分母解释。2D 实际的增量更小，效率约 97%。2D 基线多出的部分推测是拷贝。"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker></defs><rect width="900" height="360" fill="#fff"/><text x="450.0" y="30.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle" fill="#202124" font-weight="bold">2D FSDP 效率高、绝对值低：基线一变慢，同样的通信增量算出来的效率自己就变好看</text>
<text x="450.0" y="53.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#5f6368">效率 ＝ 64 芯片步时 ÷ 1024 芯片步时；示意 [推断]，条长按正文的百分比换算，不是实测秒数</text>
<rect x="94.0" y="71.0" width="18.0" height="13.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="118.0" y="82.0" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" fill="#202124">64 芯片步时（基线）</text>
<rect x="294.0" y="71.0" width="18.0" height="13.0" rx="2" fill="#eceff1" stroke="#5f6368" stroke-width="1.5"/>

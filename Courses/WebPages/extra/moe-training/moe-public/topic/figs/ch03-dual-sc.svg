<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="上面一条 SparseCore 通道上有一段 reduce-scatter，长度 100%。下面两条通道各出现同一个 reduce-scatter，长度只缩到约 85%，不是一半；瓶颈在哪未拆。">


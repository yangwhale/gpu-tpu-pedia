<svg viewBox="0 0 1400 976" width="1400" height="976" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="编译器能力边界示意：左侧是编排类优化，编译器可以自动完成；右侧是算法层面的改写，必须由人完成，Flash Attention 属于右侧">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">编译器能替你做什么，<tspan font-weight="700" fill="#d93025">做不到什么</tspan>　—— Flash Attention 是最诚实的那个例子</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">编排：编译器能自动做</text>
<rect x="174.0" y="48" width="11" height="11" rx="2" fill="#8430ce"/>
<text x="191.0" y="58" class="sm">算法：只能人来做</text>
<rect x="305.0" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="322.0" y="58" class="sm">两边都得手写的那一格</text>
<rect x="20" y="126" width="796" height="296" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="153" class="sec">编译器领地　·　把<tspan font-weight="700">已有的算子</tspan>编排好</text>
<rect x="38.0" y="170" width="371.0" height="84" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="1.1"/>
<text x="52.0" y="194" class="box" fill="#202124">算子融合</text>
<text x="52.0" y="214" class="xs">把相邻的小算子并成一个 kernel，中间结果不落回 HBM。</text>
<rect x="427.0" y="170" width="371.0" height="84" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="1.1"/>
<text x="441.0" y="194" class="box" fill="#202124">通信与计算重叠</text>
<text x="441.0" y="214" class="xs">看得到整张图，就知道哪段通信能藏在哪段计算底下。</text>
<rect x="38.0" y="268" width="371.0" height="84" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="1.1"/>
<text x="52.0" y="292" class="box" fill="#202124">内存复用</text>
<text x="52.0" y="312" class="xs">谁和谁生命期不重叠，就让它们共用同一块地址。</text>
<rect x="427.0" y="268" width="371.0" height="84" rx="7" fill="#fff" stroke="#1a73e8" stroke-width="1.1"/>
<text x="441.0" y="292" class="box" fill="#202124">布局与切分选择</text>
<text x="441.0" y="312" class="xs">同一个矩阵摆成什么形状、按哪根轴切，编译期试着挑。</text>
<rect x="38" y="366" width="760" height="40" rx="6" fill="#f1f3f4"/>
<text x="52" y="390" class="xs">这四样的共同点：<tspan font-weight="700" fill="#202124">它们都不改变「算的是什么」，只改变「怎么排」</tspan>。所以编译器有资格自己决定 —— 排错了顶多慢，不会错。</text>
<line x1="836" y1="120" x2="836" y2="428" stroke="#d93025" stroke-width="2.2" stroke-dasharray="7 5"/>
<rect x="806" y="242.0" width="60" height="64" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="836" y="266.0" class="box" fill="#d93025" text-anchor="middle">边</text>
<text x="836" y="286.0" class="box" fill="#d93025" text-anchor="middle">界</text>
<rect x="856" y="126" width="524" height="296" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.4"/>
<text x="874" y="153" class="sec">人的领地　·　<tspan font-weight="700">换一个算法</tspan></text>
<rect x="874" y="170" width="488" height="92" rx="7" fill="#fff" stroke="#8430ce" stroke-width="1.1"/>
<text x="888" y="194" class="box" fill="#202124">改变数学上的计算顺序</text>
<text x="888" y="214" class="xs">Flash 把 softmax 拆成可增量合并的形式，于是注意力矩阵<tspan font-weight="700" fill="#202124">根本不必整个存在</tspan>。这不是把已</text>
<text x="888" y="231" class="xs">有算子排得更好，<tspan font-weight="700" fill="#d93025">这是换了一个算法</tspan>。</text>
<rect x="874" y="276" width="488" height="92" rx="7" fill="#fff" stroke="#8430ce" stroke-width="1.1"/>
<text x="888" y="300" class="box" fill="#202124">发明一个不存在的算子</text>
<text x="888" y="320" class="xs">编译器只能编排它<tspan font-weight="700" fill="#202124">认识</tspan>的东西。一个从没有人写过的 kernel，它没有理由凭空想出来。</text>
<text x="874" y="400" class="xs"><tspan font-weight="700" fill="#202124">越过这条线，编译器就帮不上忙了</tspan> —— 两边都一样。</text>
<rect x="20" y="474" width="1360" height="196" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="38" y="502" class="sec">Flash Attention　—— 一个两边都失效的反例，比任何一边的成功案例都更能定义边界</text>
<rect x="38" y="520" width="420" height="104" rx="8" fill="#fff" stroke="#f9ab00" stroke-width="1.2"/>
<text x="54" y="546" class="box" fill="#202124">GPU 侧</text>
<text x="128" y="546" class="num" fill="#1a73e8">CUTLASS / Triton</text>
<text x="54" y="568" class="xs">手写。<tspan font-weight="700" fill="#202124">NVIDIA 的编译器没有自己想出 Flash</tspan>，是研究者写出来、再被库收编的。</text>
<rect x="478" y="520" width="420" height="104" rx="8" fill="#fff" stroke="#f9ab00" stroke-width="1.2"/>
<text x="494" y="546" class="box" fill="#202124">TPU 侧</text>
<text x="568" y="546" class="num" fill="#1a73e8">Pallas</text>
<text x="494" y="568" class="xs">同样手写。<tspan font-weight="700" fill="#202124">XLA 也没有自己想出 Flash</tspan>，Splash 那一支同样是人一行行写的。</text>
<rect x="918" y="520" width="444" height="104" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.4"/>
<text x="934" y="546" class="box"><tspan font-weight="700" fill="#d93025">没有任何一侧的编译器自己长出了它。</tspan></text>
<text x="934" y="570" class="xs">Flash 改的是<tspan font-weight="700" fill="#202124">数学上的计算顺序</tspan> —— 分块算、增量合并 softmax、注意力矩阵不落 </text>
<text x="934" y="587" class="xs">HBM。那是算法，不是编排。<tspan font-weight="700" fill="#202124">算法永远是人的活。</tspan></text>
<text x="38" y="646" class="xs"><tspan font-weight="700" fill="#202124">讲到这里要防一个误解</tspan>：这不是说编译器没用。上面左边那四样，在 GPU 侧同样是 Triton / CUTLASS 这些工具在替人做 —— <tspan font-weight="700" fill="#202124">区别只在于自动化的程度，不在于有没有边界。</tspan>边界两边都有，位置也差不多。</text>
<rect x="20" y="700" width="1360" height="138" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="727" class="sec">那越过边界之后，两边拿什么写　—— Triton 与 Pallas 定位几乎一样，差别在底下</text>
<rect x="38" y="742" width="650" height="80" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="54" y="766" class="box" fill="#202124">Triton　·　GPU</text>
<text x="54" y="786" class="xs">用 Python 写 kernel，编译到 <tspan class="mono" fill="#1967d2">PTX</tspan>。你操作的心智单位是<tspan font-weight="700" fill="#202124">一个 program（一组线程）处理一块</tspan>，共享内存和同步要自己安排。</text>
<rect x="712" y="742" width="650" height="80" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="728" y="766" class="box" fill="#202124">Pallas　·　TPU</text>
<text x="728" y="786" class="xs">同样用 Python 写 kernel，编译到 <tspan class="mono" fill="#1967d2">Mosaic</tspan>。你操作的心智单位是<tspan font-weight="700" fill="#202124">一块 tile 在 VMEM 里进出</tspan>，搬运由 <tspan class="mono" fill="#1967d2">BlockSpec</tspan> 描述，</text>
<text x="728" y="803" class="xs">不是自己写 load/store。</text>
<rect x="20" y="864" width="1360" height="96" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="892" class="sec">给「把控制权交给编译器」钉一个边界</text>
<text x="38" y="918" class="xs"><tspan font-weight="700" fill="#202124">编排是编译器的活，算法永远是人的活。</tspan>这条线两边都存在，位置也差不多 —— 所以「TPU 要手写 kernel」不是 TPU 的缺点，<tspan font-weight="700" fill="#d93025">GPU 上同样要写，只是写的人多、库更厚</tspan>。</text>
<text x="38" y="941" class="xs">真正的差别在<tspan font-weight="700" fill="#202124">越过边界之后有多少现成的东西可抄</tspan>。这一条 GPU 侧目前确实占优，但它是<tspan font-weight="700" fill="#202124">生态差距，不是架构差距</tspan> —— 两者会随时间收敛，别把它们混成一件事讲。</text>
</svg>
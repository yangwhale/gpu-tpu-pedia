<svg viewBox="0 0 1000 792" width="100%" role="img" aria-label="TPU v7 与 B200 的算力带宽比几乎完全相同，都是每字节约 312 次浮点运算；并列出 GB200 上 HBM、L2、共享内存三层各自的兑换比 312 / 119 / 64">
<text class="svglbl" x="0" y="16" fill="#202124" style="font-size:13.5px">两家公司、两套架构、两种设计哲学 —— 算力除以带宽，落在同一个数上</text>
<text class="svgsm" x="0" y="35">全部由两张官方规格表现算，推导链写在图里</text>
<rect x="0" y="50" width="470" height="196" rx="10" fill="#f8f9fa" stroke="#1e8e3e"/>
<text class="svglbl" x="18" y="74" fill="#1e8e3e" style="font-size:14px">TPU v7（每 chip）</text>
<text class="svgsm" x="18" y="106">BF16</text>
<text class="svgtxt" x="18" y="128" style="font-size:12.5px">2,307 TFLOPS</text>
<line x1="18" y1="134" x2="250" y2="134" stroke="#1e8e3e"/>
<text class="svgtxt" x="18" y="150" style="font-size:12.5px">7.38 TB/s</text>
<text class="svgnum" x="452" y="136" text-anchor="end" fill="#1e8e3e" style="font-size:22px">312.6</text>
<text class="svgsm" x="452" y="152" text-anchor="end" fill="#1e8e3e">FLOP / byte</text>
<text class="svgsm" x="18" y="168">FP8</text>
<text class="svgtxt" x="18" y="190" style="font-size:12.5px">4,614 TFLOPS</text>
<line x1="18" y1="196" x2="250" y2="196" stroke="#1e8e3e"/>
<text class="svgtxt" x="18" y="212" style="font-size:12.5px">7.38 TB/s</text>
<text class="svgnum" x="452" y="198" text-anchor="end" fill="#1e8e3e" style="font-size:22px">625.2</text>
<text class="svgsm" x="452" y="214" text-anchor="end" fill="#1e8e3e">FLOP / byte</text>
<text class="svgsm" x="18" y="238">来源：Google Cloud 官方 TPU7x 规格表，直接给的就是 per chip</text>
<rect x="530" y="50" width="470" height="196" rx="10" fill="#f8f9fa" stroke="#1a73e8"/>
<text class="svglbl" x="548" y="74" fill="#1a73e8" style="font-size:14px">GB200（NVL72 里那颗 · 每 GPU · dense）</text>
<text class="svgsm" x="548" y="106">BF16</text>
<text class="svgtxt" x="548" y="128" style="font-size:12.5px">2,500 TFLOPS</text>
<line x1="548" y1="134" x2="780" y2="134" stroke="#1a73e8"/>
<text class="svgtxt" x="548" y="150" style="font-size:12.5px">8.0 TB/s</text>
<text class="svgnum" x="982" y="136" text-anchor="end" fill="#1a73e8" style="font-size:22px">312.5</text>
<text class="svgsm" x="982" y="152" text-anchor="end" fill="#1a73e8">FLOP / byte</text>
<text class="svgsm" x="548" y="168">FP8</text>
<text class="svgtxt" x="548" y="190" style="font-size:12.5px">5,000 TFLOPS</text>
<line x1="548" y1="196" x2="780" y2="196" stroke="#1a73e8"/>
<text class="svgtxt" x="548" y="212" style="font-size:12.5px">8.0 TB/s</text>
<text class="svgnum" x="982" y="198" text-anchor="end" fill="#1a73e8" style="font-size:22px">625.0</text>
<text class="svgsm" x="982" y="214" text-anchor="end" fill="#1a73e8">FLOP / byte</text>
<text class="svgsm" x="548" y="238">来源：NVIDIA 官方 GB200 NVL72 域级数字 ÷ 72，稀疏值取一半得 dense</text>
<rect x="0" y="260" width="1000" height="80" rx="8" fill="#202124"/>
<text class="svgnum" x="500" y="286" text-anchor="middle" fill="#fff" style="font-size:19px">BF16　312.6　对　312.5　　｜　　FP8　625.2　对　625.0　　—— 相对差都是 0.03%</text>
<text class="svgsm" x="500" y="306" text-anchor="middle" fill="#ffffffcc">⚠️ 换成 HGX 板上的 B200 就是 2,250 ÷ 8.0 ＝ 281.3，离 312 差 11% —— 「都落在 312」的前提是拿 NVL72 里那颗 GB200 比</text>
<text class="svgsm" x="500" y="326" text-anchor="middle" fill="#ffffff99">推断（没有出处，别当结论讲）：两边都在拿 HBM 带宽去配矩阵算力，比值撞在一起并不奇怪 —— 但没有哪一家这么解释过</text>
<text class="svglbl" x="0" y="366" fill="#202124">这个数到底是什么意思</text>
<text class="svgsm" x="0" y="386" fill="#202124">· 它是硬件的「胃口」：每从 HBM 搬一个字节，硬件配套能做约 312 次 BF16 运算。喂不满，算力就在空转</text>
<text class="svgsm" x="0" y="403" fill="#202124">· 算子那头是同一个单位：它每搬一个字节，需要做几次运算 —— 这就是它的算术强度</text>
<text class="svgsm" x="0" y="420" fill="#202124">· 于是每个算子只剩一个问题：它的算术强度比 312 高还是低？高就是算力受限，低就是带宽受限</text>
<text class="svgsm" x="0" y="437" fill="#d93025">· 专题一那八步里，① embedding 的算术强度是 0 —— 它根本不在这根轴上（第 2.8 节）。这就是第 2 节要处理的东西</text>
<text class="svgsm" x="0" y="454" fill="#d93025">· 而 ④ Dense MLP 的大矩阵乘能远高于 312 —— 那是第 3 节的战场。同一颗芯片，两种完全不同的困境</text>
<line x1="0" y1="468" x2="1000" y2="468" stroke="#e8eaed"/>
<text class="svglbl" x="0" y="494" fill="#202124" style="font-size:13.5px">⚠️ 但这条线不止一条 ——&#160;<tspan font-weight="700">每往计算靠近一层，它就往下掉一截</tspan></text>
<text class="svgsm" x="0" y="513">同一个除法，在每一层各做一次。下面三个数都只对 GB200 那一颗成立，推导链写在每一行上</text>
<text class="svglbl" x="0" y="546" fill="#202124">HBM3e</text>
<text class="svgsm" x="0" y="562" fill="#5f6368">片外</text>
<text class="svgsm" x="150" y="548" fill="#202124">2,500 TFLOPS ÷ 8.0 TB/s</text>
<rect x="396" y="528" width="430" height="26" rx="4" fill="#1a73e8"/>
<text class="svgnum" x="1000" y="549" text-anchor="end" fill="#1a73e8" style="font-size:20px">312</text>
<text class="svglbl" x="0" y="586" fill="#202124">L2</text>
<text class="svgsm" x="0" y="602" fill="#5f6368">硬件自动管</text>
<text class="svgsm" x="150" y="588" fill="#202124">2,500 TFLOPS ÷ 21 TB/s</text>
<rect x="396" y="568" width="164" height="26" rx="4" fill="#1a73e8"/>
<text class="svgnum" x="1000" y="589" text-anchor="end" fill="#1a73e8" style="font-size:20px">119</text>
<text class="svglbl" x="0" y="626" fill="#202124">共享内存 / L1</text>
<text class="svgsm" x="0" y="642" fill="#5f6368">软件显式管</text>
<text class="svgsm" x="150" y="628" fill="#202124">8,192 FLOP ÷ 128 B　（都按每 SM 每周期）</text>
<rect x="396" y="608" width="88" height="26" rx="4" fill="#9334e6"/>
<text class="svgnum" x="1000" y="629" text-anchor="end" fill="#9334e6" style="font-size:20px">64</text>
<text class="svgsm" x="1000" y="642" text-anchor="end" fill="#5f6368">FLOP / byte　—— 条越短，越容易撞到带宽那一侧</text>
<rect x="0" y="650" width="1000" height="86" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
<text class="svglbl" x="18" y="672" fill="#7a5000">⭐ 从 HBM 爬到共享内存，这条线只降了约 5 倍 ——&#160;<tspan font-weight="700">片上不是无限快的</tspan></text>
<text class="svgsm" x="18" y="692" fill="#7a5000">算子融合减掉的是 <tspan font-weight="700">HBM 那一层</tspan>的搬运；可那批数据总得在片上落脚 ——&#160;<tspan font-weight="700">账没有消失，它挪到了下面这条线上</tspan>。</text>
<text class="svgsm" x="18" y="710" fill="#7a5000">所以融合之后要拿新的强度去跟 <tspan font-weight="700">64</tspan> 比，不能再跟 312 比 ——&#160;融合<tspan font-weight="700">做过头，会在新的这条线上重新撞墙</tspan>。</text>
<text class="svgsm" x="18" y="726" fill="#7a5000">⛔ 只画了 GB200 一侧：TPU 的 VMEM 带宽官方没公开，那条线存在但给不出数。</text>
<text class="svgsm" x="0" y="750" fill="#5f6368">64 的出处：分子 8,192 FLOP/周期/SM 见图 G-2；分母 128 B/周期/SM 有三处一致的公开测量（Hopper 微基准实测 127.9 · SemiAnalysis · Chips and Cheese），硬件上是 32 bank × 4 B。</text>
<text class="svgsm" x="0" y="768" fill="#5f6368">它<tspan font-weight="700">不含时钟也不含 SM 数</tspan>，是纯架构比值。反推校验：2,500 ÷ 64 ＝ 39 TB/s 全片，再 ÷（148 SM × 128 B）得时钟 ≈ 2.06 GHz，与 B200 对得上。</text>
</svg>
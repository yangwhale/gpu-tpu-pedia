<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="上下两条时间线对比。上：不填 CostEstimate，开源估算器给 custom-call 记 1、异步通信记 5000，调度器不往 Pallas kernel 底下藏通信，all-gather 排在 kernel 之后，后面用到它的算子只能干等，出现暴露等待。下：照实填了 flops 和字节数，all-gather 的 start 被提到 kernel 前面，藏在 kernel 底下，整段更早结束。">
<title>不填 CostEstimate，调度器把 kernel 当成不花时间，通信就不往它底下藏</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>
<style>
@keyframes rvm { 0% { transform: translateX(0px); opacity: 0 } 8% { transform: translateX(0px); opacity: 0 } 12% { transform: translateX(0px); opacity: 1 } 80% { transform: translateX(744px); opacity: 1 } 100% { transform: translateX(744px); opacity: 1 } }
@keyframes rvc { 0% { transform: translateX(0px); opacity: 0 } 11% { transform: translateX(0px); opacity: 0 } 12% { transform: translateX(0px); opacity: 1 } 80% { transform: translateX(744px); opacity: 1 } 84% { transform: translateX(744px); opacity: 0 } 100% { transform: translateX(744px); opacity: 0 } }
.rvm { animation: rvm 9s infinite linear } .rvc { animation: rvc 9s infinite linear }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<rect width="900" height="410" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">不填 CostEstimate，调度器把 kernel 当成不花时间，通信就不往它底下藏</text>
<text x="24" y="58" font-size="14" fill="#5f6368">示意，无刻度</text>
<rect x="20" y="80" width="860" height="150" rx="8" fill="none" stroke="#dadce0" stroke-width="1.5" />
<text x="36" y="106" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700" >不填：kernel 成本近乎 0</text>
<text x="864" y="106" font-size="13" fill="#5f6368" text-anchor="end" >开源估算器：custom-call 记 1，异步通信记 5000</text>
<text x="36" y="152" font-size="14" fill="#5f6368" text-anchor="start" >计算</text>
<text x="36" y="202" font-size="14" fill="#5f6368" text-anchor="start" >通信</text>
<line x1="130" y1="220" x2="870" y2="220" stroke="#dadce0" stroke-width="1"/>
<rect x="140" y="130" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="185" y="152" font-size="13" fill="#174ea6" text-anchor="middle" >前一个 op</text>
<rect x="240" y="130" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="400" y="152" font-size="14" fill="#174ea6" text-anchor="middle" >Pallas kernel（实际很长）</text>
<rect x="560" y="130" width="140" height="34" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="630" y="152" font-size="14" fill="#a50e0e" text-anchor="middle" font-weight="700" >干等 AG</text>
<rect x="700" y="130" width="110" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="755" y="152" font-size="13" fill="#174ea6" text-anchor="middle" >用 AG 的 op</text>
<rect x="560" y="180" width="140" height="34" rx="6" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="630" y="202" font-size="14" fill="#b06000" text-anchor="middle" >all-gather</text>
<rect x="20" y="250" width="860" height="150" rx="8" fill="none" stroke="#dadce0" stroke-width="1.5" />
<text x="36" y="276" font-size="15" fill="#0d652d" text-anchor="start" font-weight="700" >照实填 flops / bytes</text>
<text x="864" y="276" font-size="13" fill="#5f6368" text-anchor="end" >AG 的 start 提到 kernel 前，传输藏在 kernel 底下</text>
<text x="36" y="322" font-size="14" fill="#5f6368" text-anchor="start" >计算</text>
<text x="36" y="372" font-size="14" fill="#5f6368" text-anchor="start" >通信</text>
<line x1="130" y1="390" x2="870" y2="390" stroke="#dadce0" stroke-width="1"/>
<rect x="140" y="300" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="185" y="322" font-size="13" fill="#174ea6" text-anchor="middle" >前一个 op</text>
<rect x="240" y="300" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="400" y="322" font-size="14" fill="#174ea6" text-anchor="middle" >Pallas kernel</text>
<rect x="570" y="300" width="110" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="625" y="322" font-size="13" fill="#174ea6" text-anchor="middle" >用 AG 的 op</text>
<rect x="200" y="350" width="330" height="34" rx="6" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="365" y="372" font-size="14" fill="#b06000" text-anchor="middle" >all-gather</text>
<line x1="690" y1="317" x2="806" y2="317" stroke="#188038" stroke-width="2" marker-end="url(#ag)" stroke-dasharray="5 4"/>
<text x="748" y="348" font-size="14" fill="#0d652d" text-anchor="middle" font-weight="700" >更早走完</text>
<clipPath id="clip-rv"><rect x="132" y="120" width="744" height="98"/><rect x="132" y="290" width="744" height="98"/></clipPath>
<g clip-path="url(#clip-rv)"><rect x="132" y="0" width="754" height="410" fill="#ffffff" opacity="0" class="rvm"/></g>
<path d="M132 120 L132 218 M132 290 L132 388" stroke="#202124" stroke-width="2" opacity="0" class="rvc"/>
</svg>
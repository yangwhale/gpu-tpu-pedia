<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tpuguru — 上机之前，先问问它</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='600' fill='white' text-anchor='middle'%3Eg%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <div class="brand">tpu<em>guru</em></div>
  <div class="sub">上机之前，先问问它</div>
  <span class="envdot" id="envdot" title="…"></span>
  <span class="spacer"></span>
  <span class="cl" id="cluster"><span class="lamp"></span><span>集群…</span></span>
  <span class="fpstate none" id="fpstate"><span class="dot"></span><span>未跑 AOT</span></span>
  <button class="btn-ghost btn-sm" id="btn-hist">🗂 历史</button>
  <button class="btn-ghost btn-sm" id="btn-new">新会话</button>
  <button class="btn-ghost btn-sm" id="btn-save">💾 存档</button>
  <button class="btn-primary btn-sm" id="btn-run">跑 AOT</button>
  <button class="btn-sm" id="btn-metal" disabled title="AOT 编译通过后才能上机">🚀 上 64 卡</button>
</header>

<main>
  <section class="glass" id="chat">
    <div class="panel-head">
      <button class="collapse" id="btn-collapse" title="收起对话（⌘/Ctrl+B）">⟨</button>
      <span>对话</span>
      <span class="spacer" style="flex:1"></span>
      <span id="sess-title" style="font-size:12px;color:var(--faint)"></span>
    </div>
    <div id="turns"></div>
    <div id="composer">
      <textarea id="input" rows="1"
        placeholder="贴训练命令，或直接说「batch 改成 11」"></textarea>
      <button class="btn-primary" id="btn-send">发送</button>
    </div>
  </section>

  <div class="splitter" id="splitter" title="拖动改比例 · 双击复位"></div>

  <section class="glass" id="right">
    <div class="tabs">
      <div class="tab on" data-pane="cfg">配置<span class="badge" id="b-lint" hidden></span></div>
      <div class="tab" data-pane="cmd">命令</div>
      <div class="tab" data-pane="rep">AOT 报告<span class="badge" id="b-rep" hidden></span></div>
      <div class="tab" data-pane="mtl">真机报告<span class="badge" id="b-mtl" hidden></span></div>
    </div>
    <div class="pane on" id="pane-cfg"></div>
    <div class="pane" id="pane-cmd"></div>
    <div class="pane" id="pane-rep"></div>
    <div class="pane" id="pane-mtl"></div>
  </section>
</main>

<button class="expand" id="btn-expand" hidden title="展开对话（⌘/Ctrl+B）">对话</button>

<div class="drawer" id="drawer" hidden>
  <div class="dmask"></div>
  <div class="dbody">
    <div class="dhead">
      <b>🗂 全部历史</b>
      <span class="dsub">所有会话的存档 —— 不属于任何一次对话</span>
      <button class="btn-ghost btn-sm" id="d-close">关闭</button>
    </div>
    <div class="dcontent" id="pane-his"></div>
  </div>
</div>
<div id="toast"></div>
<script src="static/app.js"></script>
</body>
</html>

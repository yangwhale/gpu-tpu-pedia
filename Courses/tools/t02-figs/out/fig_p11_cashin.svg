<svg viewBox="0 0 1400 612" width="1400" height="612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AOT 配置搜索最终兑现的收益：per-chip 630 → 666.6 TFLOP/s，以及同一组配置上 AOT temp 与真机峰值 HBM 排序相反的边界案例">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">所以呢　—— <tspan font-weight="700" fill="#1e8e3e">这套先在 CPU 上搜，最后换回了 5.8%</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="37" y="58" class="sm">真机实测的收益</text>
<rect x="139.5" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="156.5" y="58" class="sm">工具够不到的那一格</text>
<rect x="20" y="124" width="792" height="340" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　它换回来的收益</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">不画条形图：630 → 666.6 只差 5.8%，从 0 起画看不见，把轴从 600 起画又是在放大差异。</tspan><tspan font-weight="700" fill="#202124">数字本身就是刻度。</tspan></text>
<rect x="38" y="200" width="756" height="52" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="52" y="231" class="box" fill="#202124">此前最优</text>
<text x="350" y="233" class="numb" fill="#202124" text-anchor="end">630</text>
<text x="360" y="233" class="xxs" fill="#5f6368">TFLOP/s per-chip</text>
<text x="560" y="233" class="lbl" fill="#202124">MFU 27.31%</text>
<line x1="80" y1="252" x2="80" y2="268" stroke="#5f6368" stroke-width="1.4" marker-end="url(#aK)"/>
<text x="100" y="264" class="xxs"><tspan font-weight="700" fill="#202124">+32.2</tspan>　<tspan fill="#9aa0a6">反向那两条路也被 tile 了</tspan></text>
<rect x="38" y="272" width="756" height="52" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="303" class="box" fill="#1e8e3e">＋ 18 个 tile 参数</text>
<text x="350" y="305" class="numb" fill="#1e8e3e" text-anchor="end">662.2</text>
<text x="360" y="305" class="xxs" fill="#5f6368">TFLOP/s per-chip</text>
<text x="560" y="305" class="lbl" fill="#1e8e3e">MFU 28.70%</text>
<line x1="80" y1="324" x2="80" y2="340" stroke="#5f6368" stroke-width="1.4" marker-end="url(#aK)"/>
<text x="100" y="336" class="xxs"><tspan font-weight="700" fill="#202124">+4.4</tspan>　<tspan fill="#9aa0a6">就是 AOT 扫出来的那个反直觉档</tspan></text>
<rect x="38" y="344" width="756" height="52" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="52" y="375" class="box" fill="#1e8e3e">＋ pdbs 12 → 13</text>
<text x="350" y="377" class="numb" fill="#1e8e3e" text-anchor="end">666.6</text>
<text x="360" y="377" class="xxs" fill="#5f6368">TFLOP/s per-chip</text>
<text x="560" y="377" class="lbl" fill="#1e8e3e">MFU 28.89%</text>
<rect x="38" y="410" width="756" height="40" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="52" y="432" class="xs"><tspan font-weight="700" fill="#d93025">但这 5.8% 不是 AOT 测出来的。</tspan><tspan font-weight="700" fill="#202124">AOT 只说了一句「13 装得下、14 装不下」</tspan>，<tspan fill="#9aa0a6">把真机额度省到该花的地方 —— 性能数字全部来自真机。</tspan></text>
<rect x="824" y="124" width="556" height="340" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="842" y="150" class="sec">乙　·　它给不了的那一格</text>
<text x="842" y="170" class="xs"><tspan fill="#9aa0a6">同一组配置，pdbs 从 12 换到 13，两个指标</tspan><tspan font-weight="700" fill="#202124">方向相反</tspan>。</text>
<rect x="842" y="198" width="520" height="78" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="856" y="220" class="lbl" fill="#202124">AOT 算的 temp</text>
<text x="856" y="236" class="xxs" fill="#5f6368">GiB（口径明确）</text>
<text x="864" y="262" class="xxs" fill="#5f6368">pdbs 12</text>
<text x="944" y="264" class="numb" fill="#202124">74.95</text>
<text x="1014" y="262" class="xxs" fill="#5f6368">→</text>
<text x="1038" y="262" class="xxs" fill="#5f6368">pdbs 13</text>
<text x="1118" y="264" class="numb" fill="#202124">73.11</text>
<text x="1348" y="264" class="numb" fill="#1e8e3e" text-anchor="end">↓ 1.84</text>
<rect x="842" y="286" width="520" height="78" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="856" y="308" class="lbl" fill="#202124">真机打印的峰值 HBM</text>
<text x="856" y="324" class="xxs" fill="#5f6368">源记录只写「G」，没写清口径</text>
<text x="864" y="350" class="xxs" fill="#5f6368">pdbs 12</text>
<text x="944" y="352" class="numb" fill="#202124">91.94</text>
<text x="1014" y="350" class="xxs" fill="#5f6368">→</text>
<text x="1038" y="350" class="xxs" fill="#5f6368">pdbs 13</text>
<text x="1118" y="352" class="numb" fill="#202124">92.57</text>
<text x="1348" y="352" class="numb" fill="#d93025" text-anchor="end">↑ 0.63</text>
<rect x="842" y="410" width="520" height="40" rx="8" fill="#fff" stroke="#202124" stroke-width="1.2"/>
<text x="856" y="432" class="xs"><tspan font-weight="700" fill="#202124">两个都没错。</tspan><tspan fill="#9aa0a6">temp 是判 OOM 的那一项，</tspan><tspan font-weight="700" fill="#202124">从来不是「谁更省显存」的排名。</tspan></text>
<rect x="20" y="492" width="1360" height="92" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="520" class="sec">这两格必须一起看</text>
<text x="38" y="546" class="xs"><tspan font-weight="700" fill="#202124">只看左边，会以为「AOT 帮我们提了 5.8%」—— 它一个性能数字都给不了。只看右边，又像在说这工具不可靠。</tspan><tspan font-weight="700" fill="#d93025">合起来才是真话：它回答的是「装不装得下」，而它的价值是把有限的真机额度省到该花的地方。</tspan><tspan fill="#9aa0a6">用一个指标去回答它没被设计来回答的问题 —— 这是这门课里</tspan></text>
<text x="38" y="565" class="xs"><tspan fill="#9aa0a6">反复出现的同一种错。</tspan></text>
<text x="1380" y="600" class="xxs" fill="#9aa0a6" text-anchor="end">实测：Hunyuan3-295B-A21B · 64 芯片 4x4x4 · per-chip = 日志 per-device × 2 · MFU = per-chip ÷ 2307</text>
</svg>
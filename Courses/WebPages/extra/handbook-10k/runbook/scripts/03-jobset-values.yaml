# =============================================================================
# 03-jobset-values.yaml —— §3.1 JobSet Helm values（chart oci://registry.k8s.io/jobset/charts/jobset）
#
# 出处：逐字取自参考集群蓝图
#
# 只删了原文件的长注释（原因写在右侧短注释里），值一个没改。
#
# 注意：
#   - image.tag 必须和 $JOBSET_VERSION 同步——chart 版本和镜像 tag 是两个独立的值，只升 chart 不改这里，
#     装上去的还是旧镜像
#   - 线上别用 `kubectl set image` 改 JobSet 镜像；下次 helm upgrade 会静默改回来
#   - 实测集群跑的是 registry.k8s.io/jobset/jobset:v0.10.1（kubectl apply 装的）；
#     sub-slicing 要求 ≥0.12.0
# =============================================================================
image:
  repository: registry.k8s.io/jobset/jobset
  tag: v0.12.0                     # 必须 = v$JOBSET_VERSION
  pullPolicy: IfNotPresent

controller:
  replicas: 3                      # chart 默认 1；JobSet 4 个 webhook 全是 failurePolicy: Fail，单副本一挂全集群建不了 JobSet
  resources:                       # CTK 原值，按 9,216 chip 规模
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
  tolerations:                     # 没有它 JobSet pod 上不了带 gke-managed-components taint 的系统池
  - key: "components.gke.io/gke-managed-components"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

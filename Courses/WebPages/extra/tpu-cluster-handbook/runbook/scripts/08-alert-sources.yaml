- id: 25
  what: TPU 节点 NodeHasDiskPressure / EvictionThresholdMet（任意一次）
  primary:
    type: logging
    filter: |
      log_id("events") resource.labels.cluster_name="$CLUSTER"
      jsonPayload.reason=("NodeHasDiskPressure" OR "EvictionThresholdMet")
    src: "经验教训第 42 条；reason 原文（EvictionThresholdMet 后约 10 s 出现 NodeHasDiskPressure）；log_id(\"events\") 写法为经验做法"
  alt: {type: kubectl, run: "kubectl get events -A --field-selector reason=NodeHasDiskPressure"}
- id: 26
  what: Kueue 驱逐（EvictedDueToNodeFailures / EvictedDueToAdmissionCheck / Preempted）——kubectl get events 可能看不到
  primary:
    type: logging
    filter: |
      resource.type="k8s_container" resource.labels.cluster_name="$CLUSTER"
      resource.labels.namespace_name="kueue-system" resource.labels.container_name="manager"
      jsonPayload.reason=~"^Evicted"
    how: 通知级；同一 Workload 1 h 内 ≥3 次改 page [推断]
    src: "经验教训第 54 条；字段（jsonPayload.reason 取值 EvictedDueToNodeFailures、EvictedDueToAdmissionCheck）"

# ==============================================================================
# 00. Self-managed CoreDNS
# ==============================================================================
# WHY THIS EXISTS
#
# Recommended practice: large clusters created with XPK enable CoreDNS
# explicitly; without it, JobSets larger than about 2K are reported not to run.
#
# Production is 144 cubes x 16 nodes = 2,304 TPU hosts, so we are squarely in
# that regime. CTK has no equivalent of what XPK does here, so
# we ship it ourselves.
#
# ------------------------------------------------------------------------------
# WHAT THIS IS *NOT*
#
# This is NOT GKE Cloud DNS (`cloud_dns_config.cluster_dns = "CLOUD_DNS"`).
# Cloud DNS was evaluated and rejected: its per-managed-zone record-set quota is
# reached by a single large headless Service, and the documented failure mode is
# silent -- "Cloud DNS does not create record sets or records for the Service".
# JobSet addresses every pod through a headless Service, so at 2,304 pods that
# is a cliff with no error message. See the handbook.
#
# ------------------------------------------------------------------------------
# HOW THIS DIFFERS FROM XPK -- READ BEFORE "FIXING" IT
#
# XPK (src/xpk/commands/cluster.py, update_coredns) does:
#   git clone coredns/deployment && cd kubernetes && ./deploy.sh | kubectl apply
#   kubectl scale deploy kube-dns-autoscaler --replicas=0
#   kubectl scale deploy kube-dns            --replicas=0
#   kubectl scale deploy coredns             --replicas=min(15, default_pool_nodes)
#
# We deliberately diverge in four places. Each divergence is the GKE-documented
# behaviour, not an invention:
#
#   1. NO SERVICE OBJECT. Upstream's coredns.yaml.sed ships a Service named
#      `kube-dns` carrying a hardcoded `clusterIP`, which overwrites the
#      GKE-managed one. We do not ship it at all. The existing GKE `kube-dns`
#      Service selects on `k8s-app: kube-dns` and NOTHING ELSE (verified on
#      a validated cluster: selector == {"k8s-app":"kube-dns"}), so labelling
#      our pods `k8s-app: kube-dns` is sufficient for the Service to pick them
#      up. This is exactly what GKE's own "Set up a custom kube-dns Deployment"
#      guide instructs. Consequences of doing it this way:
#        * no cluster DNS IP to hardcode or template (it is 10.0.32.10 today,
#          derived from services_ip_range, but we never need to say so);
#        * we never fight the GKE addon manager over a managed Service;
#        * rollback is `kubectl scale deploy kube-dns --replicas=N`, nothing
#          else -- see the handbook.
#
#   2. NO `git clone` AT DEPLOY TIME. Upstream is vendored here. A deployment
#      that clones from github at apply time is not reproducible and does not
#      work without egress.
#
#   3. REPLICAS ARE DECLARED, NOT `kubectl scale`d. XPK applies a Deployment
#      with no replica count (defaults to 1) and then scales it. In a
#      declarative blueprint that is an anti-pattern: the next `terraform apply`
#      would revert it to 1 and take cluster DNS down to a single pod.
#
#   4. NEWER IMAGE. Upstream pins coredns/coredns:1.9.4 on Docker Hub -- a 2022
#      build, behind on CVEs, and on a registry with anonymous pull limits. See
#      the `coredns_image` var in the reference blueprint for the version actually used and
#      the reasoning.
#
# ------------------------------------------------------------------------------
# THE PART THIS FILE CANNOT DO
#
# Scaling `kube-dns` and `kube-dns-autoscaler` to zero is NOT expressible here.
# `kubectl apply` cannot scale a Deployment it does not own, and writing our own
# `kube-dns` Deployment with `replicas: 0` would mean adopting a GKE-managed
# object. It is a manual runbook step, on purpose -- it is the one irreversible
# moment in the switchover and a human should be present. See
# the handbook.
#
# UNTIL THAT STEP RUNS, BOTH DNS BACKENDS SERVE. The Service selector matches
# GKE's kube-dns pods AND our CoreDNS pods, so queries round-robin across both.
# That is harmless (both answer correctly) but it means "CoreDNS is Running" is
# NOT the same as "CoreDNS is serving". Verify with endpoint counts, not pod
# counts (see handbook chapter 02, CoreDNS).
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  - services
  - pods
  - namespaces
  verbs:
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
- kind: ServiceAccount
  name: coredns
  namespace: kube-system
---
# ------------------------------------------------------------------------------
# Corefile
#
# This is upstream's default with two deliberate edits, both marked below.
#
# The ${...} placeholders are Terraform template vars supplied by the reference blueprint.
# (Written `$$` on purpose: `templatefile()` does not skip comments, so an
# unescaped `${...}` here is evaluated as an expression and fails the whole
# group.)
# Upstream's deploy.sh does the same substitutions with `sed`; we let
# kubectl-apply's template_vars do it so the values live in the blueprint.
#
# STUBDOMAINS / UPSTREAMNAMESERVER: upstream's deploy.sh reads these out of the
# live `kube-dns` ConfigMap and splices them in. On the validated cluster that
# ConfigMap is EMPTY (verified), so there is nothing to splice and
# `forward . /etc/resolv.conf` is correct. If anyone ever adds stubDomains or
# upstreamNameservers to the kube-dns ConfigMap, THEY WILL NOT REACH CORE DNS --
# this file is the source of truth and must be edited by hand. That divergence
# is silent. See the handbook.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
          lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          fallthrough in-addr.arpa ip6.arpa
        }
        prometheus :9153
        forward . /etc/resolv.conf {
          max_concurrent 1000
        }
        # EDIT 1 of 2 (vs upstream): cache TTL raised from 30s to 300s.
        # At 2,304 nodes the same JobSet headless-Service names are resolved by
        # thousands of pods within seconds of each other. A 30s TTL turns that
        # into a repeated stampede against the API-server-backed kubernetes
        # plugin. Raising it trades DNS propagation delay -- which matters for
        # Services whose endpoints churn -- for a large drop in query volume.
        # Pathways pod identities are stable for the life of a JobSet, so the
        # trade is cheap here. It would NOT be cheap on a cluster running
        # rapidly rescheduling web workloads.
        cache 300
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: "CoreDNS"
    app.kubernetes.io/name: coredns
spec:
  # Declared, not `kubectl scale`d -- see divergence 3 in the header.
  replicas: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
      app.kubernetes.io/name: coredns
  template:
    metadata:
      labels:
        # `k8s-app: kube-dns` IS THE LOAD-BEARING LABEL. The GKE-managed
        # `kube-dns` Service selects on it, which is how these pods become
        # cluster DNS without us shipping a Service. Removing or renaming it
        # silently detaches CoreDNS from cluster DNS: the pods stay Running and
        # Ready, and nothing resolves. See divergence 1 in the header.
        k8s-app: kube-dns
        app.kubernetes.io/name: coredns
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      # EDIT 2 of 2 (vs upstream): pin CoreDNS to the CPU system pool.
      #
      # Upstream only sets `kubernetes.io/os: linux`. On this cluster that would
      # let cluster DNS land on one of the 2,304 TPU hosts, which are the nodes
      # most likely to be drained, preempted, or recycled by slice repair. DNS
      # must outlive the workload it serves.
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      affinity:
        podAntiAffinity:
          # REQUIRED, not preferred. One node failure must cost us exactly one
          # DNS replica.
          #
          # This makes replica count a hard constraint on node count: the pool
          # must be able to reach 15 nodes or the surplus
          # replicas sit Pending forever. The reference blueprint keeps
          # system_pool_min_nodes >= coredns_replicas so this holds at rest;
          # the blueprint's own checks assert it so it keeps holding.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: k8s-app
                operator: In
                values: ["kube-dns"]
            topologyKey: kubernetes.io/hostname
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.13.2
        imagePullPolicy: IfNotPresent
        resources:
          # Upstream is 100m / 70Mi with a 170Mi limit; GKE's managed kube-dns
          # is 100m / 70Mi with a 210Mi limit. Both are sized for a normal
          # cluster and both are too small here.
          #
          # CoreDNS holds a watch-backed cache of every Service, EndpointSlice
          # and Pod in the cluster. At 2,304 nodes with JobSets that create one
          # endpoint per pod, that working set is large, and the `cache
          # 300` above deliberately makes it larger. A 210Mi limit
          # under that load is an OOMKill, and an OOMKilled DNS pod at this
          # scale looks exactly like "JobSets over 2K won't run" -- a plausible
          # cause of that symptom.
          #
          # No CPU limit: throttling cluster DNS is never the behaviour you
          # want, and these pods are pinned to a pool with CPU to spare.
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            memory: "1Gi"
        args: [ "-conf", "/etc/coredns/Corefile" ]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 9153
          name: metrics
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
            scheme: HTTP
      # `Default` = inherit the node's resolv.conf. Anything else would point
      # CoreDNS at itself.
      dnsPolicy: Default
      volumes:
      - name: config-volume
        configMap:
          name: coredns
          items:
          - key: Corefile
            path: Corefile

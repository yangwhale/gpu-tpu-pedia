<rect x="350.0" y="140.0" width="94.0" height="26.0" rx="4" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="397.0" y="157.7" font-size="13" fill="#202124" text-anchor="middle">重算</text>
</g>
<g>
<rect x="446.0" y="140.0" width="94.0" height="26.0" rx="4" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="493.0" y="157.7" font-size="13" fill="#a50e0e" text-anchor="middle">干等 AG</text>
</g>
<g>
<rect x="542.0" y="140.0" width="226.0" height="26.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="655.0" y="157.7" font-size="13" fill="#174ea6" text-anchor="middle">gmm</text>
</g>
<g>
<rect x="446.0" y="172.0" width="94.0" height="26.0" rx="4" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
<text x="493.0" y="189.7" font-size="13" fill="#681da8" text-anchor="middle">AG</text>
</g>
<line x1="770.0" y1="136.0" x2="770.0" y2="202.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="778.0" y="158.0" font-size="14" fill="#a50e0e" text-anchor="start" font-weight="700">本层变长</text>
<text x="24.0" y="250.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">knockout 基线：AG 先发，重算填掉原本的空等</text>
<text x="24.0" y="278.0" font-size="14" fill="#5f6368" text-anchor="start">TC</text>
<text x="24.0" y="310.0" font-size="14" fill="#5f6368" text-anchor="start">SC0</text>
<g>
<rect x="170.0" y="260.0" width="178.0" height="26.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="259.0" y="277.7" font-size="13" fill="#174ea6" text-anchor="middle">attention 等</text>
</g>
<g>
<rect x="350.0" y="260.0" width="94.0" height="26.0" rx="4" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="397.0" y="277.7" font-size="13" fill="#202124" text-anchor="middle">重算</text>
</g>
<g>
<rect x="446.0" y="260.0" width="226.0" height="26.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="559.0" y="277.7" font-size="13" fill="#174ea6" text-anchor="middle">gmm</text>
</g>
<g>
<rect x="314.0" y="292.0" width="106.0" height="26.0" rx="4" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
<text x="367.0" y="309.7" font-size="13" fill="#681da8" text-anchor="middle">AG</text>
</g>
<line x1="674.0" y1="256.0" x2="674.0" y2="322.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="682.0" y="278.0" font-size="14" fill="#0d652d" text-anchor="start" font-weight="700">本层净增 ≈ 0</text>
<rect x="350.0" y="256" width="96.0" height="34" fill="none" stroke="#188038" stroke-width="2" stroke-dasharray="5 3" rx="4"/>
<text x="398.0" y="334.0" font-size="13" fill="#0d652d" text-anchor="middle">这一截原本是干等 AG</text>
</svg>

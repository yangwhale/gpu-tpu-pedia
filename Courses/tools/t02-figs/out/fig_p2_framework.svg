<svg viewBox="0 0 1400 946" width="1400" height="946" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="追踪同一个 all-reduce 在 Megatron 与 MaxText 两条链路上分别由谁插入，说明手工切分与声明式切分的差别">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">同一个 all-reduce，两边是怎么<tspan font-weight="700" fill="#d93025">出现</tspan>的　—— 追一个通信原语，比对比两张特性表有用得多</text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="37" y="58" class="sm">你写的（人负责）</text>
<rect x="151.0" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="168.0" y="58" class="sm">编译器生成的（工具负责）</text>
<rect x="328.0" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="345.0" y="58" class="sm">通信真正发生的那一步</text>
<rect x="20" y="84" width="676" height="414" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="111" class="sec">Megatron-LM　·　GPU</text>
<rect x="38" y="128" width="640" height="76" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="52" y="152" class="box" fill="#202124">① 你选一个并行模块</text>
<text x="52" y="172" class="xs"><tspan class="mono" fill="#1967d2">ColumnParallelLinear</tspan> / <tspan class="mono" fill="#1967d2">RowParallelLinear</tspan> —— 选哪个，等于你已经决定了这一层按行切还是按列切。</text>
<line x1="358.0" y1="208" x2="358.0" y2="230" stroke="#d93025" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="38" y="234" width="640" height="76" rx="8" fill="#fff" stroke="#f9ab00" stroke-width="1.3"/>
<text x="52" y="258" class="box" fill="#202124">② 你在 forward 里写下通信</text>
<text x="52" y="278" class="xs">行切的那一半算完只是<tspan font-weight="700" fill="#202124">部分和</tspan>，所以模块的 <tspan class="mono" fill="#1967d2">forward</tspan> 末尾<tspan font-weight="700" fill="#202124">显式调</tspan> <tspan class="mono" fill="#1967d2">all_reduce</tspan>。<tspan font-weight="700" fill="#d93025">这一行是你写的。</tspan></text>
<line x1="358.0" y1="314" x2="358.0" y2="336" stroke="#d93025" stroke-width="1.6" marker-end="url(#aR)"/>
<rect x="38" y="340" width="640" height="76" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.3"/>
<text x="52" y="364" class="box" fill="#202124">③ 换个并行度，回到 ①</text>
<text x="52" y="384" class="xs">切法变了，通信位置就变了 —— <tspan font-weight="700" fill="#202124">要你自己重新想一遍</tspan>。</text>
<rect x="38" y="430" width="640" height="46" rx="6" fill="#f1f3f4"/>
<text x="52" y="452" class="xs"><tspan font-weight="700" fill="#202124">整条链上没有任何一步是自动的。</tspan>好处是每一步都在你眼皮底下，坏处是<tspan font-weight="700" fill="#d93025">每一步都得由你想对</tspan>。</text>
<rect x="724" y="84" width="656" height="414" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="742" y="111" class="sec">MaxText　·　TPU</text>
<rect x="742" y="128" width="620" height="76" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.3"/>
<text x="756" y="152" class="box" fill="#202124">① 你只标注切分意图</text>
<text x="756" y="172" class="xs">给张量挂上 <tspan class="mono" fill="#1967d2">PartitionSpec</tspan>，说清它<tspan font-weight="700" fill="#202124">按哪根轴切</tspan>。至于要不要通信，你没说，也不用说。</text>
<line x1="1052.0" y1="208" x2="1052.0" y2="230" stroke="#1e8e3e" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="742" y="234" width="620" height="76" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.3"/>
<text x="756" y="258" class="box" fill="#202124">② 编译器推导整张图</text>
<text x="756" y="278" class="xs">sharding 沿着算子传播；发现某个算子的输入切法<tspan font-weight="700" fill="#202124">对不上</tspan>时，<tspan font-weight="700" fill="#202124">自己插一个集合通信</tspan>补齐。</text>
<line x1="1052.0" y1="314" x2="1052.0" y2="336" stroke="#1e8e3e" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="742" y="340" width="620" height="76" rx="8" fill="#fff" stroke="#f9ab00" stroke-width="1.3"/>
<text x="756" y="364" class="box" fill="#202124">③ all-reduce 出现在编译产物里</text>
<text x="756" y="384" class="xs"><tspan font-weight="700" fill="#d93025">你的源码里从头到尾没有这个词。</tspan>它在 HLO 里，也在 profile 里。</text>
<rect x="742" y="430" width="620" height="46" rx="6" fill="#f1f3f4"/>
<text x="756" y="452" class="xs"><tspan font-weight="700" fill="#202124">整条链上你只做了第一步。</tspan>好处是并行度一改重编一次就行，坏处是<tspan font-weight="700" fill="#d93025">它插在哪儿、插得好不好，你只能事后去读</tspan>。</text>
<text x="20" y="530" class="sec">看完机制再看代价　—— 这四行都是上面那条链的直接后果，不是两个团队的口味差异</text>
<rect x="20" y="542" width="1360" height="36" rx="8" fill="#f1f3f4"/>
<text x="34" y="565" class="lbl" fill="#202124">问的是同一个问题</text>
<text x="246" y="565" class="lbl" fill="#202124">Megatron-LM（GPU）</text>
<text x="826" y="565" class="lbl" fill="#202124">MaxText（TPU）</text>
<line x1="20" y1="578" x2="1380" y2="578" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="610" class="xs"><tspan font-weight="700" fill="#202124">并行怎么表达</tspan></text>
<text x="246" y="604" class="xs"><tspan font-weight="700" fill="#202124">手工切</tspan>。张量并行、流水并行各有一套模块，通信写在模块的 <tspan class="mono" fill="#1967d2">forward</tspan> 里</text>
<text x="826" y="604" class="xs"><tspan font-weight="700" fill="#202124">声明式</tspan>。给张量标 sharding，通信由编译器按 mesh 生成</text>
<rect x="20" y="632" width="1360" height="54" rx="0" fill="#fafafa"/>
<line x1="20" y1="632" x2="1380" y2="632" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="664" class="xs"><tspan font-weight="700" fill="#202124">心智负担在哪</tspan></text>
<text x="246" y="658" class="xs">要知道<tspan font-weight="700" fill="#202124">每一处 all-reduce 在哪</tspan>、为什么在那儿</text>
<text x="826" y="658" class="xs">要理解 <tspan class="mono" fill="#1967d2">mesh</tspan> 和 <tspan class="mono" fill="#1967d2">PartitionSpec</tspan>，以及它们怎么传播</text>
<line x1="20" y1="686" x2="1380" y2="686" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="718" class="xs"><tspan font-weight="700" fill="#202124">出问题的时候</tspan></text>
<text x="246" y="712" class="xs"><tspan font-weight="700" fill="#202124">看得见每一步</tspan>。加个打印就知道谁慢</text>
<text x="826" y="712" class="xs"><tspan font-weight="700" fill="#d93025">要会读编译产物</tspan>。代码里没有的东西，profile 里有</text>
<rect x="20" y="740" width="1360" height="54" rx="0" fill="#fafafa"/>
<line x1="20" y1="740" x2="1380" y2="740" stroke="#e8eaed" stroke-width="1"/>
<text x="34" y="772" class="xs"><tspan font-weight="700" fill="#202124">配置复杂度</tspan></text>
<text x="246" y="766" class="xs">参数极多，但<tspan font-weight="700" fill="#202124">错一个通常只影响一处</tspan></text>
<text x="826" y="766" class="xs">参数少，但<tspan font-weight="700" fill="#d93025">一个 sharding 标错全盘皆输</tspan> —— 而且可能只表现为「慢」，不报错</text>
<rect x="20" y="542" width="1360" height="252" rx="8" fill="none" stroke="#dadce0" stroke-width="1.2"/>
<rect x="20" y="828" width="1360" height="102" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="856" class="sec">这不是两个团队风格不同，是同一条基因</text>
<text x="38" y="882" class="xs">把这张图和上一张并排看：<tspan font-weight="700" fill="#202124">「谁在安排」这个问题，在框架层原样复现了一遍。</tspan>硬件上是「谁决定数据什么时候搬」，框架上就是「谁决定通信插在哪」——<tspan font-weight="700" fill="#202124">同一个选择，换了一层皮。</tspan></text>
<text x="38" y="905" class="xs">所以选框架的时候真正要问的不是「哪个更快」，而是<tspan font-weight="700" fill="#d93025">「我这个队，是更有人能想对每一处通信，还是更有人读得懂编译产物」</tspan>。</text>
</svg>
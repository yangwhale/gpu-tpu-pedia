<svg viewBox="0 0 1400 678" width="1400" height="678" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MFU 的分母是选出来的：GB200 与 HGX B200 两个官方 BF16 峰值差 11%，TPU v7 的 per-chip 与 per-device 两个口径差 2 倍">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">比之前先问分母　—— <tspan font-weight="700" fill="#d93025">这四个数全有出处，而它们互相不等</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#202124"/>
<text x="37" y="58" class="sm">数字一律中性：光看数字分辨不出该用哪个</text>
<rect x="277.5" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="294.5" y="58" class="sm">决定该用哪个的是这一行</text>
<rect x="20" y="124" width="836" height="398" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　同一代 GPU，两个 SKU</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">两张卡同一代、同一个架构名，官方峰值差 </tspan><tspan font-weight="700" fill="#202124">11%</tspan>。<tspan font-weight="700" fill="#202124">画在同一根轴上，差的那一段单独描出来。</tspan></text>
<text x="838" y="174" class="xxs" fill="#5f6368" text-anchor="end">横轴：TFLOP/s（BF16 dense）　满程 = 2,500</text>
<text x="50" y="236" class="box" fill="#202124">GB200 的 GPU</text>
<text x="50" y="255" class="xxs" fill="#d93025">机型 a4x-highgpu-4g（A4X）</text>
<rect x="320" y="220" width="372" height="28" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="320" y="220" width="372.0" height="28" rx="4" fill="#dadce0" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="704.0" y="240" class="numb" fill="#202124">2,500</text>
<text x="320" y="268" class="xxs"><tspan font-weight="700" fill="#202124">▸</tspan>　官方 Superchip 栏 10 PFLOPS(sparse) ÷ 2 dense ÷ 2 GPU</text>
<text x="320" y="283" class="xxs"><tspan fill="#9aa0a6">✓　交叉验证：整机柜 360 PFLOPS(sparse) ÷ 72 ÷ 2 = 2.5 ✓</tspan></text>
<text x="50" y="342" class="box" fill="#202124">HGX B200</text>
<text x="50" y="361" class="xxs" fill="#d93025">机型 a4-highgpu-8g（A4 High）</text>
<rect x="320" y="326" width="372" height="28" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="320" y="326" width="334.8" height="28" rx="4" fill="#dadce0" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="666.8" y="346" class="numb" fill="#202124">2,250</text>
<text x="320" y="374" class="xxs"><tspan font-weight="700" fill="#202124">▸</tspan>　官方八卡栏 36 PFLOPS(sparse) ÷ 2 dense ÷ 8 GPU</text>
<text x="320" y="389" class="xxs"><tspan fill="#9aa0a6">✓　交叉验证：同页 FP8 72 ÷ 2 ÷ 8 = 4.5，与 BF16 正好 2:1 ✓</tspan></text>
<rect x="654.8" y="220" width="37.200000000000045" height="28" rx="0" fill="#fce8e6" stroke="#d93025" stroke-width="1.6"/>
<line x1="654.8" y1="212" x2="692" y2="212" stroke="#d93025" stroke-width="1.4"/>
<line x1="654.8" y1="212" x2="654.8" y2="354" stroke="#d93025" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="673.4" y="206" class="num" fill="#d93025" text-anchor="middle">11%</text>
<rect x="38" y="424" width="800" height="82" rx="8" fill="#fff" stroke="#202124" stroke-width="1.2"/>
<text x="52" y="446" class="xs"><tspan font-weight="700" fill="#202124">2,500 ÷ 2,250 = 1.111。</tspan><tspan font-weight="700" fill="#d93025">这 11% 会一比一地转移到 MFU 上</tspan> —— <tspan fill="#9aa0a6">硬件没变、代码没变、跑出来的 TFLOP/s 没变，只是除数换了一个。</tspan></text>
<text x="52" y="467" class="xs"><tspan font-weight="700" fill="#202124">而它不会报错。</tspan><tspan fill="#9aa0a6">选错分母算出来的仍然是一个完全正常的百分比 —— 能进汇报、能做容量规划，</tspan><tspan font-weight="700" fill="#202124">除非有人回头去查你除的是哪个数。</tspan></text>
<rect x="868" y="124" width="512" height="398" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="886" y="150" class="sec">乙　·　同一颗 TPU，两个口径</text>
<text x="886" y="170" class="xs"><tspan fill="#9aa0a6">这一边不是两个 SKU，是</tspan><tspan font-weight="700" fill="#202124">同一颗芯片</tspan>。v7 一颗芯片里有 <tspan font-weight="700" fill="#202124">2 个 device</tspan> —— 第二条正好半长。</text>
<text x="1362" y="208" class="xxs" fill="#5f6368" text-anchor="end">横轴同上　满程 = 2,307</text>
<text x="898" y="240" class="box" fill="#202124">per chip</text>
<rect x="1044" y="224" width="262" height="24" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="1044" y="224" width="262.0" height="24" rx="4" fill="#dadce0" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="1316.0" y="242" class="numb" fill="#202124">2,307</text>
<text x="898" y="264" class="xxs">官方规格表只给这一栏</text>
<text x="898" y="304" class="box" fill="#202124">per device</text>
<rect x="1044" y="288" width="262" height="24" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="1044" y="288" width="131.0" height="24" rx="4" fill="#dadce0" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="1185.0" y="306" class="numb" fill="#202124">1,153.5</text>
<text x="898" y="328" class="xxs"><tspan font-weight="700" fill="#202124">= 2,307 ÷ 2　框架日志只按这个报</tspan></text>
<rect x="886" y="352" width="476" height="62" rx="8" fill="#fff" stroke="#202124" stroke-width="1.2"/>
<text x="900" y="374" class="xs"><tspan font-weight="700" fill="#202124">上一代是 1 chip = 1 device，这一代是 1 : 2。</tspan><tspan font-weight="700" fill="#d93025">跨代照抄公式，分母就差一倍，而且不</tspan></text>
<text x="900" y="390" class="xs"><tspan font-weight="700" fill="#d93025">报错。</tspan><tspan fill="#9aa0a6">第 0 节那张瀑布图问过同一个问题 —— 那次量的是 HBM，这次是算力。</tspan></text>
<rect x="886" y="424" width="476" height="80" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="900" y="446" class="xs"><tspan font-weight="700" fill="#202124">⚠️ 还有第三件事要交代：2,307 是最高频率档下的峰值。</tspan></text>
<text x="900" y="464" class="xs"><tspan fill="#9aa0a6">我们自己的 v7 记录里，只把频率档从默认锁到最高，</tspan><tspan font-weight="700" fill="#202124">什么都没改就白拿 8.6%</tspan> —— 说明默</text>
<text x="900" y="480" class="xs">认档并不跑在那个频率上。<tspan font-weight="700" fill="#202124">分母写 2,307 的时候，顺带说一句跑的是哪一档。</tspan></text>
<rect x="20" y="550" width="1360" height="100" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="38" y="578" class="sec">⭐ 这个坑我们自己就在里面 —— 而且是同一个数字，一次对一次错</text>
<text x="38" y="604" class="xs"><tspan font-weight="700" fill="#202124">本仓库有两份文档都写着「BF16 峰值 2,250 TFLOP/s」。</tspan><tspan fill="#9aa0a6">一份跑在 A4 High（HGX B200）上 —— </tspan><tspan font-weight="700" fill="#202124">对的</tspan>；<tspan font-weight="700" fill="#d93025">另一份跑在 A4X（GB200 NVL72）上 —— 那台机器的官方峰值是 2,500，于是</tspan><tspan font-weight="700" fill="#202124">那一页三张表里的每一个 MFU 都偏高约 11%</tspan>（最佳配置 23.4% 应为 21.1%）。<tspan font-weight="700" fill="#202124">两份</tspan></text>
<text x="38" y="623" class="xs"><tspan font-weight="700" fill="#202124">文档写的是同一个数，差别不在数字里，在跑它的那台机器上。</tspan>　—— <tspan font-weight="700" fill="#202124">而这还只是分母。下一张把分子补上。</tspan></text>
<text x="1380" y="666" class="xxs" fill="#9aa0a6" text-anchor="end">来源：NVIDIA GB200 NVL72 与 HGX 平台官方规格表（均按其脚注换算成 dense）· TPU v7 取自 Google Cloud 官方 TPU7x 规格表，与第 1 节同源</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：多个小 kernel 串起来，每个 kernel 把中间量写回 HBM，下一个再读回来，绿色箭头多。右：一个 mega-kernel 把几步放在一个 kernel 里，中间量留在片上 VMEM，只在开头读一次、结尾写一次。">
<title>拆成多个小 kernel，中间量每一步都回 HBM 绕一圈；mega-kernel 在片上一口气做完</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>

<rect width="900" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">拆成多个小 kernel，中间量每一步都回 HBM 绕一圈；mega-kernel 在片上一口气做完</text>
<text x="24" y="58" font-size="14" fill="#5f6368">数绿色箭头：每一根都是一次 HBM 读或写（示意）</text>
<text x="30" y="96" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700" >多个小 kernel（老路径）</text>
<rect x="50" y="115" width="105" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="102" y="146" font-size="14" fill="#174ea6" text-anchor="middle" >kernel 1</text>
<line x1="80" y1="232" x2="80" y2="169" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<line x1="125" y1="169" x2="125" y2="228" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<rect x="185" y="115" width="105" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="237" y="146" font-size="14" fill="#174ea6" text-anchor="middle" >kernel 2</text>
<line x1="215" y1="232" x2="215" y2="169" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<line x1="260" y1="169" x2="260" y2="228" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<rect x="320" y="115" width="105" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="372" y="146" font-size="14" fill="#174ea6" text-anchor="middle" >kernel 3</text>
<line x1="350" y1="232" x2="350" y2="169" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<line x1="395" y1="169" x2="395" y2="228" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="232" width="390" height="40" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
<text x="235" y="258" font-size="15" fill="#0d652d" text-anchor="middle" font-weight="700" >HBM</text>
<text x="235" y="300" font-size="14" fill="#a50e0e" text-anchor="middle" >中间量写回、再读：每一步一次往返</text>
<text x="480" y="96" font-size="15" fill="#0d652d" text-anchor="start" font-weight="700" >mega-kernel（前向、反向各一个）</text>
<rect x="490" y="110" width="370" height="72" rx="8" fill="none" stroke="#1a73e8" stroke-width="2" />
<rect x="505" y="122" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="555" y="144" font-size="14" fill="#174ea6" text-anchor="middle" >第 1 步</text>
<line x1="605" y1="139" x2="618" y2="139" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="620" y="122" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="670" y="144" font-size="14" fill="#174ea6" text-anchor="middle" >第 2 步</text>
<line x1="720" y1="139" x2="733" y2="139" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="735" y="122" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="785" y="144" font-size="14" fill="#174ea6" text-anchor="middle" >第 3 步</text>
<text x="675" y="174" font-size="13" fill="#0d652d" text-anchor="middle" >中间量留在片上 VMEM</text>
<line x1="520" y1="232" x2="520" y2="186" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<line x1="830" y1="186" x2="830" y2="228" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<rect x="490" y="232" width="370" height="40" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
<text x="675" y="258" font-size="15" fill="#0d652d" text-anchor="middle" font-weight="700" >HBM</text>
<text x="675" y="300" font-size="14" fill="#0d652d" text-anchor="middle" >只读一次进、写一次出</text>
</svg>
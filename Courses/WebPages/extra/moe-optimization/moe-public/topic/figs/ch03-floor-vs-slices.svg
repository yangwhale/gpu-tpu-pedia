<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="小包单个 all-reduce 的耗时：2 片乘 32 芯 2.9 到 3.1 毫秒，5 片乘 4 芯 2.2 到 3.6，16 片乘 4 芯 14.2 到 14.5，上百台 host 的大片 21.8。">

<rect width="900" height="330" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >片越多、host 越多，小包地板越高</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >小包单个 all-reduce 的耗时（ms，§2）；条长取区间上沿</text>
<text x="246.0" y="118.0" font-size="15" fill="#202124" text-anchor="end" >2 片 × 32 芯</text>
<rect x="260.0" y="96.0" width="67.6" height="34.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="337.6" y="119.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold" >2.9–3.1 ms</text>
<text x="246.0" y="174.0" font-size="15" fill="#202124" text-anchor="end" >5 片 × 4 芯</text>
<rect x="260.0" y="152.0" width="78.5" height="34.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="348.5" y="175.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold" >2.2–3.6 ms</text>
<text x="246.0" y="230.0" font-size="15" fill="#202124" text-anchor="end" >16 片 × 4 芯</text>
<rect x="260.0" y="208.0" width="316.4" height="34.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="586.4" y="231.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold" >14.2–14.5 ms</text>
<text x="246.0" y="286.0" font-size="15" fill="#202124" text-anchor="end" >大片，上百台 host</text>
<rect x="260.0" y="264.0" width="475.6" height="34.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<text x="745.6" y="287.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold" >21.8 ms</text>
</svg>

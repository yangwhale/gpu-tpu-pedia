.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">这两个数是怎么挣来的　—— <tspan font-weight="700" fill="#d93025">两条爬升曲线，和一个不能比的起点</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">GB300 · 四步 · 一个通宵</text>
<rect x="197.57500000000002" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="214.57500000000002" y="58" class="sm">TPU v7 · 五步 · 约两周</text>
<rect x="369.975" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="386.975" y="58" class="sm">707.2 —— 只作刻度用，解读见乙格</text>
<rect x="20" y="124" width="900" height="502" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">甲　·　两条爬升曲线，同一根纵轴</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">纵轴</tspan><tspan font-weight="700" fill="#202124">从 0 起、没有截断</tspan> —— 这一节整节在讲怎么让数字经得起回查，在自己的图上截轴就没得讲了。</text>
<line x1="86" y1="482.0" x2="632" y2="482.0" stroke="#dadce0" stroke-width="1.0"/>
<text x="76" y="486.0" class="xxs" fill="#5f6368" text-anchor="end">0</text>
<line x1="86" y1="394.6666666666667" x2="632" y2="394.6666666666667" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="76" y="398.6666666666667" class="xxs" fill="#5f6368" text-anchor="end">300</text>
<line x1="86" y1="307.33333333333337" x2="632" y2="307.33333333333337" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="76" y="311.33333333333337" class="xxs" fill="#5f6368" text-anchor="end">600</text>
<line x1="86" y1="220.0" x2="632" y2="220.0" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="76" y="224.0" class="xxs" fill="#5f6368" text-anchor="end">900</text>
<text x="76" y="196" class="xxs" fill="#5f6368" text-anchor="end">TFLOP/s</text>
<line x1="86" y1="276.12622222222217" x2="632" y2="276.12622222222217" stroke="#9aa0a6" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="628" y="268.12622222222217" class="xxs" fill="#9aa0a6" text-anchor="end">707.2　GB300 抄来的起点</text>
<path d="M120.0,276.1 L239.5,265.4 L359.0,241.3 L478.5,233.3" stroke="#1a73e8" stroke-width="2.4" fill="none"/>
<rect x="109.0" y="265.12622222222217" width="22" height="22" rx="11" fill="#fff" stroke="#1a73e8" stroke-width="2.0"/>
<text x="120.0" y="280.12622222222217" class="xxs" fill="#1a73e8" text-anchor="middle">①</text>
<rect x="228.5" y="254.4133333333333" width="22" height="22" rx="11" fill="#fff" stroke="#1a73e8" stroke-width="2.0"/>
<text x="239.5" y="269.4133333333333" class="xxs" fill="#1a73e8" text-anchor="middle">②</text>
<rect x="348.0" y="230.2511111111111" width="22" height="22" rx="11" fill="#fff" stroke="#1a73e8" stroke-width="2.0"/>
<text x="359.0" y="245.2511111111111" class="xxs" fill="#1a73e8" text-anchor="middle">③</text>
<rect x="467.5" y="222.2746666666667" width="22" height="22" rx="11" fill="#fff" stroke="#1a73e8" stroke-width="2.0"/>
<text x="478.5" y="237.2746666666667" class="xxs" fill="#1a73e8" text-anchor="middle">④</text>
<text x="108.0" y="258.12622222222217" class="lbl" fill="#1a73e8" text-anchor="middle">GB300　707.2</text>
<text x="494.5" y="237.2746666666667" class="numb" fill="#1a73e8">854.4</text>
<path d="M120.0,349.0 L239.5,323.9 L359.0,313.2 L478.5,298.6 L598.0,289.2" stroke="#1e8e3e" stroke-width="2.4" fill="none"/>
<rect x="109.0" y="337.9622222222222" width="22" height="22" rx="11" fill="#fff" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="120.0" y="352.9622222222222" class="xxs" fill="#1e8e3e" text-anchor="middle">①</text>
<rect x="228.5" y="312.9266666666667" width="22" height="22" rx="11" fill="#fff" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="239.5" y="327.9266666666667" class="xxs" fill="#1e8e3e" text-anchor="middle">②</text>
<rect x="348.0" y="302.15555555555557" width="22" height="22" rx="11" fill="#fff" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="359.0" y="317.15555555555557" class="xxs" fill="#1e8e3e" text-anchor="middle">③</text>
<rect x="467.5" y="287.6" width="22" height="22" rx="11" fill="#fff" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="478.5" y="302.6" class="xxs" fill="#1e8e3e" text-anchor="middle">④</text>
<rect x="587.0" y="278.1971111111111" width="22" height="22" rx="11" fill="#fff" stroke="#1e8e3e" stroke-width="2.0"/>
<text x="598.0" y="293.1971111111111" class="xxs" fill="#1e8e3e" text-anchor="middle">⑤</text>
<text x="108.0" y="330.9622222222222" class="lbl" fill="#1e8e3e" text-anchor="middle">v7　457.0</text>
<text x="614.0" y="293.1971111111111" class="numb" fill="#1e8e3e">662.3</text>
<text x="90" y="502" class="xxs" fill="#5f6368">①②③④⑤ ＝ 第几步（不是时间轴）</text>
<rect x="108" y="366" width="392" height="62" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.8"/>
<text x="122" y="386" class="xs"><tspan font-weight="700" fill="#202124">⭐ v7：硬件一颗没换，457 → 662.3，</tspan><tspan font-weight="700" fill="#d93025">+44.9%</tspan>。</text>
<text x="122" y="402" class="xxs"><tspan fill="#9aa0a6">剥掉 ④ 那个频率档仍有 </tspan><tspan font-weight="700" fill="#202124">+33.4%</tspan>。<tspan font-weight="700" fill="#202124">这是本节「差距在软件」唯一的直接实验证据</tspan> </text>
<text x="122" y="415" class="xxs">—— P-15 乙格那个 1.19 是除剩下的，这个是跑出来的。</text>
<rect x="108" y="436" width="392" height="48" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="122" y="454" class="xxs"><tspan font-weight="700" fill="#202124">⚠️ 别把两条线逐步对齐看。</tspan><tspan fill="#9aa0a6">横轴只是「第几步」，两边一步的含义、耗时、继承</tspan></text>
<text x="122" y="467" class="xxs"><tspan fill="#9aa0a6">的家底都不同 —— 为什么不能这么看，全在乙格。</tspan></text>
<rect x="646" y="200" width="256" height="22" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
<text x="656" y="216" class="lbl" fill="#1a73e8">GB300 · 一个通宵，四步 · +20.8%</text>
<text x="656" y="249" class="xxs" fill="#1a73e8">①</text>
<text x="672" y="249" class="num" fill="#202124">707.2</text>
<text x="718" y="249" class="xxs">V1：照抄厂商官方 BF16 recipe</text>
<text x="656" y="279" class="xxs" fill="#1a73e8">②</text>
<text x="672" y="279" class="num" fill="#202124">744.0</text>
<text x="718" y="279" class="xxs">关掉 recompute（换 33 GB 显存，+</text>
<text x="718" y="292" class="xxs">5.2%）</text>
<text x="656" y="322" class="xxs" fill="#1a73e8">③</text>
<text x="672" y="322" class="num" fill="#202124">827.0</text>
<text x="718" y="322" class="xxs">cutedsl + a2a_overlap ← 最大单项</text>
<text x="718" y="335" class="xxs"> +11.2%</text>
<text x="656" y="365" class="xxs" fill="#1a73e8">④</text>
<text x="672" y="365" class="num" fill="#202124">854.4</text>
<text x="718" y="365" class="xxs">full_iteration graph + paged </text>
<text x="718" y="378" class="xxs">stash（+3.3%）</text>
<rect x="646" y="411" width="256" height="22" rx="5" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.2"/>
<text x="656" y="427" class="lbl" fill="#1e8e3e">TPU v7 · 约两周，五步 · +44.9%</text>
<text x="656" y="460" class="xxs" fill="#1e8e3e">①</text>
<text x="672" y="460" class="num" fill="#202124">457.0</text>
<text x="718" y="460" class="xxs">起点：<tspan class="mono" fill="#1967d2">megablox</tspan> + pdbs 8</text>
<text x="656" y="490" class="xxs" fill="#1e8e3e">②</text>
<text x="672" y="490" class="num" fill="#202124">543.0</text>
<text x="718" y="490" class="xxs">tokamax tile(512,2048,1536) ← </text>
<text x="718" y="503" class="xxs">全场最大单项 +18.8%</text>
<text x="656" y="533" class="xxs" fill="#1e8e3e">③</text>
<text x="672" y="533" class="num" fill="#202124">580.0</text>
<text x="718" y="533" class="xxs">pdbs 8 → 12（+6.8%）</text>
<text x="656" y="563" class="xxs" fill="#1e8e3e">④</text>
<text x="672" y="563" class="num" fill="#202124">630.0</text>
<text x="718" y="563" class="xxs">锁最高频率档 dvfs_p_state=7（+</text>
<text x="718" y="576" class="xxs">8.6%）<tspan font-weight="700" fill="#d93025">← 这一步不算软件</tspan></text>
<text x="656" y="606" class="xxs" fill="#1e8e3e">⑤</text>
<text x="672" y="606" class="num" fill="#202124">662.3</text>
<text x="718" y="606" class="xxs">tile 改走 18 个配置参数，不再需要</text>
<text x="718" y="619" class="xxs"> tokamax 开关（+5.1%）</text>
<rect x="932" y="124" width="448" height="502" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="950" y="150" class="sec">乙　·　起点不是同一种东西</text>
<text x="950" y="170" class="xs"><tspan fill="#9aa0a6">看甲格最容易得出的结论是「一边爬得多、一边爬得少」。</tspan><tspan font-weight="700" fill="#202124">但两条线的起点性质不同，</tspan></text>
<text x="950" y="186" class="xs"><tspan font-weight="700" fill="#202124">这个比较从第一步就不成立。</tspan></text>
<rect x="950" y="216" width="412" height="86" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="964" y="240" class="box" fill="#1a73e8">GB300 的 707.2</text>
<text x="964" y="260" class="xs"><tspan font-weight="700" fill="#202124">照抄厂商官方 BF16 recipe 就有。</tspan><tspan fill="#9aa0a6">它不是「没调优」的水位 —— 那份 </tspan></text>
<text x="964" y="276" class="xs"><tspan fill="#9aa0a6">recipe 背后是别人几个月的工作，只是那部分工时</tspan><tspan font-weight="700" fill="#202124">不出现在我们的记录里</tspan>。</text>
<rect x="950" y="310" width="412" height="86" rx="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="964" y="334" class="box" fill="#1e8e3e">v7 的 457</text>
<text x="964" y="354" class="xs"><tspan font-weight="700" fill="#202124">我们自己拼出来的第一版能跑通的配置。</tspan><tspan fill="#9aa0a6">模型是新移植进框架的，没有现成配</tspan></text>
<text x="964" y="370" class="xs"><tspan fill="#9aa0a6">方可抄 —— 所以这条线的前几步，其实在补别人起点里已经有的东西。</tspan></text>
<rect x="950" y="408" width="412" height="80" rx="8" fill="#fff" stroke="#202124" stroke-width="1.4"/>
<text x="964" y="430" class="xs"><tspan font-weight="700" fill="#202124">⭐ 第 6 节说 ③ 档贵在「两边都得有人会调」。</tspan></text>
<text x="964" y="449" class="xs"><tspan font-weight="700" fill="#202124">这一格是那句话的具体形态：「会调」里有一部分是继承来的，而继承来的那</tspan></text>
<text x="964" y="466" class="xs"><tspan font-weight="700" fill="#202124">部分不出现在任何工时统计里。</tspan></text>
<rect x="950" y="498" width="412" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="964" y="517" class="xs"><tspan font-weight="700" fill="#202124">⚠️ 撞墙的只有 v7 这一边。</tspan></text>
<text x="964" y="532" class="xxs"><tspan fill="#9aa0a6">v7：四个方向 8 格实验无一正收益。GB300：只有</tspan><tspan font-weight="700" fill="#202124">并行度形状</tspan>那一组（PP/VPP）撞墙</text>
<text x="964" y="545" class="xxs">落在 852–856；<tspan font-weight="700" fill="#202124">同表 EP 32→16 是 +3.3%，没跟进</tspan>。<tspan font-weight="700" fill="#d93025">所以 GB300 是「没跟进」不是</tspan></text>
<text x="964" y="558" class="xxs"><tspan font-weight="700" fill="#d93025">「到顶」。</tspan></text>
<rect x="950" y="568" width="412" height="42" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="964" y="585" class="xxs"><tspan font-weight="700" fill="#202124">口径提醒</tspan>：第 6 节讲的「GPU 侧只调过 7 组」是 <tspan font-weight="700" fill="#202124">A4X（GB200）</tspan>上另一个模型的记</text>
<text x="964" y="598" class="xxs">录，跟本图 <tspan font-weight="700" fill="#202124">A4X Max（GB300）</tspan>这四步是两台机器、两份记录。</text>
<rect x="20" y="654" width="1360" height="104" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="682" class="sec">⭐ 这张图真正想让人带走的，不是哪条线更高，是「调优投入」这件事根本没法直接比</text>
<text x="38" y="708" class="xs"><tspan font-weight="700" fill="#202124">我们在 v7 上花了约两周、五步、几十组配置；在 GB300 上花了一个通宵、四步。</tspan><tspan fill="#9aa0a6">如果只看这两个数字，会得出「GPU 那边随便调调就赢了」——</tspan><tspan font-weight="700" fill="#d93025">而真相是 GB300 的第一步就站在别人几个月的成果上。</tspan><tspan font-weight="700" fill="#202124">所以下次读到「我们两边都调过」的时候，接着问一句：两边的起点分</tspan></text>
<text x="38" y="727" class="xs"><tspan font-weight="700" fill="#202124">别是谁给的？</tspan><tspan fill="#9aa0a6">　—— 这一句比「各调了多久」有用得多，而且对方通常答得上来。</tspan></text>
<text x="1380" y="774" class="xxs" fill="#9aa0a6" text-anchor="end">两条曲线的横轴是「第几步」，不是时间 · 纵轴 TFLOP/s / 计算单元，BF16，0 起未截断 · 同一个 295B-A21B</text>
</svg>
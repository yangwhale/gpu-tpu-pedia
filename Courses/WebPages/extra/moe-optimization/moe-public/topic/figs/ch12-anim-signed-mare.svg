<rect width="900" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">signed 均值让正负偏差互相抵消：同一串差，signed 过门槛，先取绝对值的 MARE 不过</text>

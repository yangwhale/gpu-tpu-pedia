<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="同一个集合通信只能落一处：上路留在 TensorCore 上做 async collective fusion，计算被通信切碎；下路整个卸到 SparseCore，TensorCore 只管算。两套开关互斥，必须一起改；A06、A07 都建在下路上，开 layer scheduler 还要另开 aggregator。"><title>同一个集合通信只能落一处：上路留在 TensorCore 上做 async collective fusion，计算被通信切碎；下路整个卸到 SparseCore，TensorCore 只管算。两套开关互斥，必须一起改；A06、A07 都建在下路上，开 layer scheduler 还要另开 aggregator。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="400" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">同一个集合通信只能落一处：要么留在 TensorCore 融合，要么整个交给 SparseCore</text>

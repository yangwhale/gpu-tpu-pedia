# =============================================================================
# 06-data-pv-pvc.yaml —— 06c §6.1：数据桶经 gcsfuse CSI 静态挂载（一个 PV + 一个 PVC）
#   只去掉了 status / uid / resourceVersion / claimRef 运行时字段和 last-applied 注解，字段取值原样。
#   实测集群的 PV 没写 claimRef、靠 PVC 的 volumeName 绑定；它 ns <命名空间> 下那组则在 PV 上写了 claimRef（同文件）。
#   这里两边都写，防止别的 PVC 抢绑 [推断：K8s 静态绑定的通常做法]。
#   capacity 5Gi 对 gcsfuse 没有实际意义（桶没有容量上限），原样保留。
#
# 占位（envsubst 替换，变量在 env.sh）：
#   ${DATA_PV}      PV 名          实测集群 <数据卷>
#   ${DATA_PVC}     PVC 名         实测集群 <数据卷>
#   ${NS}           namespace      实测集群 default
#   ${DATA_BUCKET}  桶名（不带 gs:）实测集群 <数据桶>
#
# 用法（幂等：apply 已存在且未改动 → unchanged）：
#   envsubst '$DATA_PV $DATA_PVC $NS $DATA_BUCKET' < 06-data-pv-pvc.yaml | kubectl apply -f -
# 第二个桶（实测集群 <中区数据桶> → /models2）照抄一份改名即可。
#
# $INSPECT_NS 变体（给 smoke pod / 构建 pod 用，06c §6.1 警告框；未实测）：
#   $NS 里的非 TPU pod 被 Kueue 挂 SchedulingGated，所以另在 $INSPECT_NS（已在 Kueue 排除列表）建一组。
#   PV 是集群级对象、claimRef 钉死一个 namespace，所以 PV 名也必须换，不能和 $NS 那组共用；
#   env.sh 里 DATA_PV / DATA_PVC 在 source 时就按 NS 推好了，只改 NS 不会跟着变，三个都要显式给：
#   NS=$INSPECT_NS DATA_PV=${DATA_PV}-inspect DATA_PVC=${DATA_PVC}-inspect \
#     envsubst '$DATA_PV $DATA_PVC $NS $DATA_BUCKET' < 06-data-pv-pvc.yaml | kubectl apply -f -
#   还要给 ns/$INSPECT_NS/sa/$KSA 授桶权限（命令见 06c §6.1 警告框）。
#
# mountOptions 只写了实测集群 <数据卷> 的前两项。06a §4「给使用方的 gcsfuse 起步配置」多出的几项在下面以注释列出，
#   默认不开：file-cache 吃节点内存，要和 JobSet 的 200Gi tmpfs ramdisk 一起算——
#   204800 MiB = 200 GiB，加 ramdisk 200 GiB ≈ 430 GB，约占 tpu7x 主机内存四成多（06a §4）。
#   打开前确认 pod 里有 gke-gcsfuse-cache 卷（06-jobset.sh 生成的 JobSet 有，emptyDir Memory 不限大小）。
#   这几项组合在本书集群上没有实测，只有实测集群 PV 实况可参考（06a §4）。
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ${DATA_PV}
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 5Gi
  storageClassName: gcsfuse-static
  persistentVolumeReclaimPolicy: Retain      # 删 PV 不删桶里的数据
  volumeMode: Filesystem
  mountOptions:
  - implicit-dirs
  - client-protocol=grpc
  # ---- 06a §4 起步配置的其余几项（默认不开；打开前先核内存预算，见文件头）----
  # - metadata-cache:negative-ttl-secs:0
  # - metadata-cache:ttl-secs:-1             # 只读数据集可以；写目录改 0
  # - metadata-cache:stat-cache-max-size-mb:-1
  # - metadata-cache:type-cache-max-size-mb:-1
  # - file-cache:max-size-mb:204800          # 单位 MiB：200 GiB ≈ 215 GB 节点内存
  # - file-cache:enable-parallel-downloads:true
  claimRef:
    namespace: ${NS}
    name: ${DATA_PVC}
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: ${DATA_BUCKET}            # = 桶名
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${DATA_PVC}
  namespace: ${NS}
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gcsfuse-static
  volumeMode: Filesystem
  volumeName: ${DATA_PV}

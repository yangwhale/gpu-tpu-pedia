@keyframes tf { 0% { transform: translate(0px,0); opacity: 1 } 2% { transform: translate(0px,0); opacity: 1 } 7% { transform: translate(155px,0); opacity: 1 } 9% { transform: translate(155px,0); opacity: 1 } 14% { transform: translate(285px,0); opacity: 1 } 15% { transform: translate(285px,0); opacity: 1 } 20% { transform: translate(415px,0); opacity: 1 } 22% { transform: translate(415px,0); opacity: 1 } 27% { transform: translate(545px,0); opacity: 1 } 28% { transform: translate(545px,0); opacity: 1 } 33% { transform: translate(675px,0); opacity: 1 } 35% { transform: translate(675px,0); opacity: 1 } 40% { transform: translate(715px,0); opacity: 0 } 49% { transform: translate(715px,0); opacity: 0 } 100% { transform: translate(0px,0); opacity: 0 } }
@keyframes tb { 0% { opacity: 0 } 49% { transform: translate(0px,0); opacity: 0 } 50% { transform: translate(0px,0); opacity: 1 } 55% { transform: translate(0px,0); opacity: 1 } 57% { transform: translate(0px,0); opacity: 1 } 62% { transform: translate(-130px,0); opacity: 1 } 63% { transform: translate(-130px,0); opacity: 1 } 68% { transform: translate(-260px,0); opacity: 1 } 70% { transform: translate(-260px,0); opacity: 1 } 75% { transform: translate(-390px,0); opacity: 1 } 76% { transform: translate(-390px,0); opacity: 1 } 81% { transform: translate(-520px,0); opacity: 1 } 83% { transform: translate(-520px,0); opacity: 1 } 88% { transform: translate(-675px,0); opacity: 0 } 100% { transform: translate(-675px,0); opacity: 0 } }
.hl { animation: hl 11s infinite ease-in-out } .tf { animation: tf 11s infinite ease-in-out } .tb { animation: tb 11s infinite ease-in-out }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }

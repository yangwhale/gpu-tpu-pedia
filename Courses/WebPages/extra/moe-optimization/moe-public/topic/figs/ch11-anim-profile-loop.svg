<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="动图示意（顺序、第一步的 HLO 通信重排关、第三步的验收判据均为推断）：抓一份 cost profile 是一圈五步。① 用当前代码编 AOT 上卡跑，新模型第一份用 HLO 通信重排关的产物；② 在目标片数上抓 trace；③ 按 TPU plane 重导并验收；④ 把新 profile 作为 placement 的成本输入重新 AOT；⑤ 同源码只换 profile 比稳态步时中位数。迭代不单调，每份都留着能回退；模型、kernel、flag、片数任一变了就再转一圈。"><title>动图示意（顺序、第一步的 HLO 通信重排关、第三步的验收判据均为推断）：抓一份 cost profile 是一圈五步。① 用当前代码编 AOT 上卡跑，新模型第一份用 HLO 通信重排关的产物；② 在目标片数上抓 trace；③ 按 TPU plane 重导并验收；④ 把新 profile 作为 placement 的成本输入重新 AOT；⑤ 同源码只换 profile 比稳态步时中位数。迭代不单调，每份都留着能回退；模型、kernel、flag、片数任一变了就再转一圈。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><style>
.spin { transform-origin: 0px 0px; animation: spin 10s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg) } 85%,100% { transform: rotate(360deg) } }
.h0 { opacity: 1; animation: h0 10s ease-in-out infinite; }
.h1 { opacity: 0; animation: h1 10s ease-in-out infinite; }
.h2 { opacity: 0; animation: h2 10s ease-in-out infinite; }
.h3 { opacity: 0; animation: h3 10s ease-in-out infinite; }
.h4 { opacity: 0; animation: h4 10s ease-in-out infinite; }
@keyframes h0 { 0%,12% { opacity: 1 } 16%,82% { opacity: 0 } 86%,100% { opacity: 1 } }
@keyframes h1 { 0%,14% { opacity: 0 } 17%,29% { opacity: 1 } 33%,100% { opacity: 0 } }
@keyframes h2 { 0%,31% { opacity: 0 } 34%,46% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes h3 { 0%,48% { opacity: 0 } 51%,63% { opacity: 1 } 67%,100% { opacity: 0 } }
@keyframes h4 { 0%,65% { opacity: 0 } 68%,80% { opacity: 1 } 84%,100% { opacity: 0 } }
.keep { opacity: 0; animation: keep 10s ease-in-out infinite; }
@keyframes keep { 0%,66% { opacity: 0 } 70%,94% { opacity: 1 } 98%,100% { opacity: 0 } }
.again { opacity: 0; animation: again 10s ease-in-out infinite; }
@keyframes again { 0%,82% { opacity: 0 } 86%,97% { opacity: 1 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .keep, .again { opacity: 1 } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style><rect width="900" height="560" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">cost profile 不是一次性的：一圈五步，代码一变就再转一圈</text>
<text x="24.0" y="60.0" font-size="14" fill="#3c4043" text-anchor="start">示意；圆点走到哪一步，哪一步亮</text>

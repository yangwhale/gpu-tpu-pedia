<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：专家梯度最后两维按 8 行乘 128 列切 tile。左边 tile 数不是 6 的倍数，RS 不走 ND 策略；右边打开 padding 后 XLA 在后端内部补齐 tile，总数凑成 6 的倍数，走 ND 策略，这个 RS 降到约 80%。格数是示意，不对应真实形状。">

<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<text x="450.0" y="34.0" font-size="20" fill="#202124" text-anchor="middle" font-weight="bold">tile 数凑成 6 的倍数，RS 才走 ND 快路</text>
<text x="450.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="middle">N = ⌈R / 8⌉ × ⌈C / 128⌉，按编译后 HLO 的 layout 算。规则来自实验观察，未见公开文档。格数示意</text>
<text x="60.0" y="106.0" font-size="16" fill="#d93025" text-anchor="start" font-weight="bold">大号形状：tile 数不是 6 的倍数</text>

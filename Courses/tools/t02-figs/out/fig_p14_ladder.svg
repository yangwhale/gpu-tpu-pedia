<svg viewBox="0 0 1400 760" width="1400" height="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨平台对比的四个档次：比峰值、比 MFU、同模型两边各自调到最好、每美元每瓦，各自的代价与能证明的结论">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">该怎么比　—— <tspan font-weight="700" fill="#1e8e3e">一种比一种贵，也一种比一种说得上话</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#9aa0a6"/>
<text x="37" y="58" class="sm">不花钱</text>
<rect x="93.5" y="48" width="11" height="11" rx="2" fill="#f9ab00"/>
<text x="110.5" y="58" class="sm">一次实验</text>
<rect x="178.5" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="195.5" y="58" class="sm">数周量级</text>
<rect x="20" y="124" width="900" height="480" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="150" class="sec">四档比法　·　代价与结论必须一起读</text>
<text x="38" y="170" class="xs"><tspan fill="#9aa0a6">只看右边那一栏会以为该直接跳到第 ④ 档。</tspan><tspan font-weight="700" fill="#202124">但每往下一档，代价是跳着涨的 —— 大多数场合停在 ② 就够，只是必须承认它证明的是什么。</tspan></text>
<text x="60" y="214" class="lbl" fill="#5f6368">比法</text>
<text x="408" y="214" class="lbl" fill="#5f6368">代价（对数示意）</text>
<text x="586" y="214" class="lbl" fill="#5f6368">能证明什么 ／ 别忘了什么</text>
<line x1="38" y1="224" x2="902" y2="224" stroke="#dadce0" stroke-width="1.0"/>
<rect x="38" y="236" width="864" height="78" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="58" y="270" class="numb" fill="#202124">①</text>
<text x="92" y="264" class="xs" fill="#202124"><tspan font-weight="700" fill="#202124">比峰值</tspan></text>
<rect x="408" y="256" width="156" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="408" y="256" width="6.24" height="18" rx="3" fill="#eceff1" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="408" y="290" class="xs" fill="#202124" font-weight="600">零成本</text>
<text x="586" y="264" class="xs"><tspan font-weight="700" fill="#d93025">几乎什么都证明不了。</tspan></text>
<text x="586" y="280" class="xxs"><tspan fill="#9aa0a6">峰值只是分母，而且</tspan><tspan font-weight="700" fill="#202124">口径地雷全埋在这一层</tspan>：dense/sparse、哪个</text>
<text x="586" y="293" class="xxs"> SKU、per chip / per device。</text>
<rect x="38" y="322" width="864" height="78" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="58" y="356" class="numb" fill="#f9ab00">②</text>
<text x="92" y="350" class="xs" fill="#202124"><tspan font-weight="700" fill="#202124">比 MFU</tspan></text>
<rect x="408" y="342" width="156" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="408" y="342" width="24.96" height="18" rx="3" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.2"/>
<text x="408" y="376" class="xs" fill="#f9ab00" font-weight="600">两边各跑一次</text>
<text x="586" y="350" class="xs"><tspan font-weight="700" fill="#202124">这套软件栈把这块硬件用掉了多少。</tspan></text>
<text x="586" y="366" class="xxs"><tspan fill="#9aa0a6">分子分母都是选择（前两张图）。</tspan><tspan font-weight="700" fill="#d93025">而且 MFU 高不等于跑得快 —— </tspan></text>
<text x="586" y="379" class="xxs"><tspan font-weight="700" fill="#d93025">见右格。</tspan></text>
<rect x="38" y="408" width="864" height="78" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="58" y="442" class="numb" fill="#d93025">③</text>
<text x="92" y="436" class="xs" fill="#202124"><tspan font-weight="700" fill="#202124">同模型同规模，两边各自调到最好</tspan></text>
<rect x="408" y="428" width="156" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="408" y="428" width="96.72" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="408" y="462" class="xs" fill="#d93025" font-weight="600">数周 ＋ 两边的卡</text>
<text x="586" y="436" class="xs"><tspan font-weight="700" fill="#202124">最接近真话的一档。</tspan><tspan fill="#9aa0a6">⭐ 我们做的是这一档。</tspan></text>
<text x="586" y="452" class="xxs"><tspan fill="#9aa0a6">贵在</tspan><tspan font-weight="700" fill="#202124">两边都得有人会调</tspan>。<tspan font-weight="700" fill="#d93025">只调一边，比出来的是调参投入的差距。</tspan></text>
<rect x="38" y="494" width="864" height="78" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="58" y="528" class="numb" fill="#d93025">④</text>
<text x="92" y="522" class="xs" fill="#202124"><tspan font-weight="700" fill="#202124">每美元 / 每瓦</tspan></text>
<rect x="408" y="514" width="156" height="18" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="408" y="514" width="148.2" height="18" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
<text x="408" y="548" class="xs" fill="#d93025" font-weight="600">③ ＋ 两个新口径</text>
<text x="586" y="522" class="xs"><tspan font-weight="700" fill="#202124">采购真正要的那个答案。</tspan></text>
<text x="586" y="538" class="xxs"><tspan fill="#9aa0a6">价格是</tspan><tspan font-weight="700" fill="#202124">谈出来的</tspan>，不是牌价；功耗要问清<tspan font-weight="700" fill="#202124">是芯片、是整机、还是含</tspan></text>
<text x="586" y="551" class="xxs"><tspan font-weight="700" fill="#202124">冷却</tspan>。</text>
<rect x="932" y="124" width="448" height="480" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="950" y="150" class="sec">⚠️　MFU 高 ≠ 跑得快</text>
<text x="950" y="170" class="xs"><tspan fill="#9aa0a6">第 ② 档最常见的误用。不是经验之谈 —— 一条恒等式直接推出来的。</tspan></text>
<rect x="950" y="206" width="412" height="42" rx="8" fill="#fff" stroke="#202124" stroke-width="1.4"/>
<text x="1156.0" y="233" class="box" fill="#202124" text-anchor="middle">吞吐  =  MFU  ×  峰值</text>
<text x="950" y="272" class="lbl" fill="#5f6368">一个算例　·　槽长＝峰值，填充＝实际吞吐</text>
<text x="952" y="304" class="box" fill="#202124">卡 A</text>
<rect x="1016" y="288" width="134.0" height="24" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="1016" y="288" width="53.6" height="24" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="1024" y="305" class="num" fill="#1a73e8">400</text>
<text x="952" y="322" class="xxs" fill="#5f6368">峰值 1,000 · MFU 40%</text>
<text x="952" y="358" class="box" fill="#202124">卡 B</text>
<rect x="1016" y="342" width="268.0" height="24" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="1016" y="342" width="67.0" height="24" rx="4" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
<text x="1024" y="359" class="num" fill="#1e8e3e">500</text>
<text x="952" y="376" class="xxs" fill="#5f6368">峰值 2,000 · MFU 25%</text>
<rect x="950" y="396" width="412" height="40" rx="8" fill="#fff" stroke="#d93025" stroke-width="1.2"/>
<text x="964" y="414" class="xs"><tspan font-weight="700" fill="#202124">卡 B 的 MFU 低了 15 个点，却快 25%。</tspan></text>
<text x="950" y="456" class="xs"><tspan fill="#9aa0a6">MFU 回答的是「</tspan><tspan font-weight="700" fill="#202124">这套栈把手上这块硬件用满了没有</tspan>」——它是<tspan font-weight="700" fill="#202124">效率</tspan>指标，不是<tspan font-weight="700" fill="#202124">速度</tspan>指标。</text>
<text x="950" y="473" class="xs"><tspan font-weight="700" fill="#d93025">所以它适合</tspan><tspan font-weight="700" fill="#202124">纵向</tspan>比：同一块硬件，我这周比上周调好了多少。</text>
<text x="950" y="498" class="xs"><tspan font-weight="700" fill="#202124">横向比谁更快，只能看吞吐本身</tspan><tspan fill="#9aa0a6">—— 优先用 tokens/s 或「跑完一步几秒」，它们比</tspan></text>
<text x="950" y="515" class="xs"><tspan fill="#9aa0a6"> TFLOP/s 少一层公式（见上一张图的甲格）。</tspan></text>
<rect x="950" y="540" width="412" height="52" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.2"/>
<text x="964" y="560" class="xs"><tspan font-weight="700" fill="#202124">两个都报最省事</tspan>：<tspan fill="#9aa0a6">吞吐说明谁快，MFU 说明还剩多少没榨出来。</tspan></text>
<rect x="20" y="632" width="1360" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="660" class="sec">⭐ 第 ③ 档为什么贵：只调一边，比出来的是调参投入的差距</text>
<text x="38" y="686" class="xs"><tspan font-weight="700" fill="#202124">同一个模型、同一个规模，v7 上从 445 调到 666.6 TFLOP/s/chip —— +50%。</tspan><tspan fill="#9aa0a6">（这里面有 </tspan><tspan font-weight="700" fill="#202124">8.6% 是把频率档从默认锁到最高</tspan>换来的，属于硬件工作点不是调优，剥掉约 <tspan font-weight="700" fill="#202124">+38%</tspan>；起点另有一份文档记的是 457，那样算 <tspan font-weight="700" fill="#202124">+45.9%</tspan>。<tspan font-weight="700" fill="#202124">三个数都列出来，正是这一节在讲的事。</tspan>）</text>
<text x="38" y="705" class="xs"><tspan font-weight="700" fill="#d93025">这个幅度比很多「硬件对比」结论本身都大 —— 只调了一边的对比，读者看到的是「哪一边的人更熟」。</tspan><tspan font-weight="700" fill="#202124">⚠️ 而我们 GPU 侧的调优记录只到一次 7 组配置的 sweep（492 → 527，+7.1%）—— 所以下一节那组数，我们自己也只把它挂在 ③ 档的下沿。</tspan></text>
<text x="1380" y="748" class="xxs" fill="#9aa0a6" text-anchor="end">第 ③ 档的实测在下一节 · 代价条为对数示意，非测量值 · v7 与 GPU 侧调优幅度均取自本仓库的调优记录</text>
</svg>
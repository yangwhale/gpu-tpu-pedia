<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：关掉 host 归约并调大 shard，微基准带宽从 162 翻到 331 Gbps。右：训练时间线示意，开着 host 归约时 DCN 慢但藏在计算底下；关掉后 DCN 变快，却要多停下来同步，计算被打断，步时反而慢 10%。">

<rect width="900" height="360" fill="#fff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="bold" >关掉 host 归约：微基准带宽翻倍，训练反而慢 10%</text>
<text x="24.0" y="58.0" font-size="14" fill="#5f6368" text-anchor="start" >左：微基准只量「一次能运多少」；右：训练要的是「运的时候计算别停」（机理是假设，时间线示意）</text>
<rect x="24.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#1a73e8" stroke="none" stroke-width="1.5" />
<text x="44.0" y="83.0" font-size="13" fill="#202124" text-anchor="start" >计算</text>
<rect x="92.0" y="71.0" width="14.0" height="14.0" rx="3" fill="#e8710a" stroke="none" stroke-width="1.5" />
<text x="112.0" y="83.0" font-size="13" fill="#202124" text-anchor="start" >DCN 通信</text>
<rect x="191.2" y="71.0" width="14.0" height="14.0" rx="3" fill="#d93025" stroke="none" stroke-width="1.5" />
<text x="211.2" y="83.0" font-size="13" fill="#202124" text-anchor="start" >计算停下来等</text>
<text x="30.0" y="124.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >微基准带宽</text>
<text x="30.0" y="164.0" font-size="14" fill="#202124" text-anchor="start" >开（默认）</text>
<rect x="30.0" y="174.0" width="127.3" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5" />
<text x="149.3" y="194.0" font-size="14" fill="#202124" text-anchor="end" >162 Gbps</text>
<text x="30.0" y="234.0" font-size="14" fill="#202124" text-anchor="start" >关 + shard 16 MiB</text>
<rect x="30.0" y="244.0" width="260.0" height="28.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<text x="282.0" y="264.0" font-size="14" fill="#202124" text-anchor="end" >331 Gbps</text>
<text x="30.0" y="310.0" font-size="14" fill="#5f6368" text-anchor="start" >→ 看起来该关</text>
<line x1="330.0" y1="110.0" x2="330.0" y2="390.0" stroke="#dadce0" stroke-width="1" />
<text x="360.0" y="124.0" font-size="15" fill="#202124" text-anchor="start" font-weight="bold" >训练一步（示意）</text>
<text x="360.0" y="164.0" font-size="14" fill="#202124" text-anchor="start" >开（默认）</text>
<rect x="360.0" y="174.0" width="400.0" height="24.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="420.0" y="204.0" width="160.0" height="18.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<line x1="760.0" y1="168.0" x2="760.0" y2="230.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3" />
<text x="360.0" y="274.0" font-size="14" fill="#202124" text-anchor="start" >关 + shard 16 MiB</text>
<rect x="360.0" y="284.0" width="100.0" height="24.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="492.0" y="284.0" width="108.0" height="24.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="632.0" y="284.0" width="168.0" height="24.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<rect x="460.0" y="284.0" width="32.0" height="24.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="600.0" y="284.0" width="32.0" height="24.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
<rect x="408.0" y="314.0" width="52.0" height="18.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<rect x="548.0" y="314.0" width="52.0" height="18.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" />
<line x1="800.0" y1="278.0" x2="800.0" y2="340.0" stroke="#202124" stroke-width="1.5" stroke-dasharray="4 3" />
<text x="586.0" y="218.0" font-size="13" fill="#5f6368" text-anchor="start" >DCN 慢，但藏在计算底下</text>
<text x="638.0" y="328.0" font-size="13" fill="#5f6368" text-anchor="start" >DCN 快了，却要停下同步</text>
<text x="806.0" y="300.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold" >+10%</text>
</svg>

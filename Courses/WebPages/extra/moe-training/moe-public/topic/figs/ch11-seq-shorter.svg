<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" width="900" height="286" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="推断的机理：序列从 8K 变 4K：一层的计算随 token 数缩短，EP=1 下专家权重 all-gather 的字节与序列无关、长度不变，8K 时被计算盖住，4K 时多出的一截露在关键路径上。"><title>推断的机理：序列从 8K 变 4K：一层的计算随 token 数缩短，EP=1 下专家权重 all-gather 的字节与序列无关、长度不变，8K 时被计算盖住，4K 时多出的一截露在关键路径上。</title><defs><marker id="ar1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="are8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ard93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect width="900" height="286" fill="#fff"/><text x="24.0" y="36.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">序列变短：计算跟着 token 缩，权重 AG 不缩，盖不住的那截露出来</text>

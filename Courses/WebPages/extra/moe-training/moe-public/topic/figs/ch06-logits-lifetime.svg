<rect x="269.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#e8710a" />
<text x="297.0" y="85.0" font-size="14" fill="#202124">梯度 RS / AR</text>
<rect x="400.2" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="428.2" y="85.0" font-size="14" fill="#202124">暴露等待</text>
<rect x="506.2" y="73.0" width="22.0" height="13.0" rx="2" fill="#188038" />
<text x="534.2" y="85.0" font-size="14" fill="#202124">logits buffer 存活</text>
<text x="20.0" y="159.0" font-size="16" fill="#202124" font-weight="700">旧版</text>

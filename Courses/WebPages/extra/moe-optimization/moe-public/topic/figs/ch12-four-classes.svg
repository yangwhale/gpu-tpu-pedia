<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="四张卡片。A：GPU 落在数学定义上、TPU 偏开，TPU 真算错了，要修。B：TPU 落在定义上、GPU 偏开，GPU 偏离数学定义，要双方商量。C：有两种都合法的写法，两边各选一种，要选口径。D：GPU 自己重跑两次就散开得比门槛还宽，尺子本身不准，要先标定噪声。">
<title>对拍超门槛，「TPU 错了」只是四类之一：A 修、B 谈、C 选口径、D 先量尺子</title>
<defs><marker id="ar-5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ar-1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="ar-e8710a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker><marker id="ar-d93025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="ar-188038" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="ar-202124" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d93025" stroke-width="2"/></pattern><pattern id="hatchg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bdc1c6" stroke-width="2"/></pattern></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">对拍超门槛，「TPU 错了」只是四类之一：A 修、B 谈、C 选口径、D 先量尺子</text>
<text x="24" y="58" font-size="14" fill="#5f6368">示意：每张卡一条数轴，◆＝数学定义的结果；蓝点＝TPU，橙点＝GPU 参考</text>
<rect x="24.0" y="76.0" width="204.0" height="250.0" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
<rect x="24.0" y="76.0" width="204.0" height="4.0" rx="0" fill="#d93025"/>
<text x="38.0" y="102.0" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700">A 类　TPU 真算错了</text>
<line x1="44.0" y1="190.0" x2="208.0" y2="190.0" stroke="#5f6368" stroke-width="1.2"/>
<path d="M96.0,181 L103.0,190 L96.0,199 L89.0,190 Z" stroke="#202124" stroke-width="1.2" fill="#ffffff"/>
<text x="96.0" y="174.0" font-size="13" fill="#5f6368" text-anchor="middle">数学定义</text>
<circle cx="96.0" cy="190" r="6" fill="#e8710a"/>
<text x="96.0" y="220.0" font-size="13" fill="#b06000" text-anchor="middle">GPU</text>
<circle cx="176.0" cy="190" r="6" fill="#1a73e8"/>
<text x="176.0" y="220.0" font-size="13" fill="#174ea6" text-anchor="middle">TPU</text>
<text x="44.0" y="252.0" font-size="13" fill="#5f6368" text-anchor="start">TPU 偏离定义</text>
<text x="126.0" y="312.0" font-size="22" fill="#a50e0e" text-anchor="middle" font-weight="700">修</text>
<rect x="240.0" y="76.0" width="204.0" height="250.0" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
<rect x="240.0" y="76.0" width="204.0" height="4.0" rx="0" fill="#e8710a"/>
<text x="254.0" y="102.0" font-size="15" fill="#b06000" text-anchor="start" font-weight="700">B 类　GPU 偏离数学定义</text>
<line x1="260.0" y1="190.0" x2="424.0" y2="190.0" stroke="#5f6368" stroke-width="1.2"/>
<path d="M312.0,181 L319.0,190 L312.0,199 L305.0,190 Z" stroke="#202124" stroke-width="1.2" fill="#ffffff"/>
<text x="312.0" y="174.0" font-size="13" fill="#5f6368" text-anchor="middle">数学定义</text>
<circle cx="312.0" cy="190" r="6" fill="#1a73e8"/>
<text x="312.0" y="220.0" font-size="13" fill="#174ea6" text-anchor="middle">TPU</text>
<circle cx="392.0" cy="190" r="6" fill="#e8710a"/>
<text x="392.0" y="220.0" font-size="13" fill="#b06000" text-anchor="middle">GPU</text>
<text x="260.0" y="252.0" font-size="13" fill="#5f6368" text-anchor="start">TPU 是对的；</text>
<text x="260.0" y="272.0" font-size="13" fill="#5f6368" text-anchor="start">谁迁就谁要双方定</text>
<text x="342.0" y="312.0" font-size="22" fill="#b06000" text-anchor="middle" font-weight="700">谈</text>
<rect x="456.0" y="76.0" width="204.0" height="250.0" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
<rect x="456.0" y="76.0" width="204.0" height="4.0" rx="0" fill="#1a73e8"/>
<text x="470.0" y="102.0" font-size="15" fill="#174ea6" text-anchor="start" font-weight="700">C 类　两边写法不同</text>
<line x1="476.0" y1="190.0" x2="640.0" y2="190.0" stroke="#5f6368" stroke-width="1.2"/>
<path d="M513.0,181 L520.0,190 L513.0,199 L506.0,190 Z" stroke="#202124" stroke-width="1.2" fill="#ffffff"/>
<text x="513.0" y="174.0" font-size="13" fill="#5f6368" text-anchor="middle">写法 1</text>
<path d="M603.0,181 L610.0,190 L603.0,199 L596.0,190 Z" stroke="#202124" stroke-width="1.2" fill="#ffffff"/>
<text x="603.0" y="174.0" font-size="13" fill="#5f6368" text-anchor="middle">写法 2</text>
<circle cx="513.0" cy="190" r="6" fill="#1a73e8"/>
<text x="513.0" y="220.0" font-size="13" fill="#174ea6" text-anchor="middle">TPU</text>
<circle cx="603.0" cy="190" r="6" fill="#e8710a"/>
<text x="603.0" y="220.0" font-size="13" fill="#b06000" text-anchor="middle">GPU</text>
<text x="476.0" y="252.0" font-size="13" fill="#5f6368" text-anchor="start">两种都合法，</text>
<text x="476.0" y="272.0" font-size="13" fill="#5f6368" text-anchor="start">无所谓对错</text>
<text x="558.0" y="312.0" font-size="22" fill="#174ea6" text-anchor="middle" font-weight="700">选口径</text>
<rect x="672.0" y="76.0" width="204.0" height="250.0" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
<rect x="672.0" y="76.0" width="204.0" height="4.0" rx="0" fill="#188038"/>
<text x="686.0" y="102.0" font-size="15" fill="#0d652d" text-anchor="start" font-weight="700">D 类　尺子本身不准</text>
<line x1="692.0" y1="190.0" x2="856.0" y2="190.0" stroke="#5f6368" stroke-width="1.2"/>
<rect x="704.0" y="176.0" width="140.0" height="28.0" rx="3" fill="#feefe3"/>
<line x1="752.0" y1="168.0" x2="752.0" y2="212.0" stroke="#d93025" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="796.0" y1="168.0" x2="796.0" y2="212.0" stroke="#d93025" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="774.0" y="162.0" font-size="13" fill="#a50e0e" text-anchor="middle">门槛</text>
<circle cx="712.0" cy="190" r="6" fill="#e8710a"/>
<text x="712.0" y="220.0" font-size="13" fill="#b06000" text-anchor="middle">GPU 跑 1</text>
<circle cx="836.0" cy="190" r="6" fill="#e8710a"/>
<text x="836.0" y="220.0" font-size="13" fill="#b06000" text-anchor="middle">GPU 跑 2</text>
<text x="692.0" y="252.0" font-size="13" fill="#5f6368" text-anchor="start">参考自己重跑</text>
<text x="692.0" y="272.0" font-size="13" fill="#5f6368" text-anchor="start">就比门槛散得宽</text>
<text x="774.0" y="312.0" font-size="22" fill="#0d652d" text-anchor="middle" font-weight="700">先量</text>
<rect x="24.0" y="346.0" width="4.0" height="26.0" rx="0" fill="#d93025"/>
<text x="38.0" y="364.0" font-size="14" fill="#202124" text-anchor="start">不分类就动手：会把 B／C 当 bug 修，把 D 的噪声当信号追</text>
</svg>
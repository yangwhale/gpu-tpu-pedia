<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="左：旧路径先用一次转置拷贝读 W、写出一份 Wᵀ 到 HBM，再由 GMM 读 Wᵀ，多一读一写和一块权重大小的临时缓冲。右：GMM v2 直接读原来的 W，在 kernel 里换收缩轴。">
<title>反向 dX = dY·Wᵀ：旧路径先在 HBM 里转出一份 Wᵀ，v2 直接读 W、在核内换收缩轴</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fce8e6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="2"/></pattern>
</defs>

<rect width="900" height="260" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#202124">反向 dX = dY·Wᵀ：旧路径先在 HBM 里转出一份 Wᵀ，v2 直接读 W、在核内换收缩轴</text>
<text x="24" y="58" font-size="14" fill="#5f6368">数绿色箭头（HBM 读写）和红色虚框（多出来的临时缓冲）</text>
<text x="30" y="96" font-size="15" fill="#a50e0e" text-anchor="start" font-weight="700" >旧路径</text>
<rect x="40" y="120" width="70" height="50" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
<text x="75" y="151" font-size="15" fill="#0d652d" text-anchor="middle" font-weight="700" >W</text>
<line x1="112" y1="145" x2="148" y2="145" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="130" y="136" font-size="13" fill="#0d652d" text-anchor="middle" >读</text>
<rect x="150" y="120" width="90" height="50" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5" />
<text x="195" y="151" font-size="14" fill="#202124" text-anchor="middle" >转置拷贝</text>
<line x1="242" y1="145" x2="278" y2="145" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="260" y="136" font-size="13" fill="#0d652d" text-anchor="middle" >写</text>
<rect x="280" y="120" width="70" height="50" rx="6" fill="#e6f4ea" stroke="#d93025" stroke-width="2" stroke-dasharray="6 4"/>
<text x="315" y="151" font-size="15" fill="#0d652d" text-anchor="middle" font-weight="700" >Wᵀ</text>
<line x1="352" y1="145" x2="388" y2="145" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="370" y="136" font-size="13" fill="#0d652d" text-anchor="middle" >读</text>
<rect x="390" y="120" width="60" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="420" y="151" font-size="14" fill="#174ea6" text-anchor="middle" >GMM</text>
<text x="315" y="200" font-size="14" fill="#a50e0e" text-anchor="middle" >多一读一写</text>
<text x="315" y="222" font-size="14" fill="#a50e0e" text-anchor="middle" >外加一块权重大小的临时缓冲</text>
<line x1="470" y1="80" x2="470" y2="240" stroke="#dadce0" stroke-width="1"/>
<text x="500" y="96" font-size="15" fill="#0d652d" text-anchor="start" font-weight="700" >GMM v2</text>
<rect x="540" y="120" width="70" height="50" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
<text x="575" y="151" font-size="15" fill="#0d652d" text-anchor="middle" font-weight="700" >W</text>
<line x1="612" y1="145" x2="678" y2="145" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
<text x="645" y="136" font-size="13" fill="#0d652d" text-anchor="middle" >读</text>
<rect x="680" y="120" width="170" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="765" y="142" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="700" >GMM v2</text>
<text x="765" y="162" font-size="13" fill="#174ea6" text-anchor="middle" >核内换收缩轴</text>
<text x="695" y="210" font-size="14" fill="#0d652d" text-anchor="middle" >只读一遍 W，不落中间副本</text>
</svg>
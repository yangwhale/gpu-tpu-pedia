<svg viewBox="0 0 1400 902" width="1400" height="902" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NVL72 域层级示意，以及两个容易读错的口径：72 张是物理规模而可训练是 64 张，节点合计 2000 Gbps 含 400 Gbps 管理网">
<defs><style>
.ttl{font:700 18px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sec{font:700 15px "Noto Sans CJK SC",sans-serif;fill:#202124}
.box{font:700 13px "Noto Sans CJK SC",sans-serif;fill:#202124}
.lbl{font:600 12px "Noto Sans CJK SC",sans-serif;fill:#202124}
.sm{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xs{font:400 11px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.xxs{font:400 10px "Noto Sans CJK SC",sans-serif;fill:#5f6368}
.num{font:700 12px "Roboto Mono",monospace}
.numb{font:700 14px "Roboto Mono",monospace}
.mono{font:400 11px "Roboto Mono",monospace;fill:#5f6368}
</style>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/></marker>
<marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d93025"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e8e3e"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8430ce"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f6368"/></marker>
</defs>
<text x="20" y="26" class="ttl">NVL72 把「一台机器」这个词废掉了　—— 顺便埋了<tspan font-weight="700" fill="#d93025">两个口径陷阱</tspan></text>
<rect x="20" y="48" width="11" height="11" rx="2" fill="#1a73e8"/>
<text x="37" y="58" class="sm">新的边界：NVL72 域</text>
<rect x="165.95" y="48" width="11" height="11" rx="2" fill="#1e8e3e"/>
<text x="182.95" y="58" class="sm">旧的边界：一个节点</text>
<rect x="308.45" y="48" width="11" height="11" rx="2" fill="#d93025"/>
<text x="325.45" y="58" class="sm">读错了就会一路错下去的地方</text>
<rect x="20" y="124" width="1360" height="276" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.2"/>
<text x="38" y="151" class="sec">先把边界摆对　—— 上一代的常识（机内 8 卡、出机器掉网络）在这一代已经不成立</text>
<rect x="38" y="168" width="1324" height="216" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.3"/>
<text x="52" y="193" class="lbl" fill="#202124">跨域　·　RoCE / RDMA</text>
<text x="398" y="193" class="xs">出了这个域才掉到网络。实测 all-reduce <tspan font-weight="700" fill="#202124">约 840 → 约 325 GB/s</tspan>（<tspan font-weight="700" fill="#202124">2.6 倍</tspan>，本仓库 gpu/a4x/04-nccl-test），<tspan font-weight="700" fill="#202124">而且通信库要换一条实现路径</tspan>。</text>
<rect x="64" y="210" width="1272" height="160" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.3"/>
<text x="78" y="235" class="lbl" fill="#202124">NVL72 域　·　18 节点 ＝ 72 GPU，NVSwitch 5 全互联</text>
<text x="398" y="235" class="xs"><tspan font-weight="700" fill="#d93025">新的边界在这里。</tspan>域内任意两张卡之间都是 NVLink，<tspan font-weight="700" fill="#202124">不是网络</tspan>。</text>
<rect x="90" y="252" width="1220" height="104" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.3"/>
<text x="104" y="277" class="lbl" fill="#202124">节点　·　2 × Grace ARM64 ＋ 4 × Blackwell GPU</text>
<text x="398" y="277" class="xs"><tspan fill="#9aa0a6">「一台机器」原来的边界 —— 现在这条线基本不重要了。</tspan></text>
<rect x="116" y="294" width="1168" height="48" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.3"/>
<text x="130" y="319" class="lbl" fill="#202124">一张 B200</text>
<rect x="20" y="446" width="670" height="268" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="38" y="472" class="sec">陷阱一　·　物理规模 ≠ 可用规模</text>
<text x="38" y="492" class="xs"><tspan fill="#9aa0a6">跟第 0 节里 192 / 96 / 94.74 那三层是同一种病</tspan></text>
<rect x="38" y="506" width="634" height="38" rx="6" fill="#f1f3f4"/>
<text x="52" y="530" class="lbl" fill="#202124">问题</text>
<text x="236" y="530" class="xs">「一个 NVL72 域有多少显存？」</text>
<rect x="38" y="546" width="634" height="38" rx="6" fill="#fff"/>
<text x="52" y="570" class="lbl" fill="#202124">按 72 卡（物理规模）</text>
<text x="236" y="570" class="xs"><tspan font-weight="700" fill="#202124">13.4 TB</tspan>　—— 这个数<tspan font-weight="700" fill="#d93025">不能拿去规划任务</tspan></text>
<rect x="38" y="586" width="634" height="38" rx="6" fill="#fff"/>
<text x="52" y="610" class="lbl" fill="#202124">按 64 卡（我们的编排口径）</text>
<text x="236" y="610" class="xs"><tspan font-weight="700" fill="#202124">11.9 TB</tspan>　—— 16 节点上阵，<tspan font-weight="700" fill="#202124">2 节点 8 卡做热备</tspan></text>
<rect x="38" y="626" width="634" height="38" rx="6" fill="#fff"/>
<text x="52" y="650" class="lbl" fill="#202124">为什么让出 8 卡</text>
<text x="236" y="650" class="xs">这批集群 <tspan font-weight="700" fill="#202124">auto-repair 是关的</tspan>，坏一台要靠换标签顶上</text>
<rect x="38" y="666" width="634" height="38" rx="6" fill="#fff"/>
<text x="52" y="690" class="lbl" fill="#202124">⚠️ 所以 64 不是平台限制</text>
<text x="236" y="690" class="xs">是<tspan font-weight="700" fill="#202124">我们自愿让出 11% 容量</tspan>换稳定 —— <tspan font-weight="700" fill="#d93025">换个人运维就是别的数</tspan></text>
<rect x="710" y="446" width="670" height="268" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.4"/>
<text x="728" y="472" class="sec">陷阱二　·　合计里混进了不该算的东西</text>
<text x="728" y="492" class="xs"><tspan fill="#9aa0a6">跟第 0 节里 GiB 和 GB 混用是同一类错</tspan></text>
<rect x="728" y="506" width="634" height="38" rx="6" fill="#f1f3f4"/>
<text x="742" y="530" class="lbl" fill="#202124">问题</text>
<text x="926" y="530" class="xs">「一个节点的网络带宽是多少？」</text>
<rect x="728" y="546" width="634" height="38" rx="6" fill="#fff"/>
<text x="742" y="570" class="lbl" fill="#202124">RDMA（GPU 跨域通信）</text>
<text x="926" y="570" class="xs">CX-7 × 4 × 400 Gbps ＝ <tspan font-weight="700" fill="#202124">1,600 Gbps</tspan>　←　<tspan font-weight="700" fill="#202124">算 all-to-all 用这个</tspan></text>
<rect x="728" y="586" width="634" height="38" rx="6" fill="#fff"/>
<text x="742" y="610" class="lbl" fill="#202124">管理网</text>
<text x="926" y="610" class="xs">GVNIC　<tspan font-weight="700" fill="#202124">400 Gbps</tspan>　—— 跟 GPU 通信没关系</text>
<rect x="728" y="626" width="634" height="38" rx="6" fill="#fff"/>
<text x="742" y="650" class="lbl" fill="#202124">常见的报法</text>
<text x="926" y="650" class="xs"><tspan font-weight="700" fill="#d93025">「节点合计 2,000 Gbps」</tspan>　—— 它把管理网算进来了</text>
<rect x="20" y="744" width="1360" height="142" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
<text x="38" y="772" class="sec">拿这个数回头看专题一 —— 「域」才是新的「一台机器」</text>
<text x="38" y="798" class="xs">专题一算过：那个模型常驻权重 <tspan font-weight="700" fill="#202124">1.23 TiB ＝ 约 1.35 TB</tspan>（<tspan fill="#9aa0a6">这一步换算别省 —— 这张图刚说完 GiB / GB 不能混，自己更不能踩</tspan>）。一个域按 64 卡算有 <tspan font-weight="700" fill="#202124">11.9 TB</tspan>，权重只占约 <tspan font-weight="700" fill="#202124">11%</tspan> —— <tspan font-weight="700" fill="#202124">余量足够再放下相当规模的 KV cache</tspan>（具体多少取决于并发与序列长度，本节不</text>
<text x="38" y="817" class="xs">展开）。</text>
<text x="38" y="840" class="xs">也就是说，对这一档模型，<tspan font-weight="700" fill="#d93025">「跨域断崖」这件事在推理时根本不必发生</tspan>。<tspan font-weight="700" fill="#202124">但这个结论踩在两个前提上，两个都得说出来</tspan>：一是<tspan font-weight="700" fill="#202124">按 64 不是 72</tspan>；二是 <tspan font-weight="700" fill="#d93025">11.9 TB 本身也还是物理量</tspan> —— 实际可用还要扣激活、优化器状态与框架开销。<tspan font-weight="700" fill="#202124">左边那格批评的病，这句话同样要防。</tspan></text>
</svg>
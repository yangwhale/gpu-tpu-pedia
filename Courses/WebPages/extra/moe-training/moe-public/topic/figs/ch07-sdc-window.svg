<rect x="631.0" y="211.0" width="18.0" height="18.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<rect x="751.0" y="211.0" width="18.0" height="18.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>

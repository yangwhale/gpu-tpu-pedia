<style id="figonly-css">

.figbar{position:fixed;right:76px;bottom:22px;z-index:99;display:flex;gap:8px;
  align-items:center;font:600 14px/1.4 system-ui,-apple-system,"Source Sans 3","Noto Sans CJK SC",sans-serif}
.figbar button{cursor:pointer;border:1px solid #dadce0;background:#fff;color:#1a73e8;
  border-radius:999px;padding:9px 16px;box-shadow:0 2px 10px rgba(0,0,0,.14);
  font:inherit;white-space:nowrap}
.figbar button:hover{background:#f8f9fa}
.figbar .hint{color:#80868b;font-weight:400;background:#fff;border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.10);white-space:nowrap;
  max-width:0;padding:6px 0;opacity:0;overflow:hidden;
  transition:max-width .22s ease,opacity .18s,padding .22s ease}
.figbar:hover .hint,.figbar:focus-within .hint{max-width:280px;padding:6px 12px;opacity:1}

@media (max-width:720px){.figbar{right:70px;bottom:18px}
  .figbar .hint{display:none}
  .figbar button{padding:6px 11px;font-size:12px;opacity:.88}}
body.figonly section p:not(.lead):not(.landing),
body.figonly section ul,
body.figonly section ol,
body.figonly section pre,
body.figonly section .note{display:none}

body.figonly section figure p{display:revert}

body.figonly .guess p{display:revert}
body.figonly section .guess p:not(.lead):not(.landing){display:revert}
body.figonly .guess .rev .grid{clear:both}

body.figonly section .card p:not(.lead):not(.landing){display:revert}
body.figonly .toc ol{display:grid}
body.figonly .toc ul{display:revert}
body.figonly .fo-empty{display:none}
body.figonly section p.tbl-note:not(.lead):not(.landing){display:revert}

body.figonly section blockquote{display:none}


body.figonly figcaption{display:none}
body.figonly section h3:not(.guess h3){margin-top:34px}
</style>
@@SPLIT@@
<div class="figbar">
  <span class="hint" id="figonly-hint"></span>
  <button id="figonly-btn" type="button"></button>
</div>
<script>
(function(){
  var KEY = "figonly:" + location.pathname.split("/").pop();
  var btn  = document.getElementById("figonly-btn");
  var hint = document.getElementById("figonly-hint");
  var n = document.querySelectorAll(
      "section p:not(.lead):not(.landing), section ul, section ol, "
    + "section pre, section .note, section blockquote, "
    + "figcaption .capmore").length;
  function set(on){
    document.body.classList.toggle("figonly", on);
    btn.textContent = on ? "Show narration" : "Hide narration";
    btn.title = on ? (n + " paragraphs hidden; press T to toggle")
                   : ("All narration shown; press T to hide");
    hint.textContent = on ? (n + " hidden · press T") : ("All shown · press T");
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch(e){}
    // 折叠后只剩光杆的小标题（下面到下一个标题之间全被藏了）也一并藏起来
    document.querySelectorAll("section h4").forEach(function(h){
      h.classList.remove("fo-empty"); if (!on || h.closest(".guess")) return;
      var el = h.nextElementSibling, vis = false;
      while (el && !/^H[2-4]$/.test(el.tagName)) {
        if (el.getClientRects().length && el.getBoundingClientRect().height > 0) { vis = true; break; }
        el = el.nextElementSibling;
      }
      if (!vis) h.classList.add("fo-empty");
    });
    // 折叠后展开块里什么都不剩（正文全被藏了）：整颗藏掉，免得点开是空的
    // 由内向外查：内层空块先藏掉，外层才能看出自己也空了
    var dl = Array.prototype.slice.call(document.querySelectorAll("section details"));
    dl.forEach(function(d){ d.classList.remove("fo-empty"); });
    dl.reverse().forEach(function(d){
      if (!on) return;
      var was = d.open; d.open = true; var vis = false;
      for (var c = d.firstElementChild; c; c = c.nextElementSibling) {
        if (c.tagName === "SUMMARY") continue;
        if (!c.getClientRects().length) continue;
        if ((c.innerText || "").trim().length || c.querySelector("svg,img,video,canvas") || /^(SVG|IMG|VIDEO|CANVAS|FIGURE)$/i.test(c.tagName)) { vis = true; break; }
      }
      d.open = was; if (!vis) d.classList.add("fo-empty");
    });
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  set(saved === null ? true : saved === "1");
  btn.addEventListener("click", function(){ set(!document.body.classList.contains("figonly")); });
  document.addEventListener("keydown", function(e){
    if (e.key === "t" || e.key === "T"){
      if (/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||"")) return;
      set(!document.body.classList.contains("figonly"));
    }
  });
})();
</script>

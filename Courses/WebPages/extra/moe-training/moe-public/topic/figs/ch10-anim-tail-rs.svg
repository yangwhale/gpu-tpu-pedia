<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 281" width="900" height="281" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意动图：反向搜索区由相邻两个 stage 拼成，尾部的 reduce-scatter 上方没有计算可盖，露出红色等待，后面紧跟一个短的独立循环。动画中后继循环的几次迭代被局部展开、挪到 RS 底下，红色等待缩到几乎为零，后面的计算整体提前。">
<title>示意动图：反向搜索区由相邻两个 stage 拼成，尾部的 reduce-scatter 上方没有计算可盖，露出红色等待，后面紧跟一个短的独立循环。动画中后继循环的几次迭代被局部展开、挪到 RS 底下，红色等待缩到几乎为零，后面的计算整体提前。</title>
<defs><style>@keyframes k1{0.000%{opacity:1} 30.000%{opacity:1} 60.000%{opacity:0} 100.000%{opacity:0}}
.wait{animation:k1 10.0s linear infinite;}
@keyframes k2{0.000%{transform:translate(0px,0px)} 30.000%{transform:translate(0px,0px)} 60.000%{transform:translate(-100.0px,0px)} 100.000%{transform:translate(-100.0px,0px)}}
.it0{animation:k2 10.0s linear infinite;}
@keyframes k3{0.000%{transform:translate(0px,0px)} 30.000%{transform:translate(0px,0px)} 60.000%{transform:translate(-100.0px,0px)} 100.000%{transform:translate(-100.0px,0px)}}
.it1{animation:k3 10.0s linear infinite;}
@keyframes k4{0.000%{transform:translate(0px,0px)} 30.000%{transform:translate(0px,0px)} 60.000%{transform:translate(-100.0px,0px)} 100.000%{transform:translate(-100.0px,0px)}}
.it2{animation:k4 10.0s linear infinite;}
@keyframes k5{0.000%{transform:translate(0px,0px)} 30.000%{transform:translate(0px,0px)} 60.000%{transform:translate(-100.0px,0px)} 100.000%{transform:translate(-100.0px,0px)}}
.rest{animation:k5 10.0s linear infinite;}
@keyframes k6{0.000%{transform:translate(0px,0px)} 30.000%{transform:translate(0px,0px)} 60.000%{transform:translate(-100.0px,0px)} 100.000%{transform:translate(-100.0px,0px)}}
.endm{animation:k6 10.0s linear infinite;}
@keyframes k7{0.000%{opacity:1} 30.000%{opacity:1} 35.000%{opacity:0} 100.000%{opacity:0}}
.lab{animation:k7 10.0s linear infinite;}
@media (prefers-reduced-motion: reduce) { * { animation: none !important } .wait{opacity:0} .it0{transform:translate(-100.0px,0px)} .it1{transform:translate(-100.0px,0px)} .it2{transform:translate(-100.0px,0px)} .rest{transform:translate(-100.0px,0px)} .endm{transform:translate(-100.0px,0px)} .lab{opacity:0} }</style></defs>
<rect x="0" y="0" width="900" height="281" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">把后继短循环展开几圈塞到尾部 RS 底下：那段暴露等待几乎归零</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意，无刻度，只画局部：结束线前移不代表整步快这么多</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">搜索区计算</text>
<rect x="140.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#5f6368" />
<text x="168.0" y="85.0" font-size="14" fill="#202124">后继短循环迭代</text>
<rect x="288.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#e8710a" />
<text x="316.0" y="85.0" font-size="14" fill="#202124">尾部 RS</text>
<rect x="386.4" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="414.4" y="85.0" font-size="14" fill="#202124">暴露等待</text>
<text x="150.0" y="177.0" font-size="13" fill="#5f6368" text-anchor="end">计算</text>
<text x="150.0" y="219.0" font-size="13" fill="#5f6368" text-anchor="end">通信</text>
<rect x="156.0" y="131.0" width="372.7" height="106.0" rx="3" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 4" />
<text x="160.0" y="125.0" font-size="13" fill="#5f6368">反向搜索区（相邻两个 stage）</text>
<g>
<rect x="160.0" y="159.0" width="198.0" height="28.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="259.0" y="177.7" font-size="13" fill="#202124" text-anchor="middle">stage A</text>
</g>
<g>
<rect x="360.0" y="159.0" width="164.7" height="28.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="442.3" y="177.7" font-size="13" fill="#202124" text-anchor="middle">stage B</text>
</g>
<g>
<rect x="526.7" y="203.0" width="98.0" height="24.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="575.7" y="219.7" font-size="13" fill="#202124" text-anchor="middle">尾部 RS</text>
</g>
<g class="wait">
<rect x="526.7" y="159.0" width="98.0" height="28.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" />
<text x="575.7" y="177.7" font-size="13" fill="#202124" text-anchor="middle">等</text>
</g>
<g class="it0">
<rect x="626.7" y="159.0" width="30.3" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="641.8" y="177.7" font-size="13" fill="#202124" text-anchor="middle">i1</text>
</g>
<g class="it1">
<rect x="660.0" y="159.0" width="30.3" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="675.2" y="177.7" font-size="13" fill="#202124" text-anchor="middle">i2</text>
</g>
<g class="it2">
<rect x="693.3" y="159.0" width="30.3" height="28.0" rx="3" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" />
<text x="708.5" y="177.7" font-size="13" fill="#202124" text-anchor="middle">i3</text>
</g>
<g class="rest">
<rect x="726.7" y="159.0" width="98.0" height="28.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="775.7" y="177.7" font-size="13" fill="#202124" text-anchor="middle">后面的计算</text>
</g>
<g class="endm">
<line x1="826.7" y1="149.0" x2="826.7" y2="237.0" stroke="#202124" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="830.7" y="147.0" font-size="13" fill="#202124">结束</text>
</g>
<g class="lab">
<text x="676.7" y="261.0" font-size="13" fill="#5f6368" text-anchor="middle">后继短循环（展开前在 RS 之后才跑）</text>
</g>
</svg>

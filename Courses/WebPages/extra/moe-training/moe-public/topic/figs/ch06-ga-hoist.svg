<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 479" width="900" height="479" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：GA 大于 1 时 XLA 的两次外提。左：专家权重 AG 每个微批都一样，被循环不变量外提挪到 GA 循环外，整份权重在整个循环里常驻；修法是用 optimization_barrier 给权重加对循环变量的假依赖。右：dW 的 RS 被挪到累加之后，GA 循环里累加的梯度 carry 从分片变成整份；修法是在 RS 之后插 barrier。">
<title>示意图：GA 大于 1 时 XLA 的两次外提。左：专家权重 AG 每个微批都一样，被循环不变量外提挪到 GA 循环外，整份权重在整个循环里常驻；修法是用 optimization_barrier 给权重加对循环变量的假依赖。右：dW 的 RS 被挪到累加之后，GA 循环里累加的梯度 carry 从分片变成整份；修法是在 RS 之后插 barrier。</title>
<defs><marker id="ar5f6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><style></style></defs>
<rect x="0" y="0" width="900" height="479" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">GA > 1 时 XLA 会把「每个微批都一样」的活挪出循环，挪出去的 buffer 就整份常驻</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意。左右两半是同一个问题的前向侧和梯度侧；上排是编译器想做的，下排是加了屏障之后</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">计算</text>
<rect x="98.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#e8710a" />
<text x="126.0" y="85.0" font-size="14" fill="#202124">集合通信</text>
<rect x="204.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#188038" />
<text x="232.0" y="85.0" font-size="14" fill="#202124">常驻 / carry</text>
<rect x="339.1" y="73.0" width="22.0" height="13.0" rx="2" fill="#d93025" />
<text x="367.1" y="85.0" font-size="14" fill="#202124">多出来的整份</text>
<text x="20.0" y="125.0" font-size="15" fill="#202124" font-weight="700">前向侧：权重 AG 被外提</text>
<text x="20.0" y="163.0" font-size="14" fill="#d93025" font-weight="700">XLA 外提后</text>
<g>
<rect x="20.0" y="193.0" width="100.0" height="30.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="70.0" y="212.7" font-size="13" fill="#202124" text-anchor="middle">AG 权重</text>
</g>
<line x1="120.0" y1="208.0" x2="146.0" y2="208.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ar5f6368)"/>
<rect x="148.0" y="173.0" width="280.0" height="70.0" rx="6" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 3" />
<text x="156.0" y="191.0" font-size="13" fill="#5f6368">GA 循环 × 微批</text>
<g>
<rect x="170.0" y="197.0" width="110.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="225.0" y="216.7" font-size="13" fill="#202124" text-anchor="middle">GMM 微批 1</text>
</g>
<g>
<rect x="290.0" y="197.0" width="110.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="345.0" y="216.7" font-size="13" fill="#202124" text-anchor="middle">GMM 微批 2</text>
</g>
<g>
<rect x="20.0" y="253.0" width="408.0" height="26.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" />
<text x="224.0" y="270.7" font-size="13" fill="#202124" text-anchor="middle">整份 AG 后的权重：整个循环常驻</text>
</g>
<text x="20.0" y="328.0" font-size="14" fill="#188038" font-weight="700">加 optimization_barrier</text>
<rect x="20.0" y="338.0" width="408.0" height="70.0" rx="6" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 3" />
<text x="28.0" y="356.0" font-size="13" fill="#5f6368">GA 循环 × 微批（权重带一个对循环变量的假依赖）</text>
<g>
<rect x="36.0" y="362.0" width="80.0" height="30.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="76.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">AG</text>
</g>
<g>
<rect x="120.0" y="362.0" width="100.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="170.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">GMM</text>
</g>
<g>
<rect x="236.0" y="362.0" width="80.0" height="30.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="276.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">AG</text>
</g>
<g>
<rect x="320.0" y="362.0" width="100.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="370.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">GMM</text>
</g>
<g>
<rect x="36.0" y="418.0" width="184.0" height="26.0" rx="3" fill="#e6f4ea" stroke="#188038" stroke-width="1.2" />
<text x="128.0" y="435.7" font-size="13" fill="#202124" text-anchor="middle">用完即放</text>
</g>
<g>
<rect x="236.0" y="418.0" width="184.0" height="26.0" rx="3" fill="#e6f4ea" stroke="#188038" stroke-width="1.2" />
<text x="328.0" y="435.7" font-size="13" fill="#202124" text-anchor="middle">用完即放</text>
</g>
<text x="465.0" y="125.0" font-size="15" fill="#202124" font-weight="700">梯度侧：dW 的 RS 被挪出累加</text>
<text x="465.0" y="163.0" font-size="14" fill="#d93025" font-weight="700">XLA 外提后</text>
<rect x="465.0" y="173.0" width="300.0" height="70.0" rx="6" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 3" />
<text x="473.0" y="191.0" font-size="13" fill="#5f6368">GA 循环 × 微批</text>
<g>
<rect x="481.0" y="197.0" width="90.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="526.0" y="216.7" font-size="13" fill="#202124" text-anchor="middle">dW</text>
</g>
<line x1="571.0" y1="212.0" x2="595.0" y2="212.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ar5f6368)"/>
<g>
<rect x="597.0" y="197.0" width="150.0" height="30.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.2" />
<text x="672.0" y="216.7" font-size="13" fill="#202124" text-anchor="middle">累加（整份 carry）</text>
</g>
<line x1="765.0" y1="208.0" x2="787.0" y2="208.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ar5f6368)"/>
<g>
<rect x="789.0" y="193.0" width="90.0" height="30.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="834.0" y="212.7" font-size="13" fill="#202124" text-anchor="middle">RS</text>
</g>
<text x="465.0" y="271.0" font-size="13" fill="#5f6368">线性：先 RS 再加 ＝ 先加再 RS，编译器选了后者</text>
<text x="465.0" y="328.0" font-size="14" fill="#188038" font-weight="700">加 optimization_barrier</text>
<rect x="465.0" y="338.0" width="414.0" height="70.0" rx="6" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 3" />
<text x="473.0" y="356.0" font-size="13" fill="#5f6368">GA 循环 × 微批</text>
<g>
<rect x="481.0" y="362.0" width="80.0" height="30.0" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" />
<text x="521.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">dW</text>
</g>
<g>
<rect x="569.0" y="362.0" width="70.0" height="30.0" rx="3" fill="#fef0e1" stroke="#e8710a" stroke-width="1.2" />
<text x="604.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">RS</text>
</g>
<rect x="645.0" y="358.0" width="6.0" height="40.0" rx="1" fill="#202124" />
<text x="657.0" y="355.0" font-size="13" fill="#202124">barrier</text>
<g>
<rect x="661.0" y="362.0" width="200.0" height="30.0" rx="3" fill="#e6f4ea" stroke="#188038" stroke-width="1.2" />
<text x="761.0" y="381.7" font-size="13" fill="#202124" text-anchor="middle">累加（分片 carry）</text>
</g>
<text x="465.0" y="436.0" font-size="13" fill="#5f6368">RS 搬不动，carry 保持分片</text>
<line x1="452.0" y1="113.0" x2="452.0" y2="467.0" stroke="#dadce0" stroke-width="1"/>
</svg>

ill="#d93025" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>约 6 min，10+ 片 4x8x8，有片重试</title><circle cx="386.8" cy="174.5" r="5.5" fill="#d93025" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>约 3 min，10+ 片 4x8x8，有片重试</title><circle cx="390.0" cy="220.3" r="5.5" fill="#d93025" stroke="#fff" stroke-width="1.2"/></g><text x="402.8" y="237.7" font-size="13.5" fill="#202124">中位约 3 min</text><g class="pt" tabindex="0"><title>4x4x4：56 s</title><circle cx="572.4" cy="312.0" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4x4x4：26 s</title><circle cx="575.7" cy="367.9" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4x4x8：44 s</title><circle cx="554.4" cy="329.6" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4x4x8：41 s</title><circle cx="569.5" cy="334.7" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4x8x8：63 s</title><circle cx="575.6" cy="303.4" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>2×4x4x4：52 s</title><circle cx="567.9" cy="317.4" r="5.5" fill="#188038" stroke="#fff" stroke-width="1.2"/></g><text x="591.2" y="328.3" font-size="13.5" fill="#202124">中位 48 s</text><g class="pt" tabindex="0"><title>4x4x4：163 s</title><circle cx="752.7" cy="234.2" r="5.5" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>4x4x8：172 s</title><circle cx="739.4" cy="230.3" r="5.5" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><g class="pt" tabindex="0"><title>8x8x8：161 s</title><circle cx="751.4" cy="235.1" r="5.5" fill="#e8710a" stroke="#fff" stroke-width="1.2"/></g><text x="783.8" y="239.2" font-size="13.5" fill="#202124">中位 163 s</text></svg>
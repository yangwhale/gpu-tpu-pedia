<text x="198.2" y="83.0" font-size="13" fill="#202124" text-anchor="start" >片内少等</text>
<rect x="272.2" y="71.0" width="14.0" height="14.0" rx="3" fill="#5f6368" stroke="none" stroke-width="1.5" />
<text x="292.2" y="83.0" font-size="13" fill="#202124" text-anchor="start" >净变化</text>
<line x1="90.0" y1="330.0" x2="820.0" y2="330.0" stroke="#5f6368" stroke-width="1.5" />
<text x="84.0" y="335.0" font-size="13" fill="#5f6368" text-anchor="end" >1 片</text>
<rect x="150.0" y="258.0" width="110.0" height="72.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
<text x="205.0" y="250.0" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold" >约 +4%</text>
<text x="205.0" y="352.0" font-size="14" fill="#202124" text-anchor="middle" >多算</text>
<line x1="260.0" y1="258.0" x2="300.0" y2="258.0" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 3" />

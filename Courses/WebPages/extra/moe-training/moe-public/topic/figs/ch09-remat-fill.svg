<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="两行示意时间轴，都是反向同一层的 MoE 部分，都多做了一段重算。阶梯里 placement 已关，AG 要等重算完才发，重算把 AG 往后推，TensorCore 在 gmm 前多等一截，本层变长。knockout 基线里 AG 跟着提前，在重算之前就发出去了，重算正好填进原本空等 AG 的那截，本层净增约为零。">
<title>两行示意时间轴，都是反向同一层的 MoE 部分，都多做了一段重算。阶梯里 placement 已关，AG 要等重算完才发，重算把 AG 往后推，TensorCore 在 gmm 前多等一截，本层变长。knockout 基线里 AG 跟着提前，在重算之前就发出去了，重算正好填进原本空等 AG 的那截，本层净增约为零。</title>

<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#5f6368"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#d93025"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#188038"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1a73e8"/></marker></defs>
<rect width="960" height="350" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700">同样多的重算：AG 被推后就变成步时，AG 先发出去就只是填空</text>
<text x="24.0" y="60.0" font-size="14" fill="#5f6368" text-anchor="start">示意：反向同一层的 MoE 部分；两行都多了一段重算。</text>
<rect x="24.0" y="74.0" width="16.0" height="14.0" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="46.0" y="86.0" font-size="14" fill="#202124" text-anchor="start">TC 计算</text>
<rect x="124.4" y="74.0" width="16.0" height="14.0" rx="2" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="146.4" y="86.0" font-size="14" fill="#202124" text-anchor="start">多出的重算</text>
<rect x="242.4" y="74.0" width="16.0" height="14.0" rx="2" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="264.4" y="86.0" font-size="14" fill="#202124" text-anchor="start">TC 干等 AG</text>
<rect x="367.1" y="74.0" width="16.0" height="14.0" rx="2" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
<text x="389.1" y="86.0" font-size="14" fill="#202124" text-anchor="start">SC0：AG</text>
<text x="170.0" y="110.0" font-size="13" fill="#202124" text-anchor="start"></text>
<text x="24.0" y="130.0" font-size="15" fill="#202124" text-anchor="start" font-weight="700">阶梯（placement 已关）：重算把 AG 往后推</text>
<text x="24.0" y="158.0" font-size="14" fill="#5f6368" text-anchor="start">TC</text>
<text x="24.0" y="190.0" font-size="14" fill="#5f6368" text-anchor="start">SC0</text>
<g>
<rect x="170.0" y="140.0" width="178.0" height="26.0" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="259.0" y="157.7" font-size="13" fill="#174ea6" text-anchor="middle">attention 等</text>
</g>

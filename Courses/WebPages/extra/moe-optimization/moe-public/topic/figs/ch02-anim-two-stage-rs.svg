<rect x="190.0" y="216.0" width="211.8" height="70.0" rx="3" fill="#feefe3" stroke="#e8710a" stroke-width="1.5" class="a6"/>
<text x="296.9" y="256.0" font-size="14" fill="#b06000" text-anchor="middle">全量走宽路</text>
<rect x="403.8" y="280.0" width="22.9" height="6.0" rx="3" fill="none" stroke="#d93025" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="403.8" y="280.0" width="22.9" height="6.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" class="a8"/>
<text x="434.7" y="276.0" font-size="13" fill="#a50e0e" text-anchor="start">← 缩到 1/128 后走 X4，只付延迟</text>
<text x="434.7" y="232.0" font-size="15" fill="#188038" text-anchor="start" font-weight="bold">约 2/3</text>
<g class="a10"><line x1="190.0" y1="212" x2="190.0" y2="290" stroke="#202124" stroke-width="1.5" opacity="0.55"/></g>
<text x="20.0" y="361.0" font-size="15" fill="#d93025" text-anchor="start" font-weight="bold">X4 → YZC128</text>
<rect x="190.0" y="320.0" width="461.1" height="70.0" rx="3" fill="none" stroke="#d93025" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="190.0" y="320.0" width="461.1" height="70.0" rx="3" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" class="a12"/>
<text x="421.6" y="360.0" font-size="14" fill="#a50e0e" text-anchor="middle">全量挤短轴 X4</text>
<rect x="653.1" y="372.5" width="104.9" height="17.5" rx="3" fill="none" stroke="#e8710a" stroke-width="1.2" stroke-dasharray="4 3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" font-family="Noto Sans CJK SC, sans-serif" role="img" aria-label="DCN 各 feature 效果：异步 AG 约 −20%，host 归约保持开，DCN AR 合并约 3–10%，amax 只在 replica 内，关 decomposer/pipeliner 过显存，AOT+HLO 通信重排上 10+ 片指数 71→47，多片 cost profile 46→41，RS 双 SC 约 −3%，DCN 流水实测没兑现，单网卡小包快约 1 ms">
<rect width="1180" height="400" fill="#fff"/>
<text x="20" y="32" font-size="20" font-weight="bold" fill="#202124">DCN 这条线：单个 flag / pass 各值几个百分点，大头是把 AOT + HLO 通信重排搬上 10+ 片</text>
<text x="20" y="56" font-size="14" fill="#5f6368">按依赖顺序排；绿 = 变快，黄 = 中性或没量出步时收益，蓝 = 主跳；每个数在哪个配置上量的见正文表</text>
<text x="20" y="98" font-size="15" font-weight="bold" fill="#5f6368">单个 flag / pass：各自独立可试</text>
<rect x="20" y="110" width="212" height="74" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="126.0" y="141.0" font-size="15" fill="#202124" text-anchor="middle">§3 异步 AG 代替 AR</text>
<text x="126.0" y="163.0" font-size="14" fill="#202124" text-anchor="middle">DP2 步时约 −20%</text>
<rect x="245" y="110" width="212" height="74" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="351.0" y="141.0" font-size="15" fill="#202124" text-anchor="middle">§4 host 归约保持开</text>
<text x="351.0" y="163.0" font-size="14" fill="#202124" text-anchor="middle">关掉反而慢 10%</text>
<rect x="470" y="110" width="212" height="74" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="576.0" y="141.0" font-size="15" fill="#202124" text-anchor="middle">§5 DCN AR 合并</text>
<text x="576.0" y="163.0" font-size="14" fill="#202124" text-anchor="middle">步时约 3% / 约 10%</text>
<rect x="695" y="110" width="212" height="74" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="801.0" y="141.0" font-size="15" fill="#202124" text-anchor="middle">§6 amax 只在 replica 内</text>
<text x="801.0" y="163.0" font-size="14" fill="#202124" text-anchor="middle">DCN 上 MAX 归约 → 0</text>
<rect x="920" y="110" width="212" height="74" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="1026.0" y="141.0" font-size="15" fill="#202124" text-anchor="middle">§7 多片关两个 XLA pass</text>
<text x="1026.0" y="163.0" font-size="14" fill="#202124" text-anchor="middle">过显存（单片上慢约 3%）</text>
<text x="20" y="238" font-size="15" font-weight="bold" fill="#5f6368">在 §5 / §7 之后：编译器把多片通信藏到计算底下</text>
<rect x="20" y="250" width="212" height="74" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="126.0" y="281.0" font-size="15" fill="#202124" text-anchor="middle">§8 AOT + HLO 通信重排上 10+ 片</text>
<text x="126.0" y="303.0" font-size="14" fill="#202124" text-anchor="middle">指数 71 → 47（约 −35%）</text>
<rect x="245" y="250" width="212" height="74" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="351.0" y="281.0" font-size="15" fill="#202124" text-anchor="middle">§9 多片自己的 cost profile</text>
<text x="351.0" y="303.0" font-size="14" fill="#202124" text-anchor="middle">指数 46 → 41（约 −10%）</text>
<rect x="470" y="250" width="212" height="74" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
<text x="576.0" y="281.0" font-size="15" fill="#202124" text-anchor="middle">§10 RS 双 SC</text>
<text x="576.0" y="303.0" font-size="14" fill="#202124" text-anchor="middle">10+ 片 profile 步约 −3%</text>
<rect x="695" y="250" width="212" height="74" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="801.0" y="281.0" font-size="15" fill="#202124" text-anchor="middle">§11 DCN 流水与分区调度</text>
<text x="801.0" y="303.0" font-size="14" fill="#202124" text-anchor="middle">建模有收益，实测没兑现</text>
<rect x="920" y="250" width="212" height="74" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
<text x="1026.0" y="281.0" font-size="15" fill="#202124" text-anchor="middle">§12 单网卡 eth2</text>
<text x="1026.0" y="303.0" font-size="14" fill="#202124" text-anchor="middle">小包快约 1 ms</text>
<line x1="232" y1="287" x2="245" y2="287" stroke="#1a73e8" stroke-width="2"/>
<text x="20" y="372" font-size="15" fill="#174ea6" font-weight="bold">10+ 片：指数 71 → 47 → 41；单片最快 34（单片 BF16 最初基线 = 100）</text>
</svg>
# Tencent Hunyuan 3 (Hy3) 295B-A21B. Values verified field-by-field against the
# HF config.json; see the repo README for the audit table.
decoder_block: "hunyuan3"
base_num_decoder_layers: 80
base_emb_dim: 4096
base_mlp_dim: 13312            # dense layer 0 only
base_num_query_heads: 64
base_num_kv_heads: 8           # GQA 8:1
head_dim: 128
vocab_size: 120832
mlp_activations: ["silu", "linear"]
normalization_layer_epsilon: 1.0e-5   # HF rms_norm_eps; NOT the 1e-6 qwen3/deepseek use
enable_dropout: False
logits_via_embedding: False
use_qk_norm: True
attention_bias: False
rope_max_timescale: 11158840
rope_type: "default"
max_position_embeddings: 262144
num_experts: 192
num_experts_per_tok: 8
base_moe_mlp_dim: 1536
shared_experts: 1
first_num_dense_layers: 1
routed_score_func: "sigmoid"
routed_bias: True
routed_scaling_factor: 2.826
norm_topk_prob: False          # route_norm already applied in deepseek_scale_weights
float32_gate_logits: True      # 192 experts: bf16 cannot separate the sigmoid scores
routed_bias_update_rate: 0.001 # aux-loss-free load balancing, gamma from DSV3
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1

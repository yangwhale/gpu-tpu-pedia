<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 327" width="900" height="327" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：一次 HLO 通信重排全开的 CPU 编译。提速前：探测那遍要做一次 Python trace 加 lowering 再白编一次后端，正式那遍再 trace 加 lowering 一次，两遍 trace 加 lowering 才是大头，placement 搜索只占十几分钟。四刀分别砍在：trace 加 lowering 变短、探测不再编后端、两遍合成一遍、placement 搜索并行。提速后约 17 分钟，产物逐字节不变。">
<title>示意图：一次 HLO 通信重排全开的 CPU 编译。提速前：探测那遍要做一次 Python trace 加 lowering 再白编一次后端，正式那遍再 trace 加 lowering 一次，两遍 trace 加 lowering 才是大头，placement 搜索只占十几分钟。四刀分别砍在：trace 加 lowering 变短、探测不再编后端、两遍合成一遍、placement 搜索并行。提速后约 17 分钟，产物逐字节不变。</title>

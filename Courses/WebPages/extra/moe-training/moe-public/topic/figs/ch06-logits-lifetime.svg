<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 439" width="900" height="439" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：libtpu 新旧两版的同一步。旧版输出投影的权重梯度 dW 紧跟 loss 算完，两块 logits buffer 很快释放，但反向尾部的梯度 RS/AR 没东西盖、露出等待；0.0.48 把这个 dW 挪到反向尾部、和梯度 RS/AR 交替，盖住了通信尾巴，代价是两块 logits buffer 一直活到那里。">
<title>示意图：libtpu 新旧两版的同一步。旧版输出投影的权重梯度 dW 紧跟 loss 算完，两块 logits buffer 很快释放，但反向尾部的梯度 RS/AR 没东西盖、露出等待；0.0.48 把这个 dW 挪到反向尾部、和梯度 RS/AR 交替，盖住了通信尾巴，代价是两块 logits buffer 一直活到那里。</title>
<defs><style></style></defs>
<rect x="0" y="0" width="900" height="439" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">libtpu 0.0.48：dW 被挪去填反向尾部的通信空档，logits buffer 跟着活到最后</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意，无刻度。下方绿条是两块 logits buffer 的存活期；dW 只依赖它们</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />
<text x="48.0" y="85.0" font-size="14" fill="#202124">前向 / 反向</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 337" width="900" height="337" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-label="示意图：64 芯片上 GA=1 一步是前向、反向、优化器各一段；GA=2 两个微批再加一次优化器，理论上接近 2 倍，实测比 2 倍还多约 8%。四个候选原因标在它们会发生的位置：每个微批读写梯度累加 carry、微批边界打断重叠、RS 被提到循环外导致 carry 整份、carry 占显存挤掉调度余量。根因未查明。">
<title>示意图：64 芯片上 GA=1 一步是前向、反向、优化器各一段；GA=2 两个微批再加一次优化器，理论上接近 2 倍，实测比 2 倍还多约 8%。四个候选原因标在它们会发生的位置：每个微批读写梯度累加 carry、微批边界打断重叠、RS 被提到循环外导致 carry 整份、carry 占显存挤掉调度余量。根因未查明。</title>
<defs><style></style></defs>
<rect x="0" y="0" width="900" height="337" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="19" fill="#202124" font-weight="700">GA 1→2 不是白翻倍：总步时比 2 倍还多约 8%，四个候选都可能，没拆</text>
<text x="20.0" y="60.0" font-size="14" fill="#5f6368">示意，无刻度。64 芯片同配置只改 GA；虚线＝GA=1 步时的 2 倍</text>
<rect x="20.0" y="73.0" width="22.0" height="13.0" rx="2" fill="#1a73e8" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#202124">一台 TPU VM：2 块物理网卡、3 个网络接口，合计 400 Gbps（每芯 100）</text>
  <text x="30" y="60" font-size="14" fill="#5f6368">「3 张网卡」指 3 个接口，不是 3 块物理卡，也不是 3 × 200G</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
  </defs>

  <!-- 主机框 -->
  <rect x="30" y="80" width="560" height="340" rx="12" fill="none" stroke="#dadce0" stroke-width="1.6"/>
  <text x="46" y="106" font-size="16" font-weight="bold" fill="#202124">tpu7x-standard-4t（4 芯 / 2 NUMA）</text>

  <!-- NUMA0 -->
  <rect x="50" y="122" width="200" height="130" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="150" y="146" font-size="15" font-weight="bold" fill="#174ea6" text-anchor="middle">NUMA0</text>
  <rect x="68" y="162" width="76" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/><text x="106" y="203" font-size="14" fill="#174ea6" text-anchor="middle">芯片 0</text>
  <rect x="156" y="162" width="76" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/><text x="194" y="203" font-size="14" fill="#174ea6" text-anchor="middle">芯片 1</text>

  <!-- NUMA1 -->
  <rect x="50" y="272" width="200" height="130" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="150" y="296" font-size="15" font-weight="bold" fill="#174ea6" text-anchor="middle">NUMA1</text>
  <rect x="68" y="312" width="76" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/><text x="106" y="353" font-size="14" fill="#174ea6" text-anchor="middle">芯片 2</text>
  <rect x="156" y="312" width="76" height="70" rx="6" fill="#ffffff" stroke="#1a73e8"/><text x="194" y="353" font-size="14" fill="#174ea6" text-anchor="middle">芯片 3</text>

  <!-- 物理卡 -->
  <rect x="290" y="152" width="130" height="70" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
  <text x="355" y="182" font-size="15" font-weight="bold" fill="#681da8" text-anchor="middle">物理卡 A</text>
  <text x="355" y="204" font-size="14" fill="#681da8" text-anchor="middle">200 Gbps</text>
  <rect x="290" y="302" width="130" height="70" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
  <text x="355" y="332" font-size="15" font-weight="bold" fill="#681da8" text-anchor="middle">物理卡 B</text>
  <text x="355" y="354" font-size="14" fill="#681da8" text-anchor="middle">200 Gbps</text>
  <line x1="250" y1="187" x2="288" y2="187" stroke="#5f6368" stroke-width="2"/>
  <line x1="250" y1="337" x2="288" y2="337" stroke="#5f6368" stroke-width="2"/>

  <!-- 接口 -->
  <rect x="460" y="124" width="100" height="40" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/><text x="510" y="150" font-size="15" fill="#202124" text-anchor="middle">eth0</text>
  <rect x="460" y="210" width="100" height="40" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/><text x="510" y="236" font-size="15" fill="#202124" text-anchor="middle">eth1</text>
  <rect x="460" y="317" width="100" height="40" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/><text x="510" y="343" font-size="15" fill="#202124" text-anchor="middle">eth2</text>
  <path d="M420 180 L440 180 L440 144 L458 144" fill="none" stroke="#5f6368" stroke-width="2"/>
  <path d="M420 194 L440 194 L440 230 L458 230" fill="none" stroke="#5f6368" stroke-width="2"/>
  <line x1="420" y1="337" x2="458" y2="337" stroke="#5f6368" stroke-width="2"/>
  <text x="444" y="276" font-size="13" fill="#5f6368">eth0 / eth1 同卡</text>
  <text x="444" y="294" font-size="13" fill="#5f6368">[推断，按 PCI 总线号]</text>

  <!-- VPC -->
  <rect x="640" y="104" width="330" height="80" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="656" y="132" font-size="16" font-weight="bold" fill="#0d652d">主 VPC</text>
  <text x="656" y="154" font-size="14" fill="#0d652d">节点主网卡：DHCP、kubelet、镜像、GCS</text>
  <text x="656" y="174" font-size="14" fill="#0d652d">上限 200 Gbps/host（只落在一块卡上）</text>
  <rect x="640" y="200" width="330" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="656" y="226" font-size="16" font-weight="bold" fill="#b06000">DCN VPC #1</text>
  <text x="656" y="248" font-size="14" fill="#b06000">MTU 8896，跨切片训练流量</text>
  <rect x="640" y="307" width="330" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="656" y="333" font-size="16" font-weight="bold" fill="#b06000">DCN VPC #2</text>
  <text x="656" y="355" font-size="14" fill="#b06000">MTU 8896，跨切片训练流量</text>
  <line x1="560" y1="144" x2="636" y2="144" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="230" x2="636" y2="230" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="337" x2="636" y2="337" stroke="#5f6368" stroke-width="2" marker-end="url(#ar)"/>

  <text x="610" y="396" font-size="14" fill="#202124">训练任务让跨切片流量走 eth1、eth2：</text>
  <text x="610" y="416" font-size="13" fill="#202124">--megascale_grpc_interface_prefixes=eth1,eth2,lo</text>
  <text x="30" y="446" font-size="13" fill="#5f6368">物理网卡数与 400 Gbps 取自官方机型表；接口分卡按节点注解 networking.gke.io/nic-info 的 PCI 号推断（见 §1.7 正文）</text>
</svg>

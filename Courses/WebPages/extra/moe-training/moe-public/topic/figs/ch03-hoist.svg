<rect x="297.8" y="71.0" width="14.0" height="14.0" rx="3" fill="#d93025" stroke="none" stroke-width="1.5" />
<text x="317.8" y="83.0" font-size="13" fill="#202124" text-anchor="start" >地板（固定开销）</text>

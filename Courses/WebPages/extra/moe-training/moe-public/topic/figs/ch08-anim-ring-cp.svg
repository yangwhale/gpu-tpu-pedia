<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="动图示意。左：AG CP，每份只有自己那段 Q，但要先把所有段的 K/V 全部 all-gather 过来，每份都放齐完整长度的 K/V，显存 O(T·d) 不随 cp 变小。右：ring CP，各份排成一个环，每份手里只有一块 KV，每一步顺时针传给下一份，转一圈回到原位；每份同一时刻只经手一块，显存降到 O(T·d/cp)。"><style>
